      summary: Toplu daire olustur (admin + yonetici)
      description: |
        Bir blok icin kat_sayisi × kat_basi_daire adet daire, baslangic_no'dan
        ARDISIK numaralandirilir (kat kat dolar). Daire no = blok varsa
        '{blok}-{n}', yoksa '{n}'. Zaten var olan no'lar ATLANIR (kalan olusur).
        Katlar 1..kat_sayisi, sira 1..kat_basi_daire. En fazla 500 daire/istek.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitBulkCreate" }
      responses:
        "201":
          description: Olusturuldu (+ atlananlar + bitis_no)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitBulkResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Es zamanli ekleme cakismasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

