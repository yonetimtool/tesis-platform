    get:
      tags: [aidat]
      summary: Tahakkuk listesi
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: unit_id
          in: query
          schema: { type: string, format: uuid }
        - name: donem
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/DuesAssessment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [aidat]
      summary: Tahakkuk olustur (tek daire veya toplu donem) (admin)
      description: |
        `unit_id` verilirse TEK daire (ayni daire+donem ikinci kez → 409). `unit_id`
        yoksa TOPLU: `unit_ids` (verilmezse tum aktif daireler); mevcut donemler atlanir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DuesAssessmentCreate" }
      responses:
        "201":
          description: "Olusturuldu (toplu modda created + atlanan)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuesAssessmentResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Tek daire modunda ayni donem zaten var
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /dues/payments:
    get:
      tags: [aidat]
      summary: Odeme listesi
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: unit_id
          in: query
          schema: { type: string, format: uuid }
        - name: donem
          in: query
          description: "'YYYY-MM' — donem bazli rapor filtresi (payment.donem uzerinden)"
          schema: { type: string }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/DuesPayment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [aidat]
      summary: Manuel odeme kaydi (admin)
      description: |
        Gercek tahsilat YOK (soyut). Idempotency-Key ZORUNLU (cift kayit korumasi).
        kaydeden token'dan. Bakiye = toplam tahakkuk - basarili odemeler.

        DONEM ATFI (panel raporu): `donem` ('YYYY-MM') acikca verilebilir;
        verilmezse `assessment_id` varsa ONUN doneminden turer; ikisi de yoksa
        NULL kalir (serbest odeme). Rapor `GET /dues/payments?donem=` ile
        serbest odemeleri de doneme atfedebilir.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DuesPaymentCreate" }
      responses:
        "201":
          description: Odeme kaydedildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuesPayment" }
        "200":
          description: Idempotent tekrar — mevcut kayit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuesPayment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ayni Idempotency-Key farkli govde ile gonderildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /me/dues:
    get:
      tags: [aidat]
      summary: Sakinin kendi dairelerinin borc durumu (resident)
      responses:
        "200":
          description: Borc durumu listesi
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UnitDuesStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ================================================================= #
  # BUTCE (Wave 2A — yonetim tarafi; sakin seffafligi Wave 2B)
  # Para HER YERDE integer KURUS (float asla).
  # ================================================================= #
  /budget/categories:
    get:
      tags: [budget]
      summary: Butce kategorileri (yonetim)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: tip
          in: query
          schema: { $ref: "#/components/schemas/BudgetTip" }
        - name: aktif
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Liste (ad ASC)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/BudgetCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [budget]
      summary: Kategori olustur (dinamik; yonetici/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetCategoryCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Ayni tip icinde ayni ad zaten var
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /budget/categories/{category_id}:
    patch:
      tags: [budget]
      summary: Kategori guncelle — aktif=false SOFT-DELETE'tir
      description: |
        Hard DELETE ucu bilincli olarak YOK: hareketi olan kategori
        silinemez (FK RESTRICT); pasiflestirilen (aktif=false) kategoriye
        YENI kayit yazilamaz ama eski kayitlar kategorisini korur.
      parameters:
        - name: category_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetCategoryUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ayni tip icinde ayni ad zaten var
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /budget/entries:
    get:
      tags: [budget]
      summary: Defter kayitlari (tarih DESC; yonetim)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: tip
          in: query
          schema: { $ref: "#/components/schemas/BudgetTip" }
        - name: kategori_id
          in: query
          schema: { type: string, format: uuid }
        - name: kaynak
          in: query
          schema: { $ref: "#/components/schemas/BudgetKaynak" }
        - name: donem
          in: query
          description: "'YYYY-MM' ay filtresi (baslangic/bitis'e gore oncelikli)"
          schema: { type: string, example: "2026-07" }
        - name: baslangic
          in: query
          schema: { type: string, format: date }
        - name: bitis
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/BudgetEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [budget]
      summary: Manuel gelir/gider kaydi (yonetici/admin)
      description: |
        `tip` GONDERILMEZ — secilen kategoriden turetilir. Pasif kategoriye
        yeni kayit yazilamaz (422). kaynak her zaman 'manuel' olur
        (aidat_odeme kayitlarini sistem uretir).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetEntryCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /budget/entries/{entry_id}:
    patch:
      tags: [budget]
      summary: Manuel kaydi duzenle (aidat_odeme kayitlari duzenlenemez)
      parameters:
        - name: entry_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetEntryUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [budget]
      summary: Manuel kaydi sil (aidat_odeme kayitlari silinemez → 422)
      parameters:
        - name: entry_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /budget/summary:
    get:
      tags: [budget]
      summary: "Kasa ozeti: gelir, gider, bakiye (+kategori kirilimi)"
      description: |
        bakiye = toplam gelir - toplam gider (NEGATIF olabilir). Tum tutarlar
        integer KURUS. Filtresiz cagri tum zamanlari kapsar.
        SEFFAFLIK (Wave 2B): AGREGAT oldugu icin TUM rollere aciktir —
        sakin/saha sitenin toplamlarini gorur; defter satirlari ve kategori
        yonetimi yonetimde (admin+yonetici) kalir.
      parameters:
        - name: donem
          in: query
          schema: { type: string, example: "2026-07" }
        - name: baslangic
          in: query
          schema: { type: string, format: date }
        - name: bitis
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Ozet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # RAPORLAR (Wave 2B — cepten finansal ozet; salt okuma)
  # ================================================================= #
  /reports/financial-summary:
    get:
      tags: [reports]
      summary: Cepten finansal ozet (rol-duyarli icerik)
      description: |
        Telefon ekranina uygun kompakt ozet. TUM roller AGREGAT kismi alir:
        donem geliri/gideri/kasa + en yuksek gider kategorileri (ilk 5).
        `tahsilat` blogu (donem tahakkuku, tahsilat, tahsilat orani, geciken
        daire sayisi) YALNIZ yonetimde (admin+yonetici) dolar; sakin/saha
        icin `null` doner — daire/kisi duzeyinde veri sizdirilmaz.
        Parametresiz cagri tum zamanlari kapsar. Para integer KURUS.
      parameters:
        - name: donem
          in: query
          schema: { type: string, example: "2026-07" }
      responses:
        "200":
          description: Ozet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # ODEME WEBHOOK (public ama imza-korumali)
  # ================================================================= #
  /webhooks/payments/{provider}:
    post:
      tags: [webhooks]
      summary: Saglayici odeme bildirimi (iyzico/paytr)
      description: |
        PUBLIC (token YOK) ama IMZA-KORUMALI. Saglayici ode​me sonucunu bildirir.
        Imza/hash provider secret ile dogrulanir; gecersizse 401 ve hicbir islem
        yapilmaz. provider_ref'ten tenant guvenli cozulur (SECURITY DEFINER).
        IDEMPOTENT (provider+event_id). Tutar (kurus) odeme ile karsilastirilir;
        uyusmazsa 400. Govde/imza formati saglayiciya ozeldir (iyzico: JSON +
        `x-iyz-signature` header; paytr: form-encoded + `hash` alani).
      security: []   # public; guvenlik imzayla saglanir
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [iyzico, paytr] }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object } }
          application/x-www-form-urlencoded: { schema: { type: object } }
      responses:
        "200":
          description: Islendi (veya idempotent tekrar)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  durum: { $ref: "#/components/schemas/DuesDurum" }
        "400":
          description: Tutar uyusmazligi / gecersiz govde
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "401":
          description: Imza gecersiz
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "404":
          description: Saglayici/odeme referansi bulunamadi
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  # ================================================================= #
  # USERS (personel + sakin yonetimi) — admin
  # ================================================================= #
  /users:
    get:
      tags: [users]
      summary: Kullanici listesi (admin)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/UserRole" }
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          description: Ad/email icinde arama (opsiyonel)
          schema: { type: string }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/UserListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      summary: Kullanici olustur (admin her rol; yonetici saha personeli)
      description: |
        admin HER rolu olusturur. yonetici (Ozellik 3) KENDI tenant'inda YALNIZ
        saha personeli (security/tesis_gorevlisi) acar; admin/yonetici/resident
        rolu -> 403 (resident'lar POST /residents ile). telefon GLOBAL benzersiz
        LOGIN anahtaridir (zorunlu). password verilmezse TEK SEFERLIK gecici kod
        uretilir ve yanitta `temp_code` bir kez doner. password_hash YANITTA donmez.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Olusturuldu (parola verilmediyse `temp_code` doner)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserCreatedOut" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: telefon (global) veya email (tenant) zaten kayitli
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [users]
      summary: Kullanici detay (admin)
      responses:
        "200":
          description: Detay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [users]
      summary: "Kullanici guncelle (admin: her; yonetici: YALNIZ saha personeli)"
      description: |
        ad/telefon/role/is_active ve opsiyonel email/parola. parola verilirse yeniden
        hash'lenir. Kullanici SILINMEZ; pasiflestirme icin is_active=false kullanin.
        RBAC: admin herkesi duzenler; yonetici YALNIZ saha personelini
        (security/tesis_gorevlisi) duzenler ve rolu saha disina cekemez (403).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: email bu tenant'ta zaten kayitli
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/{id}/reset-password:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [users]
      summary: "Personel parolasini sifirla (admin: her; yonetici: saha) — gecici kod"
      description: |
        Yeni TEK SEFERLIK gecici kod uretir (password_set=false); personel telefon
        + bu kodla girip yeni parola belirler. Kod YALNIZ bu yanitta doner. RBAC:
        admin herkesi; yonetici YALNIZ saha personelini (security/tesis_gorevlisi)
        sifirlar (aksi 403).
      responses:
        "200":
          description: Yeni gecici kod
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResidentResetPasswordOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{id}/contact:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [users]
      summary: Iletisim ayari — telefon + arama rizasi (admin + yonetici)
      description: |
        Rol-bazli arama (C1a) icin YALNIZ telefon + aranabilir (riza) gunceller.
        admin + yonetici yetkili; rol/parola/is_active gibi hassas alanlara
        DOKUNMAZ (tam PATCH admin-only kalir — yetki yukseltme yok). Numara
        yonetim tarafindan girilir; kullanici bu turda kendi yonetmez.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserContactUpdate" }
      responses:
        "200":
          description: Guncellendi (tek-kayit yonetim gorunumu — telefon doner)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /call-target/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [call-target]
      summary: Rol-bazli arama hedefi cozumu (numara-gizlilik kapisi)
      description: |
        Callee'nin telefonu YALNIZ (1) arayan rol o callee rolunu arayabiliyorsa
        (security->yonetici/resident; resident->security) VE (2) callee.aranabilir
        = true iken aciklanir. Aksi halde numara ASLA donmez: yetkisiz yon 403,
        rizasiz/numarasiz 404. Arayan roller: security + resident (digerleri 403).
        Amaç-sınırlı (yalniz arama), toplu listelenmez (KVKK). Kanal C1a'da 'phone'
        (cihaz ceviricisi, tel:); C1b baska kanallar ekleyecek.
      responses:
        "200":
          description: "Cozuldu — numara + tel: URI (yalniz burada aciklanir)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallTarget" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================================================================= #
  # INTEGRATIONS (C1b — dis sistem entegrasyon konfig + SSRF-korumali tetik;
  # admin+yonetici yonetir; sir write-only; tetik ic/ozel hedefleri reddeder)
  # ================================================================= #
  /integrations:
    get:
      tags: [integrations]
      summary: Entegrasyon listesi (admin+yonetici)
      description: Sir (auth_secret) DONMEZ; yerine auth_secret_set (bool).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: aktif
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Integration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [integrations]
      summary: Entegrasyon olustur (admin+yonetici)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationCreate" }
      responses:
        "201":
          description: Olusturuldu (sir DONMEZ)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /integrations/presets:
    get:
      tags: [integrations]
      summary: Preset sablonlari (form on-doldurma; admin+yonetici)
      description: >
        Generic webhook uzerinde makul varsayilanlar (webhook/megaphone/
        smarthome). Gercek cihaz surucusu DEGIL — duzenlenebilir sablonlar.
      responses:
        "200":
          description: Preset listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IntegrationPreset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /integrations/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [integrations]
      summary: Entegrasyon detay (admin+yonetici; sir DONMEZ)
      responses:
        "200":
          description: Detay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [integrations]
      summary: Entegrasyon guncelle (admin+yonetici)
      description: >
        auth_secret WRITE-ONLY (verilirse yeniden sifrelenir; auth_type=none ise
        temizlenir). endpoint_url http(s) olmali (tam SSRF kapisi tetikte).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [integrations]
      summary: Entegrasyon sil (admin+yonetici)
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /integrations/{id}/trigger:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [integrations]
      summary: Entegrasyonu tetikle — SSRF-korumali HTTP gonderir (admin+yonetici)
      description: |
        payload_template ({{message}}/{{title}}) render edilir; auth siri (varsa)
        header'a eklenir; **SSRF kapisindan gecen** URL'e HTTP istegi gonderilir.
        Ic/ozel/metadata/loopback/link-local hedefler REDDEDILIR (DNS cozulup
        IP denetlenir — DNS-rebinding korumasi). Redirect TAKIP EDILMEZ. Donen
        {ok, status, error}: 2xx -> ok=true; SSRF engeli / ag / HTTP hatasi ->
        ok=false + error.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationTrigger" }
      responses:
        "200":
          description: Tetik sonucu (ok/status/error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationTriggerResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================================================================= #
  # UNIT-COMPLAINTS (D1 — sakin -> HEDEF DAIRE; TAM ANONIM. Yonetimin ayri
  # /complaints modulunden BAGIMSIZ. complainant_user_id HICBIR yanitta YOK.)
  # ================================================================= #
  /blocks:
    get:
      tags: [building]
      summary: Bina bloklari (admin+yonetici)
      description: >
        Bina bloklari + her blogu kullanan daire sayisi (unit_sayisi). D-viz
        Rev-1 bina yerlesimi yonetimi; Rev-2 gorsel editoru bunu kullanir.
      responses:
        "200":
          description: Blok listesi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [building]
      summary: Bina blogu olustur (admin+yonetici)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Block" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /blocks/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [building]
      summary: Bina blogu guncelle (admin+yonetici)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Block" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [building]
      summary: Bina blogu sil (admin+yonetici) — kullanan daire varsa 409
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /unit-complaints:
    get:
      tags: [unit-complaints]
      summary: Daire sikayetleri (YALNIZ yonetim; complainant GIZLI)
      description: >
        Rev-2 GIZLILIK: YALNIZ admin+yonetici. kategori+tarih+durum+`notlar`
        doner ama `complainant_user_id`/`complainant_ad` ARTIK DONMEZ (her zaman
        null) — yonetim yalniz 'sikayet edildigini' gorur, KIMIN ettigini degil.
        resident/security/tesis_gorevlisi ERISEMEZ (403).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: target_unit_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: durum
          in: query
          required: false
          schema: { type: string, enum: [acik, kapali] }
        - name: kategori
          in: query
          required: false
          description: "(G6, ADDITIVE) Kategori suzgeci"
          schema: { type: string, enum: [gurultu, kapi_onu_ayakkabi, zarar_verme, goruntu_kirliligi, diger] }
        - name: okunmamis
          in: query
          required: false
          description: |
            **(P24, ADDITIVE) "Yeni / Okunmamis" sekmesi.** `true` -> yalniz
            ISTEYEN yoneticinin okumadiklari; `false` -> yalniz okuduklari;
            bos -> hepsi. Okuma durumu KISI BASINADIR: bir yoneticinin
            okumasi digerinin triyaj kuyrugunu bosaltmaz.

            **Rozet sayisi icin ayri uc YOKTUR**:
            `?okunmamis=true&limit=1` cagrisinin `meta.total` degeri rozetin
            kendisidir.
          schema: { type: boolean }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/UnitComplaint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [unit-complaints]
      summary: Daire sikayeti ac (YALNIZ resident, KENDI blogu) — anonim
      description: >
        Sakin bir HEDEF daireyi bildirir. Hedef daire sakinin KENDI blogunda
        olmali (blok disi -> 403). complainant_user_id token'dan alinir, spam
        korumasi + denetim icin saklanir; resident'a DONMEZ. Spam (Rev-1.1):
        ayni daireye ayni KATEGORIDE 7 gunde en fazla 1 (farkli kategori
        serbest; durumdan bagimsiz) -> aksi 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitComplaintCreate" }
      responses:
        "201":
          description: Acildi (complainant DONMEZ)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitComplaint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >
            Haftalik spam limiti: bu daire icin bu KATEGORIDE 7 gunde 1 sikayet
            (farkli kategori serbest).
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /unit-complaints/mine:
    get:
      tags: [unit-complaints]
      summary: Kendi sikayetlerim (YALNIZ resident) — gitti mi geri bildirimi
      description: >
        Sakin YALNIZ kendi actigi sikayetleri gorur: hedef unit_no + kategori +
        tarih + durum (+ kendi notu). Baska sakinlerin kayitlari, yogunluk/renk,
        ve complainant (kendisi) YOKTUR. Diger roller 403.

        Ana ekran "Gurultu Sikayeti" sayaci (G6):
        `?kategori=gurultu&durum=acik&limit=1` -> `meta.total`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: durum
          in: query
          required: false
          schema: { type: string, enum: [acik, kapali] }
        - name: kategori
          in: query
          required: false
          description: "(G6, ADDITIVE) Kategori suzgeci — orn. gurultu"
          schema: { type: string, enum: [gurultu, kapi_onu_ayakkabi, zarar_verme, goruntu_kirliligi, diger] }
      responses:
        "200":
          description: Kendi sikayet listem
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/UnitComplaint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /unit-complaints/density:
    get:
      tags: [unit-complaints]
      summary: Daire-basi yogunluk (sayi + renk) — YALNIZ yonetim
      description: >
        Rev-1: YALNIZ admin+yonetici. Her daire icin ACIK sikayet sayisi + renk
        (P24 DORT KADEME: 0 yesil, 1-2 sari, 3-4 kirmizi, 5+ mor).
        residentlar sayilari GOREMEZ (403);
        yapi gorunumu icin /building-map (rol-farkinda) kullanilir.
      responses:
        "200":
          description: Yogunluk
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitDensity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /unit-complaints/building-map:
    get:
      tags: [unit-complaints]
      summary: Cizilebilir bina semasi (ROL-FARKINDA) — tum roller
      description: >
        blok -> kat -> daire yapisi (2D kat plani). ROL-FARKINDA
        (shows_density): yonetici/admin sayim+renk gorur; resident YALNIZ kendi
        blogunun yapisini (sayim/renk null — sikayet secici); security/
        tesis_gorevlisi tum yapiyi (sayim/renk null). Yerlesimi eksik daireler
        'unplaced'. complainant hicbir role donmez.
      responses:
        "200":
          description: Bina haritasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildingMap" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /unit-complaints/{id}/okundu:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [unit-complaints]
      summary: Sikayeti OKUNDU isaretle (admin+yonetici) — kisi basina
      description: >
        (P24) Sikayeti YALNIZ istegi yapan yonetici icin okundu isaretler;
        diger yoneticilerin "Yeni" kuyrugu etkilenmez. IDEMPOTENT: ikinci
        cagri 409 vermez, ayni sonucu doner. GERI ALMA YOKTUR — "okunmamis"
        bir is kuyrugudur, gecmis degil.
      responses:
        "200":
          description: Isaretlendi (okundu=true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitComplaint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /unit-complaints/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [unit-complaints]
      summary: Sikayeti kapat (admin+yonetici) — sikayet edeni GORMEDEN
      description: >
        Yonetim yalniz durumu degistirir (kapali); ACIK sayimi duser (renk
        feedback). complainant yine DONMEZ.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitComplaintDecision" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitComplaint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # ARAC GECISI + OTOPARK DOLULUGU (G1 + G4)
  # Bir GECIS = bir satir: `giris_zamani` her zaman dolu, `cikis_zamani`
  # NULL iken arac ICERIDEDIR. Doluluk = ACIK satirlarin sayimi (ayri
  # sayac YOK). Plaka NORMALIZE saklanir (bosluksuz + BUYUK).
  # ================================================================= #
  /vehicle-passes:
    get:
      tags: [vehicle-passes]
      summary: Arac gecisleri (giris_zamani DESC) — admin + security
      description: |
        RBAC: YALNIZ admin + security. Plaka kisisel veriye baglanabilir
        (KVKK) — yonetici/resident/tesis_gorevlisi gecis LISTESINI GORMEZ
        (403); yonetimin ihtiyaci olan AGREGAT doluluk `/parking/occupancy`
        ile tum rollere aciktir.

        Ana ekran sayaci ("N Iceride"): `?acik=true&limit=1` -> `meta.total`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: acik
          in: query
          required: false
          description: >
            true: yalniz ACIK gecisler (`cikis_zamani` IS NULL — arac iceride);
            false: yalniz kapanmis gecisler. Verilmezse tumu.
          schema: { type: boolean }
        - name: plaka
          in: query
          required: false
          description: >
            Plaka ONEK eslesmesi. Arama degeri de NORMALIZE edilir
            ("34 abc" == "34ABC"), boylece istemci format bilmek zorunda degil.
          schema: { type: string, minLength: 1, maxLength: 32 }
        - name: baslangic
          in: query
          required: false
          description: >
            giris_zamani >= (tarih filtresi). "Bugun N giris" sayaci:
            `?baslangic=<gun basi>&limit=1` -> `meta.total`.
          schema: { type: string, format: date-time }
        - name: bitis
          in: query
          required: false
          description: giris_zamani < (tarih filtresi)
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/VehiclePass" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [vehicle-passes]
      summary: Arac GIRISI kaydet (admin + security)
      description: |
        `plaka` sunucuda normalize edilir (alfanumerik disi karakterler atilir,
        harfler buyur) ve NORMALIZE hali saklanir/donuur. Daire referansi
        OPSIYONEL: `unit_id` VEYA `unit_no` (ikisi birlikte 422); hicbiri
        verilmezse arac daireye bagli degildir. Verilen daire bulunamazsa 422.

        Ayni plakanin ACIK bir gecisi varsa **409** (arac zaten iceride —
        yapisal garanti: kismi unique indeks, es zamanli iki giris yarissa
        yalniz biri yazar). Cikis damgalandiktan sonra ayni plaka yeniden
        girebilir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehiclePassCreate" }
      responses:
        "201":
          description: Giris kaydedildi (cikis_zamani null => arac iceride)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehiclePass" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Bu plakanin acik bir gecisi zaten var (arac iceride)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /vehicle-passes/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [vehicle-passes]
      summary: Arac gecisi detayi (admin + security)
      responses:
        "200":
          description: Gecis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehiclePass" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /vehicle-passes/{id}/checkout:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [vehicle-passes]
      summary: Arac CIKISI damgala (admin + security)
      description: |
        `cikis_zamani` sunucu saatiyle damgalanir; otopark dolulugu ANINDA
        duser (ayri sayac yok). Atomik kosullu guncelleme — gecis zaten
        kapanmissa **409** ve ilk cikis zamani DEGISMEZ. Govde YOKTUR.
      responses:
        "200":
          description: Cikis damgalandi (guncel kayit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehiclePass" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Arac gecisi zaten kapatilmis
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /parking/occupancy:
    get:
      tags: [vehicle-passes]
      summary: Otopark dolulugu (agregat) — TUM kimlikli roller
      description: |
        `dolu` = ACIK arac gecisi (`cikis_zamani` IS NULL) sayisi — plaka veya
        daire ICERMEZ, bu yuzden tum rollere aciktir (ana ekran karti +
        "Hizli Ozet" kutusu ayni yaniti kullanir: "78 / 120" ve "%65").

        `kapasite` tenant ayarindan gelir (`PATCH /tenant/settings` ->
        `otopark_kapasite`; admin veya yonetici yazar). Kapasite TANIMSIZ
        (null) veya 0 ise `oran` da **null** doner — istemci "—" gosterir,
        uydurma yuzde uretilmez. `dolu` her zaman gercek sayidir.
      responses:
        "200":
          description: Doluluk
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParkingOccupancy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ================================================================= #
  # IHLAL KAYDI (G2) — site_kurali YALNIZ metin tutar; somut ihlal
  # burada izlenir. Durum: yeni -> inceleniyor -> kapatildi (TERMINAL).
  # ================================================================= #
  /violations:
    get:
      tags: [violations]
      summary: Ihlal kayitlari (created_at DESC) — admin + yonetici + security
      description: |
        RBAC: OKUMA admin + yonetici + security. resident ve tesis_gorevlisi
        ERISMEZ (403) — ihlal kaydi komsu davranisi hakkinda veri tasir (KVKK).

        Ana ekran sayaci ("N Yeni"): `?durum=yeni&limit=1` -> `meta.total`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: durum
          in: query
          required: false
          schema: { type: string, enum: [yeni, inceleniyor, kapatildi] }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Violation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [violations]
      summary: Ihlal kaydi ac (admin + security)
      description: |
        Kayit acilinca `durum='yeni'` olur (ana ekran sayaci bunu sayar).
        `kaynak` verilmezse 'manuel'. `konum` serbest metindir (checkpoint FK
        DEGIL — ihlal cogu zaman checkpoint disinda tespit edilir).
        yonetici OKUR ama ACMAZ (403).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViolationCreate" }
      responses:
        "201":
          description: Olusturuldu (durum=yeni)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Violation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /violations/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [violations]
      summary: Ihlal detayi (admin + yonetici + security)
      responses:
        "200":
          description: Ihlal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Violation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [violations]
      summary: Ihlal durumunu degistir (admin + security; KAPATMA yalniz admin)
      description: |
        Gecis akisi: `yeni` -> `inceleniyor` -> `kapatildi`.

        * KAPATMA (`durum=kapatildi`) YALNIZ **admin** — dort-goz kurali;
          inceleyen personel kendi kaydini kapatamaz (security -> 403).
        * `kapatildi` TERMINAL: kapali kayit yeniden ACILMAZ (409).
        * Ayni duruma gecis IDEMPOTENT'tir (200, kayit degismez).
        * yonetici okur ama durum degistiremez (403).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViolationUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Violation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Kapatilmis ihlal yeniden acilamaz (terminal durum)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # BIRLESIK AKTIVITE AKISI (G5) — "Son Hareketler"
  # ================================================================= #
  /activity:
    get:
      tags: [activity]
      summary: Birlesik olay akisi (yeniden eskiye, rol-farkindali)
      description: |
        Mobil "Son Hareketler" akisi. Onceden istemci rol basina 3-4 ayri uca
        istek atip sonuclari elde birlestiriyordu; bu uc AYNI olaylari
        SUNUCUDA birlestirir, SUNUCUDA siralar ve SUNUCUDA rol/KVKK'ya gore
        suzer. Yeni tablo YOKTUR — hepsi mevcut kayitlardan turer.

        **Olay turleri (`tur`)**: `devriye_okutma` | `gorev_tamamlama` |
        `aidat_odeme` | `talep` | `daire_sikayeti` | `alarm` |
        `ziyaretci_giris` | `ziyaretci_cikis` | `kargo` | `kargo_teslim` |
        `arac_giris` | `arac_cikis` | `ihlal`

        **Rol suzgeci (sunucu tarafinda; istemci bypass EDEMEZ):**

        | rol | gordugu turler |
        |---|---|
        | admin | devriye_okutma, gorev_tamamlama, aidat_odeme, talep, daire_sikayeti, alarm, arac_*, ihlal |
        | yonetici | admin ile ayni, `arac_*` HARIC (plaka RBAC'i admin+security) |
        | security | devriye_okutma, gorev_tamamlama, alarm, ziyaretci_*, kargo*, arac_*, ihlal + KENDI talepleri. FINANS (aidat) YOK |
        | resident | YALNIZ kendisi/kendi dairesi: kendine hedeflenen ziyaretci, dairesinin kargosu, dairesinin aidat odemesi, kendi talepleri, KENDI ACTIGI daire sikayetleri |
        | tesis_gorevlisi | YALNIZ `gorev_tamamlama` (mevcut KVKK kisiti) |

        **ZIYARETCI/KARGO — bilincli kisit:** bu iki kaynak yonetim rollerine
        (admin + yonetici) burada da KAPALIDIR. Sebep: `/visitors` ve `/kargo`
        uclarinda yonetim VARSAYILAN KAPALI'dir ve daire bazli TEK-SEFERLIK
        izinle (`/unit-access-request`) acilir. Birlesik akis bu kapiyi
        bypass eden bir yan kanal OLMAMALIDIR.

        **Sayfalama — bilesik imlec:** `ORDER BY zaman DESC, id DESC` +
        `WHERE (zaman, id) < (imlec)`. `offset` YOKTUR: araya yeni kayit girse
        bile sayfalar kaymaz/tekrarlamaz. `meta.total` de YOKTUR (13 kaynagin
        birlesik sayimi her istekte tam tarama demektir ve akis ekraninda
        kullanilmaz); "daha var mi" bilgisi `meta.next_cursor`'in null
        OLMAMASIYLA verilir.
      parameters:
        - name: limit
          in: query
          required: false
          description: Sayfa boyutu (varsayilan 20, max 100)
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          required: false
          description: >
            Onceki yanitin `meta.next_cursor` degeri. OPAK'tir — istemci
            icerigini AYRISTIRMAMALIDIR (siralama anahtari ileride degisirse
            sozlesme kirilmasin). Gecersiz deger 422.
          schema: { type: string }
      responses:
        "200":
          description: Akis sayfasi (yeniden eskiye)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # HAVA DURUMU (G7 — sozlesme geri-doldurmasi; UC ZATEN CANLIDA)
  # ================================================================= #
  /weather:
    get:
      tags: [weather]
      summary: Tesis konumu icin guncel hava durumu — TUM kimlikli roller
      description: |
        Ana ekran basligindaki hava bloğu. Tenant'in `konum_lat`/`konum_lon`
        koordinati icin Open-Meteo proxy'si; dis istek YALNIZ cache kacirilinca
        atilir (varsayilan 30 dk TTL) ve kisa timeout'ludur (3 sn) — baslik ana
        ekrani BEKLETMEZ. Dis servis dusukse BAYAT cache donulur; hic veri
        yoksa 503 `weather_unavailable`.

        Sorgu parametresi YOKTUR (konum tenant ayarindan gelir:
        `PATCH /tenant/settings` -> `konum_ad`/`konum_lat`/`konum_lon`).
      responses:
        "200":
          description: Guncel hava
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Weather" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Tenant bulunamadi
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "503":
          description: "Hava durumu su an alinamiyor (code: weather_unavailable)"
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  # ================================================================= #
  # KAMERALAR (G7 — sozlesme geri-doldurmasi; UC ZATEN CANLIDA)
  # ================================================================= #
  /cameras:
    get:
      tags: [cameras]
      summary: Kamera listesi (ad ASC) — TUM roller, gorunurluk SUNUCUDA suzulur
      description: |
        Site kameralari. Gorunurluk ROL BAZLI ve suzgec SUNUCUDADIR — gizli
        kamera yaniti HIC terk etmez, istemci "hangisini gorebilirim"
        hesabi yapmaz:

        | rol | gordugu kameralar |
        |---|---|
        | admin, yonetici, security | TUMU (pasif + sakine kapali dahil) |
        | resident, tesis_gorevlisi | YALNIZ `aktif=true` **VE** `sakin_gorebilir=true` |

        `sakin_gorebilir` TEK anahtardir ve varsayilani **false**'tur: kamera
        mahremiyet tasir (KVKK), sakine acmak yonetimin ACIK kararidir.
        `aktif=false` kamera hicbir sakine gosterilmez — bayrak acik olsa bile
        iki kosul BIRLIKTE aranir.

        Backend yayini HIC cekmez — istemci oynatir (SSRF yuzeyi yok).
        `oynatilabilir` alani turden turer: `hls`/`mp4` -> true, `rtsp` ->
        **false** (istemciler RTSP'yi natively oynatamaz; kayit envanter icin
        tutulur, ileride medya gecidi eklenecek).

        DEGISIKLIK (onceki surum): resident + tesis_gorevlisi eskiden 403
        aliyordu, artik 200 alir. Varsayilan `sakin_gorebilir=false` oldugu
        icin MEVCUT kayitlarin gorunurlugu degismez.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: aktif
          in: query
          required: false
          description: >
            Yonetim/operasyon suzgeci (admin+yonetici+security). resident ve
            tesis_gorevlisi icin YOK SAYILIR — o roller her durumda yalniz
            aktif + sakine acik kameralari alir.
          schema: { type: boolean }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Camera" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [cameras]
      summary: Kamera ekle (admin + yonetici)
      description: |
        `ad` tenant icinde benzersizdir (cakisirsa 409).

        URL semasi `tur` ile TUTARLI olmali (aksi 422 `invalid_stream_url`):
        `hls`/`mp4` -> `http(s)://`, `rtsp` -> `rtsp://`. rtsp KABUL EDILIR ve
        saklanir; yanitta `oynatilabilir=false` doner.

        `sakin_gorebilir` verilmezse **false** (sakin/tesis gorevlisi gormez).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /cameras/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [cameras]
      summary: Kamera guncelle (admin + yonetici; en az bir alan)
      description: |
        URL/tur tutarliligi MEVCUT kayitla birlestirilerek dogrulanir: yalniz
        `tur` gonderilse bile kayitli URL'in semasi yeni ture uymak zorundadir
        (orn. http(s) URL'li kamera `tur=rtsp` yapilamaz -> 422
        `invalid_stream_url`). `sakin_gorebilir` bu uctan acilip kapatilir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [cameras]
      summary: Kamera sil (admin + yonetici)
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }


  # ------------------------------------------------------------------------
  # TUR 68 — BELGELENMEMIS UCLAR.
  #
  # Olcum (backend/tests/test_sozlesme_sapmasi.py): FastAPI 133 yol suniyordu,
  # sozlesme 119 tanimliyordu; parametre adlari normalize edilince 14 yol
  # BELGELENMEMIS cikti — arasinda tum moduller vardi. Sozlesme bu projede
  # kaynak gosterildigi icin (mobil domain testleri ona atif yapiyor) bu
  # gercek bir sapmaydi ve hicbir sey kontrol etmiyordu. Artik test ediliyor.
  # ------------------------------------------------------------------------
  /health:
    get:
      tags: [health]
      summary: Servis sagligi (altyapi kontrolu)
      description: Kimlik gerektirmez; yukleyici/izleme icin.
      # PUBLIC BEYANI (tur 74). Global `security: [bearerAuth]` gecerliyken bu
      # uc kimliksiz 200 donuyordu ama beyan edilmemisti; yetki supurmesi
      # (tests/test_yetki_kapsam.py) bunu sapma olarak bildirdi. Kimliksiz
      # erisilebilen her uc BURADA beyan edilmeli — beyan, koddaki davranisin
      # tek denetlenebilir kaydidir.
      security: []
      responses:
        '200': { description: ayakta }
  /me:
    get:
      tags: [me]
      summary: Oturumdaki kullanici (rol + tenant token'dan)
      description: |
        Access token'daki kullaniciyi doner. Tenant context ISTEKTEN ALINMAZ —
        token'daki `tenant_id` kullanilir. `avatar_url` alani `avatar_key`
        varsa kisa omurlu presigned GET URL'i olarak doldurulur (obje anahtari
        istemciye verilmez).

        Bilinen TUM roller kendi kaydini gorur.
      responses:
        '200': { description: kullanici }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/avatar:
    patch:
      tags: [me]
      summary: Kendi avatarini guncelle (presigned foto_key)
      description: |
        SELF-SERVIS profil fotografi. RBAC: **yalniz `yonetici` + `resident`**
        (auth.md). Saha personelinin (security / tesis_gorevlisi) fotografini
        yonetim `PATCH /users/{id}/avatar` ile yonetir; admin'in self-servise
        ihtiyaci yoktur → digerleri 403.

        `avatar_key` KENDI TENANT namespace'inde olmalidir (`<tenant_id>/...`);
        degilse **422 `invalid_foto_key`** — duyuru fotografiyla ayni IDOR
        engeli. `avatar_key: null` fotografi KALDIRIR. Degisen/kaldirilan eski
        obje MinIO'dan SILINIR (erisilemez cop birakilmaz). Islem
        `audit_log`'a `avatar_update` olarak yazilir.
      responses:
        '200': { description: guncellendi }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/checkpoints:
    get:
      tags: [me]
      summary: Token'daki TENANT'in kontrol noktalari (ad'a gore sirali)
      description: |
        DIKKAT — ad yaniltici olabilir: uc kullaniciya ATANMIS noktalari
        degil, **token'daki tenant'in TUM aktif olmayan/olan kontrol
        noktalarini** doner (ad ASC), RLS ile izole. Faz-0'da tenant
        izolasyonunu uctan uca dogrulamak icin eklendi ve oyle kaldi;
        devriye plani bazli nokta listesi icin
        `GET /patrol-plans/{id}/checkpoints` kullanilir.

        RBAC: kimlikli her rol (ek rol kapisi YOK).
      responses:
        '200': { description: liste }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/overview:
    get:
      tags: [me, admin]
      summary: Platform admin RBAC yoklama ucu (Faz-0 iskeleti)
      description: |
        DIKKAT — SAYAC DONDURMEZ. Govde sabittir:
        `{"status": "ok", "role": "admin"}`. Faz-0'da rol matrisini uctan uca
        dogrulamak icin eklenmis bir YOKLAMA ucudur; panel ozet sayilarini
        `GET /admin/tenants` ve `GET /reports/*` verir.

        RBAC: **yalniz `admin`** (yonetici dahil digerleri 403).
      responses:
        '200': { description: "sabit govde: {status, role}" }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit:
    get:
      tags: [audit]
      summary: Denetim kaydi listesi — CAPRAZ TENANT (platform admin)
      description: |
        KVKK denetim goruntuleyicisi. `audit_log` APPEND-ONLY'dir (migration
        0002: `app_role`'dan UPDATE/DELETE geri alinmistir).

        RLS `FORCE` oldugu icin normal uygulama rolu yalniz KENDI tenant'ini
        gorur; bu uc owner-sahipli **SECURITY DEFINER** `audit_log_list`
        fonksiyonu uzerinden TUM tenant'lari dondurur (mevcut
        `list_all_tenants` deseninin aynisi) ve `set_tenant` YAPILMAMIS bir
        oturum kullanir — RLS bypass'i fonksiyonun icindedir, uc katmaninda
        degil.

        RBAC: **yalniz `admin`** (site `yonetici`si DEGIL — capraz-tenant veri).
      parameters:
        - { name: tenant_id, in: query, required: false, description: tenant filtresi, schema: { type: string, format: uuid } }
        - { name: action, in: query, required: false, schema: { type: string } }
        - { name: resource_type, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, description: "date_from (>=)", schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, description: "date_to (<)", schema: { type: string, format: date-time } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: liste }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/{user_id}/avatar:
    patch:
      tags: [users]
      summary: BASKA bir kullanicinin avatarini guncelle (yonetim)
      description: |
        `PATCH /me/avatar`in yonetim karsiligi: saha personelinin (security /
        tesis_gorevlisi) fotografini yonetim yukler — o roller self-servis
        avatar ucuna erisemez.

        `avatar_key` HEDEF kullanicinin tenant namespace'inde olmalidir
        (`<tenant_id>/...`); degilse 422. `null` fotografi kaldirir; eski obje
        MinIO'dan silinir. Islem `audit_log`'a yazilir.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: guncellendi }
        '403': { $ref: '#/components/responses/Forbidden' }
  /shifts/{shift_id}/assignments:
    put:
      tags: [shifts]
      summary: Vardiya personelini TAM LISTE olarak degistir (admin + yonetici)
      description: |
        PUT semantigi: govdedeki `user_ids` vardiyanin YENI TAM personel
        listesidir — mevcut atamalar SILINIR ve liste yeniden yazilir. Bos
        liste vardiyayi personelsiz birakir (silme ucu ayri degildir).

        Liste SIRALI TEKILLESTIRILIR (ayni id iki kez gelirse bir kez yazilir,
        siralama korunur).

        ROL KISITI: yalniz SAHA rolleri atanabilir
        (`security` | `tesis_gorevlisi`). Listede baska rolden ya da var
        olmayan bir kullanici id'si varsa TUM istek **422
        `invalid_assignment`** ile reddedilir (kismi yazma YOK).

        RLS: baska tenant'in vardiyasi **404** (403 degil — kaydin varligi da
        sizmaz). Islem `audit_log`'a `shift_assign` olarak, atanan id
        listesiyle yazilir.
      parameters:
        - { name: shift_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: atamalar guncellendi }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /support:
    get:
      tags: [support]
      summary: KENDI platform destek taleplerim
      description: |
        SITE ↔ PLATFORM kanalidir (site ICI talep/sikayet degil — onlar
        `/complaints` ve `/unit-complaints`). Cagiran kendi tenant'inin
        actigi talepleri gorur; capraz-tenant gorunum `/support/all`dedir.
      responses:
        '200': { description: liste }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [support]
      summary: Platform destek talebi olustur
      description: |
        Talep cagiranin tenant'ina ve kullanicisina baglanir (ikisi de
        ISTEKTEN alinmaz, token'dan gelir). Ekli gorseller `foto_key`
        listesiyle verilir (presign akisi — `POST /uploads/presign`).
      responses:
        '201': { description: olusturuldu }
        '422': { $ref: '#/components/responses/ValidationError' }
  /support/all:
    get:
      tags: [support]
      summary: TUM tenant'larin destek talepleri (platform admin)
      description: |
        CAPRAZ TENANT gorunum — `/audit` ile ayni ilke: RLS'i asan okuma
        yalniz platform `admin`ine aciktir; site `yonetici`si 403 alir.
        Yanit her satirda tenant kimligini de tasir (hangi siteden geldigi).
      responses:
        '200': { description: liste }
        '403': { $ref: '#/components/responses/Forbidden' }
  /support/{ticket_id}:
    patch:
      tags: [support]
      summary: Destek talebini yanitla / durumunu degistir (platform admin)
      description: |
        Yalniz platform `admin`i yanit yazar ve durumu ilerletir; talebi ACAN
        taraf yanitlayamaz (kanalin karsi ucu). Yanit yazildiginda talep
        sahibine bildirim uretilir.
      parameters:
        - { name: ticket_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: guncellendi }
        '403': { $ref: '#/components/responses/Forbidden' }
  # ================================================================= #
  # ANPR (P16) — kaynaktan bagimsiz plaka okuma girisi.
  # Kimlik JWT DEGIL, tenant basina API ANAHTARI (`X-ANPR-Key`).
  # ================================================================= #
  /integrations/anpr/events:
    post:
      tags: [anpr]
      summary: Plaka okuma olayi al (KAMERA KUTUSU — X-ANPR-Key)
      # PUBLIC DEGIL: JWT yerine apiKey semasi kullanilir. `security: []`
      # yazmak sozlesmeyi YANILTICI yapardi (uc 401 doner).
      security:
        - anprApiKey: []
      description: |
        Frigate / Hikvision / Dahua ve elle giris AYNI uca yazar; kaynaga ozgu
        bicim `kaynak` alanina gore ADAPTOR katmaninda tek gövdeye cevrilir
        (esleme tablosu: `docs/frigate-poc.md` §6).

        **KIMLIK — JWT DEGIL.** Kamera kutusunun kullanici oturumu yoktur ve
        token yenileyemez; `X-ANPR-Key: <kimlik>.<sir>` basligi kullanilir.
        Sunucu yalniz `sir`in sha256 ozetini saklar. Gecersiz/pasif/bicimsiz
        anahtarin HEPSI ayni **401**'i doner — hangi asamada dusuldugunu
        soylemek, gecerli bir `kimlik` arayan birine bilgi verir.

        **IDEMPOTENT.** Ayni `(kaynak, kaynak_olay_id)` ikinci kez gelirse YENI
        kayit acilmaz, MEVCUT olay doner. Bu susleme degil, olculmus bir
        gerekliliktir: Frigate ayni olayi `update` ve `end` olarak birden cok
        kez yayinlar; tekillik olmadan tek arac iki gecis acardi.

        **OLAY HER ZAMAN DEFTERE YAZILIR.** Gecersiz plaka bile `durum='hata'`
        ile kaydedilir ve **201** doner — istek DUSURULMEZ. Kutunun yeniden
        denemesi bozuk bir okumayi duzeltmez; saha "kamera sacmaliyor"
        diyebilsin diye iz birakilir. Tek istisna bilinmeyen `kaynak`: o bir
        SOZLESME hatasidir (422).

        **KARAR KURALLARI**

        | Kosul | Sonuc |
        |---|---|
        | `guven` < tenant esigi (`anpr_guven_esigi`, varsayilan 0.850) | gecis ACILMAZ, `onay_bekliyor` |
        | `guven` HIC verilmemis | islenir (her kaynak guven uretmez) |
        | `yon` = `bilinmiyor` + plakanin acik gecisi VAR | CIKIS sayilir |
        | `yon` = `bilinmiyor` + acik gecis YOK | GIRIS sayilir |
        | GIRIS ama arac zaten iceride | `yok_sayildi` (`zaten_iceride`) |
        | CIKIS ama acik gecis yok | `yok_sayildi` (`acik_gecis_yok`) |
        | CIKIS ama `anpr_otomatik_cikis=false` | `yok_sayildi` |

        `yon` alanini **Frigate URETMEZ** (P15'te olculdu); `bilinmiyor`
        gercek bir haldir ve sessizce "giris" sayilmaz.

        Acilan gecis `vehicle_pass` satiridir (`kaynak='anpr'`,
        `kaydeden_user_id=null`) — otopark dolulugu ve `/activity` akisi
        AYRI kod gerektirmeden calisir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnprEventIn" }
      responses:
        "201":
          description: Olay deftere yazildi (tekrar da 201 + MEVCUT kayit doner)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnprEventOut" }
        "401":
          description: Anahtar yok / bicimsiz / bulunamadi / pasif (ayrim YAPILMAZ)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [anpr]
      summary: Olay defteri (admin + security)
      description: |
        `created_at DESC`. `?durum=onay_bekliyor` ONAY KUYRUGUDUR.
        RBAC arac gecisi listesiyle AYNI kume: plaka kisisel veriye
        baglanabilir (KVKK), yonetici/resident/tesis_gorevlisi **403** alir.

        `?plaka=` ONEK aramasidir ve sunucuda normalize edilir; gecersiz arama
        metni BOS SONUC verir (422 degil — yarim plaka yazmak hata degildir).
      parameters:
        - name: durum
          in: query
          required: false
          schema: { type: string, enum: [islendi, onay_bekliyor, yok_sayildi, hata] }
        - name: plaka
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 64 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnprEventListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /integrations/anpr/events/{event_id}/onay:
    parameters:
      - { name: event_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [anpr]
      summary: Dusuk guvenli okumanin INSAN karari (admin + security)
      description: |
        `onay=true` → okuma kabul edilir ve normal karar akisi UYGULANIR
        (giris ac / cikis kapat). `plaka` verilirse OCR duzeltilir — bir-iki
        karakter yanlis okunmasi en yaygin hatadir.
        `onay=false` → olay `yok_sayildi` olur, gecis ACILMAZ.

        **Insan onayladiginda guven esigi ARTIK UYGULANMAZ** — esik zaten
        insani cagirmak icindi.

        YALNIZ `onay_bekliyor` durumundaki olay karara acilir; islenmis bir
        olayi yeniden karara sokmak CIFT GECIS uretirdi (**409**).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnprOnayIn" }
      responses:
        "200":
          description: Karar uygulandi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnprEventOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Olay onay beklemiyor (zaten islenmis/reddedilmis)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /integrations/anpr/keys:
    get:
      tags: [anpr]
      summary: ANPR anahtarlari (YALNIZ admin)
      description: |
        Anahtarin DEGERI donmez — yalniz `kimlik` yarisi. RBAC yalniz
        `admin`: anahtar, tenant'in tum gecis akisini yazma yetkisidir ve
        site yoneticisine acilmaz.
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AnprApiKeyOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [anpr]
      summary: Yeni ANPR anahtari uret (YALNIZ admin)
      description: |
        Anahtar degeri **YALNIZ BU YANITTA, BIR KEZ** doner. Sunucuda `sir`in
        sha256 ozeti saklanir; anahtarin kendisi hicbir yerde tutulmaz.
        Kaybedilirse yenisi uretilir — bu, sizan bir yedekten anahtarin geri
        uretilememesi icin bilincli bir bedeldir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnprApiKeyCreate" }
      responses:
        "201":
          description: Uretildi (`anahtar` alani bir kez doner)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnprApiKeyCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /integrations/anpr/keys/{key_id}:
    parameters:
      - { name: key_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [anpr]
      summary: Anahtari PASIFLESTIR (YALNIZ admin)
      description: |
        Satir SILINMEZ, `aktif=false` yapilir — "kim ne zaman kullandi" izi
        (`son_kullanim`) korunur. Pasif anahtarla gelen istek 401 alir.
      responses:
        "204": { description: Pasiflestirildi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /transparency:
    get:
      tags: [transparency]
      summary: Seffaflik panosu — ay listesi
      description: |
        Aylik ANONIM finans ozeti. Kisi/daire bazli hicbir alan DONMEZ —
        pano bilincli olarak agregattir; bu yuzden sakin dahil bilinen tum
        roller okur.

        YAYIN KAPISI: yayinlanmamis aylar yalniz yonetime (admin/yonetici)
        gorunur; sakin yalniz `yayinlandi` aylari gorur.
      responses:
        '200': { description: aylar }
  /transparency/{ay}:
    get:
      tags: [transparency]
      summary: Bir ayin anonim finans ozeti
      description: |
        `ay` bicimi `YYYY-AA`. Yayinlanmamis bir ay yetkisiz role **404**
        doner (403 degil: ayin VARLIGI da bilgi sizdirmasin).
      parameters:
        - { name: ay, in: path, required: true, schema: { type: string, example: '2026-07' } }
      responses:
        '200': { description: ozet }
        '404': { $ref: '#/components/responses/NotFound' }
  /transparency/{ay}/publish:
    put:
      tags: [transparency]
      summary: Ayi yayinla / yayindan kaldir (yonetim)
      description: |
        admin + yonetici. Yayindan kaldirma da bu uctandir (idempotent:
        ayni duruma set etmek 200 doner, kayit degismez). Yayin durumu
        `transparency_publication` tablosunda tutulur (migration 0003).
      parameters:
        - { name: ay, in: path, required: true, schema: { type: string, example: '2026-07' } }
      responses:
        '200': { description: durum degisti }
        '403': { $ref: '#/components/responses/Forbidden' }

# =================================================================== #
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT access token. `Authorization: Bearer <token>`. Bkz. /contracts/auth.md"
    anprApiKey:
      type: apiKey
      in: header
      name: X-ANPR-Key
      description: |
        ANPR girisi (P16) icin TENANT BASINA uzun omurlu anahtar:
        `<kimlik>.<sir>`. Kamera kutusunun kullanici oturumu yoktur ve token
        yenileyemez, bu yuzden JWT KULLANILMAZ. Sunucu yalniz `sir`in sha256
        ozetini saklar; anahtar `POST /integrations/anpr/keys` ile uretilir ve
        deger YALNIZ O YANITTA bir kez doner.

  parameters:
    Limit:
      name: limit
      in: query
      description: Sayfa boyutu (varsayilan 50, max 200)
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      description: Atlanan kayit sayisi
      schema: { type: integer, minimum: 0, default: 0 }
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        Yayin iceriginin (duyuru / site kurali / etkinlik) hangi dilde
        servis edilecegini belirler. Standart RFC 9110 bicimi desteklenir:
        `tr-TR,tr;q=0.9,en;q=0.8`.

        **HATA METINLERI de bu basliga uyar** (`Error.message`) — endpoint
        bu parametreyi tanimlamasa bile, hata zarfi TUM uclarda istegin
        dilinde doner (ayni eslestirme zinciri).

        **Eslestirme**: bolge eki DUSURULUR (`tr-TR` -> `tr`), q'ya gore
        azalan sirada ilk DESTEKLENEN dil secilir. Desteklenen kume:
        `tr` (varsayilan/kaynak), `en`, `ar`, `ru`, `de`, `fr`, `es`.

        **GERI-DUSME ZINCIRI**: `?dil=` -> Accept-Language'daki ilk
        desteklenen dil -> icerigin ORIJINAL dili. Desteklenmeyen bir dil
        istemek HATA DEGILDIR (400 donmez) — orijinale duser, yani icerik
        her zaman okunabilir.

        Ceviri henuz hazir degilse (`ceviri_durumu` = `bekliyor`/`hata`)
        ORIJINAL metin servis edilir; govde ASLA bos kalmaz.
      schema: { type: string, example: "ru-RU,ru;q=0.9,en;q=0.8" }
    DilQuery:
      name: dil
      in: query
      required: false
      description: |
        Accept-Language basligini EZER (panel/dogrulama icin). Dil kodu
        (`tr`|`en`|`ar`|`ru`|`de`|`fr`|`es`) ya da `orijinal` — `orijinal`
        icerigin kaynak dilini zorlar. Desteklenmeyen deger 400 URETMEZ;
        geri-dusme zinciri isler.
      schema:
        type: string
        enum: [tr, en, ar, ru, de, fr, es, orijinal]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Istemci tarafindan uretilen benzersiz anahtar (UUID onerilir)
      schema: { type: string, minLength: 8, maxLength: 200 }

  responses:
    BadRequest:
      description: Gecersiz istek
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Kimlik dogrulama gerekli / gecersiz token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Rol bu islem icin yetkili degil
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Kayit bulunamadi (tenant kapsaminda)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Cakisma (benzersizlik / iliskili kayit)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Govde dogrulama hatasi
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Cok fazla istek
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ---------------------------- ortak ---------------------------- #
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Makine-okunabilir hata kodu
              example: validation_error
            message:
              type: string
              description: |
                Insan-okunabilir aciklama. **YERELLESTIRILMISTIR**: metin
                istegin `Accept-Language` basligina gore 7 dilden birinde
                doner (baslik yoksa `tr`). Istemci mantigi buna DEGIL
                `code`a bakmalidir. Sunucu yapilandirma hatalari
                (`storage_unconfigured`, `config_error`,
                `payment_unconfigured`, `payment_provider_error`,
                `webhook_unsupported`) cevrilmez — operatore hitap eder.
              example: "The record already exists (uniqueness violation)."
            details:
              type: array
              description: Alan bazli dogrulama hatalari (opsiyonel)
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }

    Page:
      type: object
      required: [meta]
      properties:
        meta: { $ref: "#/components/schemas/PageMeta" }

    PageMeta:
      type: object
      required: [limit, offset, total]
      properties:
        limit: { type: integer, example: 50 }
        offset: { type: integer, example: 0 }
        total:
          type: integer
          description: Filtreye uyan toplam kayit sayisi
          example: 137

    GunTipi:
      type: string
      enum: [her_gun, hafta_ici, hafta_sonu, resmi_tatil]

    UserRole:
      type: string
      description: >
        (P35) `guvenlik_amiri` altinci roldur: guvenligi DIS BIR SIRKET
        yurutuyorsa vardiya/tur planlamasinin sahibi. Sakin, finans, kargo ve
        ziyaretci alanlari ona BILINCLI olarak KAPALIDIR (dis sirket = en az
        yetki, KVKK).
      enum:
        [admin, yonetici, security, tesis_gorevlisi, resident, guvenlik_amiri]

    # --------------------------- devices --------------------------- #
    DevicePlatform:
      type: string
      enum: [android, ios, web]
    DeviceRegister:
      type: object
      required: [fcm_token, platform]
      properties:
        fcm_token: { type: string }
        platform: { $ref: "#/components/schemas/DevicePlatform" }
        dil:
          type: string
          enum: [tr, en, ar, ru, de, fr, es]
          default: tr
          description: >
            CIHAZIN arayuz dili. Push metni SUNUCUDA, gonderim aninda bu dilde
            uretilir — push asenkron oldugu icin o anda `Accept-Language`
            YOKTUR. Istemci uygulama dilini degistirdiginde cihazi YENIDEN
            kaydeder (ayni token -> idempotent upsert, dil guncellenir).
            Gonderilmezse `tr`.
    Device:
      type: object
      required: [id, user_id, fcm_token, platform, dil, aktif, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        fcm_token: { type: string }
        platform: { $ref: "#/components/schemas/DevicePlatform" }
        dil: { type: string, enum: [tr, en, ar, ru, de, fr, es] }
        aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # password_hash ASLA donmez (guvenlik).
    User:
      type: object
      required: [id, ad, role, is_active, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string }
        email:
          type: string
          format: email
          nullable: true
          description: Personelde zorunlu; resident'ta opsiyonel (daire ile girer)
        telefon:
          type: string
          nullable: true
          description: >
            Rol-bazli arama numarasi. YALNIZ tek-kayit yonetim gorunumunde
            (bu sema) doner; LISTEDE donmez (KVKK — bkz. UserListItem). Arayanlara
            yalniz /call-target ile riza+yetki kapisindan gecince aciklanir.
        aranabilir:
          type: boolean
          description: Telefonla aranmaya riza (C1a). Yonetim girer; /call-target kapisi.
        role: { $ref: "#/components/schemas/UserRole" }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
    UserListItem:
      type: object
      description: >
        Kullanici LISTE ogesi — telefon YOK (data-minimization: numaralar toplu
        listelenmez). aranabilir (riza bayragi, PII degil) yonetim gorunurlugu icin.
      required: [id, ad, role, is_active, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string }
        email: { type: string, format: email, nullable: true }
        aranabilir: { type: boolean }
        role: { $ref: "#/components/schemas/UserRole" }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
    UserCreate:
      type: object
      description: |
        telefon GLOBAL benzersiz LOGIN anahtaridir (zorunlu; E.164 normalize).
        email opsiyonel (girise girmez). password verilmezse TEK SEFERLIK gecici
        kod uretilir (yanitta `temp_code` bir kez doner — UserCreatedOut).
      required: [ad, telefon, role]
      properties:
        ad: { type: string }
        telefon:
          type: string
          description: GLOBAL benzersiz giris anahtari (E.164 normalize)
          example: "+905321112204"
        email: { type: string, format: email, nullable: true }
        aranabilir: { type: boolean, default: false }
        role: { $ref: "#/components/schemas/UserRole" }
        password:
          type: string
          format: password
          minLength: 8
          nullable: true
          description: Verilmezse gecici kod uretilir (temp password first)
    UserCreatedOut:
      type: object
      description: >
        Kullanici olusturma yaniti — `temp_code` YALNIZ parola verilmeyip gecici
        kod uretildiginde ve bir kez duz metin doner.
      required: [id, ad, role, is_active, aranabilir, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string }
        email: { type: string, nullable: true }
        telefon: { type: string, nullable: true }
        aranabilir: { type: boolean }
        role: { $ref: "#/components/schemas/UserRole" }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        temp_code: { type: string, nullable: true, example: "K7MR-2QWX" }
    UserUpdate:
      type: object
      minProperties: 1
      properties:
        ad: { type: string }
        email: { type: string, format: email }
        telefon: { type: string, nullable: true }
        aranabilir: { type: boolean }
        role: { $ref: "#/components/schemas/UserRole" }
        is_active: { type: boolean }
        password: { type: string, format: password, minLength: 8 }
    UserContactUpdate:
      type: object
      description: >
        Iletisim ayari (telefon + arama rizasi) — en az bir alan. Yonetim ucunda
        (PATCH /users/{id}/contact, admin+yonetici -> baskasi) VE self-servis
        ucunda (PATCH /me/contact, kullanici kendi) ayni govde.
      minProperties: 1
      properties:
        telefon: { type: string, nullable: true, maxLength: 40 }
        aranabilir: { type: boolean }
    PasswordChangeRequest:
      type: object
      description: Self-servis parola degisimi (PATCH /me/password) — mevcut parola zorunlu
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password, minLength: 1 }
        new_password: { type: string, format: password, minLength: 8 }
    MeProfileOut:
      type: object
      description: Self-servis profil (GET /me/profile, PATCH /me/contact) — password_hash yok
      required: [id, ad, role, is_active, aranabilir]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string }
        email: { type: string, nullable: true }
        telefon: { type: string, nullable: true }
        aranabilir: { type: boolean }
        role: { $ref: "#/components/schemas/UserRole" }
        is_active: { type: boolean }
        birincil:
          type: boolean
          default: false
          description: >
            Tenant'in BIRINCIL yoneticisi mi? Mobil ilk-giris adlandirma kapisi
            (POST /tenant/setup) yalniz buna acilir; yonetici disi rollerde daima false.
    CallTarget:
      type: object
      description: >
        Cozulmus arama hedefi (C1a). Numara YALNIZ burada, yetki+riza kapisindan
        gecince doner. channel C1a'da 'phone'; C1b baska kanallar ekleyecek.
      required: [user_id, ad, role, channel, telefon, tel_uri]
      properties:
        user_id: { type: string, format: uuid }
        ad: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        channel: { type: string, enum: [phone], description: "C1a: phone; C1b genisletir" }
        telefon: { type: string }
        tel_uri: { type: string, example: "tel:+905321112203" }

    # ----------------------- integrations (C1b) -------------------- #
    Integration:
      type: object
      description: >
        Entegrasyon konfig CIKTISI — auth_secret ASLA donmez (write-only);
        yerine auth_secret_set (bool). channel_type C1a kanal soyutlamasini
        genisletir.
      required: [id, ad, channel_type, endpoint_url, http_method, auth_type, aktif, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string }
        channel_type: { type: string, enum: [webhook, megaphone, smarthome] }
        endpoint_url: { type: string, description: "Public http(s); SSRF kapisi tetikte" }
        http_method: { type: string, enum: [GET, POST, PUT, PATCH] }
        headers_json:
          type: object
          additionalProperties: { type: string }
          description: Gizli OLMAYAN ek header'lar
        auth_type: { type: string, enum: [none, bearer, api_key] }
        auth_secret_set:
          type: boolean
          description: Sirrin VARLIGI (sir kendisi donmez — write-only)
        payload_template:
          type: string
          description: "{{message}} / {{title}} yer tutuculu govde sablonu"
        aktif: { type: boolean }
        created_at: { type: string, format: date-time }
    IntegrationCreate:
      type: object
      required: [ad, endpoint_url]
      properties:
        ad: { type: string, minLength: 1, maxLength: 200 }
        channel_type: { type: string, enum: [webhook, megaphone, smarthome], default: webhook }
        endpoint_url:
          type: string
          maxLength: 2000
          description: http(s) olmali (tam SSRF kapisi tetik aninda)
        http_method: { type: string, enum: [GET, POST, PUT, PATCH], default: POST }
        headers_json:
          type: object
          additionalProperties: { type: string }
        auth_type: { type: string, enum: [none, bearer, api_key], default: none }
        auth_secret:
          type: string
          maxLength: 4000
          writeOnly: true
          description: WRITE-ONLY — KEK ile sifreli saklanir; GET'te donmez
        payload_template: { type: string, maxLength: 8000, default: "" }
        aktif: { type: boolean, default: true }
    IntegrationUpdate:
      type: object
      minProperties: 1
      properties:
        ad: { type: string, minLength: 1, maxLength: 200 }
        channel_type: { type: string, enum: [webhook, megaphone, smarthome] }
        endpoint_url: { type: string, maxLength: 2000 }
        http_method: { type: string, enum: [GET, POST, PUT, PATCH] }
        headers_json:
          type: object
          additionalProperties: { type: string }
        auth_type: { type: string, enum: [none, bearer, api_key] }
        auth_secret: { type: string, maxLength: 4000, writeOnly: true }
        payload_template: { type: string, maxLength: 8000 }
        aktif: { type: boolean }
    IntegrationPreset:
      type: object
      required: [key, channel_type, http_method, headers_json, payload_template]
      properties:
        key: { type: string, example: webhook-generic }
        channel_type: { type: string, enum: [webhook, megaphone, smarthome] }
        http_method: { type: string, enum: [GET, POST, PUT, PATCH] }
        headers_json:
          type: object
          additionalProperties: { type: string }
        payload_template: { type: string }
    IntegrationTrigger:
      type: object
      description: Opsiyonel — payload_template yer tutucularini doldurur
      properties:
        message: { type: string, maxLength: 2000 }
        title: { type: string, maxLength: 500 }
    IntegrationTriggerResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, description: 2xx ise true }
        status: { type: integer, nullable: true, description: HTTP durum (ag hatasinda null) }
        error: { type: string, nullable: true, description: SSRF engeli / ag / HTTP hatasi }

    # ---------------------- unit-complaints (D1) ------------------- #
    UnitComplaint:
      type: object
      description: >
        Daire sikayeti ciktisi (Rev-2 GIZLILIK). complainant_user_id +
        complainant_ad ARTIK HICBIR uctan DONMEZ (yonetim dahil, hep null;
        alanlar geriye-uyum icin durur). notlar yalniz yonetime + kendi kaydini
        goren sakine dolu. resident/security/gorevli liste/density'ye ERISEMEZ.
      required: [id, target_unit_id, kategori, durum, created_at]
      properties:
        id: { type: string, format: uuid }
        target_unit_id: { type: string, format: uuid }
        unit_no: { type: string, nullable: true }
        kategori: { type: string, enum: [gurultu, kapi_onu_ayakkabi, zarar_verme, goruntu_kirliligi, diger] }
        notlar:
          type: string
          nullable: true
          description: YALNIZ admin+yonetici icin dolu; diger rollerde null
        durum: { type: string, enum: [acik, kapali] }
        created_at: { type: string, format: date-time }
        complainant_user_id:
          type: string
          format: uuid
          nullable: true
          description: YALNIZ yonetim (denetim) icin dolu; resident/saha icin null
        complainant_ad: { type: string, nullable: true, description: Sikayet edenin adi (yalniz yonetim) }
        okundu:
          type: boolean
          nullable: true
          description: |
            **(P24)** ISTEGI YAPAN yoneticiye gore okundu mu. Yonetim
            uclarinda (liste / kapatma / okundu) dolu; sakin uclarinda
            (`POST /unit-complaints`, `/mine`) null — okuma durumu bir
            YONETIM kuyrugu kavramidir.
    UnitComplaintCreate:
      type: object
      required: [target_unit_id]
      properties:
        target_unit_id:
          type: string
          format: uuid
          description: >
            Bildirilen HEDEF daire — sakinin KENDI blogunda olmali (blok disi 403).
        kategori:
          type: string
          enum: [gurultu, kapi_onu_ayakkabi, zarar_verme, goruntu_kirliligi, diger]
          default: diger
        notlar: { type: string, nullable: true, minLength: 1, maxLength: 1000 }
    UnitComplaintDecision:
      type: object
      required: [durum]
      properties:
        durum: { type: string, enum: [acik, kapali] }
    UnitDensityItem:
      type: object
      description: Daire-basi ANONIM yogunluk (sikayet eden YOK)
      required: [target_unit_id, unit_no, acik_sayisi, renk]
      properties:
        target_unit_id: { type: string, format: uuid }
        unit_no: { type: string }
        blok: { type: string, nullable: true }
        acik_sayisi: { type: integer, description: ACIK sikayet sayisi }
        renk:
          type: string
          enum: [yesil, sari, kirmizi, mor]
          description: |
            **DORT KADEME (P24)**: `0 → yesil`, `1-2 → sari`, `3-4 → kirmizi`,
            `5+ → mor`. Eskiden uc kademeydi (0-2 yesil...) ve TEK sikayet
            almis daire, hic sikayet almamis daireyle AYNI renkteydi —
            yonetim ilk sinyali goremiyordu.

            Renk SUNUCUDAN gelir; istemci esikleri TEKRARLAMAZ (tek dogruluk
            kaynagi). Sayim tabani ACIK sikayetlerdir: kapatma skalayi
            dusurur, P37'nin sifirlamasi da dogal olarak yesile dondurur.
    UnitDensity:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UnitDensityItem" }

    # ---------------- bina semasi (D-viz Rev-1 — ROL-FARKINDA) ------------- #
    BuildingMapUnit:
      type: object
      description: >
        Haritada tek daire. complaint_count/color YALNIZ yonetim (admin+
        yonetici) icin dolu; resident/security/gorevli icin null (yapi gorunumu).
        benim_sikayetim/benim_acik_sayisi YALNIZ resident icin anlamli — kendi
        kayitlarindan turer (Rev-1.1: sakin KENDI sikayet ettigi daireleri
        harita uzerinde isaretli gorur; genel yogunluk sizmaz).
      required: [unit_id, unit_no]
      properties:
        unit_id: { type: string, format: uuid }
        unit_no: { type: string }
        blok: { type: string, nullable: true }
        kat: { type: integer, nullable: true }
        sira: { type: integer, nullable: true }
        complaint_count:
          type: integer
          nullable: true
          description: ACIK sikayet sayisi — yalniz yonetim; digerinde null
        color:
          type: string
          enum: [yesil, sari, kirmizi, mor]
          nullable: true
          description: |
            Yogunluk rengi — yalniz yonetim; digerinde null.
            **DORT KADEME (P24)**: `0 → yesil`, `1-2 → sari`, `3-4 → kirmizi`,
            `5+ → mor`. Eskiden uc kademeydi (0-2 yesil...) ve TEK sikayet
            almis daire, hic sikayet almamis daireyle AYNI renkteydi —
            yonetim ilk sinyali goremiyordu.

            Renk SUNUCUDAN gelir; istemci esikleri TEKRARLAMAZ (tek dogruluk
            kaynagi). Sayim tabani ACIK sikayetlerdir: kapatma skalayi
            dusurur, P37'nin sifirlamasi da dogal olarak yesile dondurur.
        benim_sikayetim:
          type: boolean
          default: false
          description: >
            resident: bu daireye KENDI (oturum acmis sakin) sikayeti var mi
            (yalniz kendi kayitlarindan). Diger rollerde false.
        benim_acik_sayisi:
          type: integer
          nullable: true
          description: >
            resident: KENDI acik sikayet sayim (0 dahil). Genel sayim DEGIL;
            diger rollerde null.
    BuildingMapKat:
      type: object
      required: [kat, units]
      properties:
        kat: { type: integer }
        units:
          type: array
          items: { $ref: "#/components/schemas/BuildingMapUnit" }
    BuildingMapBlok:
      type: object
      required: [blok, katlar]
      properties:
        blok: { type: string }
        katlar:
          type: array
          items: { $ref: "#/components/schemas/BuildingMapKat" }
    BuildingMap:
      type: object
      description: >
        Cizilebilir yapi: blok -> kat -> daire; yerlesimi eksik daireler
        'unplaced' kovada. ROL-FARKINDA: shows_density yonetimde true (sayim+
        renk dolu); resident/security/gorevli icin false (yalniz yapi). resident
        YALNIZ kendi blogunu gorur. complainant hicbir role donmez.
      required: [shows_density, bloklar, unplaced]
      properties:
        shows_density:
          type: boolean
          description: true = complaint_count/color dolu (yonetim); false = yapi
        bloklar:
          type: array
          items: { $ref: "#/components/schemas/BuildingMapBlok" }
        unplaced:
          type: array
          items: { $ref: "#/components/schemas/BuildingMapUnit" }

    # ---------------- bina blok (D-viz Rev-1) ---------------- #
    Block:
      type: object
      required: [id, ad, unit_sayisi, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, description: Blok etiketi (kisa alfanumerik) }
        kat_sayisi: { type: integer, nullable: true }
        unit_sayisi: { type: integer, description: Bu blogu kullanan daire sayisi }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BlockCreate:
      type: object
      required: [ad]
      properties:
        ad: { type: string, minLength: 1, maxLength: 8, pattern: "^[A-Za-z0-9]+$" }
        kat_sayisi: { type: integer, nullable: true, minimum: 0, maximum: 200 }
    BlockUpdate:
      type: object
      minProperties: 1
      properties:
        ad: { type: string, minLength: 1, maxLength: 8, pattern: "^[A-Za-z0-9]+$" }
        kat_sayisi: { type: integer, nullable: true, minimum: 0, maximum: 200 }
    BlockList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Block" }

    PatrolWindowDurum:
      type: string
      enum: [bekliyor, tamamlandi, kacirildi]

    # ----------------------------- auth ---------------------------- #
    LoginRequest:
      type: object
      description: |
        PANEL girisi (admin — e-posta + tenant_slug). Mobil roller telefon ile
        `POST /auth/login-phone` kullanir.
      required: [tenant_slug, email, password]
      properties:
        tenant_slug:
          type: string
          description: |
            Tenant kisa adi (slug). email tenant-ici benzersiz oldugu icin login
            tenant'i bu alanla belirler. Sadece kucuk harf/rakam/tire.
          example: "acme-plaza"
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
    YoneticiCreate:
      type: object
      description: >
        Tenant olusturmada TEK bir yonetici satiri. Telefon = giris anahtari
        (GLOBAL benzersiz). E-posta ALINMAZ: mobil giris telefonladir ve yonetici
        e-postasini hicbir uc okumaz — tenant seviyesindeki `yonetim_email`
        ayridir. password verilmezse tek seferlik gecici kod uretilir.
      required: [ad, phone]
      properties:
        ad: { type: string, minLength: 2, maxLength: 120, example: "Ayse Yilmaz" }
        phone: { type: string, minLength: 1, example: "+905321112203" }
        password: { type: string, format: password, minLength: 8, nullable: true }
    TenantAdminCreate:
      type: object
      description: >
        Admin bir tenant + N yonetici acar. `yoneticiler` listesindeki ILK eleman
        BIRINCIL'dir (tesisi ilk giriste adlandirir). `ad` verilmezse yer tutucu
        ad + rastgele slug; her durumda kurulum_tamamlandi=false (birincil ONAYLAR).
        Ayni telefon birden fazla yoneticide kullanilamaz (422).
      required: [yoneticiler]
      properties:
        ad: { type: string, minLength: 2, maxLength: 160, nullable: true, example: "Acme Plaza" }
        yonetim_email:
          type: string
          nullable: true
          example: "yonetim@acme.com"
          description: "Tesisin yonetim maili (tenant seviyesi); bos gonderilirse null"
        yoneticiler:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/YoneticiCreate" }
    YoneticiCreatedOut:
      type: object
      required: [user_id, ad, birincil]
      properties:
        user_id: { type: string, format: uuid }
        ad: { type: string }
        birincil: { type: boolean, description: "Listedeki ILK yonetici true (tenant basina en fazla bir)" }
        temp_code:
          type: string
          nullable: true
          example: "K7MR-2QWX"
          description: "YALNIZ parola verilmeyen yonetici icin; BIR KEZ doner"
    TenantAdminCreatedOut:
      type: object
      description: >
        temp_code YALNIZ parola verilmeyen yonetici icin ve BIR KEZ doner (admin
        ilgili yoneticiye iletir). tenant_id GIZLI kimliktir (yalniz admin gorur).
      required: [tenant_id, yoneticiler]
      properties:
        tenant_id: { type: string, format: uuid, description: "GIZLI kimlik (yalniz admin)" }
        yoneticiler:
          type: array
          items: { $ref: "#/components/schemas/YoneticiCreatedOut" }
    TenantAdminListItem:
      type: object
      required: [id, ad, kurulum_tamamlandi, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, example: "(Kurulum bekliyor)" }
        kurulum_tamamlandi: { type: boolean }
        created_at: { type: string, format: date-time }
    TenantAdminListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TenantAdminListItem" }
    TenantSetupRequest:
      type: object
      required: [ad]
      properties:
        ad: { type: string, minLength: 2, maxLength: 120, example: "Örnek Sitesi" }
    TenantYoneticiOut:
      type: object
      required: [id, ad, is_active, password_set]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string }
        telefon: { type: string, nullable: true, description: "Giris anahtari (E.164)" }
        is_active: { type: boolean }
        password_set: { type: boolean, description: "false: henuz gecici kod asamasinda" }
    TenantAdminDetail:
      type: object
      required: [tenant_id, ad, kurulum_tamamlandi, created_at]
      properties:
        tenant_id: { type: string, format: uuid, description: "GIZLI kimlik (yalniz admin)" }
        ad: { type: string, example: "(Kurulum bekliyor)" }
        kurulum_tamamlandi: { type: boolean }
        created_at: { type: string, format: date-time }
        yonetici:
          allOf: [ { $ref: "#/components/schemas/TenantYoneticiOut" } ]
          nullable: true
    TenantAdminUpdate:
      type: object
      description: Admin tesis adini degistirir (rename/duzeltme).
      required: [ad]
      properties:
        ad: { type: string, minLength: 2, maxLength: 120 }
    TenantYoneticiUpdate:
      type: object
      description: Kismi guncelleme — verilmeyen alan degismez.
      properties:
        ad: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, minLength: 1, example: "+905321112203" }
        is_active: { type: boolean }
    TenantYoneticiResetOut:
      type: object
      required: [temp_code]
      properties:
        temp_code: { type: string, example: "K7MR-2QWX", description: "Yeni tek-seferlik kod" }
    PhoneLoginRequest:
      type: object
      description: |
        Mobil giris — cep telefonu (GLOBAL benzersiz) + parola/gecici kod.
        Tenant numaradan otomatik cozulur (tenant_slug YOK). Numara E.164
        normalize edilir (0->+90).
      required: [phone, password]
      properties:
        phone:
          type: string
          description: Cep telefonu (global benzersiz login anahtari)
          example: "+905321112203"
        password:
          type: string
          description: Kalici parola VEYA ilk giriste gecici kod
    PhoneLoginResponse:
      type: object
      required: [password_setup_required]
      properties:
        password_setup_required:
          type: boolean
          description: |
            true => gecici kodla ilk giris; `setup_token` ile
            `POST /auth/set-password` ZORUNLU (oturum token'i verilmedi).
            false => normal oturum; TokenPair alanlari dolu.
        setup_token:
          type: string
          nullable: true
          description: Kisa omurlu (~10 dk) parola-kurulum token'i
        access_token: { type: string, nullable: true }
        refresh_token: { type: string, nullable: true }
        token_type: { type: string, nullable: true, example: Bearer }
        expires_in: { type: integer, nullable: true, example: 900 }
    SetPasswordRequest:
      type: object
      required: [setup_token, new_password]
      properties:
        setup_token: { type: string }
        new_password: { type: string, format: password, minLength: 8 }
    ResidentCreate:
      type: object
      required: [unit_no, ad, telefon]
      properties:
        unit_no: { type: string, example: "A-12" }
        blok:
          type: string
          nullable: true
          description: Yalniz YENI acilan daireye islenir
        ad: { type: string, example: "Ayse Yilmaz" }
        telefon:
          type: string
          description: GLOBAL benzersiz giris anahtari (E.164 normalize)
          example: "+905321112203"
        email:
          type: string
          format: email
          nullable: true
          description: OPSIYONEL (giris anahtari degildir; bildirim/yedek)
        rol_tipi: { $ref: "#/components/schemas/ResidentRol" }
        password:
          type: string
          format: password
          minLength: 8
          nullable: true
          description: >
            VERILIRSE dogrudan belirlenir (gecici kod URETILMEZ, temp_code null);
            verilmezse gecici kod uretilir. Parola politikasi: 8+ karakter,
            buyuk harf + rakam + sembol (ihlal 422).
    ResidentCreated:
      type: object
      required: [user_id, unit_id, unit_no, ad]
      properties:
        user_id: { type: string, format: uuid }
        unit_id: { type: string, format: uuid }
        unit_no: { type: string, example: "A-12" }
        ad: { type: string }
        email: { type: string, nullable: true }
        temp_code:
          type: string
          nullable: true
          example: "K7MR-2QWX"
          description: |
            TEK SEFERLIK gecici giris kodu — parola VERILMEDIYSE bir kez doner
            (parola verildiyse null). Sunucuda bcrypt hash'i saklanir; sakin
            kalici parolasini belirleyince silinir.
    ResidentListItem:
      type: object
      description: Site sakin listesi ogesi — telefon KVKK geregi YOK.
      required: [user_id, ad, is_active]
      properties:
        user_id: { type: string, format: uuid }
        ad: { type: string }
        unit_no:
          type: string
          nullable: true
          description: Aktif daire(ler); coklu ise virgulle birlesir, yoksa null
          example: "A-12"
        is_active: { type: boolean }
    ResidentListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ResidentListItem" }
    ResidentUpdate:
      type: object
      description: |
        Sakin duzenle — en az bir alan. **KURAL (P23b): olusturmada girilebilen
        HER ALAN sonradan da duzenlenebilir.** Eskiden yalniz `ad` + `telefon`
        vardi; `email` ve `rol_tipi` olusturmada giriliyor ama bir daha
        DEGISTIRILEMIYORDU — kiraci cikip malik oturunca kayit yanlis kaliyor
        ve bu muhasebe hedeflemesini (P28) dogrudan bozuyordu.

        * `telefon` global benzersizdir (normalize; cakisma **409**).
        * `email` acikca `null` gonderilerek TEMIZLENEBILIR (sakinde opsiyonel).
        * `rol_tipi` kullanicinin **AKTIF** daire baglarinin HEPSINE uygulanir
          (`bitis IS NULL`). Aktif bag yoksa **422 `invalid_reference`** —
          once daire atanmalidir (`POST /units/{id}/residents`).
        * Gonderilmeyen alan DEGISMEZ.
      minProperties: 1
      properties:
        ad: { type: string, minLength: 1 }
        telefon: { type: string, minLength: 1, example: "+905321112203" }
        email:
          type: string
          format: email
          nullable: true
          description: "Acikca `null` = temizle"
        rol_tipi:
          type: string
          enum: [malik, kiraci]
          nullable: true
          description: >
            AKTIF daire baglarina uygulanir. Bir dairede hem malik hem kiraci
            olabilir (ayri kayitlar); muhasebede aidat KIRACI ONCELIKLI,
            yatirim/demirbas MALIK hedeflidir (P28).
    ResidentResetPasswordOut:
      type: object
      required: [temp_code]
      properties:
        temp_code: { type: string, example: "K7MR-2QWX" }
    ResidentDeleteOut:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          description: true=tamamen silindi (gecmissiz); false=pasiflestirildi (gecmis var)
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [Bearer], example: Bearer }
        expires_in:
          type: integer
          description: Access token gecerlilik suresi (saniye)
          example: 900

    # ---------------------------- shift ---------------------------- #
    Shift:
      type: object
      required: [id, ad, baslangic_saat, bitis_saat, gun_tipi, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, example: "Gece Vardiyasi" }
        baslangic_saat:
          type: string
          description: "Gun-ici saat (HH:MM, tenant.timezone'a gore)"
          example: "00:00"
        bitis_saat:
          type: string
          description: "HH:MM. bitis < baslangic ise ertesi gune sarkar"
          example: "08:00"
        gun_tipi: { $ref: "#/components/schemas/GunTipi" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ShiftCreate:
      type: object
      required: [ad, baslangic_saat, bitis_saat]
      properties:
        ad: { type: string }
        baslangic_saat: { type: string, example: "00:00" }
        bitis_saat: { type: string, example: "08:00" }
        gun_tipi: { $ref: "#/components/schemas/GunTipi" }
    ShiftUpdate:
      type: object
      minProperties: 1
      properties:
        ad: { type: string }
        baslangic_saat: { type: string }
        bitis_saat: { type: string }
        gun_tipi: { $ref: "#/components/schemas/GunTipi" }

    # -------------------------- checkpoint ------------------------- #
    Checkpoint:
      type: object
      required: [id, ad, nfc_tag_uid, aktif, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, example: "A Blok Giris" }
        nfc_tag_uid: { type: string, example: "04:A3:B2:C1:90:00" }
        gps_lat: { type: number, format: double, nullable: true, example: 41.015137 }
        gps_lng: { type: number, format: double, nullable: true, example: 28.979530 }
        aktif: { type: boolean }
        sdm_aktif:
          type: boolean
          description: "NTAG424 SDM anahtari kayitli mi (anahtarin kendisi ASLA donmez)"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CheckpointCreate:
      type: object
      required: [ad, nfc_tag_uid]
      properties:
        ad: { type: string }
        nfc_tag_uid: { type: string }
        gps_lat: { type: number, format: double, nullable: true }
        gps_lng: { type: number, format: double, nullable: true }
        aktif: { type: boolean, default: true }
    CheckpointUpdate:
      type: object
      minProperties: 1
      properties:
        ad: { type: string }
        nfc_tag_uid: { type: string }
        gps_lat: { type: number, format: double, nullable: true }
        gps_lng: { type: number, format: double, nullable: true }
        aktif: { type: boolean }

    # -------------------------- patrol plan ------------------------ #
    PatrolPlan:
      type: object
      required: [id, ad, baslangic_saat, bitis_saat, periyot_dakika, aktif, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, example: "Gece Devriyesi" }
        shift_id: { type: string, format: uuid, nullable: true }
        baslangic_saat:
          type: string
          description: "HH:MM, tenant.timezone'a gore (orn 00:00)"
          example: "00:00"
        bitis_saat:
          type: string
          example: "06:00"
        periyot_dakika:
          type: integer
          minimum: 1
          description: "Pencere periyodu (orn 60 => saat basi)"
          example: 60
        aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PatrolPlanDetail:
      allOf:
        - $ref: "#/components/schemas/PatrolPlan"
        - type: object
          properties:
            checkpoints:
              type: array
              items: { $ref: "#/components/schemas/PatrolPlanCheckpoint" }
    PatrolPlanCreate:
      type: object
      required: [ad, baslangic_saat, bitis_saat, periyot_dakika]
      properties:
        ad: { type: string }
        shift_id: { type: string, format: uuid, nullable: true }
        baslangic_saat: { type: string, example: "00:00" }
        bitis_saat: { type: string, example: "06:00" }
        periyot_dakika: { type: integer, minimum: 1, example: 60 }
        aktif: { type: boolean, default: true }
    PatrolPlanUpdate:
      type: object
      minProperties: 1
      properties:
        ad: { type: string }
        shift_id: { type: string, format: uuid, nullable: true }
        baslangic_saat: { type: string }
        bitis_saat: { type: string }
        periyot_dakika: { type: integer, minimum: 1 }
        aktif: { type: boolean }

    PatrolPlanCheckpoint:
      type: object
      required: [checkpoint_id, sira]
      properties:
        checkpoint_id: { type: string, format: uuid }
        sira: { type: integer, minimum: 0, example: 0 }
        checkpoint:
          allOf:
            - $ref: "#/components/schemas/Checkpoint"
          nullable: true
          description: "Detay yanitlarinda genisletilmis checkpoint (opsiyonel)"
    PatrolPlanCheckpointAssign:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [checkpoint_id]
            properties:
              checkpoint_id: { type: string, format: uuid }
              sira:
                type: integer
                minimum: 0
                description: "Verilmezse dizi index'i kullanilir"

    # ---------------------------- scans ---------------------------- #
    ScanReportItem:
      type: object
      description: "Gun-gun tarama raporu satiri: kim, hangi nokta, ne zaman."
      required: [id, checkpoint_id, checkpoint_ad, guard_id, guard_ad, okutma_zamani, imza_dogrulandi]
      properties:
        id: { type: string, format: uuid }
        checkpoint_id: { type: string, format: uuid }
        checkpoint_ad: { type: string }
        guard_id: { type: string, format: uuid }
        guard_ad: { type: string }
        okutma_zamani: { type: string, format: date-time }
        gps_lat: { type: number, format: double, nullable: true }
        gps_lng: { type: number, format: double, nullable: true }
        konum_durumu:
          type: string
          enum: [var, izin_yok, servis_kapali, zaman_asimi, bilinmiyor]
          default: bilinmiyor
          description: (P34) Konumun NEDEN yok oldugu
        gps_dogruluk_m: { type: number, format: double, nullable: true }
        imza_dogrulandi: { type: boolean }
    ScanReportResponse:
      type: object
      required: [tarih, items]
      properties:
        tarih: { type: string, format: date }
        items:
          type: array
          items: { $ref: "#/components/schemas/ScanReportItem" }
        konumsuz_sayisi:
          type: integer
          default: 0
          description: >
            (P34) O gunun konumsuz okutma sayisi — `konumsuz` suzgecinden
            BAGIMSIZ hesaplanir.
    ScanCreate:
      type: object
      required: [nfc_tag_uid, okutma_zamani]
      properties:
        nfc_tag_uid:
          type: string
          description: "Okutulan NFC etiketi; backend checkpoint'e eslestirir"
          example: "04:A3:B2:C1:90:00"
        checkpoint_id:
          type: string
          format: uuid
          nullable: true
          description: "Istemci biliyorsa; yoksa nfc_tag_uid ile cozumlenir"
        patrol_window_id:
          type: string
          format: uuid
          nullable: true
          description: "Ad-hoc okutmada bos birakilabilir; backend de eslestirebilir"
        okutma_zamani:
          type: string
          format: date-time
          description: "Cihazin okuttugu an (UTC). Offline gecikmeli gonderilebilir."
        gps_lat: { type: number, format: double, nullable: true }
        gps_lng: { type: number, format: double, nullable: true }
        konum_durumu:
          type: string
          enum: [var, izin_yok, servis_kapali, zaman_asimi, bilinmiyor]
          nullable: true
          description: >
            (P34) Konum NEDEN yok? Verilmezse SUNUCU TURETIR: koordinat varsa
            `var`, yoksa `bilinmiyor`. Uc farkli durumun tek bir NULL'a inmesi,
            amirin "konumsuz okutma" diye bir sey OLDUGUNU fark etmesini
            engellerdi. `var` gonderilirse koordinat ZORUNLUDUR (422).
        gps_dogruluk_m:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: >
            (P34) Metre. AYRI alandir: 5 m ile 2 km dogrulukla alinmis konum
            ekranda AYNI gorunurdu ve ikincisi kanit degeri tasimaz.
        foto_key:
          type: string
          nullable: true
          maxLength: 500
          description: >
            (P34) Tur baslangic fotografinin DEPO ANAHTARI
            (`POST /uploads/presign` ile alinir). Tenant namespace'i
            dogrulanir — baska tenant'in objesini tur kaniti diye baglamak
            IDOR olurdu (422 `invalid_foto_key`).
        foto_url:
          type: string
          nullable: true
          deprecated: true
          description: >-
            Sozlesmenin ilk surumunden kalma; DOGRULANMAZ. Yeni istemciler
            `foto_key` gonderir (ikisi de ayni kolona yazilir).
        imza_dogrulandi:
          type: boolean
          default: false
          deprecated: true
          description: >-
            DEPRECATED + YOK SAYILIR: deger artik SUNUCUDA NTAG424 SDM
            dogrulamasiyla hesaplanir; govdedeki girdi etkisizdir (eski mobil
            surumler kirilmaz). SDM icin sdm_picc_data + sdm_cmac gonderin.
        sdm_picc_data:
          type: string
          nullable: true
          minLength: 32
          maxLength: 32
          description: "NTAG424 SDM ENCPICCData (16B, hex) — etiketin NDEF ciktisindan"
          example: "EF963FF7828658A599F3041510671E88"
        sdm_cmac:
          type: string
          nullable: true
          minLength: 16
          maxLength: 16
          description: "NTAG424 SDMMAC (8B, hex) — sdm_picc_data ile BIRLIKTE gonderilir"
          example: "94EED9EE65337086"
    ScanEvent:
      type: object
      required: [id, guard_id, checkpoint_id, nfc_tag_uid, okutma_zamani, imza_dogrulandi, created_at]
      properties:
        id: { type: string, format: uuid }
        guard_id:
          type: string
          format: uuid
          description: "Token'dan turetilir (okutmayi yapan kullanici)"
        checkpoint_id: { type: string, format: uuid }
        patrol_window_id: { type: string, format: uuid, nullable: true }
        nfc_tag_uid: { type: string }
        okutma_zamani: { type: string, format: date-time }
        gps_lat: { type: number, format: double, nullable: true }
        gps_lng: { type: number, format: double, nullable: true }
        konum_durumu:
          type: string
          enum: [var, izin_yok, servis_kapali, zaman_asimi, bilinmiyor]
          default: bilinmiyor
          description: (P34) Konumun NEDEN yok oldugu
        gps_dogruluk_m: { type: number, format: double, nullable: true }
        foto_url: { type: string, nullable: true }
        imza_dogrulandi:
          type: boolean
          description: "SUNUCU hesaplar: NTAG424 SDM dogrulamasi gecerliyse true"
        idempotency_key: { type: string }
        created_at: { type: string, format: date-time }

    # -------------------------- dashboard -------------------------- #
    DashboardLive:
      type: object
      required: [generated_at, aktif_turlar, son_alarmlar]
      properties:
        generated_at: { type: string, format: date-time }
        aktif_turlar:
          type: array
          items: { $ref: "#/components/schemas/AktifTur" }
        son_alarmlar:
          type: array
          items: { $ref: "#/components/schemas/Alarm" }
    AktifTur:
      type: object
      required: [patrol_window_id, patrol_plan_id, pencere_baslangic, pencere_bitis, durum]
      properties:
        patrol_window_id: { type: string, format: uuid }
        patrol_plan_id: { type: string, format: uuid }
        patrol_plan_ad: { type: string }
        pencere_baslangic: { type: string, format: date-time }
        pencere_bitis: { type: string, format: date-time }
        durum: { $ref: "#/components/schemas/PatrolWindowDurum" }
        beklenen_checkpoint_sayisi: { type: integer }
        okutulan_checkpoint_sayisi: { type: integer }
    # Tur penceresi gecmisi (GET /patrol-windows ogesi).
    PatrolWindowHistory:
      type: object
      required:
        [id, patrol_plan_id, pencere_baslangic, pencere_bitis, durum,
         beklenen_checkpoint_sayisi, okutulan_checkpoint_sayisi]
      properties:
        id: { type: string, format: uuid }
        patrol_plan_id: { type: string, format: uuid }
        plan_adi: { type: string, nullable: true }
        pencere_baslangic: { type: string, format: date-time }
        pencere_bitis: { type: string, format: date-time }
        durum: { $ref: "#/components/schemas/PatrolWindowDurum" }
        beklenen_checkpoint_sayisi: { type: integer }
        okutulan_checkpoint_sayisi: { type: integer }
    PatrolWindowOzet:
      type: object
      required: [toplam, tamamlandi, kacirildi, bekliyor]
      description: "Filtrelenmis TUM kume uzerinden sayilar (sayfa ile sinirli degil)."
      properties:
        toplam: { type: integer }
        tamamlandi: { type: integer }
        kacirildi: { type: integer }
        bekliyor: { type: integer }
    # GET /me/patrol-window — aktif pencere + checkpoint bazinda okutma durumu.
    MePatrolCheckpoint:
      type: object
      required: [checkpoint_id, ad, sira, okutuldu]
      properties:
        checkpoint_id: { type: string, format: uuid }
        ad: { type: string }
        sira: { type: integer }
        okutuldu:
          type: boolean
          description: "PENCERE-GENELI: herhangi bir elemanin pencere araligindaki okutmasi sayilir."
        okutma_zamani:
          type: string
          format: date-time
          nullable: true
          description: "Penceredeki ILK scan'in zamani (okutulmadiysa null)."
        okutan_user_id:
          type: string
          format: uuid
          nullable: true
          description: "Penceredeki ILK scan'i yapan kullanici (okutulmadiysa null)."
    MePatrolWindowInfo:
      type: object
      required: [id, patrol_plan_id, pencere_baslangic, pencere_bitis, durum]
      properties:
        id: { type: string, format: uuid }
        patrol_plan_id: { type: string, format: uuid }
        plan_adi: { type: string, nullable: true }
        pencere_baslangic: { type: string, format: date-time }
        pencere_bitis: { type: string, format: date-time }
        durum: { $ref: "#/components/schemas/PatrolWindowDurum" }
    MePatrolWindowItem:
      allOf:
        - $ref: "#/components/schemas/MePatrolWindowInfo"
        - type: object
          required: [checkpoints]
          properties:
            checkpoints:
              type: array
              description: "Plana atanmis AKTIF checkpoint'ler, sira ASC."
              items: { $ref: "#/components/schemas/MePatrolCheckpoint" }
    MePatrolWindowResponse:
      type: object
      required: [generated_at, window, checkpoints, windows]
      properties:
        generated_at: { type: string, format: date-time }
        window:
          nullable: true
          description: "Bitisi en yakin aktif pencere; aktif pencere yoksa null."
          allOf:
            - $ref: "#/components/schemas/MePatrolWindowInfo"
        checkpoints:
          type: array
          description: "window'un checkpoint listesi; window null ise []."
          items: { $ref: "#/components/schemas/MePatrolCheckpoint" }
        windows:
          type: array
          description: "TUM aktif pencereler (pencere_bitis ASC); genelde 0-1 eleman."
          items: { $ref: "#/components/schemas/MePatrolWindowItem" }
    Alarm:
      type: object
      required: [tip, olusma_zamani, mesaj]
      properties:
        tip:
          type: string
          enum: [kacirilan_tur, eksik_checkpoint, gecikmis_okutma]
          example: kacirilan_tur
        olusma_zamani: { type: string, format: date-time }
        mesaj: { type: string }
        patrol_window_id: { type: string, format: uuid, nullable: true }
        checkpoint_id: { type: string, format: uuid, nullable: true }

    # ------------------------- notifications ----------------------- #
    CeviriAlanlari:
      type: object
      description: |
        CEVRILEBILIR YAYIN ICERIGININ ceviri ustverisi (duyuru / site kurali /
        etkinlik ortak). Govdedeki metin alanlari (`baslik` + `govde` /
        `icerik` / `aciklama`) Accept-Language ile SECILEN dilde doner;
        asagidaki alanlar o metnin NE oldugunu soyler.

        Mimari: ceviri YAZMA aninda uretilir (7 dil saklanir), okuma
        Accept-Language ile servis edilir, ORIJINAL metin her zaman korunur.
        Ceviri motoru kendi barindirdigimiz LibreTranslate'tir — icerik dis
        bir servise gonderilmez.

        CEVRILMEYEN alanlar (bilincli): `konum` (yer adi), `foto_key`/
        `foto_url` (gorsel), tarih/sira/sayi alanlari.
      required: [orijinal_dil, gosterilen_dil, ceviri_durumu, cevirildi_mi, orijinal]
      properties:
        orijinal_dil:
          type: string
          description: Icerigin YAZILDIGI (kaynak) dil. Su an her zaman `tr`.
          example: tr
        gosterilen_dil:
          type: string
          description: |
            Govdedeki metnin GERCEK dili. Ceviri hazir degilse geri-dusme
            nedeniyle `orijinal_dil`e esittir.
          example: ru
        ceviri_durumu:
          type: string
          enum: [hazir, bekliyor, hata]
          description: |
            Istenen dil icin cevirinin durumu.

            | durum | anlam | govdedeki metin |
            |---|---|---|
            | `hazir` | ceviri servis edilebilir (ya da kaynak dil istendi) | istenen dilde |
            | `bekliyor` | ceviri kuyrukta/uretiliyor | ORIJINAL |
            | `hata` | ceviri saglayicisi basarisiz | ORIJINAL |

            Istemci `bekliyor` iken "çeviri hazırlanıyor" gosterebilir; metin
            alanlari BOS DEGILDIR.
        cevirildi_mi:
          type: boolean
          description: |
            Govdedeki metin MAKINE cevirisi mi? Orijinal metinde ve yonetici
            tarafindan ELLE DUZELTILMIS ceviride `false`.
        orijinal:
          type: object
          additionalProperties: { type: string }
          description: |
            Orijinal (kaynak dildeki) metinler — HER ZAMAN doner (ayri istek
            ya da `?dil=orijinal` gerekmez). Anahtarlar entity'nin cevrilen
            alanlaridir; orn. duyuruda `{"baslik": ..., "govde": ...}`.
          example: { baslik: "Su kesintisi", govde: "Yarin 10:00-12:00." }
    Announcement:
      type: object
      description: >-
        Cevrilen metin alanlari `baslik` + `govde`; Accept-Language ile secilen
        dilde doner. Ceviri ustverisi: CeviriAlanlari.
      allOf:
        - $ref: "#/components/schemas/CeviriAlanlari"
      required: [id, baslik, govde, olusturan_user_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        baslik: { type: string, maxLength: 200 }
        govde: { type: string, maxLength: 5000 }
        foto_key:
          type: string
          nullable: true
          description: Opsiyonel gorsel — /uploads/presign ile alinan obje anahtari
        foto_url:
          type: string
          nullable: true
          description: Goruntuleme icin kisa omurlu presigned GET URL (foto_key varsa)
        olusturan_user_id: { type: string, format: uuid }
        olusturan_ad:
          type: string
          nullable: true
          description: Gonderen kullanicinin adi (liste/detayda join ile)
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AnnouncementCreate:
      type: object
      required: [baslik, govde]
      properties:
        baslik: { type: string, minLength: 1, maxLength: 200 }
        govde: { type: string, minLength: 1, maxLength: 5000 }
        foto_key:
          type: string
          nullable: true
          description: "Opsiyonel gorsel: once /uploads/presign ile alinan obje anahtari"
    AnnouncementUpdate:
      type: object
      properties:
        baslik: { type: string, minLength: 1, maxLength: 200 }
        govde: { type: string, minLength: 1, maxLength: 5000 }
        foto_key:
          type: string
          nullable: true
          description: Acikca null gonderilirse gorsel kaldirilir; alan yoksa dokunulmaz

    ComplaintPhoto:
      type: object
      required: [id, foto_key, sira]
      properties:
        id: { type: string, format: uuid }
        foto_key: { type: string }
        sira: { type: integer, description: "Gorunum sirasi (0-index)" }
        foto_url:
          type: string
          nullable: true
          description: Goruntuleme icin kisa omurlu presigned GET URL
    ComplaintStatusHistory:
      type: object
      description: Durum gecis timeline'i satiri — user_id ASLA tutulmaz, YALNIZ actor_role.
      required: [durum, actor_role, created_at]
      properties:
        durum: { type: string, enum: [acik, is_emri, cozuldu, reddedildi] }
        actor_role:
          type: string
          enum:
            [admin, yonetici, security, tesis_gorevlisi, resident, guvenlik_amiri]
        sebep:
          type: string
          nullable: true
          description: "Opsiyonel not (convert.not / resolve.cozum_notu / decline.sebep)"
        created_at: { type: string, format: date-time }
    Complaint:
      type: object
      required: [id, acan_user_id, baslik, mesaj, durum, fotograflar, gecmis, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        acan_user_id: { type: string, format: uuid }
        acan_ad:
          type: string
          nullable: true
          description: Acan kullanicinin adi (yonetim listesinde join ile)
        baslik: { type: string, maxLength: 200 }
        mesaj: { type: string, maxLength: 5000 }
        kategori_id:
          type: string
          format: uuid
          nullable: true
          description: "Talep kategorisi = yonetici-tanimli gorev kategorisi (task_category); null = belirtilmemis"
        kategori_ad:
          type: string
          nullable: true
          description: Kategori adi (join ile doldurulur)
        durum: { type: string, enum: [acik, is_emri, cozuldu, reddedildi] }
        unit_id:
          type: string
          format: uuid
          nullable: true
          description: (P33) Talebin ilgili oldugu daire
        unit_no:
          type: string
          nullable: true
          description: (P33) Daire numarasi (join ile doldurulur)
        oncelik:
          type: string
          enum: [dusuk, normal, yuksek, acil]
          default: normal
          description: (P33) Is takibi onceligi — durumdan BAGIMSIZ
        atanan_personel_id:
          type: string
          format: uuid
          nullable: true
          description: "(P33) `personel_kayit` kaydi (app_user DEGIL)"
        atanan_personel_ad:
          type: string
          nullable: true
          description: (P33) Atanan personelin adi (join ile doldurulur)
        fotograflar:
          type: array
          items: { $ref: "#/components/schemas/ComplaintPhoto" }
        gecmis:
          type: array
          description: Durum gecis timeline'i (created_at ASC)
          items: { $ref: "#/components/schemas/ComplaintStatusHistory" }
        is_emri_id:
          type: string
          format: uuid
          nullable: true
          description: Bagli is emri (Task) — talep donusturulmusse dolu
        is_emri_durum:
          type: string
          nullable: true
          description: "Bagli is emrinin ozet durumu: 'acik' (atandi) | 'tamamlandi'; is_emri_id null ise null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ComplaintCreate:
      type: object
      required: [baslik, mesaj]
      properties:
        baslik: { type: string, minLength: 1, maxLength: 200 }
        mesaj: { type: string, minLength: 1, maxLength: 5000 }
        kategori_id:
          type: string
          format: uuid
          nullable: true
          description: Opsiyonel talep kategorisi (task_category); verilmezse null
        unit_id:
          type: string
          format: uuid
          nullable: true
          description: >
            (P33) Talebin ILGILI OLDUGU daire. Acanin kendi dairesi
            OTOMATIK varsayilmaz: sakin ortak alan icin de talep acar
            ("asansor bozuk") ve talebi kendi dairesine yapistirmak, is
            emrini yanlis yere yonlendirirdi.
        foto_keys:
          type: array
          items: { type: string }
          maxItems: 3
          default: []
          description: "Opsiyonel gorseller (en fazla 3); her biri /uploads/presign ile alinan obje anahtari"
    KararUyesi:
      type: object
      description: >
        (P33) Karara katilan yonetim kurulu uyesi. Bir ADDIR, kullanici
        referansi DEGILDIR — uye uygulamada hesabi olmayan biri olabilir.
      required: [ad]
      properties:
        ad: { type: string, minLength: 1, maxLength: 150 }
        gorev: { type: string, nullable: true, maxLength: 100 }
    KararDefteriCreate:
      type: object
      required: [karar_no, konu, metin]
      properties:
        karar_no:
          type: string
          maxLength: 30
          description: Tenant icinde TEKTIR (cakisma 409)
        tarih: { type: string, format: date, description: Verilmezse bugun }
        konu: { type: string, minLength: 1, maxLength: 200 }
        metin: { type: string, minLength: 1, maxLength: 20000 }
        baskan_ad: { type: string, nullable: true, maxLength: 150 }
        uyeler:
          type: array
          items: { $ref: "#/components/schemas/KararUyesi" }
          default: []
    DokumanCreate:
      type: object
      description: >
        (P33) Sunucu DOSYAYI TASIMAZ, yalniz USTVERIYI tutar; yukleme
        presign ile dogrudan MinIO'ya yapilir.
      required: [ad, obje_anahtari]
      properties:
        ad: { type: string, minLength: 1, maxLength: 200 }
        obje_anahtari:
          type: string
          maxLength: 500
          description: Ayni anahtar iki kez kaydedilemez (409)
        icerik_tipi: { type: string, nullable: true, maxLength: 150 }
        boyut_bayt:
          type: integer
          nullable: true
          maximum: 26214400
          description: EN FAZLA 25 MB — veritabani CHECK'i ile de korunur
        aciklama: { type: string, nullable: true, maxLength: 1000 }
    SiteAktarSatir:
      type: object
      description: >
        (P33) Kurulum dosyasinin BIR SATIRI. `satir_no` dosyadaki gercek
        satir numarasidir (basliksiz 1. veri satiri genelde 2) — hata raporu
        bunu geri verir ki kullanici hucreyi bulabilsin.
      required: [satir_no]
      properties:
        satir_no: { type: integer, minimum: 1 }
        blok:
          type: string
          nullable: true
          maxLength: 8
          description: >
            Sema duzeyinde opsiyonel, IS KURALI olarak zorunlu: bos ise
            satir REDDEDILIR ama diger satirlar islenir. Sema
            zorunlulugu tum istegi 422 yapardi ve satir bazli rapor
            imkansizlasirdi.
        daire_no:
          type: string
          nullable: true
          maxLength: 50
          description: Bos ise satir reddedilir (bkz. blok)
        ad: { type: string, nullable: true, maxLength: 150 }
        telefon: { type: string, nullable: true, maxLength: 30 }
        rol_tipi:
          type: string
          nullable: true
          maxLength: 20
          description: "malik | kiraci; baskasi 422 degil SATIR HATASI verir"
    SiteAktarIstek:
      type: object
      required: [satirlar]
      properties:
        yalniz_dogrula:
          type: boolean
          default: false
          description: true ise HICBIR SEY YAZILMAZ (onizleme)
        satirlar:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/SiteAktarSatir" }
    ComplaintUpdate:
      type: object
      description: >
        (P33) Is takibi alanlari. En az bir alan zorunlu (bos govde 422
        `en_az_bir_alan`). `oncelik: null` gonderilemez — alan NOT NULL ve
        varsayilani vardir; sessizce yok saymak yerine acikca reddedilir.
      additionalProperties: false
      minProperties: 1
      properties:
        unit_id: { type: string, format: uuid, nullable: true }
        oncelik: { type: string, enum: [dusuk, normal, yuksek, acil] }
        atanan_personel_id:
          type: string
          format: uuid
          nullable: true
          description: "`personel_kayit` kaydi (app_user DEGIL)"
    ComplaintConvertRequest:
      type: object
      description: Talebi is emrine donustur (admin + yonetici)
      required: [atanan_user_id]
      properties:
        kategori_id:
          type: string
          format: uuid
          nullable: true
          description: Onaylanan/degistirilen kategori; verilmezse talebin mevcut kategorisi kullanilir
        oncelik:
          type: string
          enum: [dusuk, orta, yuksek]
          default: orta
        atanan_user_id:
          type: string
          format: uuid
          description: Atanan security veya tesis_gorevlisi (aksi 422 invalid_assignee)
        not:
          type: string
          nullable: true
          maxLength: 2000
          description: "Opsiyonel not; history satirinin sebep alanina yazilir (govde alani adi 'not' — Python tarafinda 'not_' + alias)"
    ComplaintResolveRequest:
      type: object
      description: Dogrudan coz (admin + yonetici) — opsiyonel cozum notu timeline'a yazilir
      properties:
        cozum_notu: { type: string, nullable: true, maxLength: 2000 }
    ComplaintDeclineRequest:
      type: object
      description: Reddet (admin + yonetici) — sebep ZORUNLU
      required: [sebep]
      properties:
        sebep: { type: string, minLength: 1, maxLength: 2000 }

    Visitor:
      type: object
      description: |
        Ziyaretci LOG kaydi + tam gecmis satiri (onay/red YOK). GSM'e hazir:
        hedef sakinin telefonu app_user.telefon'da; ileride gercek arama adimi
        ayri kolon/tablo ile eklenebilir — yeniden tasarim yok.
      required: [id, unit_id, ziyaretci_ad, kaydeden_user_id, target_resident_user_id, created_at]
      properties:
        id: { type: string, format: uuid }
        unit_id: { type: string, format: uuid }
        unit_no:
          type: string
          nullable: true
          description: Daire numarasi (join ile — guvenlik/sakin ekrani icin)
        ziyaretci_ad: { type: string, maxLength: 200 }
        notlar:
          type: string
          nullable: true
          description: Opsiyonel not ("not" SQL anahtar sozcugu; alan adi notlar)
        kaydeden_user_id:
          type: string
          format: uuid
          description: Kaydi acan guvenlik
        kaydeden_ad: { type: string, nullable: true }
        target_resident_user_id:
          type: string
          format: uuid
          description: >
            TEK hedef sakin — bilgilendirme push'u + gorunurluk YALNIZ onda
            (tek hedef modeli). Ayni dairedeki diger sakinler (es) bu kaydi
            gormez.
        target_resident_ad: { type: string, nullable: true }
        cikis_zamani:
          type: string
          format: date-time
          nullable: true
          description: >
            (G3, ADDITIVE) Cikis damgasi. **null => ziyaretci HALA ICERIDE**
            ("icerde" sayisi bu alandan turer). `POST /visitors/{id}/checkout`
            ile doldurulur; ikinci damga 409 (ilk deger degismez).
        created_at: { type: string, format: date-time }
    VisitorCreate:
      type: object
      description: >
        unit_id VEYA unit_no alanlarindan TAM BiRi verilmeli (aksi 422).
        target_resident_user_id o dairenin AKTIF sakini olmali (aksi 422
        invalid_reference).
      required: [ziyaretci_ad, target_resident_user_id]
      properties:
        unit_id: { type: string, format: uuid, nullable: true }
        unit_no:
          type: string
          nullable: true
          minLength: 1
          maxLength: 50
          description: Daire numarasi (orn. A-12) — sunucuda tenant icinde cozulur
        ziyaretci_ad: { type: string, minLength: 1, maxLength: 200 }
        target_resident_user_id:
          type: string
          format: uuid
          description: >
            Guvenligin sectigi TEK hedef sakin (o dairenin aktif sakini). Push +
            gorunurluk + karar YALNIZ bu sakinde.
        notlar: { type: string, nullable: true, minLength: 1, maxLength: 1000 }
    VisitorUpdate:
      type: object
      description: >
        Guvenlik ziyaretci kaydini duzenler (kismi — yalniz verilen alan degisir).
        Daire referansi verilecekse unit_id VEYA unit_no (ikisi birlikte olmaz).
        Daire/hedef degisirse hedef, (nihai) dairenin AKTIF sakini olarak yeniden
        dogrulanir. notlar acikca null gonderilirse temizlenir.
      properties:
        unit_id: { type: string, format: uuid, nullable: true }
        unit_no: { type: string, nullable: true, minLength: 1, maxLength: 50 }
        ziyaretci_ad: { type: string, minLength: 1, maxLength: 200 }
        target_resident_user_id: { type: string, format: uuid }
        notlar: { type: string, nullable: true, minLength: 1, maxLength: 1000 }

    Kargo:
      type: object
      description: Kargo/paket kaydi + tam gecmis satiri (visitor deseni)
      required: [id, unit_id, firma, durum, kaydeden_user_id, created_at]
      properties:
        id: { type: string, format: uuid }
        unit_id: { type: string, format: uuid }
        unit_no:
          type: string
          nullable: true
          description: Daire numarasi (join ile)
        firma: { type: string, maxLength: 200, description: Kargo firmasi/tasiyici }
        foto_key:
          type: string
          nullable: true
          description: Opsiyonel paket fotografi — /uploads/presign ile alinan obje anahtari
        foto_url:
          type: string
          nullable: true
          description: Goruntuleme icin kisa omurlu presigned GET URL (foto_key varsa)
        notlar:
          type: string
          nullable: true
          description: Opsiyonel not ("not" SQL anahtar sozcugu; alan adi notlar)
        durum: { type: string, enum: [bekliyor, teslim_alindi] }
        kaydeden_user_id:
          type: string
          format: uuid
          description: Kaydi acan guvenlik
        kaydeden_ad: { type: string, nullable: true }
        teslim_alan_user_id:
          type: string
          format: uuid
          nullable: true
          description: Teslim alan sakin (teslim alinmadiysa null)
        teslim_alan_ad: { type: string, nullable: true }
        teslim_zamani: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    KargoCreate:
      type: object
      description: unit_id VEYA unit_no alanlarindan TAM BiRi verilmeli (aksi 422)
      required: [firma]
      properties:
        unit_id: { type: string, format: uuid, nullable: true }
        unit_no:
          type: string
          nullable: true
          minLength: 1
          maxLength: 50
          description: Daire numarasi (orn. A-12) — sunucuda tenant icinde cozulur
        firma: { type: string, minLength: 1, maxLength: 200 }
        foto_key:
          type: string
          nullable: true
          description: "Opsiyonel paket fotografi: once /uploads/presign ile alinan obje anahtari"
        notlar: { type: string, nullable: true, minLength: 1, maxLength: 1000 }
    KargoUpdate:
      type: object
      description: Sakin teslim isareti — tek gecerli deger (geri donus yok)
      required: [durum]
      properties:
        durum: { type: string, enum: [teslim_alindi] }

    UnitAccessRequest:
      type: object
      description: >
        Yonetici tek-seferlik daire erisim izni (talep+izin tek satirda).
        onaylandi & used=false => gecerli izin; yonetici o dairenin ziyaretci/
        kargo kaydini ILK okudugunda used=true olur (one-shot, suresiz).
      required: [id, unit_id, granted_to_yonetici_user_id, durum, used, requested_at]
      properties:
        id: { type: string, format: uuid }
        unit_id: { type: string, format: uuid }
        unit_no: { type: string, nullable: true, description: Daire no (join ile) }
        granted_to_yonetici_user_id:
          type: string
          format: uuid
          description: >
            Talebi acan yonetici VEYA admin (izin ona verilir; isim tarihsel —
            admin de erisim talebi acabilir).
        yonetici_ad: { type: string, nullable: true }
        granted_by_resident_user_id:
          type: string
          format: uuid
          nullable: true
          description: Karari veren sakin (karara kadar null)
        resident_ad: { type: string, nullable: true }
        durum: { type: string, enum: [bekliyor, onaylandi, reddedildi] }
        used:
          type: boolean
          description: true = izin tuketildi (yonetici bir kez gordu); tekrar 403
        requested_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
        used_at: { type: string, format: date-time, nullable: true }
    UnitAccessRequestCreate:
      type: object
      description: unit_id VEYA unit_no alanlarindan TAM BiRi verilmeli (aksi 422)
      properties:
        unit_id: { type: string, format: uuid, nullable: true }
        unit_no:
          type: string
          nullable: true
          minLength: 1
          maxLength: 50
          description: Daire numarasi (orn. A-12) — sunucuda tenant icinde cozulur
    UnitAccessRequestDecision:
      type: object
      description: Sakin karari — onay/red ('bekliyor'a geri donus yok)
      required: [durum]
      properties:
        durum: { type: string, enum: [onaylandi, reddedildi] }
    BulkAccessRequestResult:
      type: object
      description: >
        Toplu izin talebi sonucu. created = yeni acilan bekleyen talep sayisi;
        skipped = zaten acik/onayli oldugu icin atlanan daire sayisi; items =
        yeni acilan talepler. Per-daire sakin RIZASI korunur (baypas yok).
      required: [created, skipped, items]
      properties:
        created: { type: integer }
        skipped: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/UnitAccessRequest" }
    GrantedUnit:
      type: object
      description: Talebi acanin SU AN goruntuleyebilecegi daire (onayli+kullanilmamis)
      required: [request_id, unit_id]
      properties:
        request_id: { type: string, format: uuid, description: Izin (talep) kaydinin id'si }
        unit_id: { type: string, format: uuid }
        unit_no: { type: string, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
    GrantedUnitsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GrantedUnit" }

    OrtakAlan:
      type: object
      required: [id, ad, aktif, acilis, kapanis, slot_dakika, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, maxLength: 200, example: Havuz }
        aciklama: { type: string, nullable: true, maxLength: 1000 }
        aktif:
          type: boolean
          description: false = kaldirilmis (soft-delete; rezerve edilemez)
        acilis:
          type: string
          example: "08:00"
          description: >-
            Musaitlik acilis saati ("HH:MM"). Alan her gun [acilis, kapanis)
            araliginda rezerve edilebilir.
        kapanis: { type: string, example: "22:00", description: 'Kapanis ("HH:MM"), > acilis' }
        slot_dakika:
          type: integer
          example: 60
          description: Slot izgara uzunlugu (dk) — GET /common-areas/{id}/slots buradan uretir
        created_at: { type: string, format: date-time }
    OrtakAlanCreate:
      type: object
      required: [ad]
      properties:
        ad: { type: string, minLength: 1, maxLength: 200 }
        aciklama: { type: string, nullable: true, minLength: 1, maxLength: 1000 }
        acilis: { type: string, default: "00:00", description: 'Verilmezse tum-gun ("HH:MM")' }
        kapanis: { type: string, default: "23:59:59", description: '> acilis olmali' }
        slot_dakika: { type: integer, default: 60, minimum: 1, maximum: 1440 }
    OrtakAlanUpdate:
      type: object
      description: En az bir alan gerekli
      properties:
        ad: { type: string, minLength: 1, maxLength: 200 }
        aciklama: { type: string, nullable: true, minLength: 1, maxLength: 1000 }
        aktif: { type: boolean }
        acilis: { type: string, description: '"HH:MM"; kapanis ile birlikte > acilis olmali' }
        kapanis: { type: string, description: '"HH:MM"' }
        slot_dakika: { type: integer, minimum: 1, maximum: 1440 }
    Slot:
      type: object
      required: [baslangic, bitis, dolu]
      description: >-
        Bir gunun tek slotu — ROL-FARKINDA. resident/saha: yalniz dolu/bos
        (kimlik + kisi sayisi YOK). admin/yonetici: dolu slotta ayrica rezerve
        eden daire (unit_no) + kisi_sayisi (denetim).
      properties:
        baslangic: { type: string, example: "10:00" }
        bitis: { type: string, example: "11:00" }
        dolu:
          type: boolean
          description: true = bu slotla kesisen ONAYLI rezervasyon var
        rezerve_edilebilir:
          type: boolean
          default: false
          description: >-
            Istekteki SAKIN bu slotu SIMDI rezerve edebilir mi (24s penceresi +
            gunluk kota + son-dakika istisnasi). Yonetimde her zaman false.
        sebep:
          type: string
          nullable: true
          enum: [dolu, gecti, cok_erken, gunluk]
          description: Rezerve edilemme sebebi (rezerve_edilebilir=false iken)
        unit_no:
          type: string
          nullable: true
          description: >-
            YALNIZ admin/yonetici + dolu slot: rezerve eden daire no
            (resident/saha icin DAIMA null — gizlilik).
        kisi_sayisi:
          type: integer
          nullable: true
          description: "YALNIZ admin/yonetici + dolu slot: rezerve edilen kisi sayisi"
        benim:
          type: boolean
          default: false
          description: >-
            YALNIZ resident: bu dolu slot istekteki sakinin KENDI rezervasyonu
            mu. Istemci baslangic/bitis + simdi ile aktif(yesil)/gecmis(kirmizi)
            rengini secer. Baskasinin dolu slotu benim=false + kimlik/kisi null.
    AlanSlotResponse:
      type: object
      required: [alan_id, tarih, slot_dakika, items]
      properties:
        alan_id: { type: string, format: uuid }
        tarih: { type: string, format: date }
        slot_dakika: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/Slot" } }

    Rezervasyon:
      type: object
      required: [id, alan_id, unit_id, tarih, baslangic, bitis, kisi_sayisi,
                 durum, talep_eden_user_id, created_at]
      properties:
        id: { type: string, format: uuid }
        alan_id: { type: string, format: uuid }
        alan_ad: { type: string, nullable: true, description: Alan adi (join ile) }
        unit_id: { type: string, format: uuid }
        unit_no: { type: string, nullable: true, description: Daire numarasi (join ile) }
        tarih: { type: string, format: date }
        baslangic: { type: string, example: "10:00", description: '"HH:MM"' }
        bitis: { type: string, example: "12:00", description: '"HH:MM" — baslangictan sonra' }
        kisi_sayisi: { type: integer, minimum: 1 }
        notlar:
          type: string
          nullable: true
          description: Opsiyonel not ("not" SQL anahtar sozcugu; alan adi notlar)
        durum: { type: string, enum: [onaylandi, iptal] }
        talep_eden_user_id: { type: string, format: uuid }
        talep_eden_ad: { type: string, nullable: true }
        iptal_eden_user_id:
          type: string
          format: uuid
          nullable: true
          description: Iptal eden (sakin/yonetim); yalniz durum='iptal'de dolu
        iptal_eden_ad: { type: string, nullable: true }
        iptal_zamani: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    RezervasyonCreate:
      type: object
      required: [alan_id, tarih, baslangic, bitis, kisi_sayisi]
      properties:
        alan_id: { type: string, format: uuid }
        tarih: { type: string, format: date }
        baslangic: { type: string, example: "10:00" }
        bitis: { type: string, example: "12:00", description: baslangictan sonra olmali }
        kisi_sayisi: { type: integer, minimum: 1, maximum: 1000 }
        unit_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Opsiyonel — sakinin birden fazla aktif dairesi varsa secim;
            kendi dairesi olmali (aksi 422). Verilmezse ilk aktif daire.
        notlar: { type: string, nullable: true, minLength: 1, maxLength: 1000 }

    Etkinlik:
      type: object
      description: |
        Etkinlik + SEFFAF katilim sayilari. Sayilar herkese acik;
        kim-katiliyor listesi URUN GEREGI donmez (kimlik degil yalniz sayi).
        benim_durumum istekteki kullanicinin KENDI beyanidir.

        Cevrilen metin alanlari `baslik` + `aciklama`; `konum` CEVRILMEZ
        (yer adi). Ceviri ustverisi: CeviriAlanlari.
      allOf:
        - $ref: "#/components/schemas/CeviriAlanlari"
      required: [id, baslik, aciklama, tarih, olusturan_user_id,
                 katiliyorum_sayisi, katilmiyorum_sayisi, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        baslik: { type: string, maxLength: 200, example: Mac izleme aksami }
        aciklama: { type: string, maxLength: 5000 }
        tarih:
          type: string
          format: date-time
          description: Etkinlik BASLANGICI
        bitis_zamani:
          type: string
          format: date-time
          nullable: true
          description: >
            Etkinlik bitisi; null = ANLIK etkinlik (bitis = baslangic).
            `?aktif=true` suzgeci COALESCE(bitis_zamani, tarih) kullanir.
        konum: { type: string, nullable: true, maxLength: 500 }
        foto_key:
          type: string
          nullable: true
          description: MinIO obje anahtari (/uploads/presign ile yuklenir)
        foto_url:
          type: string
          nullable: true
          description: >
            Goruntuleme icin kisa omurlu presigned GET URL (foto_key varsa).
            Depo yapilandirilmamissa null doner — okuma akisi kirilmaz.
        olusturan_user_id: { type: string, format: uuid }
        olusturan_ad: { type: string, nullable: true }
        katiliyorum_sayisi: { type: integer, minimum: 0 }
        katilmiyorum_sayisi: { type: integer, minimum: 0 }
        benim_durumum:
          type: string
          enum: [katiliyorum, katilmiyorum]
          nullable: true
          description: Istekteki kullanicinin kendi RSVP'si (beyan yoksa null)
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EtkinlikCreate:
      type: object
      required: [baslik, aciklama, tarih]
      properties:
        baslik: { type: string, minLength: 1, maxLength: 200 }
        aciklama: { type: string, minLength: 1, maxLength: 5000 }
        tarih: { type: string, format: date-time, description: Baslangic }
        bitis_zamani:
          type: string
          format: date-time
          nullable: true
          description: "Verilirse baslangictan SONRA olmali (aksi 422)"
        konum: { type: string, nullable: true, minLength: 1, maxLength: 500 }
        foto_key:
          type: string
          nullable: true
          description: "/uploads/presign ile yuklenen obje anahtari (tenant onekli)"
    EtkinlikUpdate:
      type: object
      description: >
        En az bir alan gerekli. `bitis_zamani: null` bitisi, `foto_key: null`
        gorseli kaldirir.
      properties:
        baslik: { type: string, minLength: 1, maxLength: 200 }
        aciklama: { type: string, minLength: 1, maxLength: 5000 }
        tarih: { type: string, format: date-time }
        bitis_zamani: { type: string, format: date-time, nullable: true }
        konum: { type: string, nullable: true, maxLength: 500 }
        foto_key: { type: string, nullable: true }
    EtkinlikRsvp:
      type: object
      description: Kullanici basina TEK kayit; tekrar PUT beyani degistirir
      required: [durum]
      properties:
        durum: { type: string, enum: [katiliyorum, katilmiyorum] }

    SiteKurali:
      type: object
      description: >-
        Cevrilen metin alanlari `baslik` + `icerik`; Accept-Language ile secilen
        dilde doner. Ceviri ustverisi: CeviriAlanlari.
      allOf:
        - $ref: "#/components/schemas/CeviriAlanlari"
      required: [id, baslik, icerik, sira, olusturan_user_id,
                 created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        baslik: { type: string, maxLength: 200, example: Havuz Saatleri }
        icerik: { type: string, maxLength: 10000 }
        foto_key:
          type: string
          nullable: true
          description: Opsiyonel gorsel — /uploads/presign ile alinan obje anahtari
        foto_url:
          type: string
          nullable: true
          description: Goruntuleme icin kisa omurlu presigned GET URL (foto_key varsa)
        sira: { type: integer, minimum: 0, description: Liste sirasi (kucuk once) }
        olusturan_user_id: { type: string, format: uuid }
        olusturan_ad: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DisHizmetCreate:
      type: object
      description: "Guvenilir esnaf/hizmet kisisi. tur: Cilingir/Elektrik/Tesisat..."
      required: [tur, ad, soyad, telefon]
      properties:
        tur: { type: string, minLength: 1, maxLength: 80, example: "Çilingir" }
        ad: { type: string, minLength: 1, maxLength: 120 }
        soyad: { type: string, minLength: 1, maxLength: 120 }
        telefon: { type: string, minLength: 1, maxLength: 40 }
        aciklama: { type: string, nullable: true, maxLength: 1000 }
    DisHizmetUpdate:
      type: object
      description: Kismi guncelleme (en az bir alan).
      minProperties: 1
      properties:
        tur: { type: string, minLength: 1, maxLength: 80 }
        ad: { type: string, minLength: 1, maxLength: 120 }
        soyad: { type: string, minLength: 1, maxLength: 120 }
        telefon: { type: string, minLength: 1, maxLength: 40 }
        aciklama: { type: string, nullable: true, maxLength: 1000 }
    DisHizmetOut:
      type: object
      required: [id, tur, ad, soyad, telefon, created_at]
      properties:
        id: { type: string, format: uuid }
        tur: { type: string }
        ad: { type: string }
        soyad: { type: string }
        telefon: { type: string }
        aciklama: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    DisHizmetListResponse:
      type: object
      required: [items]
      properties:
        note: { type: string, nullable: true, description: "Bolum notu (yonetici)" }
        items:
          type: array
          items: { $ref: "#/components/schemas/DisHizmetOut" }
    DisHizmetNoteUpdate:
      type: object
      properties:
        note: { type: string, nullable: true, maxLength: 2000 }
    SiteKuraliCreate:
      type: object
      required: [baslik, icerik]
      properties:
        baslik: { type: string, minLength: 1, maxLength: 200 }
        icerik: { type: string, minLength: 1, maxLength: 10000 }
        foto_key:
          type: string
          nullable: true
          description: "Opsiyonel gorsel: once /uploads/presign ile alinan obje anahtari"
        sira: { type: integer, minimum: 0, default: 0 }
    SiteKuraliUpdate:
      type: object
      description: En az bir alan gerekli
      properties:
        baslik: { type: string, minLength: 1, maxLength: 200 }
        icerik: { type: string, minLength: 1, maxLength: 10000 }
        foto_key:
          type: string
          nullable: true
          description: Acikca null gonderilirse gorsel kaldirilir; alan yoksa dokunulmaz
        sira: { type: integer, minimum: 0 }

    Notification:
      type: object
      required: [id, tip, mesaj, okundu, created_at]
      description: >
        `mesaj` ISTEGIN DILINDE uretilir (tur 16): kayit cumle degil
        `mesaj_kimlik` + `mesaj_veri` tasir. Boylece ayni kayit her
        kullaniciya kendi dilinde gorunur — cumle kayda DONDURULMAZ.
        Tur 16 oncesi satirlarda kimlik `null`dur ve `mesaj` kayittaki
        (Turkce) metindir.
      properties:
        id: { type: string, format: uuid }
        tip:
          type: string
          enum: [kacirilan_tur, eksik_checkpoint, gecikmis_okutma]
          example: kacirilan_tur
        patrol_window_id: { type: string, format: uuid, nullable: true }
        patrol_plan_id: { type: string, format: uuid, nullable: true }
        checkpoint_id: { type: string, format: uuid, nullable: true }
        task_id: { type: string, format: uuid, nullable: true }
        mesaj:
          type: string
          description: Istegin dilinde uretilmis gosterilecek metin
        mesaj_kimlik:
          type: string
          nullable: true
          example: kacirilan_tur
          description: >
            Metnin yerellestirilebilir kimligi (= `tip` / push `data.tip`).
            Istemci kendi metnini kurmak ya da yonlendirme yapmak icin
            kullanabilir.
        mesaj_veri:
          type: object
          nullable: true
          additionalProperties: true
          example: { plan: "Gece devriyesi", eksik: 2 }
          description: Metnin DEGISKEN alanlari (cevrilmez — veridir)
        okundu: { type: boolean }
        created_at: { type: string, format: date-time }
    NotificationUpdate:
      type: object
      required: [okundu]
      properties:
        okundu: { type: boolean }

    # ----------------------------- tasks --------------------------- #
    # Gorev tipi = yonetici-tanimli kategori (task_category); kategori_id null =
    # "Diğer". Sabit task_tip enum'u KALDIRILDI.
    Task:
      type: object
      required: [id, ad, foto_zorunlu, aktif, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, example: "Cop toplama" }
        aciklama: { type: string, nullable: true }
        atanan_user_id: { type: string, format: uuid, nullable: true }
        checkpoint_id: { type: string, format: uuid, nullable: true }
        kategori_id:
          type: string
          format: uuid
          nullable: true
          description: "Gorev tipi = yonetici-tanimli kategori; null = Diğer"
        periyot_dakika:
          type: integer
          minimum: 1
          nullable: true
          description: "Tekrar araligi (dakika); tek seferlikse null"
        sonraki_planlanan:
          type: string
          format: date-time
          nullable: true
          description: "Bir sonraki planlanan an (UTC); peyzaj takvimi. Tamamlaninca ilerler."
        foto_zorunlu:
          type: boolean
          description: "true ise completion foto_key olmadan kabul edilmez (422) — mobil §11 #2"
        aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TaskCreate:
      type: object
      required: [ad]
      properties:
        ad: { type: string }
        aciklama: { type: string, nullable: true }
        atanan_user_id: { type: string, format: uuid, nullable: true }
        checkpoint_id: { type: string, format: uuid, nullable: true }
        kategori_id: { type: string, format: uuid, nullable: true, description: "null = Diğer" }
        periyot_dakika: { type: integer, minimum: 1, nullable: true }
        sonraki_planlanan: { type: string, format: date-time, nullable: true }
        foto_zorunlu: { type: boolean, default: false }
        aktif: { type: boolean, default: true }
    TaskUpdate:
      type: object
      minProperties: 1
      properties:
        ad: { type: string }
        aciklama: { type: string, nullable: true }
        atanan_user_id: { type: string, format: uuid, nullable: true }
        checkpoint_id: { type: string, format: uuid, nullable: true }
        kategori_id: { type: string, format: uuid, nullable: true }
        periyot_dakika: { type: integer, minimum: 1, nullable: true }
        sonraki_planlanan: { type: string, format: date-time, nullable: true }
        foto_zorunlu: { type: boolean }
        aktif: { type: boolean }

    TaskCategory:
      type: object
      required: [id, ad, aktif, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, example: "Havuz bakimi" }
        aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }
    TaskCategoryCreate:
      type: object
      required: [ad]
      properties:
        ad: { type: string, minLength: 1, maxLength: 100 }

    TaskCompletion:
      type: object
      required: [id, task_id, tamamlayan_user_id, tamamlanma_zamani, idempotency_key, created_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        tamamlayan_user_id:
          type: string
          format: uuid
          description: "Token'dan turetilir"
        tamamlanma_zamani: { type: string, format: date-time }
        nfc_tag_uid: { type: string, nullable: true }
        gps_lat: { type: number, format: double, nullable: true }
        gps_lng: { type: number, format: double, nullable: true }
        foto_key: { type: string, nullable: true }
        foto_url: { type: string, nullable: true }
        notlar: { type: string, nullable: true }
        idempotency_key: { type: string }
        created_at: { type: string, format: date-time }
    # Capraz-gorev tamamlama gecmisi ogesi (GET /task-completions). foto_url/gps
    # YOK; kanit varligi foto_var/nfc_dogrulandi bool olarak yeter.
    TaskCompletionHistory:
      type: object
      required:
        [id, task_id, kategori_ad, tamamlayan_user_id, tamamlanma_zamani, foto_var, nfc_dogrulandi]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        task_adi: { type: string, nullable: true }
        kategori_ad: { type: string, description: "Gorevin kategorisi; null kategori -> Diğer" }
        tamamlayan_user_id: { type: string, format: uuid }
        tamamlanma_zamani: { type: string, format: date-time }
        foto_var: { type: boolean, description: "foto_key dolu mu" }
        nfc_dogrulandi: { type: boolean, description: "nfc_tag_uid okutuldu mu" }
        notlar: { type: string, nullable: true }
    TaskCompletionKategoriSayi:
      type: object
      required: [kategori_ad, sayi]
      properties:
        kategori_ad: { type: string }
        sayi: { type: integer }
    TaskCompletionOzet:
      type: object
      required: [toplam, kalemler]
      description: |
        Filtrelenmis TUM kume uzerinden KATEGORI bazli sayim (sabit tip kirilimi
        kaldirildi). NULL kategori "Diğer" altinda; sayi'ya gore azalan.
      properties:
        toplam: { type: integer }
        kalemler:
          type: array
          items: { $ref: "#/components/schemas/TaskCompletionKategoriSayi" }
    TaskCompletionCreate:
      type: object
      required: [tamamlanma_zamani]
      properties:
        tamamlanma_zamani: { type: string, format: date-time }
        nfc_tag_uid:
          type: string
          nullable: true
          description: "Verilirse task.checkpoint_id'nin nfc'si ile eslesmeli"
        gps_lat: { type: number, format: double, nullable: true }
        gps_lng: { type: number, format: double, nullable: true }
        foto_key:
          type: string
          nullable: true
          description: "Once /uploads/presign ile alinan obje anahtari"
        notlar: { type: string, nullable: true }

    # ---------------------------- uploads -------------------------- #
    PresignRequest:
      type: object
      required: [content_type]
      properties:
        content_type:
          type: string
          example: "image/jpeg"
          description: >
            Yuklenecek dosyanin MIME tipi — YALNIZ gorsel: image/jpeg,
            image/png, image/webp, image/heic (aksi 422); imzali PUT URL bu
            content-type'a baglanir (airtight — baska tip ile yuklenemez).
        dosya_adi:
          type: string
          nullable: true
          description: "Opsiyonel; uzanti foto_key icin kullanilabilir"
        boyut:
          type: integer
          nullable: true
          minimum: 1
          description: "Istemci-beyanli dosya boyutu (byte); max ~8MB (asarsa 422). Best-effort — sunucu dosyayi bizzat olcmez."
    PresignResponse:
      type: object
      required: [foto_key, upload_url, method, expires_in]
      properties:
        foto_key:
          type: string
          description: "Completion'da gonderilecek obje anahtari (tenant ile namespace'li)"
        upload_url:
          type: string
          description: "Presigned PUT URL — istemci dosyayi buraya PUT eder"
        method: { type: string, enum: [PUT], example: PUT }
        expires_in:
          type: integer
          description: "URL gecerlilik suresi (saniye)"
          example: 900

    # ---------------------------- assets --------------------------- #
    AssetKategori:
      type: string
      enum: [ekipman, arac, alet, diger]
    AssetDurum:
      type: string
      enum: [musait, zimmetli, bakimda]
    Asset:
      type: object
      required: [id, ad, durum, aktif, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, example: "Cim bicme makinesi" }
        kategori: { $ref: "#/components/schemas/AssetKategori" }
        nfc_tag_uid: { type: string, nullable: true }
        durum: { $ref: "#/components/schemas/AssetDurum" }
        aciklama: { type: string, nullable: true }
        aktif: { type: boolean }
        acik_zimmet:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/AcikZimmet" }]
          description: "Acik zimmet ozeti; zimmetli degilse null (mobil §13 #2/#5)"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AcikZimmet:
      type: object
      required: [alan_user_id, alan_user_ad, alinma_zamani]
      properties:
        alan_user_id: { type: string, format: uuid }
        alan_user_ad: { type: string, example: "Guard A" }
        alinma_zamani: { type: string, format: date-time }
    AssetCreate:
      type: object
      required: [ad]
      properties:
        ad: { type: string }
        kategori: { $ref: "#/components/schemas/AssetKategori" }
        nfc_tag_uid: { type: string, nullable: true }
        aciklama: { type: string, nullable: true }
        aktif: { type: boolean, default: true }
    AssetUpdate:
      type: object
      minProperties: 1
      properties:
        ad: { type: string }
        kategori: { $ref: "#/components/schemas/AssetKategori" }
        nfc_tag_uid: { type: string, nullable: true }
        durum: { $ref: "#/components/schemas/AssetDurum" }
        aciklama: { type: string, nullable: true }
        aktif: { type: boolean }

    AssetCheckout:
      type: object
      required: [id, asset_id, alan_user_id, alma_zamani, idempotency_key, created_at]
      properties:
        id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        alan_user_id:
          type: string
          format: uuid
          description: "Token'dan turetilir (alan kullanici)"
        alan_user_ad:
          type: string
          nullable: true
          description: "Alan kullanicinin adi (id + ad birlikte; mobil §13 #5)"
        birakan_user_id:
          type: string
          format: uuid
          nullable: true
          description: "Zimmeti kapatan (sahibi veya admin); acik zimmette NULL"
        birakan_user_ad:
          type: string
          nullable: true
          description: "Birakan kullanicinin adi (id + ad birlikte)"
        alma_zamani: { type: string, format: date-time }
        birakma_zamani:
          type: string
          format: date-time
          nullable: true
          description: "NULL => hala uzerinde (acik zimmet)"
        alma_nfc_tag_uid: { type: string, nullable: true }
        birakma_nfc_tag_uid: { type: string, nullable: true }
        alma_gps_lat: { type: number, format: double, nullable: true }
        alma_gps_lng: { type: number, format: double, nullable: true }
        birakma_gps_lat: { type: number, format: double, nullable: true }
        birakma_gps_lng: { type: number, format: double, nullable: true }
        notlar: { type: string, nullable: true }
        idempotency_key: { type: string }
        created_at: { type: string, format: date-time }
    CheckoutRequest:
      type: object
      properties:
        nfc_tag_uid:
          type: string
          nullable: true
          description: "Okutulan etiket; verilirse asset.nfc_tag_uid ile eslesmeli"
        gps_lat: { type: number, format: double, nullable: true }
        gps_lng: { type: number, format: double, nullable: true }
        notlar: { type: string, nullable: true }
    CheckinRequest:
      type: object
      properties:
        nfc_tag_uid:
          type: string
          nullable: true
          description: "Okutulan etiket; verilirse asset.nfc_tag_uid ile eslesmeli"
        gps_lat: { type: number, format: double, nullable: true }
        gps_lng: { type: number, format: double, nullable: true }
        notlar: { type: string, nullable: true }

    # ------------------------ tenant settings ---------------------- #
    TenantSettings:
      type: object
      required: [tenant_id, ad, slug, timezone]
      properties:
        tenant_id: { type: string, format: uuid }
        ad: { type: string }
        slug: { type: string }
        timezone: { type: string }
        kurulum_tamamlandi:
          type: boolean
          default: true
          description: "false ise BIRINCIL yonetici ILK GIRISTE tesisi adlandirmali (mobil setup ekrani)"
        yonetim_email:
          type: string
          nullable: true
          description: "Tesisin yonetim maili (tenant seviyesi) — yonetici iletisim kartinda gosterilir"
        konum_ad:
          type: string
          default: "İstanbul"
          description: "Hava durumu basliginda gorunen konum adi (GET /weather)"
        konum_lat:
          type: number
          format: double
          default: 41.0082
          description: "Hava durumu koordinati (enlem) — GET /weather bunu kullanir"
        konum_lon:
          type: number
          format: double
          default: 28.9784
          description: "Hava durumu koordinati (boylam)"
        otopark_kapasite:
          type: integer
          nullable: true
          minimum: 0
          example: 120
          description: >
            (G4, ADDITIVE) Otopark kapasitesi. **null = TANIMSIZ** —
            `GET /parking/occupancy` `kapasite` ve `oran` alanlarini null
            doner (istemci "—" gosterir).
        anpr_guven_esigi:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 0.85
          description: >
            (P16) Plaka okuma GUVEN esigi. Bu degerin ALTINDAKI okuma gecis
            ACMAZ, `onay_bekliyor` durumuna duser. `1.0` = hicbir okumaya
            guvenme (hepsi onaya), `0.0` = hepsini isle — ikisi de gecerli
            ayarlardir.
        tur_gecikme_toleransi_dk:
          type: integer
          minimum: 1
          maximum: 240
          default: 10
          description: >
            (P34) Tur penceresi acildiktan sonra bu kadar dakika icinde
            okutma gelmezse gecikme alarmi baslar. TENANT AYARIDIR: 10 dk
            bir sitede makul, kampus buyuklugunde erken alarm demektir.
        tur_alarm_tekrar_sayisi:
          type: integer
          minimum: 0
          maximum: 10
          default: 3
          description: >
            (P34) Alarm kac kez tekrarlanir. Araliklar KATLANIR (tolerans,
            2x, 4x...). **0 = alarm KAPALI** ve gecerli bir tercihtir; ust
            sinir bildirim yorgunlugunu onler.
        tur_baslangic_foto_zorunlu:
          type: boolean
          default: false
          description: >
            (P34) Tur penceresinin ilk okutmasinda kamera fotografi
            zorunlu mu? Urun kurali DEGIL tenant tercihi: gece vardiyasinda
            kamera kullanimi her sitede kabul gormez.
        guvenlik_modu:
          type: string
          enum: [yonetim_ici, dis_sirket]
          default: yonetim_ici
          description: >
            (P35) Guvenligi KIM yonetir. `yonetim_ici` bugunku davranistir
            (yonetici planlar); `dis_sirket`te vardiya/tur/kontrol noktasi
            YAZMA yetkisi `guvenlik_amiri`ne GECER ve yonetici SALT-OKUR.
            OKUMA HER IKI MODDA ACIK KALIR — dis sirkete devretmek DENETIMI
            devretmek degildir. `admin` her iki modda yazar (mod yanlis
            ayarlandiginda tesis kilitli kalmasin). **Yalniz admin
            degistirebilir** ve degisim `audit_log`a yazilir: sahipligi
            devreden bir ayarin izsiz degismesi, "turleri kim planliyordu"
            sorusunu sonradan yanitlanamaz kilardi.
        anpr_otomatik_cikis:
          type: boolean
          default: true
          description: >
            (P16) Cikis olayinda acik gecis otomatik kapansin mi? Tek yonlu
            kapida (yalniz giris kamerasi) kapatan olmaz — site kapatabilir.
    TenantSettingsUpdate:
      type: object
      description: >
        En az bir alan gerekli. admin TUM alanlari gonderebilir; `yonetici`
        YALNIZ `ad`, `konum_ad`, `konum_lat`, `konum_lon`, `otopark_kapasite`,
        `anpr_guven_esigi` ve `anpr_otomatik_cikis` gonderebilir (baska alan
        gonderirse 403). ANPR ayarlari yoneticidedir cunku bunlar SAHA
        kararidir — kameranin nerede durdugunu ve yanlis okumanin ne siklikta
        oldugunu site bilir. `slug` ve tenant `id` bu uctan ASLA degismez.
      minProperties: 1
      properties:
        timezone: { type: string }
        ad: { type: string }
        yonetim_email: { type: string, nullable: true }
        konum_ad: { type: string, minLength: 1 }
        konum_lat: { type: number, format: double, minimum: -90, maximum: 90 }
        konum_lon: { type: number, format: double, minimum: -180, maximum: 180 }
        otopark_kapasite:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100000
          description: >
            (G4, ADDITIVE) Acikca `null` gonderilirse kapasite TANIMSIZ'a
            doner ve `oran` yeniden null olur.
        anpr_guven_esigi:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: "(P16) Plaka okuma guven esigi (0..1)"
        anpr_otomatik_cikis:
          type: boolean
          description: "(P16) Cikis olayinda acik gecis otomatik kapatilsin mi"
        tur_gecikme_toleransi_dk:
          type: integer
          minimum: 1
          maximum: 240
          description: (P34) Tur gecikme alarmi toleransi (dakika)
        tur_alarm_tekrar_sayisi:
          type: integer
          minimum: 0
          maximum: 10
          description: "(P34) Alarm tekrar sayisi; 0 = KAPALI"
        tur_baslangic_foto_zorunlu:
          type: boolean
          description: (P34) Tur baslangicinda kamera fotografi zorunlu mu
        guvenlik_modu:
          type: string
          enum: [yonetim_ici, dis_sirket]
          description: "(P35) YALNIZ admin gonderebilir (yonetici 403); denetlenir"

    # ---------------------- yonetici iletisim ---------------------- #
    YoneticiKart:
      type: object
      description: >
        Yonetici iletisim karti. GIZLILIK ISTISNASI (contracts/auth.md §C1a):
        `telefon` burada tenant'in TUM uyelerine acilir — C1a'nin yon/riza
        kapilari BU UC icin gecerli DEGILDIR (yonetici = HIZMET rolu; numarayi
        admin bilerek girer). Istisna YALNIZ role='yonetici' icindir.
      required: [user_id, ad_soyad]
      properties:
        user_id: { type: string, format: uuid }
        ad_soyad: { type: string, example: "Ayse Yilmaz" }
        telefon:
          type: string
          nullable: true
          example: "+905321112203"
          description: "Mobil kartta METIN olarak gorunur ve tel: ile aranir"
    YoneticiIletisimOut:
      type: object
      required: [yoneticiler]
      properties:
        yoneticiler:
          type: array
          description: "BIRINCIL ilk, sonra created_at ASC. Pasif yoneticiler listelenmez."
          items: { $ref: "#/components/schemas/YoneticiKart" }
        yonetim_email: { type: string, nullable: true }

    # ----------------------------- aidat --------------------------- #
    ResidentRol:
      type: string
      enum: [malik, kiraci]
    DuesYontem:
      type: string
      enum: [elden, havale, kart, diger]
    DuesDurum:
      type: string
      enum: [basarili, bekliyor, iptal]

    # ------------------ P27 "Tanimlar" katmani semalari ---------------- #
    # PARA HER YERDE KURUS (int64). Acilis bakiyeleri ISARETSIZ tutar + AYRI
    # yon tasir (bkz. yol yorumlari).
    MesajSablonu:
      type: object
      required: [id, kanal, ad, govde, amac, aktif, created_at]
      properties:
        id: { type: string, format: uuid }
        kanal: { type: string, enum: [sms, eposta] }
        ad: { type: string, minLength: 1, maxLength: 100 }
        konu:
          type: string
          nullable: true
          maxLength: 200
          description: >
            YALNIZ e-postada. SMS'te dolu konu, gonderilen metne GIRMEYEN
            bir alan olurdu (kullanici yazar ve kaybeder) — 422.
        govde: { type: string, minLength: 1, maxLength: 4000 }
        amac:
          type: string
          enum: [pazarlama, operasyonel]
          default: operasyonel
          description: >
            **SABLONDA durur, gonderim aninda secilmez**: ayni sablonun bir
            gun pazarlama bir gun operasyonel gonderilmesi, riza denetimini
            anlamsiz kilardi.
        aktif: { type: boolean }
        etiketler:
          type: array
          items: { type: string }
          description: Sablonda gecen etiketler (sirali, tekrarsiz)
        bilinmeyen_etiketler:
          type: array
          items: { type: string }
          description: >
            Desteklenmeyen etiketler — **UYARIDIR, hata degil**: sablon
            kaydedilir ama kullanici yazim hatasini gorur. Bilinmeyen etiket
            gonderilen metinde de OLDUGU GIBI KALIR (bos birakmak hatayi
            gizlerdi).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MesajSablonuCreate:
      type: object
      required: [kanal, ad, govde]
      properties:
        kanal: { type: string, enum: [sms, eposta] }
        ad: { type: string, minLength: 1, maxLength: 100 }
        konu: { type: string, nullable: true, maxLength: 200 }
        govde: { type: string, minLength: 1, maxLength: 4000 }
        amac: { type: string, enum: [pazarlama, operasyonel], default: operasyonel }
        aktif: { type: boolean, default: true }
    MesajSablonuUpdate:
      type: object
      minProperties: 1
      properties:
        ad: { type: string, minLength: 1, maxLength: 100 }
        konu: { type: string, nullable: true, maxLength: 200 }
        govde: { type: string, minLength: 1, maxLength: 4000 }
        amac: { type: string, enum: [pazarlama, operasyonel] }
        aktif: { type: boolean }
    SmsOlcum:
      type: object
      required: [karakter, unicode_mi, parca, kalan, zorlayan]
      properties:
        karakter: { type: integer }
        unicode_mi:
          type: boolean
          description: True ise sinir 160 degil 70
        parca: { type: integer }
        kalan: { type: integer }
        zorlayan:
          type: array
          items: { type: string }
          description: UCS-2'ye zorlayan karakterler (orn. ı, ğ, ş, kucuk ç)
    MesajOnizlemeIstek:
      type: object
      required: [govde]
      properties:
        govde: { type: string, minLength: 1, maxLength: 4000 }
        konu: { type: string, nullable: true, maxLength: 200 }
        user_id:
          type: string
          format: uuid
          nullable: true
          description: Verilmezse ORNEK degerlerle onizlenir
    MesajOnizleme:
      type: object
      required: [govde, etiketler, bilinmeyen_etiketler]
      properties:
        konu: { type: string, nullable: true }
        govde: { type: string }
        etiketler: { type: array, items: { type: string } }
        bilinmeyen_etiketler: { type: array, items: { type: string } }
        sms:
          allOf: [{ $ref: "#/components/schemas/SmsOlcum" }]
          nullable: true
          description: YALNIZ kanal=sms iken dolu
    MesajGonderIstek:
      type: object
      required: [sablon_id]
      properties:
        sablon_id: { type: string, format: uuid }
        user_ids:
          type: array
          nullable: true
          items: { type: string, format: uuid }
          description: Verilirse suzgec YERINE bu kisiler
        blok: { type: string, nullable: true }
        borc_durumu: { type: string, nullable: true, enum: [borclu, tumu] }
    MesajGonderSonuc:
      type: object
      required: [gonderildi, basarisiz, riza_yok, adres_yok]
      properties:
        gonderildi: { type: integer }
        basarisiz: { type: integer }
        riza_yok:
          type: integer
          description: Pazarlama rizasi olmadigi icin ATLANANLAR (sessizce dusurulmez)
        adres_yok: { type: integer, description: Telefonu/e-postasi olmayanlar }
    MesajGonderim:
      type: object
      required: [id, kanal, amac, hedef, govde, durum, created_at]
      properties:
        id: { type: string, format: uuid }
        kanal: { type: string, enum: [sms, eposta] }
        amac: { type: string, enum: [pazarlama, operasyonel] }
        user_id: { type: string, format: uuid, nullable: true }
        user_ad: { type: string, nullable: true }
        hedef:
          type: string
          description: >
            Gonderildigi ADRES/NUMARA — kullanici sonradan degistirse bile
            "nereye gonderdik" cevaplanabilmeli.
        konu: { type: string, nullable: true }
        govde:
          type: string
          description: >
            **COZULMUS metin** (etiketler yerine konmus hali). Sablona
            referans YETMEZ: sablon sonradan degistirilirse gecmis kayit
            "ne gonderdik" sorusuna YANLIS cevap verirdi — bu bir KVKK ve
            hukuk sorusudur (bildirim kaniti).
        durum: { type: string, enum: [kuyrukta, gonderildi, iletildi, okundu, basarisiz] }
        hata: { type: string, nullable: true }
        saglayici: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    RaporParametre:
      type: object
      description: >
        Parametre modali — **TEK MODEL**, her rapor alt kumesini kullanir.
        Rapor basina ayri model, modal bileseninin her rapor icin yeniden
        yazilmasi olurdu.
      properties:
        baslangic: { type: string, format: date, nullable: true }
        bitis: { type: string, format: date, nullable: true }
        tazminat_tarihi:
          type: string
          format: date
          nullable: true
          description: >
            Gecikme tazminatinin HANGI TARIHE gore hesaplanacagi. Ayri alan
            olmasi sart: donem raporunu BUGUNUN tazminatiyla almak isteyen
            yonetim var. Verilmezse `bitis`, o da yoksa bugun.
        blok: { type: string, nullable: true }
        gelir_gider_tanim_id: { type: string, format: uuid, nullable: true }
        listeleme_tipi:
          type: string
          nullable: true
          maxLength: 30
          description: "Raporun anlamlandirdigi anahtar (orn. borclu | alacakli)"
        min_tutar_kurus:
          type: integer
          format: int64
          nullable: true
          description: SINIRLAR DAHIL (100 TL borclu "en az 100 TL" listesinde OLMALI)
        max_tutar_kurus: { type: integer, format: int64, nullable: true }
        siralama: { type: string, nullable: true, maxLength: 30 }
        ismi_goster:
          type: boolean
          default: true
          description: >
            **KVKK**: `false` iken ad SUTUNU da kalkar (degeri bosaltmak
            yetmez — bos sutun "adi neden yok" sorusunu dogururdu). Kapiya
            asilacak listede ad OLMAMALI.
        icradakileri_goster: { type: boolean, default: true }
    RaporSutun:
      type: object
      required: [anahtar, baslik]
      properties:
        anahtar: { type: string }
        baslik: { type: string }
        tip: { type: string, enum: [metin, kurus, tarih, sayi], default: metin }
    RaporTablo:
      type: object
      required: [kod, baslik, sutunlar, satirlar]
      properties:
        kod: { type: string }
        baslik: { type: string }
        sutunlar:
          type: array
          items: { $ref: "#/components/schemas/RaporSutun" }
        satirlar:
          type: array
          items: { type: object, additionalProperties: true }
        toplamlar:
          type: object
          additionalProperties: true
          description: Sutun basina alt toplam (Excel/PDF'te kalin satir)
        metin:
          type: string
          nullable: true
          description: >
            Serbest metin bolumu — yaslandirma ozeti, ihtar govdesi, denetim
            notu. Tablo sablonuna sikistirilmadi: ihtar bir YAZIDIR ve
            hucrelere bolunurdu.
    RaporKatalogOgesi:
      type: object
      required: [kod, baslik, aciklama]
      properties:
        kod: { type: string }
        baslik: { type: string }
        aciklama: { type: string }
    RaporKatalog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RaporKatalogOgesi" }
    OdemeBilgileri:
      type: object
      required: [odeme_kodu, borc_kurus, kart_aktif]
      properties:
        iban:
          type: string
          nullable: true
          description: Anlasmali banka kasasinin IBAN'i; yoksa null (havale gizlenir)
        banka_adi: { type: string, nullable: true }
        odeme_kodu:
          type: string
          pattern: "^TS-[A-Z2-9]{6}$"
          description: Havale aciklamasina yazilacak BENZERSIZ kod (sabit)
        borc_kurus: { type: integer, format: int64 }
        kart_aktif:
          type: boolean
          description: >
            Saglayici yapilandirilmis mi. Manuel saglayici "kart" DEGILDIR —
            secenegi acmak sakini calismayan bir akisa sokardi.
    KartOdemeSonuc:
      type: object
      required: [durum]
      properties:
        durum: { type: string, example: basarili }
        odeme_url:
          type: string
          nullable: true
          description: Doluysa istemci 3D akisina yonlendirir
        hareket_id:
          type: string
          format: uuid
          nullable: true
          description: Aninda basarili ise yazilan tahsilat hareketi
    FinansalHareket:
      type: object
      description: >
        TEK DEFTER kaydi. **TUTAR HER ZAMAN POZITIF**; isaret `yon`dadir —
        negatif tutar saklamak "iade" ile "eksi gider"i ayirt edilemez
        kilardi.
      required: [id, tip, yon, tutar_kurus, tarih, created_at]
      properties:
        id: { type: string, format: uuid }
        tip: { type: string, enum: [tahsilat, gider, gelir, virman, iade, acilis] }
        yon: { type: string, enum: [giris, cikis] }
        tutar_kurus: { type: integer, format: int64, minimum: 1 }
        tarih: { type: string, format: date }
        kasa_id: { type: string, format: uuid, nullable: true }
        kasa_ad: { type: string, nullable: true }
        user_id: { type: string, format: uuid, nullable: true }
        user_ad: { type: string, nullable: true }
        unit_id: { type: string, format: uuid, nullable: true }
        firma_id: { type: string, format: uuid, nullable: true }
        gelir_gider_tanim_id: { type: string, format: uuid, nullable: true }
        assessment_id: { type: string, format: uuid, nullable: true }
        belge_no: { type: string, nullable: true, maxLength: 50 }
        aciklama: { type: string, nullable: true }
        virman_grup_id:
          type: string
          format: uuid
          nullable: true
          description: Virmanin IKI satirini eslestirir
        iade_edilen_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Iade edilen hareket — "hangi tahsilat iade edildi" sorusu
            aciklama metnine birakilamaz.
        created_at: { type: string, format: date-time }
    FinansalHareketListe:
      type: object
      required: [meta, items]
      properties:
        meta: { $ref: "#/components/schemas/PageMeta" }
        items:
          type: array
          items: { $ref: "#/components/schemas/FinansalHareket" }
    TahsilatCreate:
      type: object
      required: [kasa_id, tutar_kurus]
      properties:
        user_id: { type: string, format: uuid, nullable: true }
        unit_id: { type: string, format: uuid, nullable: true }
        assessment_id: { type: string, format: uuid, nullable: true }
        kasa_id: { type: string, format: uuid }
        tutar_kurus: { type: integer, format: int64, minimum: 1 }
        tarih: { type: string, format: date, nullable: true }
        belge_no: { type: string, nullable: true, maxLength: 50 }
        aciklama: { type: string, nullable: true, maxLength: 500 }
    TopluTahsilatSatir:
      type: object
      required: [tutar_kurus]
      properties:
        user_id: { type: string, format: uuid, nullable: true }
        unit_id: { type: string, format: uuid, nullable: true }
        assessment_id: { type: string, format: uuid, nullable: true }
        tutar_kurus: { type: integer, format: int64, minimum: 1 }
        aciklama: { type: string, nullable: true }
    TopluTahsilatIstek:
      type: object
      required: [kasa_id, satirlar]
      properties:
        kasa_id: { type: string, format: uuid }
        tarih: { type: string, format: date, nullable: true }
        satirlar:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/TopluTahsilatSatir" }
    HareketSatir:
      type: object
      required: [tip, tutar_kurus, kasa_id]
      properties:
        tip: { type: string, enum: [gider, gelir] }
        tutar_kurus: { type: integer, format: int64, minimum: 1 }
        kasa_id: { type: string, format: uuid }
        firma_id: { type: string, format: uuid, nullable: true }
        gelir_gider_tanim_id: { type: string, format: uuid, nullable: true }
        tarih: { type: string, format: date, nullable: true }
        belge_no: { type: string, nullable: true, maxLength: 50 }
        aciklama: { type: string, nullable: true, maxLength: 500 }
    HareketToplu:
      type: object
      required: [satirlar]
      properties:
        satirlar:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/HareketSatir" }
    VirmanIstek:
      type: object
      required: [kaynak_kasa_id, hedef_kasa_id, tutar_kurus]
      properties:
        kaynak_kasa_id: { type: string, format: uuid }
        hedef_kasa_id: { type: string, format: uuid }
        tutar_kurus: { type: integer, format: int64, minimum: 1 }
        tarih: { type: string, format: date, nullable: true }
        aciklama: { type: string, nullable: true, maxLength: 500 }
    IadeIstek:
      type: object
      required: [hareket_id]
      properties:
        hareket_id: { type: string, format: uuid }
        tutar_kurus:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Verilmezse KALAN iade edilebilir tutarin tamami
        tarih: { type: string, format: date, nullable: true }
        aciklama: { type: string, nullable: true, maxLength: 500 }
    AcilisFisi:
      type: object
      required: [kasa_id, yon, tutar_kurus]
      properties:
        kasa_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, nullable: true }
        yon: { type: string, enum: [giris, cikis] }
        tutar_kurus: { type: integer, format: int64, minimum: 1 }
        tarih: { type: string, format: date, nullable: true }
        aciklama: { type: string, nullable: true, maxLength: 500 }
    KasaBakiye:
      type: object
      required: [kasa_id, kod, ad, acilis_bakiye_kurus, hareket_kurus, bakiye_kurus]
      properties:
        kasa_id: { type: string, format: uuid }
        kod: { type: string }
        ad: { type: string }
        acilis_bakiye_kurus: { type: integer, format: int64 }
        hareket_kurus: { type: integer, format: int64 }
        bakiye_kurus: { type: integer, format: int64 }
    KasaBakiyeResponse:
      type: object
      required: [items, genel_toplam_kurus]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/KasaBakiye" }
        genel_toplam_kurus: { type: integer, format: int64 }
    BankaSatirIn:
      type: object
      required: [satir_no, aciklama, tutar_kurus]
      properties:
        satir_no: { type: integer }
        aciklama: { type: string, maxLength: 500 }
        tutar_kurus: { type: integer, format: int64, minimum: 1 }
    BankaEslestirIstek:
      type: object
      required: [satirlar]
      properties:
        satirlar:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/BankaSatirIn" }
    BankaEslestirOneri:
      type: object
      required: [satir_no, guven, neden]
      properties:
        satir_no: { type: integer }
        user_id: { type: string, format: uuid, nullable: true }
        user_ad: { type: string, nullable: true }
        assessment_id: { type: string, format: uuid, nullable: true }
        guven:
          type: integer
          minimum: 0
          maximum: 100
          description: 0 = oneri yok
        neden:
          type: string
          description: |
            `odeme_kodu` (P30 — KESIN, guven 100) / ad / soyad /
            tutar_tam / tutar_kismi / belirsiz / eslesme_yok.
            **Kod HER SEYI EZER**: ad/tutar tahminine sonra bakmak,
            kodu dogru yazmis bir sakini "belirsiz" saymak olurdu.
    BankaEslestirSonuc:
      type: object
      required: [oneriler]
      properties:
        oneriler:
          type: array
          items: { $ref: "#/components/schemas/BankaEslestirOneri" }
    IcraDosyasi:
      type: object
      description: >
        Hukuki surec kaydi — PARA HAREKETI DEGIL. Borclar `dues_assessment`ta
        durur ve buraya KOPYALANMAZ: iki yerde tutulan borc, biri guncellenip
        digeri unutuldugunda hangi rakamin dogru oldugunu belirsiz birakirdi.
      required: [id, dosya_no, user_id, durum, created_at]
      properties:
        id: { type: string, format: uuid }
        dosya_no: { type: string, maxLength: 50 }
        user_id: { type: string, format: uuid }
        user_ad: { type: string, nullable: true }
        veris_tarihi: { type: string, format: date, nullable: true }
        avukat: { type: string, nullable: true }
        durum: { type: string, enum: [acik, takipte, tahsil_edildi, kapandi] }
        aciklama: { type: string, nullable: true }
        acik_borc_kurus:
          type: integer
          format: int64
          description: ANLIK okunur (kopyalanmaz)
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IcraDosyasiCreate:
      type: object
      required: [dosya_no, user_id]
      properties:
        dosya_no: { type: string, minLength: 1, maxLength: 50 }
        user_id: { type: string, format: uuid }
        veris_tarihi: { type: string, format: date, nullable: true }
        avukat: { type: string, nullable: true, maxLength: 150 }
        durum: { type: string, enum: [acik, takipte, tahsil_edildi, kapandi], default: acik }
        aciklama: { type: string, nullable: true, maxLength: 1000 }
    IcraDosyasiUpdate:
      type: object
      minProperties: 1
      properties:
        dosya_no: { type: string, minLength: 1, maxLength: 50 }
        veris_tarihi: { type: string, format: date, nullable: true }
        avukat: { type: string, nullable: true, maxLength: 150 }
        durum: { type: string, enum: [acik, takipte, tahsil_edildi, kapandi] }
        aciklama: { type: string, nullable: true, maxLength: 1000 }
    FinansOzet:
      type: object
      required: [borclandirilan_ay_kurus, tahsil_edilen_ay_kurus, acik_borc_kurus, kasa_toplam_kurus, icra_acik_dosya]
      properties:
        borclandirilan_ay_kurus: { type: integer, format: int64 }
        tahsil_edilen_ay_kurus: { type: integer, format: int64 }
        acik_borc_kurus: { type: integer, format: int64 }
        kasa_toplam_kurus: { type: integer, format: int64 }
        icra_acik_dosya: { type: integer }
    TopluBorcSuzgec:
      type: object
      description: >
        Hedef suzgeci. `unit_ids` verilirse **suzgeci EZER** (elle secim):
        kullanici tek tek sectiyse blok/tip kisitlarini ayrica uygulamak
        "sectigim daire neden yok" uretirdi.
      properties:
        blok: { type: string, nullable: true }
        unit_tip_id: { type: string, format: uuid, nullable: true }
        unit_grup_id: { type: string, format: uuid, nullable: true }
        unit_ids:
          type: array
          nullable: true
          items: { type: string, format: uuid }
    TopluBorcIstek:
      type: object
      required: [donem, gelir_gider_tanim_id]
      properties:
        donem: { type: string, maxLength: 7, example: "2026-07" }
        gelir_gider_tanim_id: { type: string, format: uuid }
        suzgec: { $ref: "#/components/schemas/TopluBorcSuzgec" }
        tutar_kurus:
          type: integer
          nullable: true
          minimum: 1
          description: >
            Verilirse HER daireye bu tutar; verilmezse P26'nin TIP
            VARSAYILANI kullanilir.
        yedek_tutar_kurus:
          type: integer
          nullable: true
          minimum: 1
          description: Tipi/tutari olmayan daireler icin yedek
        son_odeme_tarihi: { type: string, format: date, nullable: true }
        tarih: { type: string, format: date, nullable: true }
        aciklama: { type: string, nullable: true, maxLength: 500 }
        gecikme_uygula: { type: boolean, default: true }
    TopluBorcSatir:
      type: object
      required: [unit_id, unit_no]
      properties:
        unit_id: { type: string, format: uuid }
        unit_no: { type: string }
        tutar_kurus: { type: integer, nullable: true }
        hedef_user_id: { type: string, format: uuid, nullable: true }
        hedef_ad: { type: string, nullable: true }
        atlama_nedeni:
          type: string
