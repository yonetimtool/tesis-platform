      summary: Kural ekle (admin + yonetici)
      description: |
        Opsiyonel gorsel MEVCUT akisla: once POST /uploads/presign ile
        foto_key + PUT URL alinir, dosya PUT edilir, foto_key burada
        gonderilir (tenant-namespace dogrulanir; gorev/talep/duyuru/kargo
        ile ayni desen — yeni upload yolu YOK). Push YOK — kurallar basvuru
        icerigidir (urun karari).

        **OTOMATIK CEVIRI**: kayit sonrasi kaynak dil disindaki 6 dil icin
        ceviri isi ACILIR (`ceviri_durumu` = `bekliyor`) ve arka planda
        uretilir. Ceviri EK bir islemdir: saglayici ya da kuyruk
        erisilemez olsa bile bu istek BASARILI olur ve orijinal metin
        servis edilmeye devam eder (basarisiz diller `hata` isaretlenir).
        Duzenlemede kaynak METIN degistiyse ceviriler yeniden uretilir;
        yonetici tarafindan ELLE DUZELTILMIS bir ceviri YALNIZCA kaynak
        metin AYNI kaldiysa (orn. yalniz gorsel/tarih/sira degistiyse)
        KORUNUR.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteKuraliCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteKurali" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /site-rules/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [site-kurallari]
      summary: Kural detayi (tum roller)
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DilQuery"
      responses:
        "200":
          description: Kural
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteKurali" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [site-kurallari]
      summary: Kural duzenle (admin + yonetici; en az bir alan)
      description: |
        foto_key acikca null gonderilirse gorsel kaldirilir.

        **OTOMATIK CEVIRI**: kayit sonrasi kaynak dil disindaki 6 dil icin
        ceviri isi ACILIR (`ceviri_durumu` = `bekliyor`) ve arka planda
        uretilir. Ceviri EK bir islemdir: saglayici ya da kuyruk
        erisilemez olsa bile bu istek BASARILI olur ve orijinal metin
        servis edilmeye devam eder (basarisiz diller `hata` isaretlenir).
        Duzenlemede kaynak METIN degistiyse ceviriler yeniden uretilir;
        yonetici tarafindan ELLE DUZELTILMIS bir ceviri YALNIZCA kaynak
        metin AYNI kaldiysa (orn. yalniz gorsel/tarih/sira degistiyse)
        KORUNUR.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteKuraliUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteKurali" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [site-kurallari]
      summary: Kural sil (admin + yonetici; HARD DELETE — salt icerik)
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================================================================= #
  # TASKS (esnek gorev sistemi) + tamamlama + foto kanit
