        dagitim_sekli:
          type: string
          nullable: true
          enum: [bagimsiz_bolumlere_esit, tipe_gore]
          description: |
            **SIMDILIK IKI DEGER.** `arsa_payi` / `kisi_sayisi` BILEREK yok:
            enum'a koyup P28'de uygulamamak, SECILEBILIR ama YANLIS
            BORCLANDIRAN bir secenek gosterirdi. Genisleme tek
            `ALTER TYPE ... ADD VALUE` satiridir.

            `tip=gelir` iken **NULL olmali** (422): bir gelir kalemi bagimsiz
            bolumlere dagitilmaz, tahsil edilir.
        hedef_kurali:
          type: string
          enum: [kiraci_oncelikli, malik]
          default: kiraci_oncelikli
          description: |
            **(P28)** Borc KIME yazilir. `kiraci_oncelikli` — kiraci varsa
            ona, yoksa malike (aidat, faturalar: kullanan oder).
            `malik` — her zaman malike (yatirim, demirbas: kiraci tasinsa da
            yukumluluk malikte kalir). Kural **TANIMDA** durur, borclandirma
            aninda secilmez — aksi halde ayni kalem farkli aylarda farkli
            kisiye yazilabilirdi.
        aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
