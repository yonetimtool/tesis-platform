        Daire referansi verilecekse unit_id VEYA unit_no (ikisi birlikte olmaz).
        Daire/hedef degisirse hedef, (nihai) dairenin AKTIF sakini olarak yeniden
        dogrulanir. notlar acikca null gonderilirse temizlenir.
      properties:
        unit_id: { type: string, format: uuid, nullable: true }
        unit_no: { type: string, nullable: true, minLength: 1, maxLength: 50 }
        ziyaretci_ad: { type: string, minLength: 1, maxLength: 200 }
        target_resident_user_id: { type: string, format: uuid }
        notlar: { type: string, nullable: true, minLength: 1, maxLength: 1000 }

