        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DilQuery"
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Announcement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [announcements]
      summary: Duyuru olustur (yonetici mobilden + admin panelden)
      description: |
        Olusturan token'dan alinir. Kayit sonrasi tenant'in TUM aktif
        cihazlarina push denenir (EK gonderim — push hatasi kaydi etkilemez;
        data: tip=duyuru, announcement_id). Opsiyonel gorsel: once
        POST /uploads/presign ile foto_key + PUT URL alinir, dosya PUT edilir,
        foto_key burada gonderilir. Okumada foto_url (presigned GET) doner.

        **OTOMATIK CEVIRI**: kayit sonrasi kaynak dil disindaki 6 dil icin
        ceviri isi ACILIR (`ceviri_durumu` = `bekliyor`) ve arka planda
        uretilir. Ceviri EK bir islemdir: saglayici ya da kuyruk
        erisilemez olsa bile bu istek BASARILI olur ve orijinal metin
        servis edilmeye devam eder (basarisiz diller `hata` isaretlenir).
        Duzenlemede kaynak METIN degistiyse ceviriler yeniden uretilir;
        yonetici tarafindan ELLE DUZELTILMIS bir ceviri YALNIZCA kaynak
        metin AYNI kaldiysa (orn. yalniz gorsel/tarih/sira degistiyse)
        KORUNUR.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /announcements/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [announcements]
      summary: Duyuru detayi (tum roller)
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DilQuery"
      responses:
        "200":
          description: Duyuru
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [announcements]
      summary: Duyuru guncelle (admin + yonetici)
      description: |
        **OTOMATIK CEVIRI**: kayit sonrasi kaynak dil disindaki 6 dil icin
        ceviri isi ACILIR (`ceviri_durumu` = `bekliyor`) ve arka planda
        uretilir. Ceviri EK bir islemdir: saglayici ya da kuyruk
        erisilemez olsa bile bu istek BASARILI olur ve orijinal metin
        servis edilmeye devam eder (basarisiz diller `hata` isaretlenir).
        Duzenlemede kaynak METIN degistiyse ceviriler yeniden uretilir;
        yonetici tarafindan ELLE DUZELTILMIS bir ceviri YALNIZCA kaynak
        metin AYNI kaldiysa (orn. yalniz gorsel/tarih/sira degistiyse)
        KORUNUR.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [announcements]
      summary: Duyuru sil (admin + yonetici)
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================================================================= #
  # COMPLAINTS (Talep/Ariza -> Is Emri) — yasayan/calisandan yonetime
  #   uctan uca talep kanali (auth.md §4):
  #   acma security+tesis_gorevlisi+resident (yonetici/admin ACAMAZ);
  #   okuma acan roller KENDI + admin+yonetici TUMU;
  #   convert/resolve/decline yalniz admin+yonetici. Anonimlik YOK — anonim
  #   kanal /unit-complaints'tir (bu modulden BAGIMSIZ).
  # ================================================================= #
  /complaints:
    get:
      tags: [complaints]
      summary: Talep listesi (created_at DESC)
      description: |
        Acan roller (security/tesis_gorevlisi/resident) YALNIZ kendi
        actiklarini gorur; admin+yonetici tenant'taki tum talepleri gorur
        (yonetim gorunumu). Durum ile filtrelenebilir.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: durum
          in: query
          required: false
          schema: { type: string, enum: [acik, is_emri, cozuldu, reddedildi, geri_alindi] }
        - name: oncelik
          in: query
          required: false
          description: (P33) is takibi onceligi
          schema: { type: string, enum: [dusuk, normal, yuksek, acil] }
        - name: unit_id
          in: query
          required: false
          description: (P33) talebin ilgili oldugu daire
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Complaint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [complaints]
      summary: Talep ac (security + tesis_gorevlisi + resident; yonetici/admin 403)
      description: |
        Acan token'dan alinir; durum=acik baslar (ilk timeline satiri
        acilista yazilir). Opsiyonel gorseller (en fazla 3): once her biri
        icin POST /uploads/presign ile foto_key + PUT URL alinir, dosya PUT
        edilir, foto_key'ler foto_keys dizisinde gonderilir (tenant-namespace
        dogrulanir — aksi 422 invalid_foto_key). Okumada fotograflar[]
        icinde foto_url (kisa omurlu presigned GET) doner. Kayit sonrasi
        admin+yonetici cihazlarina push denenir (EK gonderim — push hatasi
        kaydi etkilemez; data: tip=talep, complaint_id).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplaintCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Complaint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /complaints/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [complaints]
      summary: Talep detayi (acan roller kendininki; admin+yonetici hepsi)
      description: |
        Baskasinin talebini acan-kapsamli role 404 doner (varligi da
        sizdirilmaz). fotograflar[], gecmis[] (timeline, created_at ASC) ve
        bagli is emri varsa is_emri_id/is_emri_durum ile birlikte doner.
      responses:
        "200":
          description: Talep
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Complaint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [complaints]
      summary: (P33) Is takibi alanlari — daire, oncelik, personel (admin+yonetici)
      description: |
        DURUMA DOKUNMAZ: durum yalniz makine gecisleriyle
        (convert/resolve/decline) degisir; buradan da degistirilebilseydi
        gecis kurallari ve timeline satirlari atlanabilirdi. Oncelik/atama
        talebin yasam dongusunden BAGIMSIZDIR — acik bir talebin onceligi
        is emrine donusmeden de yukselebilir.

        `atanan_personel_id` bir `personel_kayit`tir, `app_user` DEGIL:
        temizlikcinin uygulama hesabi olmayabilir ama isi ona verilir
        (bkz. P27). Bildirim alan uygulamali atama hala `convert`
        ucundadir. Var olmayan daire/personel **422** — sessizce yazilsaydi
        is emri hicbir zaman ulasmayacagi bir kisiye atanmis gorunurdu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplaintUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Complaint" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /complaints/{id}/convert:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [complaints]
      summary: Talebi is emrine donustur (admin + yonetici)
      description: |
        Gecerli gecis YALNIZ acik -> is_emri (bkz. "Talep durum makinesi");
        aksi durumdan cagrilirsa 422 invalid_transition. atanan_user_id
        security veya tesis_gorevlisi rolunde olmali (aksi 422
        invalid_assignee). Bagli bir Task olusturulur (ticket_id=bu talep,
        kategori_id/oncelik govdeden; atanan_user_id atanir). history'e
        is_emri satiri eklenir (sebep = opsiyonel `not`). Talebi acana
        (tip=talep_is_emri) + atanan saha personeline (tip=is_emri_atandi)
        EK push denenir (hatasi kaydi etkilemez).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplaintConvertRequest" }
      responses:
        "200":
          description: Is emrine donusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Complaint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /complaints/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [complaints]
      summary: Talebi dogrudan coz (admin + yonetici)
      description: |
        Gecerli gecis acik -> cozuldu VEYA is_emri -> cozuldu (bkz. "Talep
        durum makinesi"); aksi durumdan (orn. zaten cozuldu/reddedildi)
        cagrilirsa 422 invalid_transition. Opsiyonel cozum_notu timeline'a
        sebep olarak yazilir. Talebi acana (tip=talep_cozuldu) EK push
        denenir (hatasi kaydi etkilemez). Not: is_emri durumundaki bir talep,
        bagli is emri (Task) tamamlandiginda da OTOMATIK cozuldu'ya gecer
        (bkz. `POST /tasks/{id}/completions`); bu uc MANUEL/erken kapanis
        icindir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplaintResolveRequest" }
      responses:
        "200":
          description: Cozuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Complaint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /complaints/{id}/decline:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [complaints]
      summary: Talebi reddet (admin + yonetici)
      description: |
        Gecerli gecis YALNIZ acik -> reddedildi (bkz. "Talep durum
        makinesi"); is_emri veya terminal bir durumdan cagrilirsa 422
        invalid_transition. sebep ZORUNLU, timeline'a yazilir. Talebi acana
        (tip=talep_reddedildi) EK push denenir (hatasi kaydi etkilemez).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplaintDeclineRequest" }
      responses:
        "200":
          description: Reddedildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Complaint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /complaints/{id}/withdraw:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [complaints]
      summary: Talebi GERI AL (acan — security + tesis_gorevlisi + resident)
      description: |
        (P146) Talebi ACAN kendi kaydini geri ceker. SILME DEGIL: kayit
        durur, durum `geri_alindi` olur ve timeline'a satir yazilir.

        Gecerli gecis YALNIZ acik -> geri_alindi; is emrine donusmus talep
        icin 422 invalid_transition (sahada is baslamis olabilir, geri alma
        yetim gorev birakir).

        Yonetim rolleri bu ucu CAGIRAMAZ (403) — onlarin kapatma yolu
        `decline`. Baskasinin talebi icin 404 (varligi sizdirilmaz).
      responses:
        "200":
          description: Geri alindi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Complaint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /unit-complaints/{id}/withdraw:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [unit-complaints]
      summary: Daire sikayetini GERI AL (yalniz sikayet eden — resident)
      description: |
        (P146) Sikayeti ACAN kendi kaydini geri ceker; durum
        `geri_alindi` olur. Gizlilik korunur: `complainant_user_id` yalniz
        IC eslesme icin kullanilir, cevapta DONMEZ.

        Yalniz `acik` sikayet geri alinabilir — yonetim kapattiktan sonra
        karar verilmis kaydi sahibi tek tarafli degistiremez (422).
        Baskasinin sikayeti icin 404.
      responses:
        "200":
          description: Geri alindi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitComplaint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # VISITORS (ziyaretci onay akisi: guvenlik kaydeder -> daire sakinlerine
  # push -> ilk yanitlayan sakin onaylar/reddeder -> sonuc guvenlige push)
  # ================================================================= #
  /visitors:
    get:
      tags: [visitors]
      summary: Ziyaretci LOG gecmisi (created_at DESC)
      description: |
        Ziyaretci LOG-ONLY kayittir (onay/red YOK). GIZLILIK (kesin kural,
        KVKK): YALNIZ security tenant'in TUM ziyaretci gecmisini gorur;
        resident YALNIZ KENDINE HEDEFLENEN kayitlari (tek hedef modeli — ayni
        dairedeki es'inkini gormez); tesis_gorevlisi ERISMEZ (403). yonetici VE
        admin VARSAYILAN KAPALI (403): bir daireyi gormek icin once
        /unit-access-request ile tek-seferlik izin alir, sonra ?unit_id= ile
        BiR KEZ gorur (izin o okumada tuketilir). daire/tarih ile filtrelenir.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: unit_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: icerde
          in: query
          required: false
          description: >
            (G3, ADDITIVE) true: halen ICERIDE olanlar (`cikis_zamani` IS NULL);
            false: cikisi damgalanmis olanlar. Verilmezse tum gecmis.
            Ana ekran sayaci: `?icerde=true&limit=1` -> `meta.total`.
          schema: { type: boolean }
        - name: baslangic
          in: query
          required: false
          description: created_at >= (tarih filtresi)
          schema: { type: string, format: date-time }
        - name: bitis
          in: query
          required: false
          description: created_at < (tarih filtresi)
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Visitor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [visitors]
      summary: Ziyaretci LOG kaydi ac (YALNIZ security)
      description: |
        Kapidaki guvenlik ziyaretciyi kaydeder (LOG-ONLY — onay/red YOK). Daire
        unit_id VEYA unit_no ile verilir (tam biri; bulunamazsa 422); HEDEF
        sakin (target_resident_user_id) o dairenin aktif sakini olmali (degilse
        422). Kayit sonrasi YALNIZ hedef sakine BILGILENDIRME push'u denenir
        (EK gonderim — push hatasi kaydi etkilemez; data: tip=ziyaretci,
        visitor_id). yonetici/admin kayit ACMAZ (403) — kapi operasyonu
        guvenligindir; gecmisi izinle GET ile okurlar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitorCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Visitor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /visitors/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [visitors]
      summary: Ziyaretci LOG detayi (resident yalniz kendine hedeflenen)
      description: |
        Ziyaretci LOG kayittir; onay/red YOKTUR. Guvenlik kaydi PATCH ile
        DUZENLEYEBILIR (asagi); diger roller icin detay yalniz okumadir.
      responses:
        "200":
          description: Ziyaretci
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Visitor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [visitors]
      summary: Ziyaretci kaydini duzenle (YALNIZ guvenlik)
      description: |
        Guvenlik kendi tenant'inda ziyaretci kaydini duzenler: ziyaretci_ad,
        not, hedef sakin (target_resident_user_id) ve daire (unit_id|unit_no).
        Kismi — yalniz verilen alan degisir; notlar acikca null gonderilirse
        temizlenir. Daire VEYA hedef degisirse hedef, (nihai) dairenin AKTIF
        sakini olarak yeniden dogrulanir (degilse 422). Kayit yoksa 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitorUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Visitor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /visitors/{id}/checkout:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [visitors]
      summary: Ziyaretci cikisini damgala (YALNIZ security) — G3
      description: |
        (ADDITIVE — G3) `cikis_zamani` sunucu saatiyle damgalanir; kayit bundan
        sonra `?icerde=true` suzgecine GIRMEZ.

        Kayit gibi CIKIS da KAPI OPERASYONUDUR: yalniz security damgalar
        (yonetici/admin ziyaretci kaydi acmadigi gibi cikis da damgalamaz).
        Atomik kosullu guncelleme — zaten cikmissa **409** ve ILK cikis zamani
        DEGISMEZ (kargo teslim deseniyle ayni). Govde YOKTUR.
      responses:
        "200":
          description: Cikis damgalandi (guncel kayit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Visitor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ziyaretci cikisi zaten kaydedilmis
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  # ================================================================= #
  # KARGO (paket takibi: guvenlik kaydeder (daire+firma+opsiyonel foto)
  # -> daire sakinlerine push -> sakin "teslim aldim" isaretler)
  # ================================================================= #
  /kargo:
    get:
      tags: [kargo]
      summary: Kargo gecmisi (created_at DESC)
      description: |
        GIZLILIK (ziyaretci ile ayni, KVKK): YALNIZ security tenant'in TUM
        kargo gecmisini gorur; resident YALNIZ kendi DAIRELERININ paketlerini
        (es de gorur — kargo unit-bazli); tesis_gorevlisi ERISMEZ (403).
        yonetici VE admin VARSAYILAN KAPALI (403): /unit-access-request ile
        tek-seferlik izin alip ?unit_id= ile bir kez gorur (izin tuketilir).
        durum/daire/tarih ile filtrelenir. foto_key varsa okumada foto_url
        (presigned GET) doner.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: durum
          in: query
          required: false
          schema: { type: string, enum: [bekliyor, teslim_alindi] }
        - name: unit_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: baslangic
          in: query
          required: false
          description: created_at >= (tarih filtresi)
          schema: { type: string, format: date-time }
        - name: bitis
          in: query
          required: false
          description: created_at < (tarih filtresi)
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Kargo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [kargo]
      summary: Kargo kaydi ac (YALNIZ security)
      description: |
        Kapidaki guvenlik gelen paketi kaydeder; durum=bekliyor baslar.
        Daire unit_id VEYA unit_no ile verilir (tam biri; bulunamazsa 422).
        Opsiyonel paket fotografi MEVCUT akisla yuklenir: once
        POST /uploads/presign ile foto_key + PUT URL alinir, dosya PUT edilir,
        foto_key burada gonderilir (tenant-namespace dogrulanir; gorev/talep/
        duyuru ile ayni desen — yeni upload yolu YOK). Kayit sonrasi dairenin
        TUM aktif sakinlerine push denenir ("Kargonuz geldi — <firma>";
        EK gonderim — hatasi kaydi etkilemez; data: tip=kargo, kargo_id).
        yonetici/admin kayit ACMAZ (403) — kapi operasyonu guvenligindir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KargoCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Kargo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /kargo/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [kargo]
      summary: Kargo detayi (resident yalniz kendi dairesininki)
      responses:
        "200":
          description: Kargo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Kargo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [kargo]
      summary: Teslim aldim isaretle (YALNIZ o dairenin aktif sakini)
      description: |
        Sakin teslim isareti: durum=teslim_alindi (tek gecerli deger).
        teslim_alan_user_id + teslim_zamani sunucuda damgalanir. Atomik
        durum='bekliyor' kosullu UPDATE: zaten teslim alinmis kayda ikinci
        isaret 409 — kimin teslim aldigi DEGISMEZ (ayni dairede coklu sakin
        guvenli). BASKA dairenin sakini 404 alir (varlik sizdirilmaz).
        Personel rolleri bu uca ERISEMEZ (403). Teslimde geri-push YOK
        (urun karari — kayit-push'u yeterli).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KargoUpdate" }
      responses:
        "200":
          description: Teslim alindi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Kargo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # UNIT-ACCESS-REQUEST (yonetici TEK-SEFERLIK ziyaretci/kargo goruntuleme
  # izni: yonetici talep acar -> dairenin sakini onaylar/reddeder -> onay
  # tek-kullanimlik izin; yonetici o dairenin kaydini ILK okudugunda tukenir)
  # ================================================================= #
  /unit-access-request:
    post:
      tags: [unit-access]
      summary: Goruntuleme izni talebi ac (admin VEYA yonetici)
      description: |
        yonetici VEYA admin (ikisi de ziyaretci/kargo icin varsayilan kapali)
        bir dairenin kayitlarini gormek icin izin talebi acar (durum=bekliyor).
        unit_id VEYA unit_no (tam biri; yoksa 422). Dairenin AKTIF sakinlerine
        push (tip=erisim_talebi). Diger roller 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitAccessRequestCreate" }
      responses:
        "201":
          description: Talep acildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitAccessRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [unit-access]
      summary: Izin talepleri (requested_at DESC)
      description: |
        Kapsam: yonetici kendi talepleri; resident kendi dairelerine gelen
        talepler; admin tenant tumu. security/tesis_gorevlisi ERISMEZ (403).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: durum
          in: query
          required: false
          schema: { type: string, enum: [bekliyor, onaylandi, reddedildi] }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/UnitAccessRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /unit-access-request/bulk:
    post:
      tags: [unit-access]
      summary: Tum sakinli daireler icin TOPLU izin talebi (admin/yonetici)
      description: |
        Tenant'taki SAKINLI TUM daireler icin ayni anda bekleyen talep acar ->
        her dairenin AKTIF sakinlerine push (tip=erisim_talebi). PER-DAIRE karar
        sakinde kalir: toplu talep hicbir onayi BAYPAS ETMEZ. Mukerrer bildirim
        spam'ini onlemek icin talebi acanin zaten acik (bekleyen) ya da
        kullanilmamis onayli izni olan daireler ATLANIR. Diger roller 403.
      responses:
        "201":
          description: Toplu talep sonucu (olusan + atlanan)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkAccessRequestResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /unit-access-request/granted-units:
    get:
      tags: [unit-access]
      summary: Su an goruntulenebilir (onayli+kullanilmamis) daireler (admin/yonetici)
      description: |
        Talebi acanin ILK okumada tuketebilecegi daireler (durum=onaylandi,
        used=false) — 'hangi daireler acildi' gorunumu (bulk sonrasi izlenir).
        Bekleyen/reddedilen daireler burada YOKTUR; bir daire okununca (izin
        tuketilince) listeden duser. Diger roller 403.
      responses:
        "200":
          description: Goruntulenebilir daireler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantedUnitsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /unit-access-request/{id}:
    patch:
      tags: [unit-access]
      summary: Talebi onayla/reddet (YALNIZ o dairenin aktif sakini)
      description: |
        Sakin karari: durum=onaylandi|reddedildi. granted_by_resident_user_id
        + decided_at damgalanir. Atomik durum='bekliyor' kosullu UPDATE: ILK
        karar gecerli, ikinci 409. BASKA dairenin sakini 404 (varlik
        sizdirilmaz); personel/yonetici/admin rol kapisinda 403. onaylandi ->
        TEK-KULLANIMLIK izin (used=false). Sonuc push'u talebi acan yonetici'ye
        (tip=erisim_sonuc).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitAccessRequestDecision" }
      responses:
        "200":
          description: Karar verildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitAccessRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # REZERVASYON (ortak alan: yonetici alan tanimlar -> sakin slot talep
  # eder -> yonetici onaylar/reddeder; onayli slotlar CAKISAMAZ)
  # ================================================================= #
  /common-areas:
    get:
      tags: [rezervasyon]
      summary: Ortak alan listesi (ada gore)
      description: |
        TUM roller okur (sakin neyin rezerve edilebilir oldugunu gormeli).
        Yonetim (admin+yonetici) PASIF alanlari da gorur (duzenleme icin);
        diger roller YALNIZ aktif alanlari gorur.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/OrtakAlan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [rezervasyon]
      summary: Ortak alan olustur (admin + yonetici)
      description: Ayni adla ikinci alan 409. Silme yok — kaldirma PATCH aktif=false.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrtakAlanCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrtakAlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /common-areas/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [rezervasyon]
      summary: Ortak alan duzenle / aktiflik degistir (admin + yonetici)
      description: |
        aktif=false = soft-delete (rezervasyon gecmisi korunur; alan_id FK
        RESTRICT hard-delete'i zaten engeller). En az bir alan gerekli.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrtakAlanUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrtakAlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /common-areas/{id}/slots:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [rezervasyon]
      summary: Bir gunun slot izgarasi (dolu/bos + rezerve edilebilirlik) — TUM roller
      description: |
        Alanin musaitliginden (acilis/kapanis/slot_dakika) o gunun TAM slot
        izgarasini uretir; her slot dolu/bos + rezerve_edilebilir + sebep.
        **dolu** = o slotla kesisen ONAYLI bir rezervasyon var (yari-acik
        kesisim; bitisik slot dolu SAYILMAZ). GIZLILIK: kim rezerve etmis
        PAYLASILMAZ (yalniz saat + dolu). **rezerve_edilebilir** yalniz SAKIN
        icin hesaplanir (yonetimde her zaman false — yonetim rezerve etmez):
        zamanlama kurallarina uyan (24s penceresi + gunluk kota + son-dakika
        istisnasi) BOS slot true; degilse false + **sebep**
        (dolu|gecti|cok_erken|gunluk). Pasif alan sakine/sahaya 404, yonetim
        pasif alan slotlarini gorur.
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
          description: Gun (YYYY-MM-DD)
      responses:
        "200":
          description: Slot listesi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlanSlotResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /reservations:
    get:
      tags: [rezervasyon]
      summary: Rezervasyon listesi (created_at DESC)
      description: |
        admin/yonetici tenant'in TUM rezervasyonlarini gorur; resident YALNIZ
        kendi dairelerinin rezervasyonlarini gorur (daire bazli — es de gorur);
        security/tesis_gorevlisi ERISMEZ (403). alan/durum/tarih ile
        filtrelenir (alan+tarih = gun gorunumu). Onay akisi YOK — durum yalniz
        onaylandi|iptal.
      parameters:
        - in: query
          name: gecmis
          required: false
          description: |
            (P165) `true` = bitis saati GECMIS kayitlar, `false` = aktif
            (suren + gelecek), verilmezse hepsi.

            KARSILASTIRMA SUNUCUDA ve TESISIN SAAT DILIMINDE yapilir:
            `tarih` bir GUN, `bitis` bir gun-ici SAAT; ikisi ancak bir
            saat diliminde bir ANA donusur. Istemci saatine guvenmek,
            saati yanlis kurulu bir cihazda gecmis kaydin yaninda "Iptal
            et" gostermekti.

            OLCU BITIS, BASLANGIC DEGIL: su an SUREN bir rezervasyon
            aktiftir ve iptal edilebilmelidir.

            `gecmis=true` ayrica TESIS SAKLAMA PENCERESINI uygular
            (`tenant.rezervasyon_gecmis_ay`, `0 = sinirsiz`). Bu bir
            GIZLEMEDIR — kayit veritabaninda DURUR.
          schema: { type: boolean }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: durum
          in: query
          required: false
          schema: { type: string, enum: [onaylandi, iptal] }
        - name: alan_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: tarih
          in: query
          required: false
          description: Gun filtresi (YYYY-MM-DD)
          schema: { type: string, format: date }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Rezervasyon" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [rezervasyon]
      summary: Bos slotu rezerve et (YALNIZ resident) — ONAY YOK, aninda onaylandi
      description: |
        Sakin bos slotu rezerve eder: alan + tarih + saat araligi (bitis >
        baslangic, ayni gun) + kisi_sayisi (>0). Daire sakinin AKTIF dairesinden
        turetilir (birden fazla dairesi varsa unit_id ile secer — kendi dairesi
        olmali). ONAY AKISI YOK: kayit dogrudan durum=onaylandi olusur + rezerve
        edene onay push'u denenir (data: tip=rezervasyon, rezervasyon_id).
        CAKISMA: ayni alanin ONAYLI rezervasyonuyla kesisen slot 409 — nihai
        guvence INSERT anindaki DB EXCLUDE kisiti (yaris-guvenli).
        ZAMANLAMA (slot baslangicina gore, tenant tz):
          * 24 saat penceresi: slota <24s kala rezerve edilir; erken -> 422
            "Rezervasyon en erken 24 saat kala yapilabilir."; gecmis slot -> 422.
          * gunde bir: sakin, slot-gunune denk 1 aktif rezervasyon tutar;
            ikincisi -> 409 "Bu gun icin zaten bir rezervasyonunuz var."
          * son dakika: slota <10 dk kala BOS slot gunluk kotayi baypas eder.
        MUSAITLIK: aralik alanin [acilis, kapanis] penceresinde olmali — disi
        422. Pasif/olmayan alan 422. Yonetim rezerve ETMEZ (403).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RezervasyonCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rezervasyon" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /reservations/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [rezervasyon]
      summary: Rezervasyon detayi (resident yalniz kendi dairesininki)
      responses:
        "200":
          description: Rezervasyon
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rezervasyon" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /reservations/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [rezervasyon]
      summary: Rezervasyonu iptal et (YALNIZ rezerve eden sakin — 10 dk kurali)
      description: |
        Rezervasyonu iptal eder (durum='iptal'); slot bosalir (EXCLUDE disi).
        YALNIZ rezerve eden `resident` KENDI rezervasyonunu iptal eder
        (baskasininki 404 — varlik sizdirilmaz). Yonetim (admin/yonetici) iptal
        ETMEZ — onay akisi yok, yalniz izler (403). Slot baslangicina **10
        dakikadan az kala** (veya baslamis) iptal EDILEMEZ (422 "Rezervasyon
        baslangicina 10 dakikadan az kaldi, iptal edilemez."). iptal_eden_user_id
        + iptal_zamani damgalanir. Zaten iptal edilmis kayda ikinci iptal 409.
        security/tesis_gorevlisi ERISEMEZ (403).
      responses:
        "200":
          description: Iptal edildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rezervasyon" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # ETKINLIK + RSVP (yonetici olusturur -> sakinlere push -> sakin
  # katiliyorum/katilmiyorum beyani -> SAYILAR HERKESE SEFFAF)
  # ================================================================= #
  /events:
    get:
      tags: [etkinlik]
      summary: Etkinlik listesi + seffaf katilim sayilari (?aktif ile yaklasanlar)
      description: |
        TUM roller okur. Her etkinlik SEFFAF sayilarla doner
        (katiliyorum_sayisi + katilmiyorum_sayisi — herkes gorur) ve
        istekteki kullanicinin KENDI beyani (benim_durumum; yoksa null) ile
        gelir. Kim-katiliyor listesi URUN GEREGI donmez — kimlik degil,
        yalniz sayi.

        **Yaklasan/aktif suzgeci (`?aktif=true`)**: etkinlik BITISI gecene
        kadar listede kalir —
        `COALESCE(bitis_zamani, tarih) >= now()`. `bitis_zamani` verilmemis
        etkinlik ANLIKTIR (bitis = baslangic), yani baslangic anini gecince
        listeden duser. Siralama:

        | sorgu | siralama |
        |---|---|
        | `?aktif=true` | YAKLASAN once (bitis ASC) — ana ekran "yaklasan etkinlikler" bolumu |
        | `?aktif=false` | bitmisler, en YENI once (tarih DESC) |
        | suzgecsiz | tumu, en YENI once (tarih DESC — geriye uyumlu) |

        Gorsel: `foto_url` kisa omurlu presigned GET'tir (foto_key varsa) —
        duyuru/site kurali ile AYNI mekanizma.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DilQuery"
        - name: aktif
          in: query
          required: false
          description: >
            true: bitisi gecmemis (yaklasan/suren) etkinlikler, en yakin once.
            false: bitmis etkinlikler. Verilmezse tumu.
          schema: { type: boolean }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Etkinlik" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [etkinlik]
      summary: Etkinlik olustur (admin + yonetici)
      description: |
        Site yonetimi etkinligi duyurur (orn. cenaze, mac izleme). Kayit
        sonrasi TUM SAKINLERIN cihazlarina push denenir (hedef kitle
        sakinler; personel okur ama push almaz — EK gonderim, hatasi kaydi
        etkilemez; data: tip=etkinlik, etkinlik_id).

        Opsiyonel `bitis_zamani` baslangictan SONRA olmali (aksi 422); DB'de
        `ck_etkinlik_bitis` ile de zorlanir.

        Opsiyonel gorsel: `POST /uploads/presign` ile yuklenen `foto_key`
        (duyuru + site kurali ile AYNI akis: ayni depo, ayni tur/boyut
        limitleri). foto_key kendi tenant onekinde olmali — aksi halde 422
        `invalid_foto_key` (IDOR korumasi). Okumada `foto_url` doner.

        **OTOMATIK CEVIRI**: kayit sonrasi kaynak dil disindaki 6 dil icin
        ceviri isi ACILIR (`ceviri_durumu` = `bekliyor`) ve arka planda
        uretilir. Ceviri EK bir islemdir: saglayici ya da kuyruk
        erisilemez olsa bile bu istek BASARILI olur ve orijinal metin
        servis edilmeye devam eder (basarisiz diller `hata` isaretlenir).
        Duzenlemede kaynak METIN degistiyse ceviriler yeniden uretilir;
        yonetici tarafindan ELLE DUZELTILMIS bir ceviri YALNIZCA kaynak
        metin AYNI kaldiysa (orn. yalniz gorsel/tarih/sira degistiyse)
        KORUNUR.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EtkinlikCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Etkinlik" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

