            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /unit-tipleri/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [aidat]
      summary: Tip guncelle (admin+yonetici)
      description: >
        `varsayilan_aidat_kurus: null` GONDERILEBILIR ve tutari KALDIRIR.
        "Gonderilmedi" ile "null gonderildi" AYRI islenir — bu ayrim onemli:
        **0 gecerli bir tutardir** (muaf daire), `null` ise "tanimsiz".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitTipUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitTip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ayni ADDA tip zaten var
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [aidat]
      summary: Tip sil (admin+yonetici) — DAIRELER SILINMEZ
      description: >
        Tanim silinir; bagli daireler **DURUR**, yalniz tipleri bosalir
        (`ON DELETE SET NULL`). Silme 409 VERMEZ: tanim listesi temizlemek
        yaygin bir bakimdir ve "once 400 daireyi degistir" demek kullaniciyi
        tanimi pasife alip listede birakmaya iterdi. Yanit KAC daireyi
        etkiledigini doner — islem sessiz degildir.
      responses:
        "200":
          description: Silindi
          content:
            application/json:
              schema:
                type: object
                required: [etkilenen_daire]
                properties:
                  etkilenen_daire:
                    type: integer
                    description: Siniflandirmasi bosalan daire sayisi
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
