  # ================================================================= #
  # TASKS (esnek gorev sistemi) + tamamlama + foto kanit
  # ================================================================= #
  /tasks:
    get:
      tags: [tasks]
      summary: Gorev listesi
      description: |
        `atanan_user_id` filtresi (mobil §11 #1): `me` = token kullanicisina
        atananlar; duz UUID = o kullaniciya atananlar (panel; tum okuyucu
        roller kullanabilir — atama bilgisi zaten listede gorunur, yetki
        siniri degildir). Gecersiz deger 422.

        Gorunurluk (A4): saha rolleri (`security`/`tesis_gorevlisi`) kendi
        ROL GRUBUNA atanan gorevleri + atanmamislari ("Herkes") okur;
        saha-disi kisiye atanmis gorevler gorunmez. Yonetim kisitsiz.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: kategori_id
          in: query
          description: kategori UUID veya 'diger' (kategorisiz/Diğer)
          schema: { type: string }
        - name: aktif
          in: query
          schema: { type: boolean }
        - name: atanan_user_id
          in: query
          description: "'me' veya user UUID — atanan kullanici filtresi"
          schema: { type: string }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [tasks]
      summary: Gorev olustur
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /tasks/{id}:
