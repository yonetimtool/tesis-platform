            Sema duzeyinde opsiyonel, IS KURALI olarak zorunlu: bos ise
            satir REDDEDILIR ama diger satirlar islenir. Sema
            zorunlulugu tum istegi 422 yapardi ve satir bazli rapor
            imkansizlasirdi.
        daire_no:
          type: string
          nullable: true
          maxLength: 50
          description: Bos ise satir reddedilir (bkz. blok)
        ad: { type: string, nullable: true, maxLength: 150 }
        telefon: { type: string, nullable: true, maxLength: 30 }
        rol_tipi:
          type: string
          nullable: true
          maxLength: 20
          description: "malik | kiraci; baskasi 422 degil SATIR HATASI verir"
    SiteAktarIstek:
      type: object
