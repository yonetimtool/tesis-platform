            Metinsiz bir kapi, kullaniciya OKUMADAN onaylatmak olurdu.
        guncel_surum: { type: integer, nullable: true }
        onayladigi_surum: { type: integer, nullable: true }
        onay_at: { type: string, format: date-time, nullable: true }
        onay_gerekli:
          type: boolean
          description: true ise istemci onay kapisini acar (surum artinca yeniden true)
