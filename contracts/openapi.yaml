openapi: 3.0.3
info:
  title: Tesis Guvenlik & Operasyon API
  version: "0.1.0"
  description: |
    Multi-tenant tesis guvenlik & operasyon SaaS — v0 sozlesmesi.
    Backend (FastAPI) ile Mobil (Flutter) ve Panel (Next.js) gelistiricilerinin
    paralel calismasi icin tek dogruluk kaynagidir.

    Konvansiyonlar (detay: /contracts/README.md):
      * Tum zamanlar ISO8601 UTC (`...Z`). tenant.timezone ile yorumlanir.
      * Hata zarfi: `{ "error": { "code": "...", "message": "..." } }`.
      * Sayfalama: `limit` (varsayilan 50, max 200) + `offset`. Liste yanitlari
        `PageMeta` icerir.
      * Auth: JWT Bearer (bkz. /contracts/auth.md). Tenant her zaman token'dan
        cikarilir — istemci tenant_id gondermez/secemez.
      * `POST /scans` icin `Idempotency-Key` header zorunlu.

servers:
  # NOT: base path /v0 KALDIRILDI — gercek backend endpoint'leri /v0 ONEKI OLMADAN
  # sunuyor (orn. /auth/login, /scans). Base = host:port.
  - url: https://api.example.com
    description: production
  - url: http://localhost:8000
    description: yerel gelistirme

tags:
  - name: auth
  - name: shifts
  - name: checkpoints
  - name: patrol-plans
  - name: scans
  - name: dashboard
  - name: me

security:
  - bearerAuth: []

paths:
  # ================================================================= #
  # DAVET (P155 §7) — jetonlu kayit bagi
  # ================================================================= #
  /davet/coz:
    post:
      tags: [davet]
      summary: Davet jetonunu cozer (tesis/rol/daire/telefon)
      security: []   # kullanicinin henuz oturumu yok
      description: |
        Jeton cozuldugunde tesis/rol/daire/telefon bellidir. COZME jetonu
        TUKETMEZ (bag tarayicida acilip sonra uygulamada da acilabilir).
        404 bulunamadi · 410 suresi doldu / kullanilmis.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DavetCozRequest" }
      responses:
        "200":
          description: Davet baglami (telefon maskeli)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DavetCozResponse" }
        "404":
          description: Davet bulunamadi
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "410":
          description: Davet suresi doldu ya da kullanilmis
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
  /davet/parola:
    post:
      tags: [davet]
      summary: Davetle gelen kullanici parola belirler (SMS yok)
      security: []   # jeton govdede; kimlik oncesi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DavetParolaRequest" }
      responses:
        "200":
          description: Oturum acildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "410":
          description: Davet gecersiz
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422":
          description: Zayif parola
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
  /davet/sosyal:
    post:
      tags: [davet]
      summary: Davetle gelen kullanici sosyal hesabini baglar (SMS yok)
      security: []   # jeton + baglama jetonu govdede
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DavetSosyalRequest" }
      responses:
        "200":
          description: Oturum acildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "410":
          description: Davet gecersiz
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /davet/vazgec/{jeton}:
    post:
      tags: [davet]
      summary: "Davet e-postasi List-Unsubscribe tek-tik (RFC 8058) — PUBLIC"
      description: >
        (P190) Posta istemcisinin tek-tik iptali. Kimlik ONCESI (oturum yok);
        yetki jetonun HMAC imzasidir, tenant jetondan cozulur (RLS o baglamla).
        Kisi davet e-postalarindan cikarilir (`app_user.davet_vazgecti=true`);
        yeniden gonderimde bile atlanir. Gecersiz jetonda da 200 (sizdirmama);
        govde metni farklidir. Yanit HTML (RFC 8058 SHOULD onay sayfasi).
      security: []   # jeton (imzali) yolda; oturum yok
      parameters:
        - name: jeton
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: HTML onay sayfasi (cikarildi ya da gecersiz bag)
          content:
            text/html:
              schema: { type: string }

  /davet:
    get:
      tags: [davet]
      summary: Yonetici — tesisin davetleri + son gonderim durumu
      responses:
        "200":
          description: Davet listesi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DavetDurumListResponse" }
  /davet/{user_id}/yeniden:
    post:
      tags: [davet]
      summary: Yonetici — daveti tazeler ve yeniden gonderir
      parameters:
        - in: path
          name: user_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Davet yeniden gonderildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DavetDurumOut" }
        "404":
          description: Kullanici bulunamadi
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "409":
          description: Kullanici zaten kayitli
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  # ================================================================= #
  # AUTH
  # ================================================================= #
  /auth/login:
    post:
      tags: [auth]
      summary: Email + parola ile giris
      security: []   # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Basarili
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Hatali kimlik bilgisi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/login-phone:
    post:
      tags: [auth]
      summary: Mobil giris — cep telefonu (global benzersiz) + (gecici kod VEYA parola)
      description: |
        MOBIL roller (yonetici/security/tesis_gorevlisi/resident) girisi: e-posta/
        daire no/tenant_slug YERINE `phone + password` alinir. Telefon GLOBAL
        benzersiz oldugundan tenant NUMARADAN otomatik cozulur
        (`tenant_id_by_phone`, SECURITY DEFINER). Numara E.164 normalize edilir.
        (Admin paneli e-posta ile `POST /auth/login` kullanir.)

        * Kalici parola eslesirse: `password_setup_required=false` + tam
          token cifti (TokenPair ile ayni alanlar).
        * GECICI KOD eslesirse (ilk giris): `password_setup_required=true` +
          `setup_token` doner; oturum token'i VERILMEZ. Istemci
          `POST /auth/set-password` ile kalici parolayi belirlemek ZORUNDADIR.
      security: []   # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneLoginRequest"
      responses:
        "200":
          description: Basarili (normal oturum VEYA parola kurulumu gerekli)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneLoginResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Hatali telefon / kod / parola
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/set-password:
    post:
      tags: [auth]
      summary: Ilk giris sonrasi ZORUNLU kalici parola belirleme (sakin)
      description: |
        `login-resident`'in gecici kodla dondurdugu kisa omurlu `setup_token`
        (~10 dk) ile cagirilir. Basarida parola kaydedilir (bcrypt), gecici
        kod SILINIR (tek kullanimlik) ve tam oturum (TokenPair) doner —
        sakin tekrar giris yapmak zorunda kalmaz.
      security: []   # setup_token govdede tasinir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "200":
          description: Parola belirlendi; oturum acildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Gecersiz/suresi dolmus/kullanilmis setup_token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /residents:
    post:
      tags: [auth]
      summary: Sakin hesabi olustur (yonetici) — daire + gecici kod
      description: |
        Yonetici (veya admin) daire + sakin hesabini tek adimda acar. Ayni
        `unit_no` varsa YENI daire acilmaz, mevcuta baglanir (ayni dairede
        coklu sakin). Yanittaki `temp_code` YALNIZ BU YANITTA bir kez duz
        metin doner — yonetici sakine iletir; sunucuda bcrypt hash'i saklanir
        ve sakin kalici parolasini belirleyince gecersizlesir.
        RBAC: admin + yonetici (unit CRUD'un admin-only olmasindan ayri,
        sakin acma akisidir).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResidentCreate"
      responses:
        "201":
          description: Sakin olusturuldu (gecici kod bir kez gosterilir)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentCreated"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: telefon (global) veya email (tenant) zaten kayitli
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [auth]
      summary: Site sakin listesi (yonetici/admin) — ad + daire no + durum
      description: |
        Tenant'taki sakinler (role=resident): ad + aktif daire no (bitis IS NULL)
        + is_active. Telefon KVKK geregi DONMEZ. Saha/sakin roller 403.
      responses:
        "200":
          description: Sakin listesi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResidentListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /residents/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [auth]
      summary: Sakini duzenle (yonetici/admin) — ad ve/veya telefon
      description: |
        telefon global benzersiz (cakisma 409); normalize edilir. Numarayi bos
        birakmak = degismez (en az bir alan). role=resident degilse 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResidentUpdate" }
      responses:
        "204": { description: Guncellendi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Bu telefon zaten kayitli
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [auth]
      summary: Sakini SIL (akilli, yonetici/admin) — telefon her durumda serbest
      description: |
        Gecmissiz sakin TAMAMEN silinir (deleted=true; unit_resident/rsvp/device
        CASCADE). Gecmisi olan sakin (FK RESTRICT) silinemez -> pasiflestirilir +
        telefon=NULL (deleted=false). Boylece ayni numarayla yeniden kayit her
        zaman mumkun. role=resident degilse 404. Saha/sakin roller 403.
      responses:
        "200":
          description: Silme sonucu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResidentDeleteOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # (P186-ek2) /residents/{id}/reset-password KALDIRILDI — yonetici parola
  # sifirlayamaz (hesap-ele-gecirme). Kurtarma: davet yeniden ya da kullanicinin
  # kendi "sifremi unuttum"/PATCH /me/password yolu.

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh token ile yeni access (+rotated refresh) al
      security: []   # refresh token govdede tasinir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Yeni token cifti
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Gecersiz / suresi dolmus / iptal edilmis refresh token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ----------------------------------------------------------------- #
  # (P155r2 / §3) YONETICI SELF-SIGNUP — tesis UYGULAMADAN acilir.
  /auth/kayit/tesis-olustur:
    post:
      tags: [auth]
      summary: Tesis adi + yonetici -> tesis olusur, kod uretilir, oturum acilir
      security: []   # kimlik ONCESI: kullanicinin henuz hesabi yok
      description: |
        Yonetici tesisini uygulamadan acar; ADMIN PANELI ADIMI YOKTUR.
        `POST /tenants` kaldirilmadi ama artik BIRINCIL yol degil — o,
        platform sahibinin destek/tohum islerine kaldi.

        TESIS KODU ISTEMCIDEN ALINMAZ: kural (`ad`in ilk 4 harfi + '-' +
        YYAAGG) veritabanindaki tetikleyicidedir (goc 0037/0041). Turkce
        harf donusumu, 4 harften kisa ad, rakamla baslayan ad ve ayni gun
        ayni ad cakismasi (rastgele iki haneli ek) ORADA cozulur.

        ATOMIK: tesis + yonetici + (sosyal yolda) kimlik bagi TEK
        transaction'da yazilir. "Tesis olustu ama yonetici tamamlamadi"
        diye bir ara durum YOKTUR.

        YONTEM: `parola` VEYA `baglama_jetonu` — ikisi birden DEGIL.
        Sosyal yolda parola hic yazilmaz; kimlik saglayicidadir.

        HIZ SINIRI telefon basinadir ve DOGRULAMADAN ONCE sayar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TesisOlusturRequest" }
      responses:
        "201":
          description: |
            Tesis acildi ve OTURUM ACILDI. `tesis_kodu` doner cunku
            yoneticinin sakinlerine iletecegi sey odur (SMS saglayicisi
            baglanana kadar tek dagitim yolu ELLE iletmektir).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TesisOlusturResponse" }
        "409":
          description: |
            Telefon zaten kayitli, ya da sosyal kimlik baska bir hesaba
            bagli. Numaranin kendi numarasi oldugu icin AYIRT EDICI hata
            veriliyor — kullaniciyi dogru kapiya (giris) yollamak icin.
            Numara taramasini engelleyen sey hiz siniridir.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422":
          description: Telefon gecersiz ya da yontem kurali ihlal edildi
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "429":
          description: Hiz siniri asildi
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  # ----------------------------------------------------------------- #
  # (P177 §4-§6) YENI KAYIT AKISI — `YENI_KAYIT_AKISI` BAYRAGI ARKASINDA.
  #
  # BAYRAK KAPALIYKEN (VARSAYILAN) BU DORT UC DA 503 DONER ve mevcut
  # kimlik sistemi birebir bugunku gibi calisir. Yukaridaki
  # `/auth/kayit/tesis-olustur` ve asagidaki `/auth/kayit/rol-*` uclari
  # bu bayragi OKUMAZ.
  #
  # HEPSI PUBLIC (`security: []`): kaydolan kisinin henuz hesabi yoktur.
  # ----------------------------------------------------------------- #
  /auth/kayit/yonetici-basvuru:
    post:
      tags: [auth]
      summary: Yonetici kayit basvurusu — bilgiler + onaylar, e-postaya kod
      security: []   # kimlik ONCESI: kullanicinin henuz hesabi yok
      description: |
        Tanitim sitesindeki kayit formunun 1. adimi. TESIS ACILMAZ:
        tesis, e-posta dogrulandiktan sonra `/auth/kayit/yonetici-tesis`
        ile acilir. Dogrulanmamis bir adresle acilan tesis, sahibine
        ulasilamayan bir tesis olurdu.

        ONAYLAR: `onay_sozlesme` ve `onay_kvkk` ZORUNLUDUR (422).
        `onay_ticari` istege baglidir; SAKLANIR ama `TICARI_ILETI_AKTIF`
        varsayilan `false` oldugu icin HICBIR ticari ileti gonderilmez
        (sirket ve IYS kaydi yok).

        IP ve tarayici bilgisi GOVDEDE ISTENMEZ, `X-Istemci-Ip` ve
        `X-Istemci-Ajan` BASLIKLARINDAN okunur: tarayici kendi IP'sini
        bilemez ve istemcinin beyan ettigi bir IP ispat degeri tasimaz.

        AYNI ADRESLE IKINCI BASVURU DUVARA CARPMAZ: acik basvuru
        TAZELENIR (yeni kod, yeni onay damgasi) — kodunu kaybeden
        kullanici bastan deneyebilsin diye.

        HIZ SINIRI e-posta basinadir ve DOGRULAMADAN ONCE sayar.
      parameters:
        - in: header
          name: X-Istemci-Ip
          required: false
          schema: { type: string }
          description: Onay kaydina yazilacak istemci IP'si (BFF ekler).
        - in: header
          name: X-Istemci-Ajan
          required: false
          schema: { type: string }
          description: Onay kaydina yazilacak tarayici bilgisi (BFF ekler).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/YoneticiBasvuruRequest" }
      responses:
        "201":
          description: |
            Kod gonderildi. Yanit, adresin sistemde olup olmadigini
            SIZDIRMAZ — her durumda ayni govde doner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YoneticiBasvuruResponse" }
        "422":
          description: Zorunlu onaylar isaretlenmemis ya da alanlar gecersiz
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "429":
          description: Hiz siniri asildi
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "503":
          description: YENI_KAYIT_AKISI kapali
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /auth/kayit/yonetici-dogrula:
    post:
      tags: [auth]
      summary: E-posta kodunu dogrula -> tesis kurulum jetonu
      security: []
      description: |
        Kod dogruysa KURULUM JETONU doner — OTURUM DEGIL. Ortada henuz
        ne tesis ne kullanici var; verilecek bir oturum yok.

        Sure, deneme siniri ve kodun bcrypt'lenmesi `telefon_kodu`
        modulunden gelir; ikinci bir kural kumesi yazilmadi. Deneme
        sayaci AYRI OTURUMDA artirilir (ayni oturumda tutmak sayaci geri
        sardirirdi).

        HATA AYIRT ETTIRMEZ: "kod yanlis", "basvuru yok", "suresi dolmus"
        ve "deneme hakki bitti" AYNI 422'yi doner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/YoneticiDogrulaRequest" }
      responses:
        "200":
          description: Kod dogru — kurulum jetonu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YoneticiDogrulaResponse" }
        "422":
          description: Kod/basvuru gecersiz (adimlar ayirt ettirilmez)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "503":
          description: YENI_KAYIT_AKISI kapali
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /auth/kayit/yonetici-tesis:
    post:
      tags: [auth]
      summary: Site adi -> tesis acilir (MEVCUT mekanizma), oturum acilir
      security: []
      description: |
        `create_tenant_with_yoneticis` AYNEN kullanilir; tesis kodunu
        yine veritabanindaki tetikleyici uretir. Yani tesis acma
        mekanizmasi DEGISMEDI, yalniz onune e-posta dogrulamasi kondu.

        Tesis ID hem yanitta doner hem e-postayla gonderilir: yalniz
        ekranda gostermek, sekmeyi kapatan yoneticiyi destege yollardi.

        Kurulum jetonu tek kullanimliktir (basvuru `tamamlandi` olur) ve
        `type=tesis_kurulum` tasir — parola-kurulum jetonundan AYRI bir
        tip, cunku tasidigi yetki farklidir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/YoneticiTesisRequest" }
      responses:
        "201":
          description: Tesis acildi ve oturum acildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TesisOlusturResponse" }
        "401":
          description: Kurulum jetonu gecersiz, suresi dolmus ya da kullanilmis
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "409":
          description: Telefon bu arada baska bir hesap tarafindan alinmis
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "503":
          description: YENI_KAYIT_AKISI kapali
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /auth/kayit/rol-eposta-basla:
    post:
      tags: [auth]
      summary: Rol + Tesis ID + e-posta -> eslesirse e-postaya kod
      security: []
      description: |
        (§6) SAKIN / GUVENLIK / TESIS GOREVLISI kaydinin 1. adimi.
        Telefonlu kardesi (`/auth/kayit/rol-basla`) DURUYOR ve
        degistirilmedi; bu yol E-POSTA kimligiyle calisir. SMS
        GONDERILMEZ (`SMS_AKTIF=false`).

        UC SART BIRLIKTE ARANIR: (a) Tesis ID gecerli, (b) e-posta
        yoneticinin ekledigi listede (o tenant'ta, AKTIF, istenen rolde
        ve parolasi HENUZ BELIRLENMEMIS bir kullanici), (c) o adrese
        giden kod dogrulanir. Yalniz Tesis ID ile dogrulama yapilsaydi,
        ID'yi ogrenen herkes o siteye sakin olarak girerdi.

        ESLESME SONUCU YANITTAN OKUNAMAZ: eslessin ya da eslesmesin ayni
        govde doner. (b) tutmazsa deneme SESSIZCE KAYBOLMAZ, tesisin
        onay kuyruguna (`kayit_onay_kuyrugu`) duser.

        TESIS KODU HATASI SOYLENIR (422): kod zaten kamuya aciktir ve en
        sik yazim hatasi orada olur.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolEpostaBaslaRequest" }
      responses:
        "200":
          description: |
            Islem alindi. `tesis_ad` doner (kullanici dogru siteye
            kaydoldugunu gormeli; kod zaten kamuya acik). Eslesme
            durumu HICBIR alandan okunamaz.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolEpostaBaslaResponse" }
        "422":
          description: Tesis ID ya da rol gecersiz
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "429":
          description: Hiz siniri asildi
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "503":
          description: YENI_KAYIT_AKISI kapali
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /auth/kayit/rol-eposta-dogrula:
    post:
      tags: [auth]
      summary: Kod + Tesis ID + e-posta -> parola belirleme jetonu ya da onay kuyrugu
      security: []
      description: |
        Tesis ID, liste uyeligi ve kod YENIDEN kontrol edilir. Tekrar
        degil GEREKLILIK: `basla` ile `dogrula` arasinda dakikalar gecer
        ve o arada yonetici kisiyi listeden cikarmis ya da hesap baska
        bir yoldan sahiplenilmis olabilir.

        ROL BU ADIMDA ARANMAZ (govdede de yoktur): rol, listedeki
        hesabin bir OZELLIGIDIR, kisinin ileri surdugu bir yetki iddiasi
        degil. `basla` adiminda beyan edilen rol listeyle karsilastirilir
        ve uymazsa kuyruga duser; burada yeniden aramak, yonetici rolu
        iki adim arasinda DUZELTTIGINDE kisiyi dogru kodla birlikte
        yeniden kuyruga dusururdu.

        TEK YANIT TIPI, IKI SONUC: `durum='hazir'` (setup_token dolu) ya
        da `durum='onay_bekliyor'` (kuyruga dustu). Ayri hata kodlari
        dondurmek, hangi sartin tutmadigini sizdirirdi.

        `setup_token` `POST /auth/set-password` icin kullanilir; kod
        TUKETILIR ve tek-kullanimlilik `temp_code_hash` uzerinden
        yurur — ikinci bir tek-kullanim mekanizmasi yazilmadi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolEpostaDogrulaRequest" }
      responses:
        "200":
          description: Kod dogru — `hazir` ya da `onay_bekliyor`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolEpostaDogrulaResponse" }
        "422":
          description: Kod ya da Tesis ID gecersiz (adimlar ayirt ettirilmez)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "503":
          description: YENI_KAYIT_AKISI kapali
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  # ----------------------------------------------------------------- #
  # (P154 / Asama 3) ROL SECIMLI KAYIT.
  #
  # Hesap yonetici tarafindan ZATEN ACILMISTIR; kisi onu SAHIPLENIR ve
  # onay adimi YOKTUR — onay, hesabi acan yoneticinin kendisidir.
  #
  # (P155r2) Bunun KARSITI olan P148 akisi (`/auth/kayit/basla` +
  # `/auth/kayit/dogrula`: hesabi OLMAYAN birinin daire uzerinden basvurup
  # yonetici onayina dusmesi) KALDIRILDI. Yeni kural "yalniz onceden
  # eklenmis telefonla eslesen kaydolur" oldugu icin o akisin karsiligi
  # kalmadi; `/kayit-basvurulari` onay kuyrugu da onunla birlikte gitti.
  /auth/kayit/rol-basla:
    post:
      tags: [auth]
      summary: Rol + tesis ID + telefon -> eslesirse SMS kodu gonderir
      security: []   # kimlik ONCESI
      description: |
        ESLESME SONUCU YANITTAN OKUNAMAZ. Numara o tesiste o rolde kayitli
        olsa da olmasa da yanit AYNIDIR; SMS yalnizca eslesmede gider.
        Aksi hâlde uc "hangi numara bu tesiste hangi rolde" sorusunu
        yanitlayan bir TARAMA ARACI olurdu.

        Tesis kodu hatasi ise SOYLENIR (422): kod zaten kamuya aciktir
        (bkz. goc 0037 guvenlik notu) ve en sik yazim hatasi orada olur.

        Kaydolamayan durumlar (hepsi sessiz): numara tesiste yok · rol
        uyusmuyor · hesap pasif · **hesabin parolasi ZATEN belirlenmis**
        (kayit, parola belirlenmemis hesabi sahiplenmektir; parolasini
        unutanin yolu `/auth/giris/kod-iste`) · `resident` icin beyan
        edilen daire kisinin dairesi degil.

        HIZ SINIRI: telefon basina 15 dakikada 3 istek; asilirsa 429.
        Sayac DOGRULAMADAN ONCE artar, yoksa eslesmeyen numara icin
        sinirsiz deneme kalirdi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolKayitBaslaRequest" }
      responses:
        "200":
          description: Tesis dogrulandi (eslesme sonucu SOYLENMEZ)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolKayitBaslaResponse" }
        "422":
          description: Tesis kodu gecersiz ya da govde kurali ihlal edildi
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "429":
          description: Cok fazla kod istegi (hiz siniri)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /auth/kayit/rol-dogrula:
    post:
      tags: [auth]
      summary: Kod dogru ise PAROLA BELIRLEME jetonu doner (oturum DEGIL)
      security: []
      description: |
        Donen `setup_token` YALNIZ `/auth/set-password`te gecer ve TEK
        KULLANIMLIKTIR. Kayit, parola belirlenene kadar tamamlanmis
        sayilmaz.

        P148 basvurusu bu uctan TAMAMLANAMAZ (dogru kodla bile): orada
        hesap henuz yoktur ve akis yonetici onayindan gecer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolKayitDogrulaRequest" }
      responses:
        "200":
          description: Parola belirleme jetonu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolKayitDogrulaResponse" }
        "422":
          description: Kod gecersiz (adimlari ayirt ETTIRMEZ)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  # ----------------------------------------------------------------- #
  # (P149) PAROLASIZ GIRIS — tek kod mekanizmasi.
  /auth/giris/eposta-kod-iste:
    post:
      tags: [auth]
      summary: E-POSTAYA giris kodu gonderir
      security: []
      description: |
        **(P172 §5)** Telefon yoluyla AYNI mekanizma: sure, deneme siniri
        ve hiz siniri `telefon_kodu` modulunden gelir — ikinci bir sistem
        YOKTUR. Degisen tek sey kimlik ve teslimat kanali.

        **TESIS KODU ZORUNLU** ve bu telefon yolundan FARKLI: telefon
        platform genelinde benzersizdir (tesis ondan cozulur), e-posta ise
        TENANT ICINDE benzersizdir. Tesis kodu olmadan ayni adresi
        kullanan iki tesis birbirine karisirdi.

        **ADRES VARLIGINI SIZDIRMAZ**: kayitli olmayan adres (ve
        bilinmeyen tesis kodu) icin de AYNI yanit doner.

        Hiz siniri anahtari `tesis:eposta` — yalniz e-posta kullanmak,
        ayni adresi tasiyan iki tesisin sayacini birlestirirdi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EpostaKodIstek" }
      responses:
        "200": { description: her durumda ayni yanit }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/giris/eposta-kod-dogrula:
    post:
      tags: [auth]
      summary: E-posta kodu ile PAROLASIZ oturum acar
      security: []
      description: |
        **(P172 §5)** Kod dogruysa oturum acilir ve kod TUKETILIR (tekrar
        kullanilamaz). Sure dolmus, deneme siniri asilmis ya da kod yanlis
        ise ayrim yapmayan tek hata doner (`invalid_code`) — adimlari
        ayirt ettirmek, kayitli adreslerin sizmasi demekti.

        Gorev suresi disindaki denetci token ALMAZ; parolali ve telefonlu
        yollarla AYNI kural.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EpostaKodDogrulaIstek" }
      responses:
        "200": { description: token cifti }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/sifre/kod-iste:
    post:
      tags: [auth]
      summary: "Şifremi unuttum — E-POSTAYA sıfırlama kodu gönderir"
      security: []
      description: |
        **(P181 Bölüm 2)** E-POSTA TABANLI, SMS YOK. `giris/eposta-kod-iste`
        ile AYNI mekanizma (süre/deneme/hız sınırı `telefon_kodu`dan).

        **ADRES/HESAP VARLIGINI SIZDIRMAZ**: kayıtlı olmayan, pasif ya da
        e-postası DOĞRULANMAMIŞ hesap için de AYNI yanıt döner. Kod yalnız
        `eposta_dogrulandi=true` aktif kullanıcıya gider (Bölüm 1 ön koşulu).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SifreKodIstek" }
      responses:
        "200": { description: her durumda ayni yanit }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/sifre/dogrula-ve-ayarla:
    post:
      tags: [auth]
      summary: "Kod doğruysa yeni parolayı kurar"
      security: []
      description: |
        **(P181 Bölüm 2)** Kod doğruysa yeni parola yazılır ve kod TÜKETİLİR.
        OTURUM AÇMAZ — kullanıcı yeni parolasıyla taze giriş yapar. Süresi
        dolmuş/yanlış kod ayrım yapmayan tek hata döner (`invalid_code`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SifreSifirlaIstek" }
      responses:
        "200": { description: her durumda ayni yanit }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/giris/kod-iste:
    post:
      tags: [auth]
      summary: Kayitli ve AKTIF numaraya giris kodu gonderir
      security: []
      description: |
        NUMARA VARLIGINI SIZDIRMAZ: numara kayitli olmasa da yanit
        AYNIDIR (`durum: onay_bekliyor`). Aksi hâlde bu uc, hangi
        numaralarin sistemde oldugunu sorgulayan bir arac olurdu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelefonIstek" }
      responses:
        "200":
          description: Islem alindi (numara kayitli OLMASA DA ayni yanit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KayitDurumResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/giris/kod-dogrula:
    post:
      tags: [auth]
      summary: Kod dogru ise OTURUM ACAR — parola aranmaz
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelefonKodIstek" }
      responses:
        "200":
          description: Token cifti
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "422":
          description: |
            Kod gecersiz. "kod yanlis" ile "boyle kullanici yok" AYNI
            yaniti verir — fark, kayitli numaralarin sizmasi demekti.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  # ----------------------------------------------------------------- #
  # (P154 / Asama 4) SOSYAL GIRIS — Google / Microsoft / Apple.
  #
  # MERKEZ KURAL: sosyal hesap kimlik dogrulama YONTEMIDIR, eslesme
  # anahtari DEGIL. Hicbir uc kullanici YARATMAZ; kimlik her zaman tesis
  # ID + telefon ile bulunan MEVCUT bir hesaba baglanir ve ilk baglama
  # SMS ile dogrulanir.
  #
  # YOL SEKLI `/baslat/{saglayici}` — degisken segment SONDA. Basta
  # olsaydi `/baglan/basla` istegi o kaliba duser ve BASKA bir semayla
  # dogrulanip 422 verirdi (olculdu).
  # ----------------------------------------------------------------- #
  /auth/oauth/saglayicilar:
    get:
      tags: [auth]
      summary: Yapilandirilmis saglayicilar — arayuz dugmeleri buradan
      security: []
      responses:
        "200":
          description: Acik saglayicilarin kodlari
          content:
            application/json:
              schema:
                type: object
                required: [saglayicilar]
                properties:
                  saglayicilar:
                    type: array
                    items: { type: string, enum: [google, microsoft, apple] }

  /auth/oauth/baslat/{saglayici}:
    post:
      tags: [auth]
      summary: Saglayiciya gidilecek adresi uretir (PKCE + state)
      security: []
      parameters:
        - name: saglayici
          in: path
          required: true
          schema: { type: string, enum: [google, microsoft, apple] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                yuzey:
                  type: string
                  enum: [web, mobil]
                  default: web
                  description: |
                    Callback SONRASI nereye donulecegini belirler; adresin
                    KENDISI ayarlardan gelir (istekten alinmaz — acik
                    yonlendirme acigi olurdu).
      responses:
        "200":
          description: Yetkilendirme adresi
          content:
            application/json:
              schema:
                type: object
                required: [adres, state]
                properties:
                  adres: { type: string }
                  state: { type: string }
        "404":
          description: Bilinmeyen saglayici
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "503":
          description: Saglayici yapilandirilmamis
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /auth/oauth/callback/{saglayici}:
    get:
      tags: [auth]
      summary: Google/Microsoft geri donusu
      security: []
      parameters:
        - name: saglayici
          in: path
          required: true
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        "303":
          description: |
            Yuzeyin donus adresine `?oauth=<sonuc_id>` ile yonlendirir.
            JETON URL'DE TASINMAZ — sonuc_id tek kullanimliktir ve
            `POST /auth/oauth/sonuc` ile jetona cevrilir.
    post:
      tags: [auth]
      summary: Apple geri donusu (form_post)
      description: |
        Apple `name`/`email` kapsamlarinda sonucu GET sorgu dizesiyle
        degil POST govdesiyle gonderir; ayni uc iki metotla acilmazsa
        Apple girisi callback'te 405 alirdi.
      security: []
      parameters:
        - name: saglayici
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        "303":
          description: Yuzeyin donus adresine yonlendirir

  /auth/oauth/sonuc:
    post:
      tags: [auth]
      summary: Tek kullanimlik sonucu jetona ya da baglama istegine cevirir
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sonuc_id]
              properties:
                sonuc_id: { type: string }
      responses:
        "200":
          description: |
            `durum=giris` ise `jetonlar` dolu; `durum=baglama_gerekli` ise
            `baglama_jetonu` ile tesis kodu + telefon adimina gecilir.
          content:
            application/json:
              schema:
                type: object
                required: [durum]
                properties:
                  durum: { type: string, enum: [giris, baglama_gerekli] }
                  jetonlar: { $ref: "#/components/schemas/TokenPair" }
                  saglayici: { type: string, nullable: true }
                  eposta:
                    type: string
                    nullable: true
                    description: YALNIZ GORUNTULEME — eslesmede kullanilmaz.
                  relay:
                    type: boolean
                    description: |
                      Apple "e-postami gizle" dediyse true. Arayuz bunu
                      soyler cunku o adrese posta gonderilemez.
                  ad:
                    type: string
                    nullable: true
                    description: |
                      (P155r2 §2) Saglayicinin bildirdigi ad soyad — kayit
                      formunu ON-DOLDURMAK icin; kullanici duzeltebilir.
                      Eslesmede KULLANILMAZ. Apple bunu `id_token`da
                      vermez (yalniz ilk yetkilendirmenin govdesinde);
                      bos gelir ve akis kirilmaz. TELEFON HICBIR
                      SAGLAYICIDAN GELMEZ — kullanici doldurur.
                  baglama_jetonu: { type: string, nullable: true }
        "400":
          description: Sonuc bulunamadi ya da suresi doldu
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /auth/oauth/baglan/basla:
    post:
      tags: [auth]
      summary: Tesis kodu + telefon eslesirse SMS kodu gonderir
      description: |
        ESLESME SONUCU YANITTAN OKUNAMAZ: eslesen ve eslesmeyen numara
        AYNI yaniti alir. Aksi hâlde uc "bu numara bu sitede kayitli mi"
        sorgusuna donusurdu.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baglama_jetonu, tesis_kodu, telefon]
              properties:
                baglama_jetonu: { type: string }
                tesis_kodu: { type: string }
                telefon: { type: string }
      responses:
        "200":
          description: Tesis dogrulandi; eslesme sonucu SOYLENMEZ
          content:
            application/json:
              schema:
                type: object
                required: [tesis_ad, telefon_maskeli]
                properties:
                  tesis_ad: { type: string }
                  telefon_maskeli: { type: string }
        "400":
          description: Baglama jetonu ya da tesis kodu gecersiz
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "429":
          description: Telefon basina kod isteme siniri asildi
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /auth/oauth/baglan/dogrula:
    post:
      tags: [auth]
      summary: SMS kodu dogruysa kimligi baglar VE oturum acar
      description: |
        ILK BAGLAMADA SMS ZORUNLU: saglayici "bu Google hesabinin
        sahibisin" der, "bu telefonun sahibisin" DEMEZ. Yeni bir kapi
        acmaz — SMS bu urunde zaten tek basina oturum aciyor
        (`/auth/giris/kod-dogrula`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baglama_jetonu, telefon, kod]
              properties:
                baglama_jetonu: { type: string }
                telefon: { type: string }
                kod: { type: string }
      responses:
        "200":
          description: Token cifti
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "409":
          description: Bu sosyal hesap BASKA bir kullaniciya bagli
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422":
          description: Kod gecersiz
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /auth/oauth/rol-tamamla:
    post:
      tags: [auth]
      summary: (P184) SSO kimligini bir ROL hesabina baglar — SMS'siz
      description: |
        `baglan/*`nin E-POSTA esi. SSO kimligini sakin/guvenlik/tesis
        gorevlisi hesabina baglar. UC SART (P177): (a) Tesis ID gecerli,
        (b) e-posta yoneticinin listesinde, (c) saglayici
        `email_verified=true` ise OTP ATLANIR (`durum='giris'`); degilse
        e-posta OTP gonderilir (`durum='otp_gerekli'`, `-dogrula` ile devam).
        Apple `privaterelay` dogrulanmis sayilir.

        SIZDIRMAMA: GECERSIZ Tesis ID ile LISTE DISI e-posta AYNI yaniti
        (`onay_bekliyor`) alir; hangi sartin tutmadigi disari SIZMAZ.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baglama_jetonu, tesis_kodu]
              properties:
                baglama_jetonu: { type: string }
                tesis_kodu: { type: string }
                # (P191 §1) OPSIYONEL. Verilirse rol BEYANIDIR (kayit akisi).
                # Verilmezse GIRISTE TAMAMLAMA modudur: rol hesaptan okunur ve
                # `password_set=true` hesap da baglanabilir (mevcut hesaba SSO
                # yontemi eklemek, kayit degil).
                rol: { type: string, nullable: true }
      responses:
        "200":
          description: durum=giris|otp_gerekli|onay_bekliyor
          content:
            application/json:
              schema:
                type: object
                required: [durum]
                properties:
                  durum: { type: string, description: "giris|otp_gerekli|onay_bekliyor" }
                  tesis_ad: { type: string, nullable: true }
                  jetonlar: { $ref: "#/components/schemas/TokenPair" }
        "400":
          description: Baglama jetonu gecersiz/suresi dolmus
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "409":
          description: Bu sosyal hesap BASKA bir kullaniciya bagli
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422":
          description: Rol gecersiz
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "503":
          description: Yeni kayit akisi kapali
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /auth/oauth/rol-tamamla-dogrula:
    post:
      tags: [auth]
      summary: (P184) email_verified=false yolu — e-posta OTP + baglama
      description: |
        `rol-tamamla` `otp_gerekli` dondugunde 2. adim: e-posta OTP dogrulanir,
        sonra kimlik baglanir VE oturum acilir. (a),(b) sartlari YENIDEN aranir.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baglama_jetonu, tesis_kodu, kod]
              properties:
                baglama_jetonu: { type: string }
                tesis_kodu: { type: string }
                # (P191 §1) `rol-tamamla` ile ayni kural: opsiyonel.
                rol: { type: string, nullable: true }
                kod: { type: string }
      responses:
        "200":
          description: durum=giris|onay_bekliyor
          content:
            application/json:
              schema:
                type: object
                required: [durum]
                properties:
                  durum: { type: string, description: "giris|otp_gerekli|onay_bekliyor" }
                  tesis_ad: { type: string, nullable: true }
                  jetonlar: { $ref: "#/components/schemas/TokenPair" }
        "400":
          description: Baglama jetonu gecersiz/suresi dolmus
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "409":
          description: Bu sosyal hesap BASKA bir kullaniciya bagli
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422":
          description: Kod ya da rol gecersiz
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "503":
          description: Yeni kayit akisi kapali
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /auth/oauth/baglantilarim:
    get:
      tags: [auth]
      summary: Kendi bagli giris yontemlerim
      responses:
        "200":
          description: Baglantilar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OauthBaglantiListesi" }
    post:
      tags: [auth]
      summary: Oturum acikken yeni bir giris yontemi ekler
      description: |
        SMS ARANMAZ ve bu bilincli: cagiran zaten gecerli bir oturum
        tasiyor, yani kimligini KANITLAMIS durumda. Ayni tarayici akisi
        kullanilir (`/baslat` -> callback -> `sonuc_id`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sonuc_id]
              properties:
                sonuc_id: { type: string }
      responses:
        "200":
          description: Guncel baglanti listesi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OauthBaglantiListesi" }
        "409":
          description: Bu sosyal hesap BASKA bir kullaniciya bagli
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /auth/oauth/baglantilarim/{saglayici}:
    delete:
      tags: [auth]
      summary: Giris yontemini kaldirir
      description: |
        SON GIRIS YOLUNU kaldirmaya IZIN VERMEZ — kullanicinin elinde
        parola, baska bir sosyal kimlik ya da telefon (SMS ile giris)
        kalmali; yoksa kendi hesabina bir daha giremez.
      parameters:
        - name: saglayici
          in: path
          required: true
          schema: { type: string, enum: [google, microsoft, apple] }
      responses:
        "204": { description: Kaldirildi }
        "404":
          description: Bu saglayici hesaba bagli degil
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "409":
          description: Tek giris yontemi kaldirilamaz
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  # ================================================================= #
  # SELF-SERVIS PROFIL (/me/*) — tum roller, yalniz kendi kaydi
  # ================================================================= #
  /me/profile:
    get:
      tags: [me]
      summary: Kendi profilim (kimlik + iletisim)
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeProfileOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/password:
    patch:
      tags: [me]
      summary: Kendi parolami degistir (mevcut parola zorunlu)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeRequest" }
      responses:
        "204": { description: Parola guncellendi }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # (P149) PAROLASIZ kullanici icin silme onay kodu. Parolali kullanici
  # bu ucu KULLANMAZ — silme dogrudan parolayla onaylanir.
  /me/eposta/kod-iste:
    post:
      tags: [me]
      summary: (P181) Mevcut kullanicinin e-postasini ekleme/dogrulama kodu gonderir
      description: |
        E-postasiz ya da dogrulanmamis kullanici bir adres verir, koda gider.
        Kilitleme yok; oturum surer. Hiz siniri e-posta basina. Adres baska bir
        kullanicida kayitliysa 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eposta]
              properties:
                eposta: { type: string }
      responses:
        "200":
          description: Kod gonderildi
          content:
            application/json:
              schema:
                type: object
                required: [durum]
                properties:
                  durum: { type: string, enum: [gonderildi] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: E-posta baska bir kullanicida kayitli
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422":
          description: Gecersiz e-posta
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /me/eposta/dogrula:
    post:
      tags: [me]
      summary: (P181) E-posta kodunu dogrular; eposta_dogrulandi=true yapar
      description: |
        Kod dogruysa e-posta yazilir ve dogrulanmis isaretlenir; bundan sonra
        parola sifirlama ve OTP giris calisir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eposta, kod]
              properties:
                eposta: { type: string }
                kod: { type: string }
      responses:
        "200":
          description: Dogrulandi (guncel kullanici)
          content:
            application/json: { schema: { type: object } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: Kod gecersiz / suresi dolmus
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /me/hesap-sil/kod-iste:
    post:
      tags: [me]
      summary: Parolasiz kullanici icin hesap silme onay kodu gonderir
      description: |
        Hesabinda kayitli telefon yoksa 422 `no_phone` — kod gonderilecek
        bir kanal olmadigi icin silme akisi baslatilamaz.
      responses:
        "200":
          description: Kod gonderildi
          content:
            application/json:
              schema:
                type: object
                required: [durum]
                properties:
                  durum: { type: string, enum: [gonderildi] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: Hesapta kayitli telefon numarasi yok
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /me/hesap-sil/eposta-kod-iste:
    post:
      tags: [me]
      summary: (P184) Parolasiz kullanici icin hesap silme onay kodu — E-POSTAYA
      description: |
        `/me/hesap-sil/kod-iste`nin E-POSTA esi (SMS kapali oldugundan bugun
        calisan yol). Dogrulanmis e-posta yoksa 422 `no_email`. Kod
        `amac='hesap_silme'` ile uretilir; giris/parola kodu buraya YARAMAZ.
      responses:
        "200":
          description: Kod gonderildi
          content:
            application/json:
              schema:
                type: object
                required: [durum]
                properties:
                  durum: { type: string, enum: [gonderildi] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: Hesapta dogrulanmis e-posta yok
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /me/hesap-sil:
    post:
      tags: [me]
      summary: Hesabimi SIL (self-servis — App Store 5.1.1(v))
      description: |
        (P112) Kullanici KENDI hesabini uygulama icinden siler. Apple'in
        kurali: hesap acilabiliyorsa uygulama icinden silinebilmeli —
        destege yazdirmak ya da web sitesine yonlendirmek REDDEDILME
        sebebidir.

        **YENIDEN KIMLIK DOGRULAMA ZORUNLU** (`current_password`): access
        token'i olan biri (odunc alinmis telefon) tek dokunusla baskasinin
        hesabini silememeli. Hatali parola -> 400 `invalid_credentials`.

        **SON YONETICI ENGELI** -> 409 `conflict`: tesisin tek
        admin/yoneticisi kendini silerse tesis SAHIPSIZ kalir. Hata metni
        ne yapilacagini soyler (once devret). Apple kuralina aykiri
        degildir: kural "hesap silinebilmeli" der, "tesisi kullanilamaz
        birak" demez.

        **NE SILINIR:** ad -> yer tutucu; e-posta, telefon, avatar -> NULL;
        parola/gecici kod hash'leri -> NULL; cihaz+push kayitlari SILINIR;
        aktif daire baglantilari kapatilir; `is_active=false`.

        **NE KALIR (yasal saklama):** finans satirlari (tahakkuk, odeme,
        kasa hareketi) ve denetim kaydi. TTK/vergi mevzuati defterlerin
        saklanmasini emreder; KVKK md. 7 silme hakki baska bir kanunun
        ongordugu saklama yukumlulugunu kaldirmaz. Bu satirlar artik
        ANONIM bir kullaniciya isaret eder.

        `deleted=false` donmesi silme YAPILMADI demek DEGILDIR: hesabin
        gecmisi oldugu icin satir anonimlestirilerek korundu demektir.
        Istemci iki durumda da OTURUMU KAPATIR.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HesapSilmeIstek" }
      responses:
        "200":
          description: Hesap silindi ya da anonimlestirildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HesapSilmeSonuc" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Son yonetici — once devredilmeli
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /me/contact:
    patch:
      tags: [me]
      summary: Kendi telefon + arama rizami guncelle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeContactUpdate" }
      responses:
        "200":
          description: Guncellenmis profil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeProfileOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # (P167 §1.7) "GUVENLIK VE GIRIS" + "BILDIRIM AYARLARI"
  #
  # Bu dort uc, var olan uclarin KISITLI KOPYASI DEGIL — AYRI yetki
  # kararlaridir. `GET /devices` tenant'in TUM cihazlarini yalniz admin'e,
  # `GET /audit` tesisin TUM denetim kaydini admin+denetci'ye acar.
  # Asagidakiler HER ROLE aciktir ve YALNIZ kisinin KENDI satirlarini
  # doner: kendi hesabinda hangi cihazin acik oldugunu gormek bir yonetim
  # yetkisi degil, hesap guvenliginin temel kosuludur.
  # ================================================================= #
  /me/cihazlar:
    get:
      tags: [me]
      summary: Kendi kayitli cihazlarim (en son gorunen ustte)
      description: |
        Kullanicinin KENDI push cihazlari. `fcm_token` DONMEZ — push adresidir
        ve disari verilmesi o kullaniciya bildirim gondermenin anahtarini
        vermek olurdu; satirlar `id` ile yonetilir.

        PASIF cihazlar da doner (`aktif=false`): "kaldirdim mi gercekten"
        sorusunun cevabi listede gorunmeli.
      responses:
        "200":
          description: Cihaz listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CihazOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/cihazlar/tumunden-cik:
    post:
      tags: [me]
      summary: Tum cihazlarimi kaldir ("telefonumu kaybettim")
      description: |
        Aktif cihazlarin hepsini pasiflestirir. OTURUMLARI SONLANDIRMAZ —
        refresh token'lar bu tabloda degildir ve sonlandirilmis gibi
        gostermek kullaniciyi guvende SANDIGI ama olmadigi bir yerde
        birakirdi.
      responses:
        "200":
          description: Kaldirilan cihaz sayisi
          content:
            application/json:
              schema:
                type: object
                required: [kaldirilan]
                properties:
                  kaldirilan: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/cihazlar/{cihaz_id}:
    delete:
      tags: [me]
      summary: Bir cihazimi kaldir (satir silinmez, pasiflesir)
      description: |
        Satir SILINMEZ, `aktif=false` olur: `uq_user_device_tenant_token`
        ayni token'in tekrar kaydini upsert'e cevirdigi icin silme, ayni
        telefonun her girisinde cihaz gecmisini sifirlardi. Push gonderimi
        `aktif` bayragina baktigi icin kaldirma ANINDA etkilidir.

        BASKASININ CIHAZI: sorgu `user_id` ile kapali → 404.
      parameters:
        - name: cihaz_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Kaldirildi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/etkinlik:
    get:
      tags: [me]
      summary: Kendi hesap etkinligim (denetim kaydindan, en yeni ustte)
      description: |
        YALNIZ `actor_user_id = kendisi` olan denetim satirlari. `/audit`
        ucunun kisitlanmisi degil, ayri bir yetki karari (bkz. bolum notu).
        Suzgec SORGUNUN ICINDE — tum listeyi gonderip istemcide suzmek,
        satirlarin tarayiciya ulasmasi demekti.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Etkinlik listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HesapEtkinligiOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/bildirim-tercihleri:
    get:
      tags: [me]
      summary: Kendi bildirim kanali tercihlerim (e-posta / SMS / mobil)
      responses:
        "200":
          description: Tercihler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BildirimTercihleri" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      summary: Bildirim kanali tercihlerini guncelle (KISMI)
      description: |
        Gonderilmeyen kanal DEGISMEZ — iki sekme acik olan kullanicida tam
        govde, otekinin degisikligini SESSIZCE geri alirdi.

        `/me/pazarlama-tercihleri` ile KARISTIRILMAMALI: orasi bir KVKK
        RIZASI (varsayilani KAPALI olmak zorunda, ispat yukumlulugu var),
        burasi bir kullanim TERCIHI (varsayilani ACIK — "aidat borcunuz
        olustu" bildirimi sozlesme iliskisinin isleyisidir, riza
        gerektirmez). Tek uca toplamak, pazarlamayi kapatan kisinin aidat
        bildirimini de kaybetmesi olurdu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BildirimTercihUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BildirimTercihleri" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # SHIFTS
  # ================================================================= #
  /shifts:
    get:
      tags: [shifts]
      summary: Vardiya listesi
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: gun_tipi
          in: query
          schema: { $ref: "#/components/schemas/GunTipi" }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Shift" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [shifts]
      summary: Vardiya olustur
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShiftCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shift" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /shifts/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [shifts]
      summary: Vardiya detay
      responses:
        "200":
          description: Detay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shift" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [shifts]
      summary: Vardiya guncelle (kismi)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShiftUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shift" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [shifts]
      summary: Vardiya sil
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ================================================================= #
  # CHECKPOINTS
  # ================================================================= #
  /checkpoints:
    get:
      tags: [checkpoints]
      summary: Checkpoint listesi
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: aktif
          in: query
          schema: { type: boolean }
        - name: nfc_tag_uid
          in: query
          description: NFC etiket UID ile esleme/arama
          schema: { type: string }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Checkpoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [checkpoints]
      summary: Checkpoint olustur (nfc_tag_uid eslemesi dahil)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckpointCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkpoint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: nfc_tag_uid bu tenant'ta zaten kayitli
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /checkpoints/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [checkpoints]
      summary: Checkpoint detay
      responses:
        "200":
          description: Detay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkpoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [checkpoints]
      summary: Checkpoint guncelle (kismi)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckpointUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkpoint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [checkpoints]
      summary: Checkpoint sil
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /checkpoints/{id}/sdm-key:
    parameters:
      - $ref: "#/components/parameters/PathId"
    put:
      tags: [checkpoints]
      summary: NTAG424 SDM anahtarini kaydet/kapat (yalniz admin)
      description: |
        Checkpoint'e yapisik NTAG424 DNA etiketinin SDM (SDMFileRead) AES-128
        anahtarini kaydeder: `{ "key": "<32 hex>" }`. Anahtar sunucuda `SDM_KEK`
        (env) ile AES-GCM SIFRELI saklanir ve HICBIR response'ta geri donmez;
        yalniz `Checkpoint.sdm_aktif` gorunur. Kayit sirasinda replay sayaci
        (`sdm_son_sayac`) 0'lanir — yeni anahtar = yeni/yeniden provision edilmis
        etiket varsayimi. `{ "key": null }` SDM'i kapatir.

        `SDM_KEK` yapilandirilmamissa (bos/32 karakterden kisa) **500
        `config_error`** — anahtar yazma reddedilir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  nullable: true
                  description: "AES-128 anahtar, 32 hex karakter; null = SDM kapat"
                  example: "00112233445566778899AABBCCDDEEFF"
      responses:
        "200":
          description: Kaydedildi/kapatildi (anahtar donmez; sdm_aktif gorunur)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkpoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500":
          description: SDM_KEK yapilandirilmamis (config_error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

