        PUBLIC portal yaniti. Icerigin tamami BILINCLI secilmistir: sakin
        listesi, daire sayisi, finans ve personel BURADA YOKTUR.
      required: [slug, tesis_adi]
      properties:
        slug: { type: string }
        tesis_adi: { type: string }
