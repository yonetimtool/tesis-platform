                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Unit" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [aidat]
      summary: Daire olustur (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Daire no bu tesiste zaten kayitli
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /units/bulk:
    post:
      tags: [aidat]
      summary: Toplu daire olustur (admin + yonetici)
      description: |
        Bir blok icin kat_sayisi × kat_basi_daire adet daire, baslangic_no'dan
        ARDISIK numaralandirilir (kat kat dolar). Daire no = blok varsa
        '{blok}-{n}', yoksa '{n}'. Zaten var olan no'lar ATLANIR (kalan olusur).
        Katlar 1..kat_sayisi, sira 1..kat_basi_daire. En fazla 500 daire/istek.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitBulkCreate" }
      responses:
        "201":
          description: Olusturuldu (+ atlananlar + bitis_no)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitBulkResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Es zamanli ekleme cakismasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /units/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [aidat]
      summary: Daire detay
      responses:
        "200":
          description: Detay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [aidat]
      summary: Daire guncelle (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [aidat]
      summary: Daire sil (admin)
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /units/{id}/layout:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [aidat]
      summary: Daire yerlesimini guncelle (admin+yonetici)
      description: |
        Daire fiziksel yerlesimini (blok/kat/sira) girer/gunceller — bina
        semasi verisi. RBAC: admin + yonetici (digerleri 403). Yerlesim
        anonimligi etkilemez (sikayetci verisi tasimaz). Yonetici mobilden
        yonetebilsin diye genel daire CRUD (admin-only) disinda ayri uctur.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitLayoutUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /units/by-no/{unit_no}/residents:
    parameters:
      - name: unit_no
        in: path
        required: true
        description: Daire numarasi (orn. A-12) — guvenlik daire NO'sunu bilir
        schema: { type: string, minLength: 1, maxLength: 50 }
    get:
      tags: [visitors]
      summary: Dairenin AKTIF sakinleri (hedef sakin secicisi)
      description: |
        Ziyaretci kaydinda guvenligin HEDEF sakini secmesi icin dairenin AKTIF
        sakinlerini (user_id + ad) doner. RBAC: security + admin + yonetici;
        resident 403 (komsularini listeleyemez). unit_no tenant icinde
        cozulur; bulunamazsa 404. RLS ile tenant izole.
      responses:
        "200":
          description: Aktif sakin listesi (ad'a gore sirali)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UnitResidentBrief" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /units/{id}/residents:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [aidat]
      summary: Dairenin sakinleri (admin + yonetici)
      description: |
        RBAC **P23a'da genisletildi**: `admin` + `yonetici`. Gerekce — sakin
        CRUD'u (`/residents`) zaten admin+yonetici; "kim nerede oturuyor"
        ayni sinif veridir ve bagi admin-only birakmak, mobilde sakin yoneten
        yoneticinin VAR OLAN bir sakine daire ATAYAMAMASI demekti. Genel
        daire CRUD'u admin-only KALIR; acilan yalniz BAG uclaridir.
      responses:
        "200":
          description: Sakin listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UnitResident" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [aidat]
      summary: Daireye sakin ata (admin + yonetici)
      description: |
        VAR OLAN bir sakini bir daireye baglar (P23a) — sakin olusturmadan
        SONRA da daire atanabilir ve bir sakin BIRDEN COK daireye baglanabilir.
        `rol_tipi` (malik | kiraci) bag uzerinde durur; ayni dairede hem malik
        hem kiraci olabilir (ayri kayitlar).

        (P154 / goc 0049) BIR DAIREDE HER ROLDEN EN FAZLA BIR AKTIF HESAP.
        Kilitli kural 4 rol basina uygulanir: malik + kiraci birlikte YASAL,
        ikinci bir malik (ya da ikinci bir kiraci) **409**. Kural hem uc
        katmaninda (`units.daire_rolu_dolu_mu`) hem veritabaninda
        (`uq_unitresident_daire_rol`) zorlanir.

        `rol_tipi` VERILMEZSE (NULL) o da BIR DEGER sayilir: rolsuz ikinci
        sakin de 409 alir. Bu kontrol YALNIZ uc katmanindadir — PostgreSQL
        benzersiz indekste NULL'lari catistirmaz (gerekce goc 0049'da).

        "Aktif" `bitis IS NULL` demektir: bag kapatilinca o rol yeniden
        atanabilir, yani daire el degistirebilir.

        Hedef kullanici `resident` DEGILSE 422; ayni (daire, kullanici) bagi
        zaten varsa 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResidentAssign" }
      responses:
        "201":
          description: Atandi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitResident" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /units/{id}/residents/{user_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [aidat]
      summary: Sakini daireden cikar (bitis=now) (admin + yonetici)
      responses:
        "204": { description: Cikarildi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /units/{id}/dues:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [aidat]
      summary: Dairenin borc durumu (tahakkuk - odeme = bakiye)
      responses:
        "200":
          description: Borc durumu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitDuesStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /dues/assessments/{assessment_id}/ters-kayit:
    post:
      tags: [aidat]
      summary: "(P192 §6.3) Yanlis tahakkuku TERS KAYITLA duzelt"
      description: |
        Yanlis tahakkuk edilirse ne olacagi BELIRSIZDI: silme ucu yok (ve
        olmamali) ama duzeltme yolu da yoktu.

        Cozum defterdekinin AYNISI: satir SILINMEZ, ters kayit yazilir.
        Ikisi de borc hesabinin disinda kalir (`iptal_edildi` bayragi),
        toplamlari sifirdir ve duzeltmenin izi denetimde durur.

        ODENMIS BORC TERS KAYITLANAMAZ (409): alinmis parayi karsiliksiz
        birakmak daireyi ALACAKLI gosterirdi. Once tahsilat iade/iptal
        edilir.
      parameters:
        - name: assessment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TahakkukTersKayitIstek" }
      responses:
        "201":
          description: Ters kayit satiri
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuesAssessment" }
        "409": { $ref: "#/components/responses/Conflict" }
  /dues/assessments:
    get:
      tags: [aidat]
      summary: Tahakkuk listesi
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: unit_id
          in: query
          schema: { type: string, format: uuid }
        - name: donem
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/DuesAssessment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [aidat]
      summary: Tahakkuk olustur (tek daire veya toplu donem) (admin + yonetici)
      description: |
        `unit_id` verilirse TEK daire (ayni daire+donem ikinci kez → 409). `unit_id`
        yoksa TOPLU: `unit_ids` (verilmezse tum aktif daireler); mevcut donemler atlanir.

        (P167) YONETICIYE ACILDI: aidat yazmak site yoneticisinin asil isidir.
        `POST /dues/payments` ACILMADI ve admin'de kaldi — tahakkuk bir BORC
        yazmaktir, tahsilat ise PARA ALINDI beyanidir.

        TENANT IZOLASYONU: yonetici yalniz KENDI tesisinin dairelerine yazabilir.
        Oturum RLS ile token'daki tenant'a bagli; baska tesisin dairesi tekil
        modda 422 `invalid_reference`, liste modunda 422
        `daire_listesi_bulunamadi` doner. `tenant_id` istekten DEGIL oturumdan
        gelir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DuesAssessmentCreate" }
      responses:
        "201":
          description: "Olusturuldu (toplu modda created + atlanan)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuesAssessmentResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Tek daire modunda ayni donem zaten var
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /dues/payments:
    get:
      tags: [aidat]
      summary: Odeme listesi
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: unit_id
          in: query
          schema: { type: string, format: uuid }
        - name: donem
          in: query
          description: "'YYYY-MM' — donem bazli rapor filtresi (payment.donem uzerinden)"
          schema: { type: string }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/DuesPayment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [aidat]
      summary: Manuel odeme kaydi (admin)
      description: |
        Gercek tahsilat YOK (soyut). Idempotency-Key ZORUNLU (cift kayit korumasi).
        kaydeden token'dan. Bakiye = toplam tahakkuk - basarili odemeler.

        DONEM ATFI (panel raporu): `donem` ('YYYY-MM') acikca verilebilir;
        verilmezse `assessment_id` varsa ONUN doneminden turer; ikisi de yoksa
        NULL kalir (serbest odeme). Rapor `GET /dues/payments?donem=` ile
        serbest odemeleri de doneme atfedebilir.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DuesPaymentCreate" }
      responses:
        "201":
          description: Odeme kaydedildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuesPayment" }
        "200":
          description: Idempotent tekrar — mevcut kayit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuesPayment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ayni Idempotency-Key farkli govde ile gonderildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /me/dues:
    get:
      tags: [aidat]
      summary: Sakinin kendi dairelerinin borc durumu (resident)
      responses:
        "200":
          description: Borc durumu listesi
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UnitDuesStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ================================================================= #
  # BUTCE (Wave 2A — yonetim tarafi; sakin seffafligi Wave 2B)
  # Para HER YERDE integer KURUS (float asla).
  # ================================================================= #
  /budget/categories:
    get:
      tags: [budget]
      summary: Butce kategorileri (yonetim)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: tip
          in: query
          schema: { $ref: "#/components/schemas/BudgetTip" }
        - name: aktif
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Liste (ad ASC)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/BudgetCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [budget]
      summary: Kategori olustur (dinamik; yonetici/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetCategoryCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Ayni tip icinde ayni ad zaten var
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /budget/categories/{category_id}:
    patch:
      tags: [budget]
      summary: Kategori guncelle — aktif=false SOFT-DELETE'tir
      description: |
        Hard DELETE ucu bilincli olarak YOK: hareketi olan kategori
        silinemez (FK RESTRICT); pasiflestirilen (aktif=false) kategoriye
        YENI kayit yazilamaz ama eski kayitlar kategorisini korur.
      parameters:
        - name: category_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetCategoryUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ayni tip icinde ayni ad zaten var
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /budget/entries:
    get:
      tags: [budget]
      summary: Defter kayitlari (tarih DESC; yonetim)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: tip
          in: query
          schema: { $ref: "#/components/schemas/BudgetTip" }
        - name: kategori_id
          in: query
          schema: { type: string, format: uuid }
        - name: kaynak
          in: query
          schema: { $ref: "#/components/schemas/BudgetKaynak" }
        - name: donem
          in: query
          description: "'YYYY-MM' ay filtresi (baslangic/bitis'e gore oncelikli)"
          schema: { type: string, example: "2026-07" }
        - name: baslangic
          in: query
          schema: { type: string, format: date }
        - name: bitis
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/BudgetEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [budget]
      summary: Manuel gelir/gider kaydi (yonetici/admin)
      description: |
        `tip` GONDERILMEZ — secilen kategoriden turetilir. Pasif kategoriye
        yeni kayit yazilamaz (422). kaynak her zaman 'manuel' olur
        (aidat_odeme kayitlarini sistem uretir).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetEntryCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /budget/entries/{entry_id}:
    patch:
      tags: [budget]
      summary: Manuel kaydi duzenle (aidat_odeme kayitlari duzenlenemez)
      parameters:
        - name: entry_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetEntryUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [budget]
      summary: Manuel kaydi sil (aidat_odeme kayitlari silinemez → 422)
      parameters:
        - name: entry_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /budget/summary:
    get:
      tags: [budget]
      summary: "Kasa ozeti: gelir, gider, bakiye (+kategori kirilimi)"
      description: |
        bakiye = toplam gelir - toplam gider (NEGATIF olabilir). Tum tutarlar
        integer KURUS. Filtresiz cagri tum zamanlari kapsar.
        SEFFAFLIK (Wave 2B): AGREGAT oldugu icin TUM rollere aciktir —
        sakin/saha sitenin toplamlarini gorur; defter satirlari ve kategori
        yonetimi yonetimde (admin+yonetici) kalir.
      parameters:
        - name: donem
          in: query
          schema: { type: string, example: "2026-07" }
        - name: baslangic
          in: query
          schema: { type: string, format: date }
        - name: bitis
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Ozet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # RAPORLAR (Wave 2B — cepten finansal ozet; salt okuma)
  # ================================================================= #
  /reports/financial-summary:
    get:
      tags: [reports]
      summary: Cepten finansal ozet (rol-duyarli icerik)
      description: |
        Telefon ekranina uygun kompakt ozet. TUM roller AGREGAT kismi alir:
        donem geliri/gideri/kasa + en yuksek gider kategorileri (ilk 5).
        `tahsilat` blogu (donem tahakkuku, tahsilat, tahsilat orani, geciken
        daire sayisi) YALNIZ yonetimde (admin+yonetici) dolar; sakin/saha
        icin `null` doner — daire/kisi duzeyinde veri sizdirilmaz.
        Parametresiz cagri tum zamanlari kapsar. Para integer KURUS.
      parameters:
        - name: donem
          in: query
          schema: { type: string, example: "2026-07" }
      responses:
        "200":
          description: Ozet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # ODEME WEBHOOK (public ama imza-korumali)
  # ================================================================= #
  /webhooks/payments/{provider}:
    post:
      tags: [webhooks]
      summary: Saglayici odeme bildirimi (iyzico/paytr)
      description: |
        PUBLIC (token YOK) ama IMZA-KORUMALI. Saglayici ode​me sonucunu bildirir.
        Imza/hash provider secret ile dogrulanir; gecersizse 401 ve hicbir islem
        yapilmaz. provider_ref'ten tenant guvenli cozulur (SECURITY DEFINER).
        IDEMPOTENT (provider+event_id). Tutar (kurus) odeme ile karsilastirilir;
        uyusmazsa 400. Govde/imza formati saglayiciya ozeldir (iyzico: JSON +
        `x-iyz-signature` header; paytr: form-encoded + `hash` alani).
      security: []   # public; guvenlik imzayla saglanir
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [iyzico, paytr] }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object } }
          application/x-www-form-urlencoded: { schema: { type: object } }
      responses:
        "200":
          description: Islendi (veya idempotent tekrar)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  durum: { $ref: "#/components/schemas/DuesDurum" }
        "400":
          description: Tutar uyusmazligi / gecersiz govde
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "401":
          description: Imza gecersiz
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "404":
          description: Saglayici/odeme referansi bulunamadi
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  # ================================================================= #
  # USERS (personel + sakin yonetimi) — admin
  # ================================================================= #
  /users:
    get:
      tags: [users]
      summary: Kullanici listesi (admin)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/UserRole" }
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          description: Ad/email icinde arama (opsiyonel)
          schema: { type: string }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/UserListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      summary: Kullanici olustur (admin her rol; yonetici saha personeli)
      description: |
        KIM KIMI ACAR tablosu TEK yerdedir: backend `app/roller.py`
        (`ACILABILIR_ROLLER`) — uc noktalari, `GET /users/acilabilir-roller`
        ve panelin acilir listesi ayni tabloyu okur.

        admin HER rolu olusturur. yonetici (Ozellik 3) KENDI tenant'inda YALNIZ
        saha personeli (security/tesis_gorevlisi) acar; admin/yonetici/resident
        rolu -> 403 (resident'lar POST /residents ile). telefon GLOBAL benzersiz
        LOGIN anahtaridir (zorunlu). password verilmezse TEK SEFERLIK gecici kod
        uretilir ve yanitta `temp_code` bir kez doner. password_hash YANITTA donmez.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Olusturuldu (parola verilmediyse `temp_code` doner)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserCreatedOut" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: telefon (global) veya email (tenant) zaten kayitli
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /public/tanitim-iletisim:
    post:
      tags: [tanitim]
      security: []
      summary: (P127.2) Tanitim sitesi iletisim formu — PUBLIC
      description: |
        Kok alan adindaki (tanitim sitesi) iletisim formu. KIMLIK YOK.

        KAYIT ONCE, BILDIRIM SONRA (portal formuyla ayni ilke): mesaj once
        `tanitim_iletisim` tablosuna yazilir, sonra e-posta DENENIR. Tersi
        yapilsaydi SMTP yapilandirilmamis bir kurulumda musteri adayi
        SESSIZCE KAYBOLURDU.

        TENANT YOK: yazan kisinin bir tesisi yoktur. Tabloda RLS acik ve
        POLITIKA YOK; yazma/okuma SECURITY DEFINER fonksiyonlarindan gecer
        (goc 0033) — yani bu PUBLIC uc, tablonun tamamini okuyabilecek bir
        yetki TASIMAZ.

        HIZ SINIRI: IP basina 60 dakikada 5 gonderim; asilirsa 429.
        `X-Forwarded-For`un ilk degeri kullanilir (yalniz sayac anahtari —
        yetki karari degildir).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TanitimIletisimIstek" }
      responses:
        "201":
          description: Alindi
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429":
          description: Hiz siniri asildi
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /tanitim-iletisim:
    get:
      tags: [tanitim]
      summary: (P127.2) Gelen musteri adaylari — YALNIZ platform admini
      description: |
        Kayitlar KISISEL VERI tasir (ad + iletisim). Gonderim public ama
        OKUMA degil: ayni ucun altinda olsalardi form dolduran biri butun
        adaylari okuyabilirdi.
      parameters:
        - name: okundu
          in: query
          schema: { type: boolean }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/TanitimIletisimOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tanitim-iletisim/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [tanitim]
      summary: (P127.2) Okundu isaretle — YALNIZ platform admini
      description: |
        SILME YOK (bilincli): gelen bir ticari iletisim kaydini tek
        tiklamayla yok etmek, "kim ne zaman yazdi" sorusunu cevapsiz
        birakirdi. Listeyi eritmenin yolu `okundu`dur.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { okundu: { type: boolean, default: true } }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TanitimIletisimOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/acilabilir-roller:
    get:
      tags: [users]
      summary: Cagiranin ACABILECEGI roller (P130)
      description: |
        Kim kimi acar tablosunun (backend `app/roller.py`) cagiran icin
        okunmus hâli. Panelin/`app.*`in rol acilir listesi BUNU kullanir:
        liste istemcide sabitken alti rolu de gosteriyordu ve site
        yoneticisi "Platform Admin"i secip 403 aliyordu.

        YOL SIRASI: `/users/{id}`den ONCE tanimlidir; sonra gelseydi id
        degiskenine eslesir ve UUID cozumlemesi 422 verirdi.
      responses:
        "200":
          description: Roller (bos liste = hicbir rol acilamaz)
          content:
            application/json:
              schema:
                type: object
                required: [roller]
                properties:
                  roller:
                    type: array
                    items: { $ref: "#/components/schemas/UserRole" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [users]
      summary: Kullanici detay (admin)
      responses:
        "200":
          description: Detay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [users]
      summary: "Kullanici guncelle (admin: her; yonetici: YALNIZ saha personeli)"
      description: |
        ad/telefon/role/is_active ve opsiyonel email/parola. parola verilirse yeniden
        hash'lenir. Kullanici SILINMEZ; pasiflestirme icin is_active=false kullanin.
        RBAC: admin herkesi duzenler; yonetici YALNIZ saha personelini
        (security/tesis_gorevlisi) duzenler ve rolu saha disina cekemez (403).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: email bu tenant'ta zaten kayitli
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }

  # (P186-ek2) /users/{id}/reset-password KALDIRILDI — yonetici parola
  # sifirlayamaz (hesap-ele-gecirme). Kurtarma: davet yeniden ya da kullanicinin
  # kendi "sifremi unuttum"/PATCH /me/password yolu.

  /users/{id}/contact:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [users]
      summary: Iletisim ayari — telefon + arama rizasi (admin + yonetici)
      description: |
        Rol-bazli arama (C1a) icin YALNIZ telefon + aranabilir (riza) gunceller.
        admin + yonetici yetkili; rol/parola/is_active gibi hassas alanlara
        DOKUNMAZ (tam PATCH admin-only kalir — yetki yukseltme yok). Numara
        yonetim tarafindan girilir; kullanici bu turda kendi yonetmez.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserContactUpdate" }
      responses:
        "200":
          description: Guncellendi (tek-kayit yonetim gorunumu — telefon doner)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /call-target/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [call-target]
      summary: Rol-bazli arama hedefi cozumu (numara-gizlilik kapisi)
      description: |
        Callee'nin telefonu YALNIZ (1) arayan rol o callee rolunu arayabiliyorsa
        (security->yonetici/resident; resident->security) VE (2) callee.aranabilir
        = true iken aciklanir. Aksi halde numara ASLA donmez: yetkisiz yon 403,
        rizasiz/numarasiz 404. Arayan roller: security + resident (digerleri 403).
        Amaç-sınırlı (yalniz arama), toplu listelenmez (KVKK). Kanal C1a'da 'phone'
        (cihaz ceviricisi, tel:); C1b baska kanallar ekleyecek.
      responses:
        "200":
          description: "Cozuldu — numara + tel: URI (yalniz burada aciklanir)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallTarget" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================================================================= #
  # INTEGRATIONS (C1b — dis sistem entegrasyon konfig + SSRF-korumali tetik;
  # admin+yonetici yonetir; sir write-only; tetik ic/ozel hedefleri reddeder)
  # ================================================================= #
  /integrations:
    get:
      tags: [integrations]
      summary: Entegrasyon listesi (admin+yonetici)
      description: Sir (auth_secret) DONMEZ; yerine auth_secret_set (bool).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: aktif
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Integration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [integrations]
      summary: Entegrasyon olustur (admin+yonetici)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationCreate" }
      responses:
        "201":
          description: Olusturuldu (sir DONMEZ)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /integrations/presets:
    get:
      tags: [integrations]
      summary: Preset sablonlari (form on-doldurma; admin+yonetici)
      description: >
        Generic webhook uzerinde makul varsayilanlar (webhook/megaphone/
        smarthome). Gercek cihaz surucusu DEGIL — duzenlenebilir sablonlar.
      responses:
        "200":
          description: Preset listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IntegrationPreset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /integrations/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [integrations]
      summary: Entegrasyon detay (admin+yonetici; sir DONMEZ)
      responses:
        "200":
          description: Detay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [integrations]
      summary: Entegrasyon guncelle (admin+yonetici)
      description: >
        auth_secret WRITE-ONLY (verilirse yeniden sifrelenir; auth_type=none ise
        temizlenir). endpoint_url http(s) olmali (tam SSRF kapisi tetikte).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [integrations]
      summary: Entegrasyon sil (admin+yonetici)
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /integrations/{id}/trigger:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [integrations]
      summary: Entegrasyonu tetikle — SSRF-korumali HTTP gonderir (admin+yonetici)
      description: |
        payload_template ({{message}}/{{title}}) render edilir; auth siri (varsa)
        header'a eklenir; **SSRF kapisindan gecen** URL'e HTTP istegi gonderilir.
        Ic/ozel/metadata/loopback/link-local hedefler REDDEDILIR (DNS cozulup
        IP denetlenir — DNS-rebinding korumasi). Redirect TAKIP EDILMEZ. Donen
        {ok, status, error}: 2xx -> ok=true; SSRF engeli / ag / HTTP hatasi ->
        ok=false + error.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationTrigger" }
      responses:
        "200":
          description: Tetik sonucu (ok/status/error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationTriggerResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================================================================= #
  # UNIT-COMPLAINTS (D1 — sakin -> HEDEF DAIRE; TAM ANONIM. Yonetimin ayri
  # /complaints modulunden BAGIMSIZ. complainant_user_id HICBIR yanitta YOK.)
  # ================================================================= #
  /blocks:
    get:
      tags: [building]
      summary: Bina bloklari (admin+yonetici)
      description: >
        Bina bloklari + her blogu kullanan daire sayisi (unit_sayisi). D-viz
        Rev-1 bina yerlesimi yonetimi; Rev-2 gorsel editoru bunu kullanir.
      responses:
        "200":
          description: Blok listesi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [building]
      summary: Bina blogu olustur (admin+yonetici)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Block" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /blocks/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [building]
      summary: Bina blogu guncelle (admin+yonetici)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Block" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [building]
      summary: Bina blogu sil (admin+yonetici) — kullanan daire varsa 409
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /unit-complaints:
    get:
      tags: [unit-complaints]
      summary: Daire sikayetleri (YALNIZ yonetim; complainant GIZLI)
      description: >
        Rev-2 GIZLILIK: YALNIZ admin+yonetici. kategori+tarih+durum+`notlar`
        doner ama `complainant_user_id`/`complainant_ad` ARTIK DONMEZ (her zaman
        null) — yonetim yalniz 'sikayet edildigini' gorur, KIMIN ettigini degil.
        resident/security/tesis_gorevlisi ERISEMEZ (403).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: target_unit_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: durum
          in: query
          required: false
          schema: { type: string, enum: [acik, kapali, geri_alindi] }
        - name: kategori
          in: query
          required: false
          description: "(G6, ADDITIVE) Kategori suzgeci"
          schema: { type: string, enum: [gurultu, kapi_onu_ayakkabi, zarar_verme, goruntu_kirliligi, diger] }
        - name: okunmamis
          in: query
          required: false
          description: |
            **(P24, ADDITIVE) "Yeni / Okunmamis" sekmesi.** `true` -> yalniz
            ISTEYEN yoneticinin okumadiklari; `false` -> yalniz okuduklari;
            bos -> hepsi. Okuma durumu KISI BASINADIR: bir yoneticinin
            okumasi digerinin triyaj kuyrugunu bosaltmaz.

            **Rozet sayisi icin ayri uc YOKTUR**:
            `?okunmamis=true&limit=1` cagrisinin `meta.total` degeri rozetin
            kendisidir.
          schema: { type: boolean }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/UnitComplaint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [unit-complaints]
      summary: Daire sikayeti ac (YALNIZ resident, KENDI blogu) — anonim
      description: >
        Sakin bir HEDEF daireyi bildirir. Hedef daire sakinin KENDI blogunda
        olmali (blok disi -> 403). complainant_user_id token'dan alinir, spam
        korumasi + denetim icin saklanir; resident'a DONMEZ. Spam (Rev-1.1):
        ayni daireye ayni KATEGORIDE 7 gunde en fazla 1 (farkli kategori
        serbest; durumdan bagimsiz) -> aksi 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitComplaintCreate" }
      responses:
        "201":
          description: Acildi (complainant DONMEZ)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitComplaint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >
            Haftalik spam limiti: bu daire icin bu KATEGORIDE 7 gunde 1 sikayet
            (farkli kategori serbest).
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /unit-complaints/mine:
    get:
      tags: [unit-complaints]
      summary: Kendi sikayetlerim (YALNIZ resident) — gitti mi geri bildirimi
      description: >
        Sakin YALNIZ kendi actigi sikayetleri gorur: hedef unit_no + kategori +
        tarih + durum (+ kendi notu). Baska sakinlerin kayitlari, yogunluk/renk,
        ve complainant (kendisi) YOKTUR. Diger roller 403.

        Ana ekran "Gurultu Sikayeti" sayaci (G6):
        `?kategori=gurultu&durum=acik&limit=1` -> `meta.total`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: durum
          in: query
          required: false
          schema: { type: string, enum: [acik, kapali, geri_alindi] }
        - name: kategori
          in: query
          required: false
          description: "(G6, ADDITIVE) Kategori suzgeci — orn. gurultu"
          schema: { type: string, enum: [gurultu, kapi_onu_ayakkabi, zarar_verme, goruntu_kirliligi, diger] }
      responses:
        "200":
          description: Kendi sikayet listem
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/UnitComplaint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /unit-complaints/density:
    get:
      tags: [unit-complaints]
      summary: Daire-basi yogunluk (sayi + renk) — YALNIZ yonetim
      description: >
        Rev-1: YALNIZ admin+yonetici. Her daire icin ACIK sikayet sayisi + renk
        (P24 DORT KADEME: 0 yesil, 1-2 sari, 3-4 kirmizi, 5+ mor).
        residentlar sayilari GOREMEZ (403);
        yapi gorunumu icin /building-map (rol-farkinda) kullanilir.
      responses:
        "200":
          description: Yogunluk
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitDensity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /unit-complaints/building-map:
    get:
      tags: [unit-complaints]
      summary: Cizilebilir bina semasi (ROL-FARKINDA) — tum roller
      description: >
        blok -> kat -> daire yapisi (2D kat plani). ROL-FARKINDA
        (shows_density): yonetici/admin sayim+renk gorur; resident YALNIZ kendi
        blogunun yapisini (sayim/renk null — sikayet secici); security/
        tesis_gorevlisi tum yapiyi (sayim/renk null). Yerlesimi eksik daireler
        'unplaced'. complainant hicbir role donmez.
      responses:
        "200":
          description: Bina haritasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildingMap" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /unit-complaints/{id}/okundu:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [unit-complaints]
      summary: Sikayeti OKUNDU isaretle (admin+yonetici) — kisi basina
      description: >
        (P24) Sikayeti YALNIZ istegi yapan yonetici icin okundu isaretler;
        diger yoneticilerin "Yeni" kuyrugu etkilenmez. IDEMPOTENT: ikinci
        cagri 409 vermez, ayni sonucu doner. GERI ALMA YOKTUR — "okunmamis"
        bir is kuyrugudur, gecmis degil.
      responses:
        "200":
          description: Isaretlendi (okundu=true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitComplaint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /unit-complaints/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [unit-complaints]
      summary: Sikayeti kapat (admin+yonetici) — sikayet edeni GORMEDEN
      description: >
        Yonetim yalniz durumu degistirir (kapali); ACIK sayimi duser (renk
        feedback). complainant yine DONMEZ.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitComplaintDecision" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitComplaint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # ARAC GECISI + OTOPARK DOLULUGU (G1 + G4)
  # Bir GECIS = bir satir: `giris_zamani` her zaman dolu, `cikis_zamani`
  # NULL iken arac ICERIDEDIR. Doluluk = ACIK satirlarin sayimi (ayri
  # sayac YOK). Plaka NORMALIZE saklanir (bosluksuz + BUYUK).
  # ================================================================= #
  /vehicle-passes:
    get:
      tags: [vehicle-passes]
      summary: Arac gecisleri (giris_zamani DESC) — admin + security
      description: |
        RBAC: YALNIZ admin + security. Plaka kisisel veriye baglanabilir
        (KVKK) — yonetici/resident/tesis_gorevlisi gecis LISTESINI GORMEZ
        (403); yonetimin ihtiyaci olan AGREGAT doluluk `/parking/occupancy`
        ile tum rollere aciktir.

        Ana ekran sayaci ("N Iceride"): `?acik=true&limit=1` -> `meta.total`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: acik
          in: query
          required: false
          description: >
            true: yalniz ACIK gecisler (`cikis_zamani` IS NULL — arac iceride);
            false: yalniz kapanmis gecisler. Verilmezse tumu.
          schema: { type: boolean }
        - name: plaka
          in: query
          required: false
          description: >
            Plaka ONEK eslesmesi. Arama degeri de NORMALIZE edilir
            ("34 abc" == "34ABC"), boylece istemci format bilmek zorunda degil.
          schema: { type: string, minLength: 1, maxLength: 32 }
        - name: baslangic
          in: query
          required: false
          description: >
            giris_zamani >= (tarih filtresi). "Bugun N giris" sayaci:
            `?baslangic=<gun basi>&limit=1` -> `meta.total`.
          schema: { type: string, format: date-time }
        - name: bitis
          in: query
          required: false
          description: giris_zamani < (tarih filtresi)
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/VehiclePass" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [vehicle-passes]
      summary: Arac GIRISI kaydet (admin + security)
      description: |
        `plaka` sunucuda normalize edilir (alfanumerik disi karakterler atilir,
        harfler buyur) ve NORMALIZE hali saklanir/donuur. Daire referansi
        OPSIYONEL: `unit_id` VEYA `unit_no` (ikisi birlikte 422); hicbiri
        verilmezse arac daireye bagli degildir. Verilen daire bulunamazsa 422.

        Ayni plakanin ACIK bir gecisi varsa **409** (arac zaten iceride —
        yapisal garanti: kismi unique indeks, es zamanli iki giris yarissa
        yalniz biri yazar). Cikis damgalandiktan sonra ayni plaka yeniden
        girebilir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehiclePassCreate" }
      responses:
        "201":
          description: Giris kaydedildi (cikis_zamani null => arac iceride)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehiclePass" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Bu plakanin acik bir gecisi zaten var (arac iceride)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /vehicle-passes/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [vehicle-passes]
      summary: Arac gecisi detayi (admin + security)
      responses:
        "200":
          description: Gecis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehiclePass" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /vehicle-passes/{id}/checkout:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [vehicle-passes]
      summary: Arac CIKISI damgala (admin + security)
      description: |
        `cikis_zamani` sunucu saatiyle damgalanir; otopark dolulugu ANINDA
        duser (ayri sayac yok). Atomik kosullu guncelleme — gecis zaten
        kapanmissa **409** ve ilk cikis zamani DEGISMEZ. Govde YOKTUR.
      responses:
        "200":
          description: Cikis damgalandi (guncel kayit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehiclePass" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Arac gecisi zaten kapatilmis
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /parking/occupancy:
    get:
      tags: [vehicle-passes]
      summary: Otopark dolulugu (agregat) — TUM kimlikli roller
      description: |
        `dolu` = ACIK arac gecisi (`cikis_zamani` IS NULL) sayisi — plaka veya
        daire ICERMEZ, bu yuzden tum rollere aciktir (ana ekran karti +
        "Hizli Ozet" kutusu ayni yaniti kullanir: "78 / 120" ve "%65").

        `kapasite` tenant ayarindan gelir (`PATCH /tenant/settings` ->
        `otopark_kapasite`; admin veya yonetici yazar). Kapasite TANIMSIZ
        (null) veya 0 ise `oran` da **null** doner — istemci "—" gosterir,
        uydurma yuzde uretilmez. `dolu` her zaman gercek sayidir.
      responses:
        "200":
          description: Doluluk
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParkingOccupancy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ================================================================= #
  # IHLAL KAYDI (G2) — site_kurali YALNIZ metin tutar; somut ihlal
  # burada izlenir. Durum: yeni -> inceleniyor -> kapatildi (TERMINAL).
  # ================================================================= #
  /violations:
    get:
      tags: [violations]
      summary: Ihlal kayitlari (created_at DESC) — admin + yonetici + security
      description: |
        RBAC: OKUMA admin + yonetici + security. resident ve tesis_gorevlisi
        ERISMEZ (403) — ihlal kaydi komsu davranisi hakkinda veri tasir (KVKK).

        Ana ekran sayaci ("N Yeni"): `?durum=yeni&limit=1` -> `meta.total`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: durum
          in: query
          required: false
          schema: { type: string, enum: [yeni, inceleniyor, kapatildi] }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Violation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [violations]
      summary: Ihlal kaydi ac (admin + security)
      description: |
        Kayit acilinca `durum='yeni'` olur (ana ekran sayaci bunu sayar).
        `kaynak` verilmezse 'manuel'. `konum` serbest metindir (checkpoint FK
        DEGIL — ihlal cogu zaman checkpoint disinda tespit edilir).
        yonetici OKUR ama ACMAZ (403).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViolationCreate" }
      responses:
        "201":
          description: Olusturuldu (durum=yeni)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Violation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /violations/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [violations]
      summary: Ihlal detayi (admin + yonetici + security)
      responses:
        "200":
          description: Ihlal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Violation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [violations]
      summary: Ihlal durumunu degistir (admin + security; KAPATMA yalniz admin)
      description: |
        Gecis akisi: `yeni` -> `inceleniyor` -> `kapatildi`.

        * KAPATMA (`durum=kapatildi`) YALNIZ **admin** — dort-goz kurali;
          inceleyen personel kendi kaydini kapatamaz (security -> 403).
        * `kapatildi` TERMINAL: kapali kayit yeniden ACILMAZ (409).
        * Ayni duruma gecis IDEMPOTENT'tir (200, kayit degismez).
        * yonetici okur ama durum degistiremez (403).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViolationUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Violation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Kapatilmis ihlal yeniden acilamaz (terminal durum)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # BIRLESIK AKTIVITE AKISI (G5) — "Son Hareketler"
  # ================================================================= #
  /activity:
    get:
      tags: [activity]
      summary: Birlesik olay akisi (yeniden eskiye, rol-farkindali)
      description: |
        Mobil "Son Hareketler" akisi. Onceden istemci rol basina 3-4 ayri uca
        istek atip sonuclari elde birlestiriyordu; bu uc AYNI olaylari
        SUNUCUDA birlestirir, SUNUCUDA siralar ve SUNUCUDA rol/KVKK'ya gore
        suzer. Yeni tablo YOKTUR — hepsi mevcut kayitlardan turer.

        **Olay turleri (`tur`)**: `devriye_okutma` | `gorev_tamamlama` |
        `aidat_odeme` | `talep` | `daire_sikayeti` | `alarm` |
        `ziyaretci_giris` | `ziyaretci_cikis` | `kargo` | `kargo_teslim` |
        `arac_giris` | `arac_cikis` | `ihlal`

        **Rol suzgeci (sunucu tarafinda; istemci bypass EDEMEZ):**

        | rol | gordugu turler |
        |---|---|
        | admin | devriye_okutma, gorev_tamamlama, aidat_odeme, talep, daire_sikayeti, alarm, arac_*, ihlal |
        | yonetici | admin ile ayni, `arac_*` HARIC (plaka RBAC'i admin+security) |
        | security | devriye_okutma, gorev_tamamlama, alarm, ziyaretci_*, kargo*, arac_*, ihlal + KENDI talepleri. FINANS (aidat) YOK |
        | resident | YALNIZ kendisi/kendi dairesi: kendine hedeflenen ziyaretci, dairesinin kargosu, dairesinin aidat odemesi, kendi talepleri, KENDI ACTIGI daire sikayetleri |
        | tesis_gorevlisi | YALNIZ `gorev_tamamlama` (mevcut KVKK kisiti) |

        **ZIYARETCI/KARGO — bilincli kisit:** bu iki kaynak yonetim rollerine
        (admin + yonetici) burada da KAPALIDIR. Sebep: `/visitors` ve `/kargo`
        uclarinda yonetim VARSAYILAN KAPALI'dir ve daire bazli TEK-SEFERLIK
        izinle (`/unit-access-request`) acilir. Birlesik akis bu kapiyi
        bypass eden bir yan kanal OLMAMALIDIR.

        **Sayfalama — bilesik imlec:** `ORDER BY zaman DESC, id DESC` +
        `WHERE (zaman, id) < (imlec)`. `offset` YOKTUR: araya yeni kayit girse
        bile sayfalar kaymaz/tekrarlamaz. `meta.total` de YOKTUR (13 kaynagin
        birlesik sayimi her istekte tam tarama demektir ve akis ekraninda
        kullanilmaz); "daha var mi" bilgisi `meta.next_cursor`'in null
        OLMAMASIYLA verilir.
      parameters:
        - name: limit
          in: query
          required: false
          description: Sayfa boyutu (varsayilan 20, max 100)
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          required: false
          description: >
            Onceki yanitin `meta.next_cursor` degeri. OPAK'tir — istemci
            icerigini AYRISTIRMAMALIDIR (siralama anahtari ileride degisirse
            sozlesme kirilmasin). Gecersiz deger 422.
          schema: { type: string }
      responses:
        "200":
          description: Akis sayfasi (yeniden eskiye)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # HAVA DURUMU (G7 — sozlesme geri-doldurmasi; UC ZATEN CANLIDA)
  # ================================================================= #
  /weather:
    get:
      tags: [weather]
      summary: Tesis konumu icin guncel hava durumu — TUM kimlikli roller
      description: |
        Ana ekran basligindaki hava bloğu. Tenant'in `konum_lat`/`konum_lon`
        koordinati icin Open-Meteo proxy'si; dis istek YALNIZ cache kacirilinca
        atilir (varsayilan 30 dk TTL) ve kisa timeout'ludur (3 sn) — baslik ana
        ekrani BEKLETMEZ. Dis servis dusukse BAYAT cache donulur; hic veri
        yoksa 503 `weather_unavailable`.

        Sorgu parametresi YOKTUR (konum tenant ayarindan gelir:
        `PATCH /tenant/settings` -> `konum_ad`/`konum_lat`/`konum_lon`).
      responses:
        "200":
          description: Guncel hava
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Weather" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Tenant bulunamadi
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "503":
          description: "Hava durumu su an alinamiyor (code: weather_unavailable)"
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  # ================================================================= #
  # KAMERALAR (G7 — sozlesme geri-doldurmasi; UC ZATEN CANLIDA)
  # ================================================================= #
  /cameras:
    get:
      tags: [cameras]
      summary: Kamera listesi (ad ASC) — TUM roller, gorunurluk SUNUCUDA suzulur
      description: |
        Site kameralari. Gorunurluk ROL BAZLI ve suzgec SUNUCUDADIR — gizli
        kamera yaniti HIC terk etmez, istemci "hangisini gorebilirim"
        hesabi yapmaz:

        | rol | gordugu kameralar |
        |---|---|
        | admin, yonetici, security | TUMU (pasif + sakine kapali dahil) |
        | resident, tesis_gorevlisi | YALNIZ `aktif=true` **VE** `sakin_gorebilir=true` |

        `sakin_gorebilir` TEK anahtardir ve varsayilani **false**'tur: kamera
        mahremiyet tasir (KVKK), sakine acmak yonetimin ACIK kararidir.
        `aktif=false` kamera hicbir sakine gosterilmez — bayrak acik olsa bile
        iki kosul BIRLIKTE aranir.

        Backend yayini HIC cekmez — istemci oynatir (SSRF yuzeyi yok).
        `oynatilabilir` alani turden turer: `hls`/`mp4` -> true, `rtsp` ->
        **false** (istemciler RTSP'yi natively oynatamaz; kayit envanter icin
        tutulur, ileride medya gecidi eklenecek).

        DEGISIKLIK (onceki surum): resident + tesis_gorevlisi eskiden 403
        aliyordu, artik 200 alir. Varsayilan `sakin_gorebilir=false` oldugu
        icin MEVCUT kayitlarin gorunurlugu degismez.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: aktif
          in: query
          required: false
          description: >
            Yonetim/operasyon suzgeci (admin+yonetici+security). resident ve
            tesis_gorevlisi icin YOK SAYILIR — o roller her durumda yalniz
            aktif + sakine acik kameralari alir.
          schema: { type: boolean }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Camera" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [cameras]
      summary: Kamera ekle (admin + yonetici)
      description: |
        `ad` tenant icinde benzersizdir (cakisirsa 409).

        URL semasi `tur` ile TUTARLI olmali (aksi 422 `invalid_stream_url`):
        `hls`/`mp4` -> `http(s)://`, `rtsp` -> `rtsp://`. rtsp KABUL EDILIR ve
        saklanir; yanitta `oynatilabilir=false` doner.

        `sakin_gorebilir` verilmezse **false** (sakin/tesis gorevlisi gormez).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /cameras/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [cameras]
      summary: Kamera guncelle (admin + yonetici; en az bir alan)
      description: |
        URL/tur tutarliligi MEVCUT kayitla birlestirilerek dogrulanir: yalniz
        `tur` gonderilse bile kayitli URL'in semasi yeni ture uymak zorundadir
        (orn. http(s) URL'li kamera `tur=rtsp` yapilamaz -> 422
        `invalid_stream_url`). `sakin_gorebilir` bu uctan acilip kapatilir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [cameras]
      summary: Kamera sil (admin + yonetici)
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------- (P191 §3) BAGLANTI TESTI ------------------------- #
  # Yonetici kamerayi KAYDETMEDEN once adresin calistigini gorur. Basarisizlik
  # TANILI doner: kimlik hatasi / ulasilamiyor / yol bulunamadi / ffmpeg yok...
  /cameras/test-baglanti:
    post:
      tags: [cameras]
      summary: "(P191 §3) RTSP adresini kaydetmeden dene"
      description: >
        Verilen `rtsp://` adresinden tek kare cekmeyi dener; HICBIR KAYIT
        YAPMAZ. Yalniz admin/yonetici. Tesis basina dakikada 20 deneme
        (asimda 429 `kamera_test_sinir`) — uc bir ic-ag tarayicisina
        donusmesin. Basarisizlikta hata kimligi ARIZAYI ADLANDIRIR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stream_url]
              properties:
                stream_url: { type: string }
                tur: { type: string, enum: [rtsp] }
      responses:
        "200":
          description: Kare alindi
          content:
            application/json:
              schema:
                type: object
                required: [basarili, kare_bayt]
                properties:
                  basarili: { type: boolean }
                  kare_bayt: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429":
          description: Cok fazla deneme (`kamera_test_sinir`)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "502":
          description: >
            Baglanti kurulamadi — TANILI kimlik: `kamera_kimlik_hatali`,
            `kamera_ulasilamiyor`, `kamera_adres_cozulemedi`,
            `kamera_zaman_asimi`, `kamera_yol_bulunamadi`,
            `kamera_yayin_okunamadi`, `kamera_baglanti_yok`
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "503":
          description: Sunucuda ffmpeg yok (`kamera_ffmpeg_yok`)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /cameras/{id}/kare:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [cameras]
      summary: "(P190 §6) RTSP kameradan tek kare (JPEG) — izgara karosu"
      description: >
        Kareyi SUNUCU ceker (ffmpeg): kimlik bilgili RTSP adresi istemciye
        gitmez. Redis'te 10 sn onbellek + surec basina 3 es-zamanli cekim;
        olu kamera 5 sn negatif-onbellek. Rol gorunurlugu liste ile ayni
        (sakin/gorevli yalniz aktif+sakin_gorebilir). Yalniz `tur=rtsp`
        (SSRF siniri; http(s) kaynaklar istemcide oynar).
      responses:
        "200":
          description: JPEG kare
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502":
          description: >
            (P191 §3) TANILI hata: `kamera_kimlik_hatali`,
            `kamera_ulasilamiyor`, `kamera_adres_cozulemedi`,
            `kamera_zaman_asimi`, `kamera_yol_bulunamadi`,
            `kamera_yayin_okunamadi` ya da genel `kamera_baglanti_yok`
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "503":
          description: Sunucuda ffmpeg yok (`kamera_ffmpeg_yok`)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /cameras/{id}/canli/{dosya}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: dosya
        in: path
        required: true
        description: "HLS dosyasi (index.m3u8 / segment .ts|.mp4)"
        schema: { type: string }
    get:
      tags: [cameras]
      summary: "(P190 §6) Canli izleme — MediaMTX HLS vekili"
      description: >
        RTSP kamerayi MediaMTX gecidi HLS'e cevirir; bu uc gecide kimlik-
        kapili vekildir (istemci gecidi/RTSP adresini gormez). Gecit
        `sourceOnDemand` calisir: kimse izlemezken RTSP cekilmez. Ayni anda
        en cok `KAMERA_CANLI_SINIR` (varsayilan 3) farkli kamera donusturulur
        (asimda 429). MediaMTX yapilandirilmamissa 503 `kamera_canli_kapali`.
      responses:
        "200":
          description: HLS playlist ya da segment
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
            video/mp2t:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429":
          description: Es-zamanli canli izleme siniri (`kamera_canli_sinir`)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "502":
          description: >
            (P191 §3) `kamera_gecit_yok` (MediaMTX'e ulasilamadi — SUNUCU
            sorunu) ya da `kamera_yayin_hazir_degil` (gecit ayakta, kaynaktan
            goruntu gelmedi)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "503":
          description: Canli izleme yapilandirilmamis (`kamera_canli_kapali`)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }


  # ------------------------------------------------------------------------
  # TUR 68 — BELGELENMEMIS UCLAR.
  #
  # Olcum (backend/tests/test_sozlesme_sapmasi.py): FastAPI 133 yol suniyordu,
  # sozlesme 119 tanimliyordu; parametre adlari normalize edilince 14 yol
  # BELGELENMEMIS cikti — arasinda tum moduller vardi. Sozlesme bu projede
  # kaynak gosterildigi icin (mobil domain testleri ona atif yapiyor) bu
  # gercek bir sapmaydi ve hicbir sey kontrol etmiyordu. Artik test ediliyor.
  # ------------------------------------------------------------------------
  /health:
    get:
      tags: [health]
      summary: Servis sagligi (altyapi kontrolu)
      description: Kimlik gerektirmez; yukleyici/izleme icin.
      # PUBLIC BEYANI (tur 74). Global `security: [bearerAuth]` gecerliyken bu
      # uc kimliksiz 200 donuyordu ama beyan edilmemisti; yetki supurmesi
      # (tests/test_yetki_kapsam.py) bunu sapma olarak bildirdi. Kimliksiz
      # erisilebilen her uc BURADA beyan edilmeli — beyan, koddaki davranisin
      # tek denetlenebilir kaydidir.
      security: []
      responses:
        '200': { description: ayakta }
  /me:
    get:
      tags: [me]
      summary: Oturumdaki kullanici (rol + tenant token'dan)
      description: |
        Access token'daki kullaniciyi doner. Tenant context ISTEKTEN ALINMAZ —
        token'daki `tenant_id` kullanilir. `avatar_url` alani `avatar_key`
        varsa kisa omurlu presigned GET URL'i olarak doldurulur (obje anahtari
        istemciye verilmez).

        Bilinen TUM roller kendi kaydini gorur.
      responses:
        '200': { description: kullanici }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/tema:
    patch:
      tags: [me]
      summary: "(P190 §5) Tema tercihi — hesapta saklanir (system|light|dark)"
      description: >
        Web tema tercihi kullanici HESABINDA durur (cihaz/tarayici degil):
        baska tarayicida da ayni tema gelir. Kozmetik tercih — denetime
        yazilmaz. Deger kumesi sema + DB CHECK (goc 0076) ile sinirli.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tema]
              properties:
                tema: { type: string, enum: [system, light, dark] }
      responses:
        '200': { description: guncellenmis kullanici }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me/avatar:
    patch:
      tags: [me]
      summary: Kendi avatarini guncelle (presigned foto_key)
      description: |
        SELF-SERVIS profil fotografi. RBAC: **admin + yonetici + denetci +
        resident** (auth.md).

        (P167 §1.7) `admin` ve `denetci` BU TURDA EKLENDI. Eski kume
        `yonetici + resident`ti ve gerekcesi "admin'e self-servis
        gerekmez"di; panelin sag ust kosesi artik HER rol icin avatar
        cizdigi (kullanici menusu) ve profil sayfasi hepsine acik oldugu
        icin o gerekce dustu. Dugmeyi gosterip 403 donmek kullaniciya
        sebepsiz bir hata vermek, dugmeyi role gore gizlemek ise ayni
        kurali istemcide tekrar etmek olurdu.

        SAHA PERSONELI (security / tesis_gorevlisi) HALA 403: onlarin
        fotografi bir sus degil OPERASYONEL KIMLIK kaydidir (vardiya,
        devriye, ziyaretci karsilama) ve yonetim
        `PATCH /users/{id}/avatar` ile yonetir.

        `avatar_key` KENDI TENANT namespace'inde olmalidir (`<tenant_id>/...`);
        degilse **422 `invalid_foto_key`** — duyuru fotografiyla ayni IDOR
        engeli. `avatar_key: null` fotografi KALDIRIR. Degisen/kaldirilan eski
        obje MinIO'dan SILINIR (erisilemez cop birakilmaz). Islem
        `audit_log`'a `avatar_update` olarak yazilir.
      responses:
        '200': { description: guncellendi }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/checkpoints:
    get:
      tags: [me]
      summary: Token'daki TENANT'in kontrol noktalari (ad'a gore sirali)
      description: |
        DIKKAT — ad yaniltici olabilir: uc kullaniciya ATANMIS noktalari
        degil, **token'daki tenant'in TUM aktif olmayan/olan kontrol
        noktalarini** doner (ad ASC), RLS ile izole. Faz-0'da tenant
        izolasyonunu uctan uca dogrulamak icin eklendi ve oyle kaldi;
        devriye plani bazli nokta listesi icin
        `GET /patrol-plans/{id}/checkpoints` kullanilir.

        RBAC: kimlikli her rol (ek rol kapisi YOK).
      responses:
        '200': { description: liste }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/overview:
    get:
      tags: [me, admin]
      summary: Platform admin RBAC yoklama ucu (Faz-0 iskeleti)
      description: |
        DIKKAT — SAYAC DONDURMEZ. Govde sabittir:
        `{"status": "ok", "role": "admin"}`. Faz-0'da rol matrisini uctan uca
        dogrulamak icin eklenmis bir YOKLAMA ucudur; panel ozet sayilarini
        `GET /admin/tenants` ve `GET /reports/*` verir.

        RBAC: **yalniz `admin`** (yonetici dahil digerleri 403).
      responses:
        '200': { description: "sabit govde: {status, role}" }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit:
    get:
      tags: [audit]
      summary: Denetim kaydi listesi — CAPRAZ TENANT (platform admin)
      description: |
        KVKK denetim goruntuleyicisi. `audit_log` APPEND-ONLY'dir (migration
        0002: `app_role`'dan UPDATE/DELETE geri alinmistir).

        RLS `FORCE` oldugu icin normal uygulama rolu yalniz KENDI tenant'ini
        gorur; bu uc owner-sahipli **SECURITY DEFINER** `audit_log_list`
        fonksiyonu uzerinden TUM tenant'lari dondurur (mevcut
        `list_all_tenants` deseninin aynisi) ve `set_tenant` YAPILMAMIS bir
        oturum kullanir — RLS bypass'i fonksiyonun icindedir, uc katmaninda
        degil.

        RBAC: **yalniz `admin`** (site `yonetici`si DEGIL — capraz-tenant veri).
      parameters:
        - { name: tenant_id, in: query, required: false, description: tenant filtresi, schema: { type: string, format: uuid } }
        - { name: action, in: query, required: false, schema: { type: string } }
        - { name: resource_type, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, description: "date_from (>=)", schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, description: "date_to (<)", schema: { type: string, format: date-time } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: liste }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/{user_id}/avatar:
    patch:
      tags: [users]
      summary: BASKA bir kullanicinin avatarini guncelle (yonetim)
      description: |
        `PATCH /me/avatar`in yonetim karsiligi: saha personelinin (security /
        tesis_gorevlisi) fotografini yonetim yukler — o roller self-servis
        avatar ucuna erisemez.

        `avatar_key` HEDEF kullanicinin tenant namespace'inde olmalidir
        (`<tenant_id>/...`); degilse 422. `null` fotografi kaldirir; eski obje
        MinIO'dan silinir. Islem `audit_log`'a yazilir.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: guncellendi }
        '403': { $ref: '#/components/responses/Forbidden' }
  /shifts/{shift_id}/assignments:
    put:
      tags: [shifts]
      summary: Vardiya personelini TAM LISTE olarak degistir (admin + yonetici)
      description: |
        PUT semantigi: govdedeki `user_ids` vardiyanin YENI TAM personel
        listesidir — mevcut atamalar SILINIR ve liste yeniden yazilir. Bos
        liste vardiyayi personelsiz birakir (silme ucu ayri degildir).

        Liste SIRALI TEKILLESTIRILIR (ayni id iki kez gelirse bir kez yazilir,
        siralama korunur).

        ROL KISITI: yalniz SAHA rolleri atanabilir
        (`security` | `tesis_gorevlisi`). Listede baska rolden ya da var
        olmayan bir kullanici id'si varsa TUM istek **422
        `invalid_assignment`** ile reddedilir (kismi yazma YOK).

        RLS: baska tenant'in vardiyasi **404** (403 degil — kaydin varligi da
        sizmaz). Islem `audit_log`'a `shift_assign` olarak, atanan id
        listesiyle yazilir.
      parameters:
        - { name: shift_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: atamalar guncellendi }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /support:
    get:
      tags: [support]
      summary: KENDI platform destek taleplerim
      description: |
        SITE ↔ PLATFORM kanalidir (site ICI talep/sikayet degil — onlar
        `/complaints` ve `/unit-complaints`). Cagiran kendi tenant'inin
        actigi talepleri gorur; capraz-tenant gorunum `/support/all`dedir.
      responses:
        '200': { description: liste }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [support]
      summary: Platform destek talebi olustur
      description: |
        Talep cagiranin tenant'ina ve kullanicisina baglanir (ikisi de
        ISTEKTEN alinmaz, token'dan gelir). Ekli gorseller `foto_key`
        listesiyle verilir (presign akisi — `POST /uploads/presign`).
      responses:
        '201': { description: olusturuldu }
        '422': { $ref: '#/components/responses/ValidationError' }
  /support/all:
    get:
      tags: [support]
      summary: TUM tenant'larin destek talepleri (platform admin)
      description: |
        CAPRAZ TENANT gorunum — `/audit` ile ayni ilke: RLS'i asan okuma
        yalniz platform `admin`ine aciktir; site `yonetici`si 403 alir.
        Yanit her satirda tenant kimligini de tasir (hangi siteden geldigi).
      responses:
        '200': { description: liste }
        '403': { $ref: '#/components/responses/Forbidden' }
  /support/{ticket_id}:
    patch:
      tags: [support]
      summary: Destek talebini yanitla / durumunu degistir (platform admin)
      description: |
        Yalniz platform `admin`i yanit yazar ve durumu ilerletir; talebi ACAN
        taraf yanitlayamaz (kanalin karsi ucu). Yanit yazildiginda talep
        sahibine bildirim uretilir.
      parameters:
        - { name: ticket_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: guncellendi }
        '403': { $ref: '#/components/responses/Forbidden' }
  # ================================================================= #
  # ANPR (P16) — kaynaktan bagimsiz plaka okuma girisi.
  # Kimlik JWT DEGIL, tenant basina API ANAHTARI (`X-ANPR-Key`).
  # ================================================================= #
  /integrations/anpr/events:
    post:
      tags: [anpr]
      summary: Plaka okuma olayi al (KAMERA KUTUSU — X-ANPR-Key)
      # PUBLIC DEGIL: JWT yerine apiKey semasi kullanilir. `security: []`
      # yazmak sozlesmeyi YANILTICI yapardi (uc 401 doner).
      security:
        - anprApiKey: []
      description: |
        Frigate / Hikvision / Dahua ve elle giris AYNI uca yazar; kaynaga ozgu
        bicim `kaynak` alanina gore ADAPTOR katmaninda tek gövdeye cevrilir
        (esleme tablosu: `docs/frigate-poc.md` §6).

        **KIMLIK — JWT DEGIL.** Kamera kutusunun kullanici oturumu yoktur ve
        token yenileyemez; `X-ANPR-Key: <kimlik>.<sir>` basligi kullanilir.
        Sunucu yalniz `sir`in sha256 ozetini saklar. Gecersiz/pasif/bicimsiz
        anahtarin HEPSI ayni **401**'i doner — hangi asamada dusuldugunu
        soylemek, gecerli bir `kimlik` arayan birine bilgi verir.

        **IDEMPOTENT.** Ayni `(kaynak, kaynak_olay_id)` ikinci kez gelirse YENI
        kayit acilmaz, MEVCUT olay doner. Bu susleme degil, olculmus bir
        gerekliliktir: Frigate ayni olayi `update` ve `end` olarak birden cok
        kez yayinlar; tekillik olmadan tek arac iki gecis acardi.

        **OLAY HER ZAMAN DEFTERE YAZILIR.** Gecersiz plaka bile `durum='hata'`
        ile kaydedilir ve **201** doner — istek DUSURULMEZ. Kutunun yeniden
        denemesi bozuk bir okumayi duzeltmez; saha "kamera sacmaliyor"
        diyebilsin diye iz birakilir. Tek istisna bilinmeyen `kaynak`: o bir
        SOZLESME hatasidir (422).

        **KARAR KURALLARI**

        | Kosul | Sonuc |
        |---|---|
        | `guven` < tenant esigi (`anpr_guven_esigi`, varsayilan 0.850) | gecis ACILMAZ, `onay_bekliyor` |
        | `guven` HIC verilmemis | islenir (her kaynak guven uretmez) |
        | `yon` = `bilinmiyor` + plakanin acik gecisi VAR | CIKIS sayilir |
        | `yon` = `bilinmiyor` + acik gecis YOK | GIRIS sayilir |
        | GIRIS ama arac zaten iceride | `yok_sayildi` (`zaten_iceride`) |
        | CIKIS ama acik gecis yok | `yok_sayildi` (`acik_gecis_yok`) |
        | CIKIS ama `anpr_otomatik_cikis=false` | `yok_sayildi` |

        `yon` alanini **Frigate URETMEZ** (P15'te olculdu); `bilinmiyor`
        gercek bir haldir ve sessizce "giris" sayilmaz.

        Acilan gecis `vehicle_pass` satiridir (`kaynak='anpr'`,
        `kaydeden_user_id=null`) — otopark dolulugu ve `/activity` akisi
        AYRI kod gerektirmeden calisir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnprEventIn" }
      responses:
        "201":
          description: Olay deftere yazildi (tekrar da 201 + MEVCUT kayit doner)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnprEventOut" }
        "401":
          description: Anahtar yok / bicimsiz / bulunamadi / pasif (ayrim YAPILMAZ)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [anpr]
      summary: Olay defteri (admin + security)
      description: |
        `created_at DESC`. `?durum=onay_bekliyor` ONAY KUYRUGUDUR.
        RBAC arac gecisi listesiyle AYNI kume: plaka kisisel veriye
        baglanabilir (KVKK), yonetici/resident/tesis_gorevlisi **403** alir.

        `?plaka=` ONEK aramasidir ve sunucuda normalize edilir; gecersiz arama
        metni BOS SONUC verir (422 degil — yarim plaka yazmak hata degildir).
      parameters:
        - name: durum
          in: query
          required: false
          schema: { type: string, enum: [islendi, onay_bekliyor, yok_sayildi, hata] }
        - name: plaka
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 64 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnprEventListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /integrations/anpr/events/{event_id}/onay:
    parameters:
      - { name: event_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [anpr]
      summary: Dusuk guvenli okumanin INSAN karari (admin + security)
      description: |
        `onay=true` → okuma kabul edilir ve normal karar akisi UYGULANIR
        (giris ac / cikis kapat). `plaka` verilirse OCR duzeltilir — bir-iki
        karakter yanlis okunmasi en yaygin hatadir.
        `onay=false` → olay `yok_sayildi` olur, gecis ACILMAZ.

        **Insan onayladiginda guven esigi ARTIK UYGULANMAZ** — esik zaten
        insani cagirmak icindi.

        YALNIZ `onay_bekliyor` durumundaki olay karara acilir; islenmis bir
        olayi yeniden karara sokmak CIFT GECIS uretirdi (**409**).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnprOnayIn" }
      responses:
        "200":
          description: Karar uygulandi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnprEventOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Olay onay beklemiyor (zaten islenmis/reddedilmis)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /integrations/anpr/keys:
    get:
      tags: [anpr]
      summary: ANPR anahtarlari (YALNIZ admin)
      description: |
        Anahtarin DEGERI donmez — yalniz `kimlik` yarisi. RBAC yalniz
        `admin`: anahtar, tenant'in tum gecis akisini yazma yetkisidir ve
        site yoneticisine acilmaz.
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AnprApiKeyOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [anpr]
      summary: Yeni ANPR anahtari uret (YALNIZ admin)
      description: |
        Anahtar degeri **YALNIZ BU YANITTA, BIR KEZ** doner. Sunucuda `sir`in
        sha256 ozeti saklanir; anahtarin kendisi hicbir yerde tutulmaz.
        Kaybedilirse yenisi uretilir — bu, sizan bir yedekten anahtarin geri
        uretilememesi icin bilincli bir bedeldir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnprApiKeyCreate" }
      responses:
        "201":
          description: Uretildi (`anahtar` alani bir kez doner)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnprApiKeyCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /integrations/anpr/keys/{key_id}:
    parameters:
      - { name: key_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [anpr]
      summary: Anahtari PASIFLESTIR (YALNIZ admin)
      description: |
        Satir SILINMEZ, `aktif=false` yapilir — "kim ne zaman kullandi" izi
        (`son_kullanim`) korunur. Pasif anahtarla gelen istek 401 alir.
      responses:
        "204": { description: Pasiflestirildi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /transparency:
    get:
      tags: [transparency]
      summary: Seffaflik panosu — ay listesi
      description: |
        Aylik ANONIM finans ozeti. Kisi/daire bazli hicbir alan DONMEZ —
        pano bilincli olarak agregattir; bu yuzden sakin dahil bilinen tum
        roller okur.

        YAYIN KAPISI: yayinlanmamis aylar yalniz yonetime (admin/yonetici)
        gorunur; sakin yalniz `yayinlandi` aylari gorur.
      responses:
        '200': { description: aylar }
  /transparency/{ay}:
    get:
      tags: [transparency]
      summary: Bir ayin anonim finans ozeti
      description: |
        `ay` bicimi `YYYY-AA`. Yayinlanmamis bir ay yetkisiz role **404**
        doner (403 degil: ayin VARLIGI da bilgi sizdirmasin).
      parameters:
        - { name: ay, in: path, required: true, schema: { type: string, example: '2026-07' } }
      responses:
        '200': { description: ozet }
        '404': { $ref: '#/components/responses/NotFound' }
  /transparency/{ay}/publish:
    put:
      tags: [transparency]
      summary: Ayi yayinla / yayindan kaldir (yonetim)
      description: |
        admin + yonetici. Yayindan kaldirma da bu uctandir (idempotent:
        ayni duruma set etmek 200 doner, kayit degismez). Yayin durumu
        `transparency_publication` tablosunda tutulur (migration 0003).
      parameters:
        - { name: ay, in: path, required: true, schema: { type: string, example: '2026-07' } }
      responses:
        '200': { description: durum degisti }
        '403': { $ref: '#/components/responses/Forbidden' }

# =================================================================== #
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT access token. `Authorization: Bearer <token>`. Bkz. /contracts/auth.md"
    anprApiKey:
      type: apiKey
      in: header
      name: X-ANPR-Key
      description: |
        ANPR girisi (P16) icin TENANT BASINA uzun omurlu anahtar:
        `<kimlik>.<sir>`. Kamera kutusunun kullanici oturumu yoktur ve token
        yenileyemez, bu yuzden JWT KULLANILMAZ. Sunucu yalniz `sir`in sha256
        ozetini saklar; anahtar `POST /integrations/anpr/keys` ile uretilir ve
        deger YALNIZ O YANITTA bir kez doner.

  parameters:
    Limit:
      name: limit
      in: query
      description: Sayfa boyutu (varsayilan 50, max 200)
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      description: Atlanan kayit sayisi
      schema: { type: integer, minimum: 0, default: 0 }
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        Yayin iceriginin (duyuru / site kurali / etkinlik) hangi dilde
        servis edilecegini belirler. Standart RFC 9110 bicimi desteklenir:
        `tr-TR,tr;q=0.9,en;q=0.8`.

        **HATA METINLERI de bu basliga uyar** (`Error.message`) — endpoint
        bu parametreyi tanimlamasa bile, hata zarfi TUM uclarda istegin
        dilinde doner (ayni eslestirme zinciri).

        **Eslestirme**: bolge eki DUSURULUR (`tr-TR` -> `tr`), q'ya gore
        azalan sirada ilk DESTEKLENEN dil secilir. Desteklenen kume:
        `tr` (varsayilan/kaynak), `en`, `ar`, `ru`, `de`, `fr`, `es`.

        **GERI-DUSME ZINCIRI**: `?dil=` -> Accept-Language'daki ilk
        desteklenen dil -> icerigin ORIJINAL dili. Desteklenmeyen bir dil
        istemek HATA DEGILDIR (400 donmez) — orijinale duser, yani icerik
        her zaman okunabilir.

        Ceviri henuz hazir degilse (`ceviri_durumu` = `bekliyor`/`hata`)
        ORIJINAL metin servis edilir; govde ASLA bos kalmaz.
      schema: { type: string, example: "ru-RU,ru;q=0.9,en;q=0.8" }
    DilQuery:
      name: dil
      in: query
      required: false
      description: |
        Accept-Language basligini EZER (panel/dogrulama icin). Dil kodu
        (`tr`|`en`|`ar`|`ru`|`de`|`fr`|`es`) ya da `orijinal` — `orijinal`
        icerigin kaynak dilini zorlar. Desteklenmeyen deger 400 URETMEZ;
        geri-dusme zinciri isler.
      schema:
        type: string
        enum: [tr, en, ar, ru, de, fr, es, orijinal]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Istemci tarafindan uretilen benzersiz anahtar (UUID onerilir)
      schema: { type: string, minLength: 8, maxLength: 200 }
    IdempotencyKeyOpsiyonel:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        (P64) VEZNE yazmalarinda CIFT KAYIT korumasi. ZORUNLU DEGIL:
        bu uclar calisan bir prod'da kullaniliyor ve zorunlu kilmak,
        baslik gondermeyen her istemciyi ANINDA kirardi. Gonderildiginde
        ayni anahtarla gelen ikinci istek YENI KAYIT ACMAZ; 200 ile ilk
        islemin satirlarini doner. Ayni anahtar FARKLI bir para hareketiyle
        (tip/yon/tutar/kasa) gelirse 409.

        Korunan risk HIZLI CIFT TIKLAMA DEGIL (panel dugmesi zaten kilitli),
        ZAMAN ASIMI SONRASI TEKRARDIR: istek sunucuya ulasip yanit donmezse
        kullanici "kaydedilmedi" sanip tekrar basar ve kasada IKI hareket
        olusurdu.
      schema: { type: string, minLength: 8, maxLength: 200 }

  responses:
    BadRequest:
      description: Gecersiz istek
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Kimlik dogrulama gerekli / gecersiz token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Rol bu islem icin yetkili degil
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Kayit bulunamadi (tenant kapsaminda)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Cakisma (benzersizlik / iliskili kayit)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Govde dogrulama hatasi
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Cok fazla istek
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ---------------------------- davet (P155 §7) ------------------ #
    DavetCozRequest:
      type: object
      required: [jeton]
      properties:
        jeton: { type: string, minLength: 8, maxLength: 128 }
    DavetCozResponse:
      type: object
      required: [tesis_ad, rol, ad, telefon_maskeli]
      properties:
        tesis_ad:        { type: string, example: "Oltu Sitesi" }
        rol:             { type: string, example: "resident" }
        ad:              { type: string }
        telefon_maskeli: { type: string, example: "+9053***203" }
        daire_no:        { type: string, nullable: true }
    DavetParolaRequest:
      type: object
      required: [jeton, new_password]
      properties:
        jeton:        { type: string, minLength: 8, maxLength: 128 }
        ad:           { type: string, nullable: true, minLength: 1, maxLength: 120 }
        new_password: { type: string, minLength: 8 }
    DavetSosyalRequest:
      type: object
      required: [jeton, baglama_jetonu]
      properties:
        jeton:          { type: string, minLength: 8, maxLength: 128 }
        baglama_jetonu: { type: string }
        ad:             { type: string, nullable: true, minLength: 1, maxLength: 120 }
    DavetDurumOut:
      type: object
      required: [user_id, ad, rol, telefon, son_gecerlilik]
      properties:
        user_id:         { type: string, format: uuid }
        ad:              { type: string }
        rol:             { type: string }
        telefon:         { type: string }
        daire_no:        { type: string, nullable: true }
        son_kanal:       { type: string, nullable: true }
        son_durum:       { type: string, nullable: true }
        son_hata:        { type: string, nullable: true }
        son_gonderim_at: { type: string, format: date-time, nullable: true }
        used_at:         { type: string, format: date-time, nullable: true }
        son_gecerlilik:  { type: string, format: date-time }
    DavetDurumListResponse:
      type: object
      required: [items]
      properties:
        tesis_kodu: { type: string, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/DavetDurumOut" }
    DavetGonderimSonucu:
      type: object
      required: [gonderildi]
      properties:
        gonderildi: { type: boolean }
        kanal:      { type: string, nullable: true }
    # ---------------------------- ortak ---------------------------- #
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Makine-okunabilir hata kodu
              example: validation_error
            message:
              type: string
              description: |
                Insan-okunabilir aciklama. **YERELLESTIRILMISTIR**: metin
                istegin `Accept-Language` basligina gore 7 dilden birinde
                doner (baslik yoksa `tr`). Istemci mantigi buna DEGIL
                `code`a bakmalidir. Sunucu yapilandirma hatalari
                (`storage_unconfigured`, `config_error`,
                `payment_unconfigured`, `payment_provider_error`,
                `webhook_unsupported`) cevrilmez — operatore hitap eder.
              example: "The record already exists (uniqueness violation)."
            details:
              type: array
              description: Alan bazli dogrulama hatalari (opsiyonel)
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }

    Page:
      type: object
      required: [meta]
      properties:
        meta: { $ref: "#/components/schemas/PageMeta" }

    PageMeta:
      type: object
      required: [limit, offset, total]
      properties:
        limit: { type: integer, example: 50 }
        offset: { type: integer, example: 0 }
        total:
          type: integer
          description: Filtreye uyan toplam kayit sayisi
          example: 137

    GunTipi:
      type: string
      enum: [her_gun, hafta_ici, hafta_sonu, resmi_tatil]

    TanitimIletisimIstek:
      type: object
      description: >
        Telefon VEYA e-posta ZORUNLU: ikisi de yoksa gelen mesaja cevap
        verilemezdi. `dil` sayfanin o anki dilidir (donuste ayni dilde
        cevap yazilabilsin); bilinmeyen deger SAKLANMAZ.
      required: [ad, mesaj]
      properties:
        ad: { type: string, minLength: 2, maxLength: 150 }
        email: { type: string, maxLength: 200, nullable: true }
        telefon: { type: string, maxLength: 40, nullable: true }
        mesaj: { type: string, minLength: 5, maxLength: 5000 }
        dil: { type: string, maxLength: 5, nullable: true }
    TanitimIletisimOut:
      type: object
      required: [id, ad, mesaj, okundu, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string }
        email: { type: string, nullable: true }
        telefon: { type: string, nullable: true }
        mesaj: { type: string }
        dil: { type: string, nullable: true }
        okundu: { type: boolean }
        created_at: { type: string, format: date-time }

    UserRole:
      type: string
      description: >
        (P35) `guvenlik_amiri` altinci roldur: guvenligi DIS BIR SIRKET
        yurutuyorsa vardiya/tur planlamasinin sahibi. Sakin, finans, kargo ve
        ziyaretci alanlari ona BILINCLI olarak KAPALIDIR (dis sirket = en az
        yetki, KVKK).


        (P128) `denetci` YEDINCI roldur: tesisin SALT-OKUMA mali gozetimi
        (raporlar, gelir/gider, tahakkuk-tahsilat, kasa/banka). HICBIR
        mutasyon ucu bu role acik degildir — kural yapisal olarak test
        edilir (`backend/tests/test_denetci_salt_okuma.py`): rota agacinda
        `denetci`ye acik GET-disi her uc, gerekcesi yazili bir istisna
        listesinde olmak ZORUNDADIR. Tek istisna `POST /raporlar/{kod}`:
        rapor URETIMI bir okumadir, POST secilmesinin sebebi parametrelerin
        bir govde istemesidir.


        Gorev penceresi (`gorev_baslangic`/`gorev_bitis`) HER ISTEKTE
        olculur; disinda kalan istek 403 `gorev_suresi_disinda` alir ve
        giris de ayni kodla reddedilir.
      enum:
        [admin, yonetici, security, tesis_gorevlisi, resident, guvenlik_amiri,
         denetci]

    # --------------------------- devices --------------------------- #
    DevicePlatform:
      type: string
      enum: [android, ios, web]
    DeviceRegister:
      type: object
      required: [fcm_token, platform]
      properties:
        fcm_token: { type: string }
        platform: { $ref: "#/components/schemas/DevicePlatform" }
        dil:
          type: string
          enum: [tr, en, ar, ru, de, fr, es]
          default: tr
          description: >
            CIHAZIN arayuz dili. Push metni SUNUCUDA, gonderim aninda bu dilde
            uretilir — push asenkron oldugu icin o anda `Accept-Language`
            YOKTUR. Istemci uygulama dilini degistirdiginde cihazi YENIDEN
            kaydeder (ayni token -> idempotent upsert, dil guncellenir).
            Gonderilmezse `tr`.
        cihaz_kimligi:
          type: string
          nullable: true
          maxLength: 128
          description: >
            (P191-ek §1) Kararli KURULUM kimligi (donanim kimligi DEGIL).
            Verilirse ayni cihazin onceki jetonlari pasiflestirilir.

    BankaHareket:
      type: object
      description: >
        (P191 §4) Banka hareketi. `karsi_iban_maskeli` YALNIZ son 4 haneyi
        gosterir; tam IBAN hicbir yanitta DONMEZ (guvenlik maddesi).
      required: [id, kaynak, external_transaction_id, islem_tarihi, tutar_kurus, yon, durum, created_at]
      properties:
        id: { type: string, format: uuid }
        kaynak: { type: string }
        external_transaction_id: { type: string }
        islem_tarihi: { type: string, format: date }
        tutar_kurus: { type: integer, description: "HER ZAMAN POZITIF; isaret `yon`da" }
        yon: { type: string, enum: [giris, cikis] }
        para_birimi: { type: string }
        aciklama: { type: string, nullable: true }
        karsi_ad: { type: string, nullable: true }
        karsi_iban_maskeli: { type: string, nullable: true }
        durum:
          type: string
          enum: [yeni, eslesti, manuel_inceleme, ilgisiz_gelir, masraf, ters_kayit]
        not_metni: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        eslesmeler:
          type: array
          items:
            type: object
            required: [id, tutar_kurus, confidence_score, match_type, durum]
            properties:
              id: { type: string, format: uuid }
              user_id: { type: string, format: uuid, nullable: true }
              unit_id: { type: string, format: uuid, nullable: true }
              assessment_id:
                type: string
                format: uuid
                nullable: true
                description: "NULL = daire alacagina yazilan FAZLA odeme"
              tutar_kurus: { type: integer }
              confidence_score: { type: integer }
              match_type: { type: string, enum: [odeme_kodu, iban, ad_tutar, manuel] }
              durum: { type: string, enum: [onerildi, onaylandi, geri_alindi, reddedildi] }
              receipt_id: { type: string, format: uuid, nullable: true }

    Device:
      type: object
      required: [id, user_id, fcm_token, platform, dil, aktif, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        fcm_token: { type: string }
        platform: { $ref: "#/components/schemas/DevicePlatform" }
        dil: { type: string, enum: [tr, en, ar, ru, de, fr, es] }
        aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # password_hash ASLA donmez (guvenlik).
    User:
      type: object
      required: [id, ad, role, is_active, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string }
        email:
          type: string
          format: email
          nullable: true
          description: Personelde zorunlu; resident'ta opsiyonel (daire ile girer)
        telefon:
          type: string
          nullable: true
          description: >
            Rol-bazli arama numarasi. YALNIZ tek-kayit yonetim gorunumunde
            (bu sema) doner; LISTEDE donmez (KVKK — bkz. UserListItem). Arayanlara
            yalniz /call-target ile riza+yetki kapisindan gecince aciklanir.
        aranabilir:
          type: boolean
          description: Telefonla aranmaya riza (C1a). Yonetim girer; /call-target kapisi.
        role: { $ref: "#/components/schemas/UserRole" }
        is_active: { type: boolean }
        gorev_baslangic:
          type: string
          format: date
          nullable: true
          description: (P128) Gorev penceresi basi — denetci disi rollerde null.
        gorev_bitis:
          type: string
          format: date
          nullable: true
          description: (P128) Gorev penceresi sonu — denetci disi rollerde null.
        created_at: { type: string, format: date-time }
    UserListItem:
      type: object
      description: >
        Kullanici LISTE ogesi — telefon YOK (data-minimization: numaralar toplu
        listelenmez). aranabilir (riza bayragi, PII degil) yonetim gorunurlugu icin.
      required: [id, ad, role, is_active, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string }
        email: { type: string, format: email, nullable: true }
        aranabilir: { type: boolean }
        role: { $ref: "#/components/schemas/UserRole" }
        is_active: { type: boolean }
        gorev_baslangic:
          type: string
          format: date
          nullable: true
          description: (P128) Gorev penceresi basi — denetci disi rollerde null.
        gorev_bitis:
          type: string
          format: date
          nullable: true
          description: (P128) Gorev penceresi sonu — denetci disi rollerde null.
        created_at: { type: string, format: date-time }
    UserCreate:
      type: object
      description: |
        telefon GLOBAL benzersiz LOGIN anahtaridir (zorunlu; E.164 normalize).
        email ZORUNLU (dogrulama/bildirim + DAVET kanali). (P186) `password` YOK:
        hesap parolasiz acilir ve kisi DAVET (Tesis ID) ile kendi kimligini kurar.
      required: [ad, telefon, email, role]
      properties:
        ad: { type: string }
        telefon:
          type: string
          description: GLOBAL benzersiz giris anahtari (E.164 normalize)
          example: "+905321112204"
        email: { type: string, format: email }
        aranabilir: { type: boolean, default: false }
        role: { $ref: "#/components/schemas/UserRole" }
        gorev_baslangic:
          type: string
          format: date
          nullable: true
          description: >
            (P128) Gorev penceresi basi — bugun yalniz `denetci` icin
            anlamli. Ikisi de bos ise gorev SURESIZDIR.
        gorev_bitis:
          type: string
          format: date
          nullable: true
          description: >
            (P128) Gorev penceresi sonu. `gorev_baslangic`tan once olamaz
            (422; semada da CHECK var — goc 0032). Bu tarih gecince
            kullanici giris yapamaz ve ACIK oturumu da gecersizlesir.
    UserCreatedOut:
      type: object
      description: >
        Kullanici olusturma yaniti. (P186) `temp_code` KALDIRILDI — hesap
        parolasiz acilir ve sahiplenme yalniz DAVET yoluyladir (`davet` ozeti).
      required: [id, ad, role, is_active, aranabilir, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string }
        email: { type: string, nullable: true }
        telefon: { type: string, nullable: true }
        aranabilir: { type: boolean }
        role: { $ref: "#/components/schemas/UserRole" }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
    UserUpdate:
      type: object
      minProperties: 1
      description: >
        (P186) `password` YOK — yonetici bir kullanicinin parolasini
        degistiremez; kullanici kendi `PATCH /me/password` yolunu kullanir.
      properties:
        ad: { type: string }
        email: { type: string, format: email }
        telefon: { type: string, nullable: true }
        aranabilir: { type: boolean }
        role: { $ref: "#/components/schemas/UserRole" }
        is_active: { type: boolean }
        # (P128) Gorev penceresi GUNCELLENEBILIR: uzatma ya da bitis
        # tarihini gecmise cekerek FIILEN IPTAL. `null` gondermek pencereyi
        # KALDIRIR (suresiz gorev) — alani hic gondermemekten farklidir.
        gorev_baslangic: { type: string, format: date, nullable: true }
        gorev_bitis: { type: string, format: date, nullable: true }
    UserContactUpdate:
      type: object
      description: >
        Iletisim ayari (telefon + arama rizasi) — en az bir alan. YONETIM ucunun
        govdesi (PATCH /users/{id}/contact, admin+yonetici -> baskasi).
      minProperties: 1
      properties:
        telefon: { type: string, nullable: true, maxLength: 40 }
        aranabilir: { type: boolean }
    MeContactUpdate:
      type: object
      description: >
        (P167 §1.7) SELF-SERVIS govde (PATCH /me/contact) — UserContactUpdate +
        `ad`. Ad yonetim ucuna EKLENMEDI: "iletisim guncelle" adli bir ucun
        sessizce kimlik alani da degistirebilmesi, yetki matrisi degismeden
        davranisin genislemesi olurdu.

        `email` BILEREK YOK. Bu sistemde e-posta LOGIN ANAHTARIDIR
        (uq_app_user_tenant_email) ve dogrulama akisi yoktur. Dogrulamasiz
        degisim: (a) odunc alinmis bir oturum adresi degistirip hesabin
        sahibini kalici olarak disarida birakabilir, (b) yanlis yazilan bir
        adres parola sifirlamayi SESSIZCE calismaz kilar. Degisim yolu,
        dogrulama kodu akisiyla BIRLIKTE acilmalidir.
      minProperties: 1
      properties:
        telefon: { type: string, nullable: true, maxLength: 40 }
        aranabilir: { type: boolean }
        ad: { type: string, minLength: 1, maxLength: 120 }
    HesapSilmeIstek:
      type: object
      required: [current_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 200
          description: Yeniden kimlik dogrulama — mevcut parola.
    HesapSilmeSonuc:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          description: >
            true = satir tamamen silindi (hesabin hicbir gecmisi yoktu).
            false = yasal saklama geregi satir KALDI, kimlik alanlari
            temizlendi (anonimlestirme). Ikisi de BASARIDIR.
    PasswordChangeRequest:
      type: object
      description: Self-servis parola degisimi (PATCH /me/password) — mevcut parola zorunlu
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password, minLength: 1 }
        new_password: { type: string, format: password, minLength: 8 }
    MeProfileOut:
      type: object
      description: Self-servis profil (GET /me/profile, PATCH /me/contact) — password_hash yok
      required: [id, ad, role, is_active, aranabilir]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string }
        email: { type: string, nullable: true }
        telefon: { type: string, nullable: true }
        aranabilir: { type: boolean }
        role: { $ref: "#/components/schemas/UserRole" }
        is_active: { type: boolean }
        birincil:
          type: boolean
          default: false
          description: >
            Tenant'in BIRINCIL yoneticisi mi? Mobil ilk-giris adlandirma kapisi
            (POST /tenant/setup) yalniz buna acilir; yonetici disi rollerde daima false.
        avatar_url:
          type: string
          nullable: true
          description: >
            (P167 §1.7) Kisa omurlu presigned GET URL'i; obje anahtari ISTEMCIYE
            VERILMEZ (UserOut ile ayni kural). null = fotograf yok → arayuz bas
            harfleri cizer. Buraya eklendi cunku sag ust kullanici menusu ile
            profil sayfasi AYNI kaydin iki gorunumu; avatari /me'den, gerisini
            /me/profile'dan cekmek iki istek ve iki onbellek demekti.
    # ---- (P167 Asama 2) OZET SAYFASI --------------------------------
    HatirlatmaBase:
      type: object
      required: [baslik, baslangic]
      properties:
        baslik: { type: string, minLength: 1, maxLength: 200 }
        aciklama: { type: string, nullable: true, maxLength: 2000 }
        baslangic: { type: string, format: date-time }
        bitis:
          type: string
          format: date-time
          nullable: true
          description: >
            NULL OLABILIR: "saat 14:00'te ara" gibi ANLIK bir hatirlatmanin
            bitisi yoktur; zorunlu kilmak uydurma bir sure girdirirdi.
        renk: { type: string, default: mavi, maxLength: 20 }
        tekrar:
          type: string
          enum: [yok, gunluk, haftalik, aylik]
          default: yok
          description: >
            Tekrar SAKLANIR, genisletilmez — "her hafta" bir KURALDIR ve her
            ornegini satir olarak yazmak, kurali degistirmeyi yuzlerce satir
            guncellemeye cevirirdi. Genisletme /takvim okumasinda, pencere
            kadar yapilir.
    HatirlatmaCreate:
      allOf:
        - $ref: "#/components/schemas/HatirlatmaBase"
    HatirlatmaUpdate:
      type: object
      description: KISMI guncelleme — gonderilmeyen alan DEGISMEZ.
      minProperties: 1
      properties:
        baslik: { type: string, minLength: 1, maxLength: 200 }
        aciklama: { type: string, nullable: true, maxLength: 2000 }
        baslangic: { type: string, format: date-time }
        bitis: { type: string, format: date-time, nullable: true }
        renk: { type: string, maxLength: 20 }
        tekrar: { type: string, enum: [yok, gunluk, haftalik, aylik] }
    HatirlatmaOut:
      allOf:
        - $ref: "#/components/schemas/HatirlatmaBase"
        - type: object
          required: [id, created_at]
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
    TakvimOgesi:
      type: object
      description: >
        Takvimde cizilen TEK olay. Alti kaynak (etkinlik, devriye, aidat,
        gorev, rezervasyon, hatirlatma) BURADA tek dile cevrilir — her biri
        kendi tablosunda baska kolon adlari tasiyor ve ceviriyi istemciye
        birakmak, cizim kodunun alti veri seklini bilmesi demekti.
      required: [tip, id, baslik, baslangic]
      properties:
        tip:
          type: string
          enum: [etkinlik, devriye, aidat, gorev, rezervasyon, hatirlatma]
        id:
          type: string
          format: uuid
          description: >
            Kaynak kaydin kimligi. AIDAT satirlarinda tarihe gore gruplanmis
            bir kumeyi temsil eder ve tarihten turetilmis KARARLI bir uuid5'tir.
            TEKRAR EDEN hatirlatmada AYNI id birden fazla satirda gorunur.
        baslik: { type: string }
        baslangic: { type: string, format: date-time }
        bitis: { type: string, format: date-time, nullable: true }
        hedef:
          type: string
          nullable: true
          description: >
            Tiklaninca gidilecek panel rotasi. SUNUCU veriyor cunku hangi
            kaydin hangi ekranda acildigini uc zaten biliyor; istemcide bir
            `tip -> rota` tablosu tutmak ikinci bir dogruluk kaynagi olurdu.
        renk: { type: string, nullable: true, description: Yalniz hatirlatma icin dolu }
    TakvimResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TakvimOgesi" }
    PanoWidget:
      type: object
      required: [rota]
      properties:
        rota:
          type: string
          maxLength: 200
          description: >
            Menu ogesinin baglantisi. ROTA saklanir, "widget tipi" DEGIL:
            ayri bir tip listesi acmak, menuye eklenen her sayfayi ikinci
            bir yerde daha tanimlamak olurdu.
    PanoBolum:
      type: object
      required: [id]
      properties:
        id: { type: string, maxLength: 40 }
        gizli: { type: boolean, default: false }
    PanoSatir:
      type: object
      description: "(P181 7.1/7.2) Yerlesim satiri: 1-4 sutun + opsiyonel banner."
      properties:
        sutun: { type: integer, minimum: 1, maximum: 4, default: 1 }
        idler:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 40 }
        baslik: { type: string, maxLength: 60, nullable: true }
    PanoTercihi:
      type: object
      description: >
        Kullanicinin Ozet sayfasi duzeni. JSONB'de duruyor ama SEMASIZ
        DEGIL — uc bu modelle dogrular ve tanimadigi anahtari ATAR.
        BOS NESNE = "varsayilani kullan".
      properties:
        widgetlar:
          type: array
          maxItems: 6
          nullable: true
          items: { $ref: "#/components/schemas/PanoWidget" }
          description: En fazla ALTI — sinir sunucuda, cunku asan bir istek seridi tasiran bir pano uretirdi.
        bolumler:
          type: array
          maxItems: 20
          nullable: true
          items: { $ref: "#/components/schemas/PanoBolum" }
        satirlar:
          type: array
          maxItems: 20
          nullable: true
          items: { $ref: "#/components/schemas/PanoSatir" }
          description: "(P181 7.1/7.2) Satir bazli yerlesim; yoksa tam/yarim eslesme."
    BildirimTercihleri:
      type: object
      description: >
        (P167 §1.7) Isleyis bildirimlerinin kanal tercihleri. PazarlamaTercihleri
        ile karistirilmamali — o bir RIZA (varsayilani kapali), bu bir TERCIH
        (varsayilani acik). Kanal basina ayri: uygulamasi acik olan SMS istemez,
        uygulamayi kurmamis olana yalniz e-postayla ulasilir.
      required: [bildirim_eposta, bildirim_sms, bildirim_mobil]
      properties:
        bildirim_eposta: { type: boolean }
        bildirim_sms: { type: boolean }
        bildirim_mobil: { type: boolean }
    BildirimTercihUpdate:
      type: object
      description: KISMI guncelleme — gonderilmeyen kanal DEGISMEZ.
      properties:
        bildirim_eposta: { type: boolean, nullable: true }
        bildirim_sms: { type: boolean, nullable: true }
        bildirim_mobil: { type: boolean, nullable: true }
    CihazOut:
      type: object
      description: >
        (P167 §1.7) "Guvenilen cihazlar" satiri. fcm_token BILINCLI OLARAK YOK —
        push adresidir; disari verilmesi o kullaniciya bildirim gondermenin
        anahtarini vermek olurdu.
      required: [id, platform, dil, aktif, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [android, ios, web] }
        dil: { type: string }
        aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: >
            Son etkinlik — token her uygulama acilisinda upsert edildigi icin
            pratikte "cihaz en son ne zaman gorundu"yu tasir.
    HesapEtkinligiOut:
      type: object
      description: >
        (P167 §1.7) Kendi denetim kaydi satiri. meta KVKK geregi yalniz
        id/alan-adi tasir, kisisel veri DEGERI asla.
      required: [id, action, ts]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        resource_type: { type: string, nullable: true }
        resource_id:
          type: string
          nullable: true
          description: >
            METIN (uuid degil): denetim satiri her zaman bir uuid'ye isaret
            etmez (orn. bir dosya anahtari).
        ts: { type: string, format: date-time }
        meta: { type: object, additionalProperties: true }
    CallTarget:
      type: object
      description: >
        Cozulmus arama hedefi (C1a). Numara YALNIZ burada, yetki+riza kapisindan
        gecince doner. channel C1a'da 'phone'; C1b baska kanallar ekleyecek.
      required: [user_id, ad, role, channel, telefon, tel_uri]
      properties:
        user_id: { type: string, format: uuid }
        ad: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        channel: { type: string, enum: [phone], description: "C1a: phone; C1b genisletir" }
        telefon: { type: string }
        tel_uri: { type: string, example: "tel:+905321112203" }

    # ----------------------- integrations (C1b) -------------------- #
    Integration:
      type: object
      description: >
        Entegrasyon konfig CIKTISI — auth_secret ASLA donmez (write-only);
        yerine auth_secret_set (bool). channel_type C1a kanal soyutlamasini
        genisletir.
      required: [id, ad, channel_type, endpoint_url, http_method, auth_type, aktif, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string }
        channel_type: { type: string, enum: [webhook, megaphone, smarthome] }
        endpoint_url: { type: string, description: "Public http(s); SSRF kapisi tetikte" }
        http_method: { type: string, enum: [GET, POST, PUT, PATCH] }
        headers_json:
          type: object
          additionalProperties: { type: string }
          description: Gizli OLMAYAN ek header'lar
        auth_type: { type: string, enum: [none, bearer, api_key] }
        auth_secret_set:
          type: boolean
          description: Sirrin VARLIGI (sir kendisi donmez — write-only)
        payload_template:
          type: string
          description: "{{message}} / {{title}} yer tutuculu govde sablonu"
        aktif: { type: boolean }
        created_at: { type: string, format: date-time }
    IntegrationCreate:
      type: object
      required: [ad, endpoint_url]
      properties:
        ad: { type: string, minLength: 1, maxLength: 200 }
        channel_type: { type: string, enum: [webhook, megaphone, smarthome], default: webhook }
        endpoint_url:
          type: string
          maxLength: 2000
          description: http(s) olmali (tam SSRF kapisi tetik aninda)
        http_method: { type: string, enum: [GET, POST, PUT, PATCH], default: POST }
        headers_json:
          type: object
          additionalProperties: { type: string }
        auth_type: { type: string, enum: [none, bearer, api_key], default: none }
        auth_secret:
          type: string
          maxLength: 4000
          writeOnly: true
          description: WRITE-ONLY — KEK ile sifreli saklanir; GET'te donmez
        payload_template: { type: string, maxLength: 8000, default: "" }
        aktif: { type: boolean, default: true }
    IntegrationUpdate:
      type: object
      minProperties: 1
      properties:
        ad: { type: string, minLength: 1, maxLength: 200 }
        channel_type: { type: string, enum: [webhook, megaphone, smarthome] }
        endpoint_url: { type: string, maxLength: 2000 }
        http_method: { type: string, enum: [GET, POST, PUT, PATCH] }
        headers_json:
          type: object
          additionalProperties: { type: string }
        auth_type: { type: string, enum: [none, bearer, api_key] }
        auth_secret: { type: string, maxLength: 4000, writeOnly: true }
        payload_template: { type: string, maxLength: 8000 }
        aktif: { type: boolean }
    IntegrationPreset:
      type: object
      required: [key, channel_type, http_method, headers_json, payload_template]
      properties:
        key: { type: string, example: webhook-generic }
        channel_type: { type: string, enum: [webhook, megaphone, smarthome] }
        http_method: { type: string, enum: [GET, POST, PUT, PATCH] }
        headers_json:
          type: object
          additionalProperties: { type: string }
        payload_template: { type: string }
    IntegrationTrigger:
      type: object
      description: Opsiyonel — payload_template yer tutucularini doldurur
      properties:
        message: { type: string, maxLength: 2000 }
        title: { type: string, maxLength: 500 }
    IntegrationTriggerResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, description: 2xx ise true }
        status: { type: integer, nullable: true, description: HTTP durum (ag hatasinda null) }
        error: { type: string, nullable: true, description: SSRF engeli / ag / HTTP hatasi }

    # ---------------------- unit-complaints (D1) ------------------- #
    UnitComplaint:
      type: object
      description: >
        Daire sikayeti ciktisi (Rev-2 GIZLILIK). complainant_user_id +
        complainant_ad ARTIK HICBIR uctan DONMEZ (yonetim dahil, hep null;
        alanlar geriye-uyum icin durur). notlar yalniz yonetime + kendi kaydini
        goren sakine dolu. resident/security/gorevli liste/density'ye ERISEMEZ.
      required: [id, target_unit_id, kategori, durum, created_at]
      properties:
        id: { type: string, format: uuid }
        target_unit_id: { type: string, format: uuid }
        unit_no: { type: string, nullable: true }
        kategori: { type: string, enum: [gurultu, kapi_onu_ayakkabi, zarar_verme, goruntu_kirliligi, diger] }
        notlar:
          type: string
          nullable: true
          description: YALNIZ admin+yonetici icin dolu; diger rollerde null
        durum: { type: string, enum: [acik, kapali, geri_alindi] }
        created_at: { type: string, format: date-time }
        complainant_user_id:
          type: string
          format: uuid
          nullable: true
          description: YALNIZ yonetim (denetim) icin dolu; resident/saha icin null
        complainant_ad: { type: string, nullable: true, description: Sikayet edenin adi (yalniz yonetim) }
        okundu:
          type: boolean
          nullable: true
          description: |
            **(P24)** ISTEGI YAPAN yoneticiye gore okundu mu. Yonetim
            uclarinda (liste / kapatma / okundu) dolu; sakin uclarinda
            (`POST /unit-complaints`, `/mine`) null — okuma durumu bir
            YONETIM kuyrugu kavramidir.
    UnitComplaintCreate:
      type: object
      required: [target_unit_id]
      properties:
        target_unit_id:
          type: string
          format: uuid
          description: >
            Bildirilen HEDEF daire — sakinin KENDI blogunda olmali (blok disi 403).
        kategori:
          type: string
          enum: [gurultu, kapi_onu_ayakkabi, zarar_verme, goruntu_kirliligi, diger]
          default: diger
        notlar: { type: string, nullable: true, minLength: 1, maxLength: 1000 }
    UnitComplaintDecision:
      type: object
      required: [durum]
      properties:
        durum: { type: string, enum: [acik, kapali] }  # (P146) geri_alindi YOK: geri alma sahibinin ucundan (/withdraw)
    UnitDensityItem:
      type: object
      description: Daire-basi ANONIM yogunluk (sikayet eden YOK)
      required: [target_unit_id, unit_no, acik_sayisi, renk]
      properties:
        target_unit_id: { type: string, format: uuid }
        unit_no: { type: string }
        blok: { type: string, nullable: true }
        acik_sayisi: { type: integer, description: ACIK sikayet sayisi }
        renk:
          type: string
          enum: [yesil, sari, kirmizi, mor]
          description: |
            **DORT KADEME (P24)**: `0 → yesil`, `1-2 → sari`, `3-4 → kirmizi`,
            `5+ → mor`. Eskiden uc kademeydi (0-2 yesil...) ve TEK sikayet
            almis daire, hic sikayet almamis daireyle AYNI renkteydi —
            yonetim ilk sinyali goremiyordu.

            Renk SUNUCUDAN gelir; istemci esikleri TEKRARLAMAZ (tek dogruluk
            kaynagi). Sayim tabani ACIK sikayetlerdir: kapatma skalayi
            dusurur, P37'nin sifirlamasi da dogal olarak yesile dondurur.
    UnitDensity:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UnitDensityItem" }

    # ---------------- bina semasi (D-viz Rev-1 — ROL-FARKINDA) ------------- #
    BuildingMapUnit:
      type: object
      description: >
        Haritada tek daire. complaint_count/color YALNIZ yonetim (admin+
        yonetici) icin dolu; resident/security/gorevli icin null (yapi gorunumu).
        benim_sikayetim/benim_acik_sayisi YALNIZ resident icin anlamli — kendi
        kayitlarindan turer (Rev-1.1: sakin KENDI sikayet ettigi daireleri
        harita uzerinde isaretli gorur; genel yogunluk sizmaz).
      required: [unit_id, unit_no]
      properties:
        unit_id: { type: string, format: uuid }
        unit_no: { type: string }
        blok: { type: string, nullable: true }
        kat: { type: integer, nullable: true }
        sira: { type: integer, nullable: true }
        complaint_count:
          type: integer
          nullable: true
          description: ACIK sikayet sayisi — yalniz yonetim; digerinde null
        color:
          type: string
          enum: [yesil, sari, kirmizi, mor]
          nullable: true
          description: |
            Yogunluk rengi — yalniz yonetim; digerinde null.
            **DORT KADEME (P24)**: `0 → yesil`, `1-2 → sari`, `3-4 → kirmizi`,
            `5+ → mor`. Eskiden uc kademeydi (0-2 yesil...) ve TEK sikayet
            almis daire, hic sikayet almamis daireyle AYNI renkteydi —
            yonetim ilk sinyali goremiyordu.

            Renk SUNUCUDAN gelir; istemci esikleri TEKRARLAMAZ (tek dogruluk
            kaynagi). Sayim tabani ACIK sikayetlerdir: kapatma skalayi
            dusurur, P37'nin sifirlamasi da dogal olarak yesile dondurur.
        benim_sikayetim:
          type: boolean
          default: false
          description: >
            resident: bu daireye KENDI (oturum acmis sakin) sikayeti var mi
            (yalniz kendi kayitlarindan). Diger rollerde false.
        benim_acik_sayisi:
          type: integer
          nullable: true
          description: >
            resident: KENDI acik sikayet sayim (0 dahil). Genel sayim DEGIL;
            diger rollerde null.
    BuildingMapKat:
      type: object
      required: [kat, units]
      properties:
        kat: { type: integer }
        units:
          type: array
          items: { $ref: "#/components/schemas/BuildingMapUnit" }
    BuildingMapBlok:
      type: object
      required: [blok, katlar]
      properties:
        blok: { type: string }
        katlar:
          type: array
          items: { $ref: "#/components/schemas/BuildingMapKat" }
    BuildingMap:
      type: object
      description: >
        Cizilebilir yapi: blok -> kat -> daire; yerlesimi eksik daireler
        'unplaced' kovada. ROL-FARKINDA: shows_density yonetimde true (sayim+
        renk dolu); resident/security/gorevli icin false (yalniz yapi). resident
        YALNIZ kendi blogunu gorur. complainant hicbir role donmez.
      required: [shows_density, bloklar, unplaced]
      properties:
        shows_density:
          type: boolean
          description: true = complaint_count/color dolu (yonetim); false = yapi
        bloklar:
          type: array
          items: { $ref: "#/components/schemas/BuildingMapBlok" }
        unplaced:
          type: array
          items: { $ref: "#/components/schemas/BuildingMapUnit" }

    # ---------------- bina blok (D-viz Rev-1) ---------------- #
    Block:
      type: object
      required: [id, ad, unit_sayisi, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, description: Blok etiketi (kisa alfanumerik) }
        kat_sayisi: { type: integer, nullable: true }
        unit_sayisi: { type: integer, description: Bu blogu kullanan daire sayisi }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BlockCreate:
      type: object
      required: [ad]
      properties:
        ad: { type: string, minLength: 1, maxLength: 8, pattern: "^[A-Za-z0-9]+$" }
        kat_sayisi: { type: integer, nullable: true, minimum: 0, maximum: 200 }
    BlockUpdate:
      type: object
      minProperties: 1
      properties:
        ad: { type: string, minLength: 1, maxLength: 8, pattern: "^[A-Za-z0-9]+$" }
        kat_sayisi: { type: integer, nullable: true, minimum: 0, maximum: 200 }
    BlockList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Block" }

    PatrolWindowDurum:
      type: string
      enum: [bekliyor, tamamlandi, kacirildi]

    # ----------------------------- auth ---------------------------- #
    LoginRequest:
      type: object
      description: |
        PANEL girisi (admin — e-posta + tenant_slug). Mobil roller telefon ile
        `POST /auth/login-phone` kullanir.
      required: [tenant_slug, email, password]
      properties:
        tenant_slug:
          type: string
          description: |
            Tenant kisa adi (slug). email tenant-ici benzersiz oldugu icin login
            tenant'i bu alanla belirler. Sadece kucuk harf/rakam/tire.
          example: "acme-plaza"
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
    YoneticiCreate:
      type: object
      description: >
        Tenant olusturmada TEK bir yonetici satiri. Telefon = giris anahtari
        (GLOBAL benzersiz). E-posta ALINMAZ: mobil giris telefonladir ve yonetici
        e-postasini hicbir uc okumaz — tenant seviyesindeki `yonetim_email`
        ayridir. password verilmezse tek seferlik gecici kod uretilir.
      required: [ad, phone]
      properties:
        ad: { type: string, minLength: 2, maxLength: 120, example: "Ayse Yilmaz" }
        phone: { type: string, minLength: 1, example: "+905321112203" }
        password: { type: string, format: password, minLength: 8, nullable: true }
    TenantAdminCreate:
      type: object
      description: >
        Admin bir tenant + N yonetici acar. `yoneticiler` listesindeki ILK eleman
        BIRINCIL'dir (tesisi ilk giriste adlandirir). `ad` verilmezse yer tutucu
        ad + rastgele slug; her durumda kurulum_tamamlandi=false (birincil ONAYLAR).
        Ayni telefon birden fazla yoneticide kullanilamaz (422).
      required: [yoneticiler]
      properties:
        ad: { type: string, minLength: 2, maxLength: 160, nullable: true, example: "Acme Plaza" }
        yonetim_email:
          type: string
          nullable: true
          example: "yonetim@acme.com"
          description: "Tesisin yonetim maili (tenant seviyesi); bos gonderilirse null"
        yoneticiler:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/YoneticiCreate" }
    YoneticiCreatedOut:
      type: object
      required: [user_id, ad, birincil]
      properties:
        user_id: { type: string, format: uuid }
        ad: { type: string }
        birincil: { type: boolean, description: "Listedeki ILK yonetici true (tenant basina en fazla bir)" }
        temp_code:
          type: string
          nullable: true
          example: "K7MR-2QWX"
          description: "YALNIZ parola verilmeyen yonetici icin; BIR KEZ doner"
    TenantAdminCreatedOut:
      type: object
      description: >
        temp_code YALNIZ parola verilmeyen yonetici icin ve BIR KEZ doner (admin
        ilgili yoneticiye iletir). tenant_id GIZLI kimliktir (yalniz admin gorur).
      required: [tenant_id, yoneticiler]
      properties:
        tenant_id: { type: string, format: uuid, description: "GIZLI kimlik (yalniz admin)" }
        yoneticiler:
          type: array
          items: { $ref: "#/components/schemas/YoneticiCreatedOut" }
    TenantAdminListItem:
      type: object
      required: [id, ad, kurulum_tamamlandi, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, example: "(Kurulum bekliyor)" }
        kurulum_tamamlandi: { type: boolean }
        created_at: { type: string, format: date-time }
    TenantAdminListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TenantAdminListItem" }
    TenantSetupRequest:
      type: object
      required: [ad]
      properties:
        ad: { type: string, minLength: 2, maxLength: 120, example: "Örnek Sitesi" }
    TenantYoneticiOut:
      type: object
      required: [id, ad, is_active, password_set]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string }
        telefon: { type: string, nullable: true, description: "Giris anahtari (E.164)" }
        is_active: { type: boolean }
        password_set: { type: boolean, description: "false: henuz gecici kod asamasinda" }
    TenantAdminDetail:
      type: object
      required: [tenant_id, ad, kurulum_tamamlandi, created_at]
      properties:
        tenant_id: { type: string, format: uuid, description: "GIZLI kimlik (yalniz admin)" }
        ad: { type: string, example: "(Kurulum bekliyor)" }
        kurulum_tamamlandi: { type: boolean }
        created_at: { type: string, format: date-time }
        yonetici:
          allOf: [ { $ref: "#/components/schemas/TenantYoneticiOut" } ]
          nullable: true
    TenantAdminUpdate:
      type: object
      description: Admin tesis adini degistirir (rename/duzeltme).
      required: [ad]
      properties:
        ad: { type: string, minLength: 2, maxLength: 120 }
    TenantYoneticiUpdate:
      type: object
      description: Kismi guncelleme — verilmeyen alan degismez.
      properties:
        ad: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, minLength: 1, example: "+905321112203" }
        is_active: { type: boolean }
    TenantYoneticiResetOut:
      type: object
      required: [temp_code]
      properties:
        temp_code: { type: string, example: "K7MR-2QWX", description: "Yeni tek-seferlik kod" }
    # (P154) Tesis basina COKLU yonetici.
    TenantYoneticiListItem:
      type: object
      description: |
        `TenantYoneticiOut` + `birincil` + `created_at`. `birincil` tekil
        detayda YOKTUR (orasi zaten yalniz birincili doner); listede ise
        hangi satirin silinemeyecegini soyleyen tek isarettir.
      required: [id, ad, is_active, password_set, birincil, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string }
        telefon: { type: string, nullable: true }
        is_active: { type: boolean }
        password_set: { type: boolean }
        birincil: { type: boolean, description: "Tenant basina TEK; silinemez" }
        created_at: { type: string, format: date-time }
    TenantYoneticiListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TenantYoneticiListItem" }
    TenantYoneticiAdd:
      type: object
      description: |
        Parola alani YOK — bilincli fark. Tesis kurulumunda admin bazen
        yoneticiyle ayni odadadir; sonradan ekleme uzaktan yapilir ve
        admin'in baskasi adina parola secmesi onu bir kanaldan iletmek
        demektir. Tek yol tek seferlik koddur.
      required: [ad, phone]
      properties:
        ad: { type: string, minLength: 2, maxLength: 120, example: "Ayse Yilmaz" }
        phone: { type: string, minLength: 1, example: "+905321112203" }
    TenantYoneticiAddedOut:
      type: object
      required: [user_id, ad, temp_code]
      properties:
        user_id: { type: string, format: uuid }
        ad: { type: string }
        temp_code: { type: string, description: "BIR KEZ doner; admin ilgiliye iletir" }
    KayitDurumResponse:
      type: object
      description: |
        `POST /auth/giris/kod-iste`in KASTEN BILGISIZ yaniti.

        (P155r2) Tek degeri (`onay_bekliyor`) P148 onay kuyrugundan arta
        kaldi ve artik bir kuyrugu ANLATMIYOR — o kuyruk kaldirildi.
        Yine de degistirilmedi: `kod-iste` numaranin kayitli olup
        olmadigini SIZDIRMAMALI, yani yanit her durumda AYNI olmali.
        Sabit tek degerli bir alan bunu yapisal olarak garantiler.
      required: [durum]
      properties:
        durum: { type: string, enum: [onay_bekliyor] }
    # (P155r2 / §3) Yonetici self-signup.
    TesisOlusturRequest:
      type: object
      description: |
        `tesis_kodu` ISTENMEZ ve GONDERILEMEZ — kodu sunucu uretir.
        `parola` VEYA `baglama_jetonu` verilmeli, ikisi birden DEGIL.
        (P187) `telefon` OPSIYONEL — bu uc SSO "yeni tesis" yolu icindir; SSO
        kimligi telefon vermez ve yonetici SSO ile girer.
      required: [tesis_ad, ad]
      properties:
        tesis_ad: { type: string, minLength: 2, maxLength: 120, example: "Oltu Sitesi" }
        ad:       { type: string, minLength: 2, maxLength: 120, example: "Ayse Yilmaz" }
        telefon:  { type: string, minLength: 5, maxLength: 32, nullable: true, example: "+905321112203" }
        parola:
          type: string
          minLength: 8
          maxLength: 128
          nullable: true
          description: Elle kayit yolu. Sosyal yolda BOS birakilir.
        baglama_jetonu:
          type: string
          nullable: true
          description: |
            Sosyal yol: `POST /auth/oauth/sonuc`un dondugu kisa omurlu
            jeton. Saglayicidan gelen ad soyad ISTEMCIDE forma doldurulur
            ve kullanici duzeltebilir; sunucuya `ad` alaninda gelir.
    TesisOlusturResponse:
      type: object
      required: [tesis_ad, tesis_kodu, jetonlar]
      properties:
        tesis_ad:   { type: string, example: "Oltu Sitesi" }
        tesis_kodu: { type: string, example: "OLTU-260715" }
        jetonlar:   { $ref: "#/components/schemas/TokenPair" }
    # ------------------------------------------------------------------ #
    # (P177 §4-§6) YENI KAYIT AKISI SEMALARI
    # ------------------------------------------------------------------ #
    YoneticiBasvuruRequest:
      type: object
      description: |
        Yonetici kayit formunun govdesi. TESIS ADI BURADA ISTENMEZ —
        tesis, e-posta dogrulandiktan sonra ayri bir ucta acilir.

        `onay_sozlesme` ve `onay_kvkk` ZORUNLUDUR: `false` gonderilirse
        422 doner. Kapi hem semada hem veritabani kisitindadir
        (`ck_yonetici_basvuru_zorunlu_onay`) — ileride yazilacak bir uc
        onayi atlayamasin diye.

        IP ve tarayici bilgisi GOVDEDE YOK: basliktan okunur.
      required: [ad, soyad, eposta, telefon, parola, onay_sozlesme, onay_kvkk]
      properties:
        ad:      { type: string, minLength: 2, maxLength: 80, example: "Ayse" }
        soyad:   { type: string, minLength: 2, maxLength: 80, example: "Yilmaz" }
        eposta:  { type: string, format: email, example: "ayse@ornek.com" }
        telefon: { type: string, minLength: 5, maxLength: 32, example: "+905321112203" }
        parola:  { type: string, minLength: 8, maxLength: 128 }
        onay_sozlesme:
          type: boolean
          description: Kullanici Sozlesmesi onayi — ZORUNLU.
        onay_kvkk:
          type: boolean
          description: KVKK Aydinlatma Metni onayi — ZORUNLU.
        onay_ticari:
          type: boolean
          default: false
          description: |
            Ticari elektronik ileti onayi — ISTEGE BAGLI. SAKLANIR ama
            `TICARI_ILETI_AKTIF=false` oldugu surece hicbir ileti
            gonderilmez (sirket ve IYS kaydi yok).
    YoneticiBasvuruResponse:
      type: object
      required: [durum]
      properties:
        durum:
          type: string
          enum: [kod_gonderildi]
          description: |
            HER ZAMAN `kod_gonderildi`. Adresin sistemde olup olmadigi
            yanittan okunamaz.
    YoneticiDogrulaRequest:
      type: object
      required: [eposta, kod]
      properties:
        eposta: { type: string, format: email }
        kod:    { type: string, minLength: 4, maxLength: 8, example: "482913" }
    YoneticiDogrulaResponse:
      type: object
      required: [kurulum_jetonu]
      properties:
        kurulum_jetonu:
          type: string
          description: |
            `type=tesis_kurulum` tasiyan kisa omurlu jeton. OTURUM
            DEGILDIR ve yalniz `/auth/kayit/yonetici-tesis` ucunu acar.
    YoneticiTesisRequest:
      type: object
      required: [kurulum_jetonu, tesis_ad]
      properties:
        kurulum_jetonu: { type: string }
        tesis_ad: { type: string, minLength: 2, maxLength: 120, example: "Oltu Sitesi" }
    RolEpostaBaslaRequest:
      type: object
      description: |
        `ad` ve `telefon` YALNIZ BILGI AMACLIDIR: kuyruga dusen bir
        denemede yonetici kimin denedigini gorsun diye saklanir.
        DOGRULAMADA KULLANILMAZ — dogrulama e-posta uzerinden yurur.
      required: [tesis_kodu, eposta, rol]
      properties:
        tesis_kodu: { type: string, minLength: 3, maxLength: 40, example: "OLTU-260715" }
        eposta:     { type: string, format: email }
        rol:
          type: string
          enum: [resident, security, gorevli]
          description: |
            `yonetici`/`admin` BILEREK YOK: yonetici kendi yolundan
            (basvuru) gelir, ek yoneticiyi mevcut yonetici ekler.
        ad:      { type: string, maxLength: 120, nullable: true }
        telefon: { type: string, maxLength: 32, nullable: true }
    RolEpostaBaslaResponse:
      type: object
      required: [tesis_ad, durum]
      properties:
        tesis_ad: { type: string, example: "Oltu Sitesi" }
        durum:
          type: string
          enum: [kod_gonderildi]
          description: Eslesme sonucu bu alandan OKUNAMAZ.
    RolEpostaDogrulaRequest:
      type: object
      required: [tesis_kodu, eposta, kod]
      properties:
        tesis_kodu: { type: string, minLength: 3, maxLength: 40 }
        eposta:     { type: string, format: email }
        kod:        { type: string, minLength: 4, maxLength: 8 }
    RolEpostaDogrulaResponse:
      type: object
      description: |
        TEK YANIT TIPI, IKI SONUC. `hazir` ise `setup_token` doludur ve
        `POST /auth/set-password` ile parola belirlenir. `onay_bekliyor`
        ise hesap ACILMAMISTIR ve deneme tesisin onay kuyruguna dusmustur.
      required: [durum]
      properties:
        durum:
          type: string
          enum: [hazir, onay_bekliyor]
        setup_token:
          type: string
          nullable: true
          description: Yalniz `durum=hazir` iken dolu.
    # (P154 / Asama 3) Rol secimli kayit.
    RolKayitBaslaRequest:
      type: object
      description: |
        `daire_no` YALNIZ `resident` icin anlamlidir ve orada ZORUNLUDUR;
        yoneticiden daire istenmez.

        `rol` kumesi: `admin` YOK (platform sahibi, tesis kaydiyla
        acilmaz); `guvenlik_amiri` YOK (brief'in mobil/web rol
        listelerinde gecmiyor — enum'da duruyor, kaydolabilir yapmak
        ayri bir urun karari).
      required: [rol, tesis_kodu, telefon]
      properties:
        rol:
          type: string
          enum: [yonetici, resident, security, tesis_gorevlisi, denetci]
        tesis_kodu: { type: string, minLength: 4, maxLength: 32, example: "OLTU-260715" }
        telefon:    { type: string, minLength: 5, maxLength: 32, example: "+905321112203" }
        daire_no:   { type: string, maxLength: 32, nullable: true, description: "`resident` icin ZORUNLU" }
        blok:       { type: string, maxLength: 32, nullable: true }
    RolKayitBaslaResponse:
      type: object
      description: |
        `telefon_maskeli` KULLANICININ YAZDIGI numaradan uretilir, kayitli
        bir numaradan degil — maskenin kendisi bilgi tasimaz.
      required: [tesis_ad, telefon_maskeli]
      properties:
        tesis_ad:        { type: string, example: "Oltu Sitesi" }
        telefon_maskeli: { type: string, example: "+9053***203" }
    RolKayitDogrulaRequest:
      type: object
      required: [telefon, kod]
      properties:
        telefon: { type: string, minLength: 5, maxLength: 32 }
        kod:     { type: string, minLength: 4, maxLength: 12 }
    RolKayitDogrulaResponse:
      type: object
      required: [setup_token]
      properties:
        setup_token:
          type: string
          description: YALNIZ /auth/set-password'te gecer; TEK KULLANIMLIK.
    # (P154 / Asama 6.3) Arama.
    AramaVurusu:
      type: object
      description: |
        GOVDE DONMEZ, yalniz baslik + kisa ayrinti: arama bir ONIZLEME
        yuzeyidir. Tam kaydi vermek, listeleme uclarinin alan bazli
        gizlemelerini atlayan ikinci bir okuma yolu acardi.
      required: [kaynak, id, baslik]
      properties:
        kaynak:
          type: string
          enum: [kisi, daire, blok, firma, gorev, duyuru, talep, finans]
        id:      { type: string, format: uuid }
        baslik:  { type: string }
        ayrinti: { type: string, nullable: true }
    # ---------------- (P154 / Asama 6.4) NOT VE EK ---------------- #
    EkVarlikTipi:
      type: string
      description: |
        Ek takilabilen varliklar — KAPALI KUME. Serbest metin birakmak,
        `unit` yerine `units` yazan bir cagiranin sessizce erisilemez bir
        ek uretmesi demekti. Ayni kume goc 0043'teki `ck_varlik_eki_tipi`
        CHECK kisitinda ve `routers/ekler.py::VARLIKLAR`ta durur;
        `test_ekler.py::test_varlik_tipleri_GOCLE_AYNI` ikisini kilitler.
      enum: [unit, app_user, task, icra_dosyasi, tenant_dokuman,
             complaint, firma, building_block]
    EkTuru:
      type: string
      description: |
        `not` -> `metin` zorunlu. `dosya` -> `dosya_key` zorunlu, `metin`
        opsiyonel aciklamadir. Kural hem burada hem veritabanindaki
        `ck_varlik_eki_icerik` CHECK'inde; sozlesme duzeyinde reddetmek
        kullaniciya NE eksik oldugunu soyler.
      enum: [not, dosya]
    EkGirdi:
      type: object
      required: [varlik_tipi, varlik_id, tur]
      properties:
        varlik_tipi: { $ref: "#/components/schemas/EkVarlikTipi" }
        varlik_id:   { type: string, format: uuid }
        tur:         { $ref: "#/components/schemas/EkTuru" }
        metin:       { type: string, maxLength: 4000, nullable: true }
        dosya_key:   { type: string, maxLength: 500, nullable: true }
        dosya_adi:   { type: string, maxLength: 255, nullable: true }
    Ek:
      type: object
      required: [id, tur, created_at]
      properties:
        id:        { type: string, format: uuid }
        tur:       { $ref: "#/components/schemas/EkTuru" }
        metin:     { type: string, nullable: true }
        dosya_key: { type: string, nullable: true }
        dosya_adi: { type: string, nullable: true }
        olusturan_ad:
          type: string
          nullable: true
          description: Kim ekledi. "kim yazdi" bilinmeyen bir not, kayit
            defterinde ise yaramaz.
        created_at: { type: string, format: date-time }
    EkListesi:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Ek" }
    # ---------- (P154 / Asama 5) YAPI DUZENLEME TOPLU ISLEMLERI ---------- #
    TopluIslemSonuc:
      type: object
      required: [etkilenen]
      properties:
        etkilenen: { type: integer }
        atlanan:
          type: array
          items: { type: string }
          description: >
            Bulunamayan kimlikler. RLS baska tenant'in satirini zaten
            gostermez; kimlik SESSIZCE dusmez, burada gorunur.
    UnitTopluGuncelle:
      type: object
      required: [unit_ids]
      properties:
        unit_ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, format: uuid }
        unit_tip_id: { type: string, format: uuid, nullable: true }
        unit_grup_id: { type: string, format: uuid, nullable: true }
        aktif: { type: boolean, nullable: true }
    UnitSiralamaSatiri:
      type: object
      required: [id, kat, sira]
      properties:
        id: { type: string, format: uuid }
        kat: { type: integer }
        sira: { type: integer }
    UnitSiralama:
      type: object
      required: [satirlar]
      properties:
        satirlar:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/UnitSiralamaSatiri" }
    KatSilIstek:
      type: object
      required: [blok, kat]
      properties:
        blok: { type: string, minLength: 1, maxLength: 8 }
        kat: { type: integer }
        cascade: { type: boolean, default: false }
    TopluSilIstek:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }
        cascade: { type: boolean, default: false }
    TopluSilSonuc:
      type: object
      required: [silinen]
      properties:
        silinen: { type: integer }
        atlanan:
          type: array
          items: { type: object }
          description: "Silinemeyenler ve SEBEBI — sessizce atlamak, kullanicinin sildigini sanmasi demekti."
    # ---------- (P154 / Asama 8) ICE AKTARIM CATISI ---------- #
    IceAktarimAlan:
      type: object
      required: [kod, zorunlu, ornek]
      properties:
        kod: { type: string, description: "Istemcinin kolon eslemesi bunun uzerine kurulur." }
        zorunlu: { type: boolean }
        ornek: { type: string }
    IceAktarimTur:
      type: object
      required: [kod, aciklama_kodu, alanlar]
      properties:
        kod:
          type: string
          enum: [daire, kisi, acilis_bakiye, arac]
        aciklama_kodu:
          type: string
          description: "METIN DEGIL ANAHTAR — etiket istemcide aktif dilde cozulur."
        alanlar:
          type: array
          items: { $ref: "#/components/schemas/IceAktarimAlan" }
    IceAktarimSatir:
      type: object
      required: [satir_no]
      properties:
        satir_no: { type: integer }
        degerler:
          type: object
          additionalProperties: { type: string, nullable: true }
          description: "BIZIM alan kodlarimizla; esleme istemcide yapilir."
    IceAktarimIstek:
      type: object
      required: [satirlar]
      properties:
        satirlar:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: "#/components/schemas/IceAktarimSatir" }
        yalniz_dogrula:
          type: boolean
          default: false
          description: "True ise HICBIR SEY yazilmaz, yalnizca rapor doner."
        dosya_adi:
          type: string
          nullable: true
          maxLength: 255
          description: >
            Yalniz gecmis listesinde gosterilir. DOSYANIN KENDISI SAKLANMAZ
            — icinde kisisel veri olabilir (KVKK: veri en az).
    IceAktarimHata:
      type: object
      required: [satir_no, hata]
      properties:
        satir_no: { type: integer }
        alan: { type: string, nullable: true }
        hata: { type: string }
    IceAktarimSonuc:
      type: object
      required: [satir_sayisi, olusan, atlanan, hatali, hatalar]
      properties:
        satir_sayisi: { type: integer }
        olusan: { type: integer }
        atlanan: { type: integer, description: "Zaten var olan kayit (IDEMPOTENT)." }
        hatali: { type: integer }
        hatalar:
          type: array
          items: { $ref: "#/components/schemas/IceAktarimHata" }
        aktarim_id:
          type: string
          format: uuid
          nullable: true
          description: "Yalniz UYGULANDIGINDA doner; onizlemede null."
    IceAktarimKosum:
      type: object
      required: [id, tur, satir_sayisi, olusan, atlanan, hatali, durum, created_at]
      properties:
        id: { type: string, format: uuid }
        tur: { type: string, enum: [daire, kisi, acilis_bakiye, arac] }
        dosya_adi: { type: string, nullable: true }
        satir_sayisi: { type: integer }
        olusan: { type: integer }
        atlanan: { type: integer }
        hatali: { type: integer }
        durum: { type: string, enum: [uygulandi, geri_alindi] }
        created_at: { type: string, format: date-time }
        geri_alma_at: { type: string, format: date-time, nullable: true }
    # ---------- (P154 / Asama 7.3) KURULUM SIHIRBAZI ---------- #
    KurulumAdimi:
      type: object
      required: [kod, sayi, tamam, atlandi]
      properties:
        kod:
          type: string
          description: |
            Adim kodu — METIN DEGIL KIMLIK. Etiket istemcide aktif dilde
            cozulur. Kume SABIT ve `routers/kurulum.py::ADIMLAR` ile ayni.
          enum: [blok, daire, daire_tipi, sakin, personel, gorev_alani,
                 nfc_noktasi, aidat]
        sayi:
          type: integer
          description: >
            Adimin uretmis oldugu kayit sayisi. `tamam` ile birlikte doner
            cunku "3 blok var" ile "blok var" kullaniciya ayni seyi
            soylemez.
        tamam: { type: boolean, description: "sayi > 0 — VERIDEN sayilir" }
        atlandi: { type: boolean, description: "BILINCLI atlandi" }
    KurulumDurumu:
      type: object
      required: [adimlar, toplam, gecilen]
      properties:
        adimlar:
          type: array
          items: { $ref: "#/components/schemas/KurulumAdimi" }
        toplam: { type: integer }
        gecilen:
          type: integer
          description: >
            Tamamlanan + BILINCLI ATLANAN. Atlanani saymasaydik, bilincli
            atlayan bir tesis %100'e asla ulasamaz ve gosterge kalici bir
            sitem olurdu.
    KurulumAtla:
      type: object
      required: [kod]
      properties:
        kod: { $ref: "#/components/schemas/KurulumAdimi/properties/kod" }
        atla:
          type: boolean
          default: true
          description: "`false` ATLAMAYI GERI ALIR."
    AramaSonucu:
      type: object
      required: [q, items]
      properties:
        q: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/AramaVurusu" }
    EpostaKodIstek:
      type: object
      required: [tenant_slug, eposta]
      properties:
        tenant_slug: { type: string, minLength: 1, maxLength: 100 }
        eposta: { type: string, format: email }
    EpostaKodDogrulaIstek:
      type: object
      required: [tenant_slug, eposta, kod]
      properties:
        tenant_slug: { type: string, minLength: 1, maxLength: 100 }
        eposta: { type: string, format: email }
        kod: { type: string, minLength: 4, maxLength: 12 }
    SifreKodIstek:
      type: object
      required: [tenant_slug, eposta]
      properties:
        tenant_slug: { type: string, minLength: 1, maxLength: 100 }
        eposta: { type: string, format: email }
    SifreSifirlaIstek:
      type: object
      required: [tenant_slug, eposta, kod, yeni_parola]
      properties:
        tenant_slug: { type: string, minLength: 1, maxLength: 100 }
        eposta: { type: string, format: email }
        kod: { type: string, minLength: 4, maxLength: 12 }
        yeni_parola: { type: string, minLength: 8 }
    TelefonIstek:
      type: object
      required: [telefon]
      properties:
        telefon: { type: string, minLength: 5, maxLength: 32, example: "+905321112203" }
    TelefonKodIstek:
      type: object
      required: [telefon, kod]
      properties:
        telefon: { type: string, minLength: 5, maxLength: 32 }
        kod:     { type: string, minLength: 4, maxLength: 12 }
    PhoneLoginRequest:
      type: object
      description: |
        Mobil giris — cep telefonu (GLOBAL benzersiz) + parola/gecici kod.
        Tenant numaradan otomatik cozulur (tenant_slug YOK). Numara E.164
        normalize edilir (0->+90).
      required: [phone, password]
      properties:
        phone:
          type: string
          description: Cep telefonu (global benzersiz login anahtari)
          example: "+905321112203"
        password:
          type: string
          description: Kalici parola VEYA ilk giriste gecici kod
    PhoneLoginResponse:
      type: object
      required: [password_setup_required]
      properties:
        password_setup_required:
          type: boolean
          description: |
            true => gecici kodla ilk giris; `setup_token` ile
            `POST /auth/set-password` ZORUNLU (oturum token'i verilmedi).
            false => normal oturum; TokenPair alanlari dolu.
        setup_token:
          type: string
          nullable: true
          description: Kisa omurlu (~10 dk) parola-kurulum token'i
        access_token: { type: string, nullable: true }
        refresh_token: { type: string, nullable: true }
        token_type: { type: string, nullable: true, example: Bearer }
        expires_in: { type: integer, nullable: true, example: 900 }
    SetPasswordRequest:
      type: object
      required: [setup_token, new_password]
      properties:
        setup_token: { type: string }
        new_password: { type: string, format: password, minLength: 8 }
    ResidentCreate:
      type: object
      required: [unit_no, ad, telefon]
      properties:
        unit_no: { type: string, example: "A-12" }
        blok:
          type: string
          nullable: true
          description: Yalniz YENI acilan daireye islenir
        ad: { type: string, example: "Ayse Yilmaz" }
        telefon:
          type: string
          description: GLOBAL benzersiz giris anahtari (E.164 normalize)
          example: "+905321112203"
        email:
          type: string
          format: email
          nullable: true
          description: OPSIYONEL (giris anahtari degildir; bildirim/yedek)
        rol_tipi: { $ref: "#/components/schemas/ResidentRol" }
        # (P186) `password` YOK: hesap parolasiz acilir ve kisi DAVET (Tesis ID)
        # ile kendi kimligini kurar; yonetici parola atamaz.
    ResidentCreated:
      type: object
      description: >
        (P186) `temp_code` KALDIRILDI — hesap parolasiz acilir, sahiplenme yalniz
        DAVET yoluyladir (`davet` ozeti gonderim durumunu tasir).
      required: [user_id, unit_id, unit_no, ad]
      properties:
        user_id: { type: string, format: uuid }
        unit_id: { type: string, format: uuid }
        unit_no: { type: string, example: "A-12" }
        ad: { type: string }
        email: { type: string, nullable: true }
    ResidentListItem:
      type: object
      description: Site sakin listesi ogesi — telefon KVKK geregi YOK.
      required: [user_id, ad, is_active]
      properties:
        user_id: { type: string, format: uuid }
        ad: { type: string }
        unit_no:
          type: string
          nullable: true
          description: Aktif daire(ler); coklu ise virgulle birlesir, yoksa null
          example: "A-12"
        is_active: { type: boolean }
    ResidentListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ResidentListItem" }
    ResidentUpdate:
      type: object
      description: |
        Sakin duzenle — en az bir alan. **KURAL (P23b): olusturmada girilebilen
        HER ALAN sonradan da duzenlenebilir.** Eskiden yalniz `ad` + `telefon`
        vardi; `email` ve `rol_tipi` olusturmada giriliyor ama bir daha
        DEGISTIRILEMIYORDU — kiraci cikip malik oturunca kayit yanlis kaliyor
        ve bu muhasebe hedeflemesini (P28) dogrudan bozuyordu.

        * `telefon` global benzersizdir (normalize; cakisma **409**).
        * `email` acikca `null` gonderilerek TEMIZLENEBILIR (sakinde opsiyonel).
        * `rol_tipi` kullanicinin **AKTIF** daire baglarinin HEPSINE uygulanir
          (`bitis IS NULL`). Aktif bag yoksa **422 `invalid_reference`** —
          once daire atanmalidir (`POST /units/{id}/residents`).
        * Gonderilmeyen alan DEGISMEZ.
      minProperties: 1
      properties:
        ad: { type: string, minLength: 1 }
        telefon: { type: string, minLength: 1, example: "+905321112203" }
        email:
          type: string
          format: email
          nullable: true
          description: "Acikca `null` = temizle"
        rol_tipi:
          type: string
          enum: [malik, kiraci]
          nullable: true
          description: >
            AKTIF daire baglarina uygulanir. Bir dairede hem malik hem kiraci
            olabilir (ayri kayitlar); muhasebede aidat KIRACI ONCELIKLI,
            yatirim/demirbas MALIK hedeflidir (P28).
    ResidentDeleteOut:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          description: true=tamamen silindi (gecmissiz); false=pasiflestirildi (gecmis var)
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [Bearer], example: Bearer }
        expires_in:
          type: integer
          description: Access token gecerlilik suresi (saniye)
          example: 900

    # ---------------------------- shift ---------------------------- #
    Shift:
      type: object
      required: [id, ad, baslangic_saat, bitis_saat, gun_tipi, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, example: "Gece Vardiyasi" }
        baslangic_saat:
          type: string
          description: "Gun-ici saat (HH:MM, tenant.timezone'a gore)"
          example: "00:00"
        bitis_saat:
          type: string
          description: "HH:MM. bitis < baslangic ise ertesi gune sarkar"
          example: "08:00"
        gun_tipi: { $ref: "#/components/schemas/GunTipi" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ShiftCreate:
      type: object
      required: [ad, baslangic_saat, bitis_saat]
      properties:
        ad: { type: string }
        baslangic_saat: { type: string, example: "00:00" }
        bitis_saat: { type: string, example: "08:00" }
        gun_tipi: { $ref: "#/components/schemas/GunTipi" }
    ShiftUpdate:
      type: object
      minProperties: 1
      properties:
        ad: { type: string }
        baslangic_saat: { type: string }
        bitis_saat: { type: string }
        gun_tipi: { $ref: "#/components/schemas/GunTipi" }

    # -------------------------- checkpoint ------------------------- #
    Checkpoint:
      type: object
      required: [id, ad, nfc_tag_uid, aktif, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, example: "A Blok Giris" }
        nfc_tag_uid: { type: string, example: "04:A3:B2:C1:90:00" }
        gps_lat: { type: number, format: double, nullable: true, example: 41.015137 }
        gps_lng: { type: number, format: double, nullable: true, example: 28.979530 }
        aktif: { type: boolean }
        sdm_aktif:
          type: boolean
          description: "NTAG424 SDM anahtari kayitli mi (anahtarin kendisi ASLA donmez)"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CheckpointCreate:
      type: object
      required: [ad, nfc_tag_uid]
      properties:
        ad: { type: string }
        nfc_tag_uid: { type: string }
        gps_lat: { type: number, format: double, nullable: true }
        gps_lng: { type: number, format: double, nullable: true }
        aktif: { type: boolean, default: true }
    CheckpointUpdate:
      type: object
      minProperties: 1
      properties:
        ad: { type: string }
        nfc_tag_uid: { type: string }
        gps_lat: { type: number, format: double, nullable: true }
        gps_lng: { type: number, format: double, nullable: true }
        aktif: { type: boolean }

    # -------------------------- patrol plan ------------------------ #
    PatrolPlan:
      type: object
      required: [id, ad, baslangic_saat, bitis_saat, periyot_dakika, aktif, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, example: "Gece Devriyesi" }
        shift_id: { type: string, format: uuid, nullable: true }
        baslangic_saat:
          type: string
          description: "HH:MM, tenant.timezone'a gore (orn 00:00)"
          example: "00:00"
        bitis_saat:
          type: string
          example: "06:00"
        periyot_dakika:
          type: integer
          minimum: 1
          description: "Pencere periyodu (orn 60 => saat basi)"
          example: 60
        aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PatrolPlanDetail:
      allOf:
        - $ref: "#/components/schemas/PatrolPlan"
        - type: object
          properties:
            checkpoints:
              type: array
              items: { $ref: "#/components/schemas/PatrolPlanCheckpoint" }
    PatrolPlanCreate:
      type: object
      required: [ad, baslangic_saat, bitis_saat, periyot_dakika]
      properties:
        ad: { type: string }
        shift_id: { type: string, format: uuid, nullable: true }
        baslangic_saat: { type: string, example: "00:00" }
        bitis_saat: { type: string, example: "06:00" }
        periyot_dakika: { type: integer, minimum: 1, example: 60 }
        aktif: { type: boolean, default: true }
    PatrolPlanUpdate:
      type: object
      minProperties: 1
      properties:
        ad: { type: string }
        shift_id: { type: string, format: uuid, nullable: true }
        baslangic_saat: { type: string }
        bitis_saat: { type: string }
        periyot_dakika: { type: integer, minimum: 1 }
        aktif: { type: boolean }

    PatrolPlanCheckpoint:
      type: object
      required: [checkpoint_id, sira]
      properties:
        checkpoint_id: { type: string, format: uuid }
        sira: { type: integer, minimum: 0, example: 0 }
        checkpoint:
          allOf:
            - $ref: "#/components/schemas/Checkpoint"
          nullable: true
          description: "Detay yanitlarinda genisletilmis checkpoint (opsiyonel)"
    PatrolPlanCheckpointAssign:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [checkpoint_id]
            properties:
              checkpoint_id: { type: string, format: uuid }
              sira:
                type: integer
                minimum: 0
                description: "Verilmezse dizi index'i kullanilir"

    # ---------------------------- scans ---------------------------- #
    ScanReportItem:
      type: object
      description: "Gun-gun tarama raporu satiri: kim, hangi nokta, ne zaman."
      required: [id, checkpoint_id, checkpoint_ad, guard_id, guard_ad, okutma_zamani, imza_dogrulandi]
      properties:
        id: { type: string, format: uuid }
        checkpoint_id: { type: string, format: uuid }
        checkpoint_ad: { type: string }
        guard_id: { type: string, format: uuid }
        guard_ad: { type: string }
        okutma_zamani: { type: string, format: date-time }
        gps_lat: { type: number, format: double, nullable: true }
        gps_lng: { type: number, format: double, nullable: true }
        konum_durumu:
          type: string
          enum: [var, izin_yok, servis_kapali, zaman_asimi, bilinmiyor]
          default: bilinmiyor
          description: (P34) Konumun NEDEN yok oldugu
        gps_dogruluk_m: { type: number, format: double, nullable: true }
        imza_dogrulandi: { type: boolean }
    ScanReportResponse:
      type: object
      required: [tarih, items]
      properties:
        tarih: { type: string, format: date }
        items:
          type: array
          items: { $ref: "#/components/schemas/ScanReportItem" }
        konumsuz_sayisi:
          type: integer
          default: 0
          description: >
            (P34) O gunun konumsuz okutma sayisi — `konumsuz` suzgecinden
            BAGIMSIZ hesaplanir.
    SimuleScanCreate:
      type: object
      required: [checkpoint_id]
      description: >
        `nfc_tag_uid` YOKTUR ve olamaz: etiket UID'sini istemciden almak,
        "hangi etiket okutuldu" sorusunu istemcinin uydurmasina birakmak
        olurdu. Sunucu UID'yi `checkpoint_id`den kendisi cozer.
      properties:
        checkpoint_id: { type: string, format: uuid }
        patrol_window_id: { type: string, format: uuid, nullable: true }
        okutma_zamani:
          type: string
          format: date-time
          nullable: true
          description: Verilmezse SUNUCU SAATI kullanilir.
        gps_lat: { type: number, nullable: true }
        gps_lng: { type: number, nullable: true }
    ScanCreate:
      type: object
      required: [nfc_tag_uid, okutma_zamani]
      properties:
        nfc_tag_uid:
          type: string
          description: "Okutulan NFC etiketi; backend checkpoint'e eslestirir"
          example: "04:A3:B2:C1:90:00"
        checkpoint_id:
          type: string
          format: uuid
          nullable: true
          description: "Istemci biliyorsa; yoksa nfc_tag_uid ile cozumlenir"
        patrol_window_id:
          type: string
          format: uuid
          nullable: true
          description: "Ad-hoc okutmada bos birakilabilir; backend de eslestirebilir"
        okutma_zamani:
          type: string
          format: date-time
          description: "Cihazin okuttugu an (UTC). Offline gecikmeli gonderilebilir."
        gps_lat: { type: number, format: double, nullable: true }
        gps_lng: { type: number, format: double, nullable: true }
        konum_durumu:
          type: string
          enum: [var, izin_yok, servis_kapali, zaman_asimi, bilinmiyor]
          nullable: true
          description: >
            (P34) Konum NEDEN yok? Verilmezse SUNUCU TURETIR: koordinat varsa
            `var`, yoksa `bilinmiyor`. Uc farkli durumun tek bir NULL'a inmesi,
            amirin "konumsuz okutma" diye bir sey OLDUGUNU fark etmesini
            engellerdi. `var` gonderilirse koordinat ZORUNLUDUR (422).
        gps_dogruluk_m:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: >
            (P34) Metre. AYRI alandir: 5 m ile 2 km dogrulukla alinmis konum
            ekranda AYNI gorunurdu ve ikincisi kanit degeri tasimaz.
        foto_key:
          type: string
          nullable: true
          maxLength: 500
          description: >
            (P34) Tur baslangic fotografinin DEPO ANAHTARI
            (`POST /uploads/presign` ile alinir). Tenant namespace'i
            dogrulanir — baska tenant'in objesini tur kaniti diye baglamak
            IDOR olurdu (422 `invalid_foto_key`).
        foto_url:
          type: string
          nullable: true
          deprecated: true
          description: >-
            Sozlesmenin ilk surumunden kalma; DOGRULANMAZ. Yeni istemciler
            `foto_key` gonderir (ikisi de ayni kolona yazilir).
        imza_dogrulandi:
          type: boolean
          default: false
          deprecated: true
          description: >-
            DEPRECATED + YOK SAYILIR: deger artik SUNUCUDA NTAG424 SDM
            dogrulamasiyla hesaplanir; govdedeki girdi etkisizdir (eski mobil
            surumler kirilmaz). SDM icin sdm_picc_data + sdm_cmac gonderin.
        sdm_picc_data:
          type: string
          nullable: true
          minLength: 32
          maxLength: 32
          description: "NTAG424 SDM ENCPICCData (16B, hex) — etiketin NDEF ciktisindan"
          example: "EF963FF7828658A599F3041510671E88"
        sdm_cmac:
          type: string
          nullable: true
          minLength: 16
          maxLength: 16
          description: "NTAG424 SDMMAC (8B, hex) — sdm_picc_data ile BIRLIKTE gonderilir"
          example: "94EED9EE65337086"
    ScanEvent:
      type: object
      required: [id, guard_id, checkpoint_id, nfc_tag_uid, okutma_zamani, imza_dogrulandi, created_at]
      properties:
        id: { type: string, format: uuid }
        guard_id:
          type: string
          format: uuid
          description: "Token'dan turetilir (okutmayi yapan kullanici)"
        checkpoint_id: { type: string, format: uuid }
        patrol_window_id: { type: string, format: uuid, nullable: true }
        nfc_tag_uid: { type: string }
        okutma_zamani: { type: string, format: date-time }
        gps_lat: { type: number, format: double, nullable: true }
        gps_lng: { type: number, format: double, nullable: true }
        konum_durumu:
          type: string
          enum: [var, izin_yok, servis_kapali, zaman_asimi, bilinmiyor]
          default: bilinmiyor
          description: (P34) Konumun NEDEN yok oldugu
        gps_dogruluk_m: { type: number, format: double, nullable: true }
        foto_url: { type: string, nullable: true }
        imza_dogrulandi:
          type: boolean
          description: "SUNUCU hesaplar: NTAG424 SDM dogrulamasi gecerliyse true"
        idempotency_key: { type: string }
        created_at: { type: string, format: date-time }

    # -------------------------- dashboard -------------------------- #
    DashboardLive:
      type: object
      required: [generated_at, aktif_turlar, alarm_gruplari]
      properties:
        generated_at: { type: string, format: date-time }
        aktif_turlar:
          type: array
          items: { $ref: "#/components/schemas/AktifTur" }
        # (P133.3) `son_alarmlar` (duz liste) KALDIRILDI, yerine gruplu
        # liste geldi. Pano alti neredeyse ayni satiri yan yana
        # ciziyordu: `notification`da (tenant, tip, pencere) tekil oldugu
        # icin bir planin alti penceresi alti satir uretiyor. Yonetici
        # icin bunlar TEK olgudur. Tuketici olculdu: mobil bu uctan
        # yalniz `aktif_turlar` okuyor.
        alarm_gruplari:
          type: array
          items: { $ref: "#/components/schemas/AlarmGrubu" }
        # (P133.2) Aidat tahsilat orani — YALNIZ mali yetkisi olan role
        # (admin, yonetici). Bu uc guvenlik rollerine de acik ve tahsilat
        # orani mali veridir; yetki yoksa alan null doner ve pano blogu
        # HIC cizmez. Ayri uc acilmadi: panonun ek gidis-donusu olmamali.
        aidat_tahsilat_orani: { type: integer, nullable: true }
        # (P133.2) Tesis blogu icin AKTIF NFC nokta sayisi. Ayri bir
        # /checkpoints istegi acmamak adina bu yanita bindirildi.
        nfc_nokta_sayisi: { type: integer }
    AktifTur:
      type: object
      required: [patrol_window_id, patrol_plan_id, pencere_baslangic, pencere_bitis, durum]
      properties:
        patrol_window_id: { type: string, format: uuid }
        patrol_plan_id: { type: string, format: uuid }
        patrol_plan_ad: { type: string }
        pencere_baslangic: { type: string, format: date-time }
        pencere_bitis: { type: string, format: date-time }
        durum: { $ref: "#/components/schemas/PatrolWindowDurum" }
        beklenen_checkpoint_sayisi: { type: integer }
        okutulan_checkpoint_sayisi: { type: integer }
        son_okutma: { type: string, format: date-time, nullable: true, description: "(P181 7.3) son okutma zamani" }
    # Tur penceresi gecmisi (GET /patrol-windows ogesi).
    PatrolWindowHistory:
      type: object
      required:
        [id, patrol_plan_id, pencere_baslangic, pencere_bitis, durum,
         beklenen_checkpoint_sayisi, okutulan_checkpoint_sayisi]
      properties:
        id: { type: string, format: uuid }
        patrol_plan_id: { type: string, format: uuid }
        plan_adi: { type: string, nullable: true }
        pencere_baslangic: { type: string, format: date-time }
        pencere_bitis: { type: string, format: date-time }
        durum: { $ref: "#/components/schemas/PatrolWindowDurum" }
        beklenen_checkpoint_sayisi: { type: integer }
        okutulan_checkpoint_sayisi: { type: integer }
    PatrolWindowOzet:
      type: object
      required: [toplam, tamamlandi, kacirildi, bekliyor]
      description: "Filtrelenmis TUM kume uzerinden sayilar (sayfa ile sinirli degil)."
      properties:
        toplam: { type: integer }
        tamamlandi: { type: integer }
        kacirildi: { type: integer }
        bekliyor: { type: integer }
    # GET /me/patrol-window — aktif pencere + checkpoint bazinda okutma durumu.
    MePatrolCheckpoint:
      type: object
      required: [checkpoint_id, ad, sira, okutuldu]
      properties:
        checkpoint_id: { type: string, format: uuid }
        ad: { type: string }
        sira: { type: integer }
        okutuldu:
          type: boolean
          description: "PENCERE-GENELI: herhangi bir elemanin pencere araligindaki okutmasi sayilir."
        okutma_zamani:
          type: string
          format: date-time
          nullable: true
          description: "Penceredeki ILK scan'in zamani (okutulmadiysa null)."
        okutan_user_id:
          type: string
          format: uuid
          nullable: true
          description: "Penceredeki ILK scan'i yapan kullanici (okutulmadiysa null)."
    MePatrolWindowInfo:
      type: object
      required: [id, patrol_plan_id, pencere_baslangic, pencere_bitis, durum]
      properties:
        id: { type: string, format: uuid }
        patrol_plan_id: { type: string, format: uuid }
        plan_adi: { type: string, nullable: true }
        pencere_baslangic: { type: string, format: date-time }
        pencere_bitis: { type: string, format: date-time }
        durum: { $ref: "#/components/schemas/PatrolWindowDurum" }
    MePatrolWindowItem:
      allOf:
        - $ref: "#/components/schemas/MePatrolWindowInfo"
        - type: object
          required: [checkpoints]
          properties:
            checkpoints:
              type: array
              description: "Plana atanmis AKTIF checkpoint'ler, sira ASC."
              items: { $ref: "#/components/schemas/MePatrolCheckpoint" }
    MePatrolWindowResponse:
      type: object
      required: [generated_at, window, checkpoints, windows]
      properties:
        generated_at: { type: string, format: date-time }
        window:
          nullable: true
          description: "Bitisi en yakin aktif pencere; aktif pencere yoksa null."
          allOf:
            - $ref: "#/components/schemas/MePatrolWindowInfo"
        checkpoints:
          type: array
          description: "window'un checkpoint listesi; window null ise []."
          items: { $ref: "#/components/schemas/MePatrolCheckpoint" }
        windows:
          type: array
          description: "TUM aktif pencereler (pencere_bitis ASC); genelde 0-1 eleman."
          items: { $ref: "#/components/schemas/MePatrolWindowItem" }
    Alarm:
      type: object
      required: [tip, olusma_zamani, mesaj]
      properties:
        tip:
          type: string
          enum: [kacirilan_tur, eksik_checkpoint, gecikmis_okutma]
          example: kacirilan_tur
        olusma_zamani: { type: string, format: date-time }
        mesaj: { type: string }
        patrol_window_id: { type: string, format: uuid, nullable: true }
        checkpoint_id: { type: string, format: uuid, nullable: true }

    # (P133.3) Grup ICINDEKI tek olay. `tip` ve `patrol_plan_id` BURADA
    # YOK: ikisi de grubun ustunde bir kez duruyor. Olay basina
    # tekrarlamak, gruplamanin kazandirdigi govdeyi geri verirdi.
    AlarmOlayi:
      type: object
      required: [olusma_zamani]
      properties:
        olusma_zamani: { type: string, format: date-time }
        patrol_window_id: { type: string, format: uuid, nullable: true }
        checkpoint_id: { type: string, format: uuid, nullable: true }

    AlarmGrubu:
      type: object
      required: [tip, mesaj, sayi, en_son, onem, olaylar]
      properties:
        tip:
          type: string
          enum: [kacirilan_tur, eksik_checkpoint, gecikmis_okutma]
          example: gecikmis_okutma
        patrol_plan_id: { type: string, format: uuid, nullable: true }
        # Plan silinmisse FK SET NULL oldugu icin ad da null gelir.
        patrol_plan_ad: { type: string, nullable: true }
        # Temsili metin: en yeni olayin cumlesi, istegin dilinde. Olay
        # basina degil GRUP basina — grup icinde neredeyse ayni cumlenin
        # tekrariydi ve govdenin en buyuk kalemiydi.
        mesaj: { type: string }
        sayi: { type: integer, example: 6 }
        en_son: { type: string, format: date-time }
        # ONEM TIPTEN TURETILIR, kolonda tutulmaz. Gruplama zaten (tip,
        # devriye) ile yapildigi icin bir grubun tum olaylari ayni
        # tiptedir; "en kotu onem" bugun tipin kendi onemidir. Alan yine
        # de doner ki istemci tip->onem tablosunu ikinci kez tasimasin.
        onem:
          type: string
          enum: [dusuk, orta, yuksek]
        olaylar:
          type: array
          items: { $ref: "#/components/schemas/AlarmOlayi" }

    # ------------------------- notifications ----------------------- #
    CeviriAlanlari:
      type: object
      description: |
        CEVRILEBILIR YAYIN ICERIGININ ceviri ustverisi (duyuru / site kurali /
        etkinlik ortak). Govdedeki metin alanlari (`baslik` + `govde` /
        `icerik` / `aciklama`) Accept-Language ile SECILEN dilde doner;
        asagidaki alanlar o metnin NE oldugunu soyler.

        Mimari: ceviri YAZMA aninda uretilir (7 dil saklanir), okuma
        Accept-Language ile servis edilir, ORIJINAL metin her zaman korunur.
        Ceviri motoru kendi barindirdigimiz LibreTranslate'tir — icerik dis
        bir servise gonderilmez.

        CEVRILMEYEN alanlar (bilincli): `konum` (yer adi), `foto_key`/
        `foto_url` (gorsel), tarih/sira/sayi alanlari.
      required: [orijinal_dil, gosterilen_dil, ceviri_durumu, cevirildi_mi, orijinal]
      properties:
        orijinal_dil:
          type: string
          description: Icerigin YAZILDIGI (kaynak) dil. Su an her zaman `tr`.
          example: tr
        gosterilen_dil:
          type: string
          description: |
            Govdedeki metnin GERCEK dili. Ceviri hazir degilse geri-dusme
            nedeniyle `orijinal_dil`e esittir.
          example: ru
        ceviri_durumu:
          type: string
          enum: [hazir, bekliyor, hata]
          description: |
            Istenen dil icin cevirinin durumu.

            | durum | anlam | govdedeki metin |
            |---|---|---|
            | `hazir` | ceviri servis edilebilir (ya da kaynak dil istendi) | istenen dilde |
            | `bekliyor` | ceviri kuyrukta/uretiliyor | ORIJINAL |
            | `hata` | ceviri saglayicisi basarisiz | ORIJINAL |

            Istemci `bekliyor` iken "çeviri hazırlanıyor" gosterebilir; metin
            alanlari BOS DEGILDIR.
        cevirildi_mi:
          type: boolean
          description: |
            Govdedeki metin MAKINE cevirisi mi? Orijinal metinde ve yonetici
            tarafindan ELLE DUZELTILMIS ceviride `false`.
        orijinal:
          type: object
          additionalProperties: { type: string }
          description: |
            Orijinal (kaynak dildeki) metinler — HER ZAMAN doner (ayri istek
            ya da `?dil=orijinal` gerekmez). Anahtarlar entity'nin cevrilen
            alanlaridir; orn. duyuruda `{"baslik": ..., "govde": ...}`.
          example: { baslik: "Su kesintisi", govde: "Yarin 10:00-12:00." }
    Announcement:
      type: object
      description: >-
        Cevrilen metin alanlari `baslik` + `govde`; Accept-Language ile secilen
        dilde doner. Ceviri ustverisi: CeviriAlanlari.
      allOf:
        - $ref: "#/components/schemas/CeviriAlanlari"
      required: [id, baslik, govde, olusturan_user_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        baslik: { type: string, maxLength: 200 }
        govde: { type: string, maxLength: 5000 }
        foto_key:
          type: string
          nullable: true
          description: Opsiyonel gorsel — /uploads/presign ile alinan obje anahtari
        foto_url:
          type: string
          nullable: true
          description: Goruntuleme icin kisa omurlu presigned GET URL (foto_key varsa)
        olusturan_user_id: { type: string, format: uuid }
        olusturan_ad:
