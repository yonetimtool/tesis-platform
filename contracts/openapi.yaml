        sms: { type: boolean }
        arama: { type: boolean }
    KararUyesi:
      type: object
      description: >
        (P33) Karara katilan yonetim kurulu uyesi. Bir ADDIR, kullanici
        referansi DEGILDIR — uye uygulamada hesabi olmayan biri olabilir.
      required: [ad]
      properties:
        ad: { type: string, minLength: 1, maxLength: 150 }
        gorev: { type: string, nullable: true, maxLength: 100 }
    KararDefteriCreate:
      type: object
      required: [konu, metin]
      properties:
        karar_no:
          type: string
          nullable: true
          maxLength: 30
          description: >
            Tenant icinde TEKTIR (cakisma 409). **(P167 §6.2)** ZORUNLU
            DEGIL: bos birakilirsa MERKEZI seriden uretilir
            (`KRR-2026-000001`, `belge_sayaci` tablosu). Zorunlu tutmak,
            her karar icin kullaniciyi bir numara UYDURMAYA zorlar ve
            serinin tutarliligini insan hafizasina birakirdi. Elinde
            gercek bir karar numarasi olan kisi ise onu yazabilir —
            merkezi uretimin amaci kullaniciyi engellemek degil.
        tarih: { type: string, format: date, description: Verilmezse bugun }
        konu: { type: string, minLength: 1, maxLength: 200 }
        metin: { type: string, minLength: 1, maxLength: 20000 }
        baskan_ad: { type: string, nullable: true, maxLength: 150 }
        uyeler:
          type: array
          items: { $ref: "#/components/schemas/KararUyesi" }
          default: []
    DokumanCreate:
      type: object
      description: >
        (P33) Sunucu DOSYAYI TASIMAZ, yalniz USTVERIYI tutar; yukleme
        presign ile dogrudan MinIO'ya yapilir.
      required: [ad, obje_anahtari]
      properties:
        ad: { type: string, minLength: 1, maxLength: 200 }
        obje_anahtari:
          type: string
          maxLength: 500
          description: Ayni anahtar iki kez kaydedilemez (409)
        icerik_tipi: { type: string, nullable: true, maxLength: 150 }
        boyut_bayt:
          type: integer
          nullable: true
          maximum: 26214400
          description: EN FAZLA 25 MB — veritabani CHECK'i ile de korunur
        aciklama: { type: string, nullable: true, maxLength: 1000 }
        sakine_acik:
          type: boolean
          default: false
          description: >
            **(P167 ek)** Sakin bu dokumani gorebilir mi? **VARSAYILAN
            KAPALI.** `tenant_dokuman` tek bir arsivdir ve icinde ne
            oldugu sozlesmede belirli DEGIL (yonetim plani da olabilir,
            personel sozlesmesi de). Acik varsayilan, bugune kadar
            "yalnizca yonetim gorur" varsayimiyla yuklenmis HER dosyayi
            geriye donuk yayinlamak olurdu.
    DokumanUpdate:
      type: object
      description: >
        **(P167 ek)** Yalnizca GORUNURLUK degistirilebilir.
        Ad/aciklama/dosya duzenleme bilerek yok: dosyanin kendisi degismez
        (yeni surum yeni kayittir) ve adi degistirmek, sakinin indirdigi
        dosyayla listede gordugu adin ayrismasina yol acardi.
      required: [sakine_acik]
      properties:
        sakine_acik: { type: boolean }
    SiteAktarSatir:
      type: object
      description: >
        (P33) Kurulum dosyasinin BIR SATIRI. `satir_no` dosyadaki gercek
        satir numarasidir (basliksiz 1. veri satiri genelde 2) — hata raporu
        bunu geri verir ki kullanici hucreyi bulabilsin.
      required: [satir_no]
      properties:
        satir_no: { type: integer, minimum: 1 }
        blok:
          type: string
          nullable: true
          maxLength: 8
