        konum_lon: { type: number, format: double, nullable: true }
        galeri: { type: array, items: { type: object } }
        duyurular:
          type: array
          description: YALNIZ baslik + OZET + tarih (tam govde public'e cikmaz)
          items: { type: object }
        anketler:
          type: array
          description: "`oy_verdim` null, acik anketin sonucu null"
          items: { type: object }
    KvkkMetinCreate:
      type: object
      required: [baslik, govde]
      properties:
        tur:
          type: string
          enum: [aydinlatma, acik_riza, gizlilik, kullanim_kosullari, cerez]
          default: aydinlatma
          description: >
            **(P168 §5)** Hangi yasal metin. Surum TUR BASINA ilerler:
            gizlilik politikasi yayinlamak aydinlatma metninin numarasini
            ATLATMAMALI, yoksa "v3'u onayladim" cumlesi hangi metne ait
            belirsiz kalirdi.
        yeniden_onay_gerekir:
          type: boolean
          default: true
          description: >
            **(P168 §5)** Bu surum, onceki surumu onaylamis kullanicilardan
            YENIDEN onay ister mi? VARSAYILAN `true` ve bu bilincli:
            guvenli yon SORMAKTIR. `false` varsayilan olsaydi, esasli bir
            degisikligi yayinlayan yonetici kutuyu isaretlemeyi
            unuttugunda kimseye sorulmaz ve bu SESSIZCE hukuki bir
            eksiklik olurdu. Yazim hatasi duzeltmeleri icin `false`.
        baslik: { type: string, minLength: 1, maxLength: 200 }
        govde:
          type: string
          minLength: 1
          maxLength: 100000
          description: >
            **(P171) SUNUCU YAZMA ANINDA TEMIZLER.** Govde zengin metindir
            ve beyaz listeden gecirilir (`nh3`): izinli etiketler
            `p br strong em u s h1-h4 ul ol li a blockquote hr`, izinli
            oznitelikler yalniz `a[href]` ve `a[title]`, izinli semalar
            `http https mailto`. `on*`, `style`, `script`, `iframe`,
            `svg`, `img` ve `javascript:`/`data:` ATILIR.
            Uzunluk siniri KULLANICININ yazdigi metne uygulanir —
            temizlik SONRA calisir, yoksa siniri asan bir govde
            kisaldigi icin sessizce kabul edilirdi.
            Donen deger de temizdir; istemci govdeyi ZENGIN METIN olarak
            cizebilir.
    KvkkMetin:
      type: object
      required: [id, surum, baslik, govde, created_at]
      properties:
        id: { type: string, format: uuid }
        surum: { type: integer, minimum: 1 }
        baslik: { type: string }
        govde: { type: string }
        created_at: { type: string, format: date-time }
    KvkkDurum:
      type: object
