        grup_id: { type: string, format: uuid, nullable: true }
        dagitim_sekli:
          type: string
          nullable: true
          enum: [bagimsiz_bolumlere_esit, tipe_gore]
        hedef_kurali: { type: string, enum: [kiraci_oncelikli, malik], default: kiraci_oncelikli }
        aktif: { type: boolean, default: true }
