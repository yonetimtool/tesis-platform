  # ================================================================= #
  # ANNOUNCEMENTS (duyuru) — gonderme admin+yonetici, okuma tum roller
  # ================================================================= #
  /announcements:
    get:
      tags: [announcements]
      summary: Duyuru listesi (created_at DESC)
      description: OKUMA tum rollere aciktir (resident dahil) — auth.md §4.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DilQuery"
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Announcement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [announcements]
      summary: Duyuru olustur (yonetici mobilden + admin panelden)
      description: |
        Olusturan token'dan alinir. Kayit sonrasi tenant'in TUM aktif
        cihazlarina push denenir (EK gonderim — push hatasi kaydi etkilemez;
        data: tip=duyuru, announcement_id). Opsiyonel gorsel: once
        POST /uploads/presign ile foto_key + PUT URL alinir, dosya PUT edilir,
        foto_key burada gonderilir. Okumada foto_url (presigned GET) doner.

        **OTOMATIK CEVIRI**: kayit sonrasi kaynak dil disindaki 6 dil icin
        ceviri isi ACILIR (`ceviri_durumu` = `bekliyor`) ve arka planda
        uretilir. Ceviri EK bir islemdir: saglayici ya da kuyruk
        erisilemez olsa bile bu istek BASARILI olur ve orijinal metin
        servis edilmeye devam eder (basarisiz diller `hata` isaretlenir).
        Duzenlemede kaynak METIN degistiyse ceviriler yeniden uretilir;
        yonetici tarafindan ELLE DUZELTILMIS bir ceviri YALNIZCA kaynak
        metin AYNI kaldiysa (orn. yalniz gorsel/tarih/sira degistiyse)
        KORUNUR.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /announcements/{id}:
