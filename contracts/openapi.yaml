  /tasks/{id}/completions:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [tasks]
      summary: Gorev tamamlama gecmisi
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/TaskCompletion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [tasks]
      summary: Gorevi tamamla (kanit gonder)
      description: |
        Idempotency-Key header ZORUNLU (offline cift gonderim korumasi, scan deseni).
        Foto icin: once POST /uploads/presign ile foto_key + PUT URL alinir, dosya
        dogrudan MinIO'ya yuklenir, sonra burada foto_key gonderilir.

        FOTO ZORUNLULUGU (mobil §11 #2): gorevde `foto_zorunlu=true` ise
        `foto_key` OLMADAN tamamlama **422** doner (anlamli mesajla).

        NFC eslesmesi NORMALIZE (mobil §11 #3): gorevin checkpoint'i varsa
        gonderilen `nfc_tag_uid` strip + upper sonrasi karsilastirilir
        (buyuk/kucuk harf, bas/son bosluk farki 422 dusurmez).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCompletionCreate" }
      responses:
        "201":
          description: Tamamlama kaydedildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskCompletion" }
        "200":
          description: Idempotent tekrar — mevcut kayit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskCompletion" }
        "400":
          description: Idempotency-Key eksik veya gecersiz govde
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ayni Idempotency-Key farkli govde ile gonderildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /task-completions:
    get:
      tags: [tasks]
      summary: Gorev tamamlama gecmisi (tum gorevler; tarih/tip/atanan filtreli)
      description: |
        TUM gorevlerin tamamlanma GECMISI. /tasks/{id}/completions tek gorev
        icindir; bu uc capraz-gorev gecmise donuk sorgu icindir ("gecen hafta
        hangi gorevler tamamlandi, kim, hangi tip"). tamamlanma_zamani DESC.
        /patrol-windows ile ayni desen: ozet sayilar (toplam + tip dagilimi)
        FILTRELENMIS TUM kume uzerinden response.ozet'te doner.
        RBAC (gorev-yonetimi goruntuleme): admin + yonetici + security +
        tesis_gorevlisi; resident 403. tenant-izole (RLS).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: baslangic
          in: query
          description: "tamamlanma_zamani >= bu an (UTC, ISO-8601)"
          schema: { type: string, format: date-time }
        - name: bitis
          in: query
          description: "tamamlanma_zamani < bu an (UTC, ISO-8601; yari-acik)"
          schema: { type: string, format: date-time }
        - name: kategori_id
          in: query
          schema: { type: string, format: uuid }
        - name: task_id
          in: query
          schema: { type: string, format: uuid }
        - name: tamamlayan_user_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Tamamlama listesi + ozet
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items, ozet]
                    properties:
                      ozet: { $ref: "#/components/schemas/TaskCompletionOzet" }
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/TaskCompletionHistory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /task-categories:
    get:
      tags: [tasks]
      summary: Gorev kategorileri (yonetici-tanimli, A6)
      description: |
        Tenant'a ozel kategori seti. OKUMA gorev goren roller
        (admin/yonetici/security/tesis_gorevlisi); resident 403.
        Varsayilan yalniz aktif kategoriler (`aktif=false` ile pasifler).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: aktif
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Liste (ad sirali)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/TaskCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [tasks]
      summary: Kategori olustur (admin + yonetici)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCategoryCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /task-categories/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [tasks]
      summary: Kategori duzenle — ad ve/veya aktiflik (admin + yonetici)
      description: |
        (P166) Bu uc onceden YOKTU: yazim hatasi duzeltmenin tek yolu
        sil-yeniden-olustur olurdu ve o, kategoriyi kullanan gorevleri PASIF
        bir kategoriye baglardi. `aktif: true` ayrica soft-delete edilmis bir
        kategoriyi GERI ALIR (DELETE'in tersi baska yolla mumkun degildi).
        Ad tenant icinde benzersizdir; cakisma 409 doner (POST ile ayni).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCategoryUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [tasks]
      summary: Kategori sil — SOFT-DELETE (admin + yonetici)
      description: |
        aktif=false yapar (gorev gecmisi kategoriye referans verebilir; hard
        silme kaydi koparir). Pasif kategoriye yeni gorev yazilamaz (422).
      responses:
        "204": { description: Pasiflestirildi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /uploads/presign:
    post:
      tags: [uploads]
      summary: Foto yukleme icin presigned PUT URL uret
      description: |
        Backend foto_key uretir ve MinIO icin presigned PUT URL doner. Istemci
        dosyayi bu URL'e PUT eder, sonra foto_key'i ilgili completion'da,
        duyuru olusturmada veya talep acmada gonderir. RBAC:
        admin/security/tesis_gorevlisi + yonetici (duyuru gorseli) +
        resident (sikayet/oneri gorseli).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresignRequest" }
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresignResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # ASSETS (demirbas envanteri) + zimmet (checkout/checkin)
  # ================================================================= #
  /assets:
    get:
      tags: [assets]
      summary: Demirbas listesi
      description: |
        Her item ACIK zimmet ozeti tasir: `acik_zimmet` (null | {alan_user_id,
        alan_user_ad, alinma_zamani}) — mobil history taramadan gosterir
        (mobil §13 #2/#5). `nfc_tag_uid` TAM eslesme filtresi UID->asset
        cozumunu tek istege indirir (mobil §13 #1). `checked_out_by` acik
        zimmet filtresi: `me` = token kullanicisinin uzerindekiler (mobil §13
        #3); `<uuid>` degeri YALNIZ admin (baskasi 403), gecersiz deger 422.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: kategori
          in: query
          schema: { $ref: "#/components/schemas/AssetKategori" }
        - name: durum
          in: query
          schema: { $ref: "#/components/schemas/AssetDurum" }
        - name: aktif
          in: query
          schema: { type: boolean }
        - name: nfc_tag_uid
          in: query
          description: Tam eslesme — UID okutup asset'i tek istekle cozmek icin
          schema: { type: string }
        - name: checked_out_by
          in: query
          description: "'me' veya user UUID (UUID yalniz admin) — acik zimmeti bu kullanicida olanlar"
          schema: { type: string }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Asset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [assets]
      summary: Demirbas olustur
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: nfc_tag_uid bu tenant'ta zaten kayitli
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /assets/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [assets]
      summary: Demirbas detay
      responses:
        "200":
          description: Detay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [assets]
      summary: Demirbas guncelle (kismi)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [assets]
      summary: Demirbas sil
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /assets/{id}/checkout:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [assets]
      summary: Demirbasi al (zimmetle)
      description: |
        Idempotency-Key ZORUNLU (scan deseni). nfc_tag_uid verilirse asset'in
        nfc'siyle eslesmeli. alan_user_id token'dan. Zaten zimmetliyse 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "201":
          description: Zimmetlendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetCheckout" }
        "200":
          description: Idempotent tekrar — mevcut kayit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetCheckout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Demirbas zaten zimmetli (veya ayni key farkli govde)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /assets/{id}/checkin:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [assets]
      summary: Demirbasi birak (zimmeti kapat)
      description: |
        Acik zimmeti kapatir (birakma_zamani=now). Idempotency-Key ZORUNLU.
        nfc_tag_uid verilirse asset'in nfc'siyle eslesmeli. Acik zimmet yoksa 409.

        SAHIPLIK (mobil §13 #6): checkin'i YALNIZ acik zimmetin sahibi
        (alan_user_id == token user) veya ADMIN (yonetim mudahalesi)
        yapabilir; baska kullanici 403 `forbidden`
        ("Zimmet baskasinin uzerinde..."). security/tesis_gorevlisi baskasinin
        zimmetini KAPATAMAZ.

        Kapatan kullanici `birakan_user_id` olarak kaydedilir (cevapta ve
        history'de `birakan_user_ad` ile birlikte doner).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckinRequest" }
      responses:
        "200":
          description: Birakildi (zimmet kapatildi / idempotent tekrar)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetCheckout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Acik zimmet yok (demirbas zaten musait)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /assets/{id}/history:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [assets]
      summary: Demirbas zimmet gecmisi
      description: |
        Siralama `alma_zamani` uzerinden; VARSAYILAN `desc` (en yeni ustte —
        mobil §13 #4). Eski (en eski ustte) davranis icin `?order=asc`.
        Item'larda `alan_user_ad` dolu gelir (id + ad birlikte, mobil §13 #5).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: order
          in: query
          description: "alma_zamani sirasi (varsayilan: desc = en yeni ustte)"
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Gecmis
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AssetCheckout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================================================================= #
  # DEVICES (FCM push token kaydi)
  # ================================================================= #
  /devices:
    post:
      tags: [devices]
      summary: Cihaz push token kaydet (kendi cihazi; her rol)
      description: |
        Giris yapmis kullanici kendi cihaz FCM token'ini kaydeder. Ayni token
        (tenant icinde UNIQUE) tekrar gonderilirse guncellenir + aktiflesir
        (idempotent upsert). user_id token'dan turetilir.

        (P191-ek §1) `cihaz_kimligi` OPSIYONEL kararli kurulum kimligidir.
        Verilirse AYNI cihazin onceki jetonlari pasiflestirilir ve kayit
        COGALMAZ — jeton bir cihaz kimligi degil, cihazin o anki ADRESIDIR.
        Gondermeyen eski surumlerde eski davranis aynen surer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRegister" }
      responses:
        "201":
          description: Kaydedildi (veya guncellendi)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [devices]
      summary: Tenant cihazlari (admin, debug)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ------------------------- (P191 §2) PUSH TESHISI ------------------------- #
  # "Bildirim gelmedi" sorusunun tek adresi. Zincirin alti halkasi (jeton,
  # kayit, tetikleme, saglayici yaniti, tercih, servis hesabi) TEK yanitta
  # gorunur; `POST /push/test` yonetici KENDI cihazinda gercek bir gonderim
  # dener. Tam FCM jetonu HICBIR yanitta donmez (yalniz son 6 karakter).
  # ====================== (P191 §4) BANKA ENTEGRASYONU ====================== #
  # Ekstre -> eslestirme -> borc kapanisi + defter + makbuz. YENI BIR SISTEM
  # DEGIL: borc `dues_payment` ile kapanir, muhasebe kaydi `finansal_hareket`e
  # yazilir, referans `app_user.odeme_kodu`dur. Uclarin HEPSI admin/yonetici.
  # IBAN yanitlarda MASKELIDIR (son 4 hane); tam IBAN hicbir yanitta DONMEZ.
  /banka/ice-aktar:
    post:
      tags: [banka]
      summary: "(P191) Ekstre ice aktar (yapilandirilmis satirlar veya MT940)"
      description: |
        MUKERRER KORUMASI: `external_transaction_id` tenant icinde
        BENZERSIZDIR. Banka referans vermiyorsa (tarih|tutar|yon|aciklama|sira)
        besinden KARARLI bir kimlik turetilir — ayni ekstre iki kez
        yuklenirse ikinci yukleme yeni satir ACMAZ ve `yinelenen` sayisi
        doner.

        CSV/XLSX PANELDE ayristirilir (saldiri yuzeyi karari, P28/P29);
        MT940 duz metin oldugu icin SUNUCUDA ayristirilir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kaynak: { type: string, enum: [ekstre, acik_bankacilik] }
                satirlar:
                  type: array
                  items:
                    type: object
                    required: [tarih, tutar]
                    properties:
                      tarih: { type: string }
                      tutar: { oneOf: [{ type: string }, { type: integer }] }
                      aciklama: { type: string }
                      yon: { type: string, enum: [giris, cikis], nullable: true }
                      referans: { type: string, nullable: true }
                      karsi_ad: { type: string, nullable: true }
                      karsi_iban: { type: string, nullable: true }
                      para_birimi: { type: string, nullable: true }
                mt940: { type: string, nullable: true }
                kasa_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: >-
                    (P192 §2.1) Ekstrenin ait oldugu BANKA HESABI.
                    Verilmezse varsayilan banka hesabi kullanilir/acilir.
                    Bir tesisin iki hesabi varsa ikisinin ekstresini ayni
                    kasaya yazmak bakiyeleri karistirmak olurdu.
      responses:
        "201":
          description: Ice aktarildi
          content:
            application/json:
              schema:
                type: object
                required: [eklenen, yinelenen, toplam]
                properties:
                  eklenen: { type: integer }
                  yinelenen: { type: integer }
                  toplam: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /banka/eslestir:
    post:
      tags: [banka]
      summary: "(P191) Bekleyen hareketleri eslestir (esigi gecenleri UYGULAR)"
      description: |
        Oncelik: (1) odeme referansi, (2) gonderen IBAN gecmisi,
        (3) ad + tutar + acik borc. Guven puani ESIK_OTOMATIK (80) altinda
        kalan her sey `manuel_inceleme`dir. Ad eslesmesi TEK BASINA asla
        yeterli degildir. Referans ile IBAN gecmisi CELISIYORSA sonuc
        otomatik DEGIL manueldir.

        Uygulanan karar: FIFO borc kapanisi (`dues_payment`), TEK defter
        satiri (`finansal_hareket`), makbuz (`receipt` + MinIO PDF) ve
        sakine bildirim.
      responses:
        "200":
          description: Kosum ozeti
          content:
            application/json:
              schema:
                type: object
                required: [incelenen, otomatik, manuel]
                properties:
                  incelenen: { type: integer }
                  otomatik: { type: integer }
                  manuel: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /banka/hareketler:
    get:
      tags: [banka]
      summary: "(P191) Banka hareketleri (eslesmeyenler ekrani)"
      parameters:
        - name: durum
          in: query
          schema:
            type: string
            enum: [yeni, eslesti, manuel_inceleme, ilgisiz_gelir, masraf, ters_kayit]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Liste (IBAN MASKELI)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/BankaHareket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /banka/hareketler/{hareket_id}/manuel-eslestir:
    parameters:
      - name: hareket_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [banka]
      summary: "(P191) Yonetici hareketi elle bir kisiye atar"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
                unit_id: { type: string, format: uuid, nullable: true }
      responses:
        "200":
          description: Eslesti
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankaHareket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Zaten eslesmis (`banka_zaten_eslesti`)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /banka/hareketler/{hareket_id}/isaretle:
    parameters:
      - name: hareket_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [banka]
      summary: "(P191) Ilgisiz gelir / banka masrafi / ters kayit isaretle"
      description: >
        BANKA MASRAFI OTOMATIK GIDER YAZMAZ — yalniz isaretlenir; gideri
        deftere yazmak yoneticinin ayri ve bilincli kararidir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [durum]
              properties:
                durum: { type: string, enum: [ilgisiz_gelir, masraf, ters_kayit] }
                not_metni: { type: string, nullable: true }
      responses:
        "200":
          description: Isaretlendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankaHareket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Zaten eslesmis
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /banka/hareketler/{hareket_id}/geri-al:
    parameters:
      - name: hareket_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [banka]
      summary: "(P191) Yanlis eslesmeyi geri al — SILMEZ, ters kayit yazar"
      description: >
        `dues_payment.durum='iptal'` (borc YENIDEN ACILIR), deftere
        `tip='iptal'` cikis satiri (`ters_kayit_id` ile asil satiri
        gosterir), `payment_match.durum='geri_alindi'`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                not_metni: { type: string, nullable: true }
      responses:
        "200":
          description: Geri alindi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankaHareket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Geri alinacak onaylanmis eslesme yok
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /banka/makbuz/{receipt_id}:
    parameters:
      - name: receipt_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [banka]
      summary: "(P191) Makbuz kaydi + kisa omurlu PDF adresi"
      responses:
        "200":
          description: Makbuz
          content:
            application/json:
              schema:
                type: object
                required: [id, belge_no, tutar_kurus, created_at]
                properties:
                  id: { type: string, format: uuid }
                  belge_no: { type: string }
                  tutar_kurus: { type: integer }
                  user_id: { type: string, format: uuid, nullable: true }
                  unit_id: { type: string, format: uuid, nullable: true }
                  created_at: { type: string, format: date-time }
                  pdf_url: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /push/cihaz-temizle:
    post:
      tags: [push]
      summary: "(P191-ek) Gecersiz cihaz jetonlarini temizle (bildirim GONDERMEDEN)"
      description: |
        FCM `validate_only=true` ile her AKTIF jeton dogrulanir; `UNREGISTERED`
        / `INVALID_ARGUMENT` donenler pasiflestirilir. Hicbir telefon CALMAZ —
        bu bir bakim aracidir.

        `desteklenmiyor=true` "hepsi saglam" DEMEK DEGILDIR: saglayici (noop ya
        da kimliksiz fcm) dogrulama YAPAMAMISTIR ve hicbir jeton budanmaz.
        `belirsiz` gecici hata (ag/kota) yuzunden karar verilemeyen jeton
        sayisidir; onlar KORUNUR.
      responses:
        "200":
          description: Temizlik sonucu
          content:
            application/json:
              schema:
                type: object
                required: [saglayici, denenen, budanan, desteklenmiyor]
                properties:
                  saglayici: { type: string }
                  denenen: { type: integer }
                  budanan: { type: integer }
                  desteklenmiyor: { type: boolean }
                  belirsiz: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /push/teshis:
    get:
      tags: [push]
      summary: (P191) Push zincirinin durum tablosu + son denemeler
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Durum + son denemeler
          content:
            application/json:
              schema:
                type: object
                required: [saglayici, yapilandirildi, cihaz_aktif, cihaz_kullanici, bildirim_kapali, ozet_24s, denemeler]
                properties:
                  saglayici: { type: string, description: "noop ise hicbir bildirim gonderilmez" }
                  yapilandirildi: { type: boolean }
                  cihaz_aktif: { type: integer }
                  cihaz_kullanici: { type: integer }
                  bildirim_kapali: { type: integer }
                  ozet_24s:
                    type: object
                    additionalProperties: { type: integer }
                  denemeler:
                    type: array
                    items:
                      type: object
                      required: [id, kimlik, saglayici, durum, created_at]
                      properties:
                        id: { type: string, format: uuid }
                        kimlik: { type: string }
                        user_id: { type: string, format: uuid, nullable: true }
                        ad: { type: string, nullable: true }
                        rol: { type: string, nullable: true }
                        token_son6: { type: string, nullable: true }
                        platform: { type: string, nullable: true }
                        saglayici: { type: string }
                        durum: { type: string }
                        hata_kodu: { type: string, nullable: true }
                        created_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /push/test:
    post:
      tags: [push]
      summary: (P191) KENDI cihazlarina test bildirimi gonder
      description: |
        Yalniz cagiranin kendi cihazlarina gider — "test" adi altinda tum
        tesise bildirim atabilen bir dugme, ilk yanlis tiklamada gercek bir
        olay gibi gorunen gurultu uretirdi.
      responses:
        "200":
          description: Sonuc
          content:
            application/json:
              schema:
                type: object
                required: [saglayici, cihaz, gonderildi, durum]
                properties:
                  saglayici: { type: string }
                  cihaz: { type: integer }
                  gonderildi: { type: integer }
                  durum: { type: string }
                  hata_kodu: { type: string, nullable: true }
                  budanan:
                    type: integer
                    description: >
                      (P191-ek) FCM "kayitli degil" dedigi icin PASIFLESTIRILEN
                      jeton sayisi — olu jeton bir daha denenmez.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /devices/{fcm_token}:
    delete:
      tags: [devices]
      summary: Kendi cihaz token'ini pasiflestir (logout/uninstall)
      parameters:
        - name: fcm_token
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Pasiflestirildi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /external-services:
    get:
      tags: [external-services]
      summary: Dis Hizmetler — bolum notu + kisiler (TUM roller)
      description: |
        Guvenilir esnaf/hizmet kisileri (cilingir/elektrik/tesisat...) + yonetici
        bolum notu (tenant.dis_hizmet_notu). OKUMA tum roller; ture/ada gore sirali.
      responses:
        "200":
          description: Not + kisiler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisHizmetListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [external-services]
      summary: Dis hizmet kisisi ekle (admin + yonetici)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisHizmetCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisHizmetOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /external-services/note:
    put:
      tags: [external-services]
      summary: Bolum notunu ayarla (admin + yonetici)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisHizmetNoteUpdate" }
      responses:
        "200":
          description: Guncel not + kisiler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisHizmetListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /external-services/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [external-services]
      summary: Dis hizmet kisisi duzenle (admin + yonetici)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisHizmetUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisHizmetOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [external-services]
      summary: Dis hizmet kisisi sil (admin + yonetici)
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================================================================= #
  # YONETICI ILETISIM (tenant'in yonetici dizini)
  # ================================================================= #
  /yonetici-iletisim:
    get:
      tags: [yonetici-iletisim]
      summary: Tesisin yonetici iletisim dizini (tenant'in HER uyesi)
      description: |
        Tenant'in TUM aktif yoneticileri (BIRINCIL ilk, sonra created_at ASC) +
        tenant'in `yonetim_email`i.

        RBAC: tenant'in HERHANGI bir kimlikli uyesi — rol kapisi YOK (bes rolun
        besi de); izolasyon RLS ile.

        GIZLILIK ISTISNASI (bkz. contracts/auth.md §C1a): bu uc, rol-bazli
        aramanin UC KAPISINI (YON + RIZA + NUMARA VARLIGI) ve "listede numara YOK"
        kuralini YALNIZ yonetici kartlari icin BILINCLI olarak deler. `aranabilir`
        rizasi bu ucta YOKSAYILIR — yonetici rizayi kaldirsa bile kartta listelenir.
        Kapsam dar: yalniz bu uc, yalniz role='yonetici', yalniz ad_soyad+telefon.
      operationId: yoneticiIletisim
      responses:
        "200":
          description: Yonetici kartlari + yonetim maili
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YoneticiIletisimOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tenant/settings:
    get:
      tags: [tenant]
      summary: Tenant ayarlari (tesis adi + timezone + yonetim maili)
      description: >
        Tesisin adi, slug'i, timezone'u, kurulum durumu ve yonetim maili. Mobil
        `ad`i ana ekran basliginda gosterir; `kurulum_tamamlandi=false` ise
        BIRINCIL yonetici tesisi ILK GIRISTE adlandirmalidir. RBAC: okuma TUM
        rollere acik (herkes kendi tesisinin adini gorur).
      responses:
        "200":
          description: Ayarlar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [tenant]
      summary: "Tenant ayarlarini guncelle (admin: tum alanlar / yonetici: yalniz ad)"
      description: >
        admin TUM alanlari gonderebilir. `yonetici` SAHA ISLETMESI alanlarini
        gonderebilir: `ad`, konum (`konum_ad`/`konum_lat`/`konum_lon`),
        `otopark_kapasite`, ANPR esigi/otomatik cikis ve (P34) tur alarmi
        ayarlari (`tur_gecikme_toleransi_dk`, `tur_alarm_tekrar_sayisi`,
        `tur_baslangic_foto_zorunlu`) — turu PLANLAYAN kisi toleransi da
        ayarlayabilmeli; platform operatorune birakmak her esik degisikligini
        destek talebine cevirirdi. Baska alan gonderirse 403. Diger roller
        403. `slug` ve tenant `id` ASLA degismez.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantSettingsUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /tenant/setup:
    post:
      tags: [tenant]
      summary: BIRINCIL yonetici ILK GIRISTE tesisi adlandirir (onboarding Model A)
      description: |
        Admin tenant + N yonetici acmisti (kurulum_tamamlandi=false, yer tutucu
        ya da admin'in girdigi ad). YALNIZ BIRINCIL yonetici (`app_user.birincil`)
        burada tesis adini belirler/onaylar; kurulum_tamamlandi=true olur.
        Birincil OLMAYAN yonetici (ve yonetici disi roller) 403 — mobil kapi da
        yalniz birincile gosterilir, uc de eslesir. Zaten kuruluysa 409.
        Path: POST /tenant/setup.
      operationId: setupTenant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantSetupRequest" }
      responses:
        "200":
          description: Tesis adlandirildi (kurulum tamam)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Tesis zaten kuruldu
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /tenants:
    post:
      tags: [tenant]
      summary: Admin — yeni tesis + N yonetici acar (cross-tenant)
      description: |
        Admin bir tenant + EN AZ BIR yonetici hesabini birlikte acar; listedeki
        ILK yonetici BIRINCIL'dir (tesisi ilk giriste adlandirir/onaylar).
        `ad` verilmezse yer tutucu ad + rastgele slug uretilir; `ad` verilse bile
        kurulum_tamamlandi=false kalir (birincil ONAYLAR). Yonetici basina parola
        verilmezse tek seferlik gecici kod doner (bir kez). tenant_id GIZLI
        kimliktir (yalniz admin gorur). Telefon GLOBAL benzersiz -> cakisma 409
        (tenant olusmaz; tek transaction). Ayni telefon govde icinde tekrar
        ederse 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantAdminCreate" }
      responses:
        "201":
          description: Tesis + yonetici(ler) olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantAdminCreatedOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Bu telefon zaten kayitli
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [tenant]
      summary: Admin — tum tesisler (id + ad + kurulum durumu)
      responses:
        "200":
          description: Tesis listesi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantAdminListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tenants/{tenant_id}:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [tenant]
      summary: Admin — tek tesis detayi + yoneticisi (cross-tenant)
      responses:
        "200":
          description: Tesis detayi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantAdminDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [tenant]
      summary: Admin — tesis ADINI degistirir (rename/duzeltme)
      description: |
        Yalniz tesis adini gunceller; kurulum_tamamlandi=true olur. Yalniz
        admin. Bilinmeyen tesis 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantAdminUpdate" }
      responses:
        "200":
          description: Guncellendi (tesis detayi)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantAdminDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [tenant]
      summary: Admin — tesisi ve TUM verisini siler (cascade, GERI ALINAMAZ)
      description: |
        tenant ON DELETE CASCADE ile yonetici + duyuru + daire + sakin... hepsi
        silinir. Yalniz admin. Bilinmeyen tesis 404.
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tenants/{tenant_id}/yonetici:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [tenant]
      summary: Admin — tesis yoneticisinin ad/telefon/aktifligini gunceller
      description: |
        Kismi guncelleme (verilmeyen alan degismez). Telefon global benzersiz ->
        cakisma 409. Yonetici yoksa 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantYoneticiUpdate" }
      responses:
        "200":
          description: Guncellendi (tesis detayi)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantAdminDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Bu telefon zaten kayitli
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /tenants/{tenant_id}/yonetici/reset-credential:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [tenant]
      summary: Admin — yonetici parolasini sifirlar + yeni gecici kod uretir
      description: |
        Parola silinir, yeni TEK SEFERLIK gecici kod (bir kez) doner; yonetici
        tekrar ilk-giris (parola belirleme) akisina duser. Yonetici yoksa 404.
      responses:
        "200":
          description: Yeni gecici kod
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantYoneticiResetOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # (P154) TESIS BASINA COKLU YONETICI.
  # Tekil `/yonetici` yolu BIRINCIL yoneticiyi hedefler ve DEGISMEDI; bu
  # cogul yol kadroyu yonetir (ekleme/silme). Ikisi ayri durur cunku tekil
  # yola bir kimlik eklemek, eski cagiranlarin sessizce baska bir kaydi
  # guncellemesine yol acabilirdi.
  /tenants/{tenant_id}/kvkk:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [tenant]
      summary: Bir tesisin KVKK metinleri + onay ozeti (YALNIZ platform admin)
      description: >
        (P170 §2) Metinlerin YONETIMI tesis yuzeyinden buraya tasindi.
        Tasinan sey YETKIDIR, veri degil: `kvkk_metin` tenant icerigi olarak
        kaliyor — her tesisin veri sorumlusu kendisidir ve platforma gomulu
        tek bir metin 200 tesise baskasinin metnini imzalatmak olurdu.
        Capraz-tenant erisim dar `SECURITY DEFINER` islevlerle (goc 0065).
        Onay ozeti KISI LISTESI DONDURMEZ.
      responses:
        "200": { description: metinler + onay ozeti }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [tenant]
      summary: Tesise YENI SURUM yayinla (YALNIZ platform admin)
      description: |
        **Duzenleme ucu YOKTUR.** Yayinlanmis bir metnin govdesi
        degistirilemez; yerinde duzenlemeye izin verilseydi dun onay vermis
        bir kullanicinin onayi bugun **baska bir metne** ait gorunurdu.

        Surum ISTEMCIDEN ALINMAZ, sunucu artirir (tur basina, ilk surum 1).

        **Ayni govde yeniden yayinlanamaz (409 `kvkk_metni_degismedi`):**
        degismemis bir metin icin herkesi yeniden onaya zorlamak, onayi
        anlamsiz bir tikla dondururdu. Bilinmeyen tesis **404**.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KvkkMetinCreate" }
      responses:
        "201": { description: yayinlandi }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /tenants/{tenant_id}/yoneticiler:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [tenant]
      summary: Admin — tesisin TUM yoneticileri (birincil once)
      description: |
        Tesis yoksa 404: bos liste donmek "tesis var ama yoneticisi yok" ile
        "boyle bir tesis yok"u ayirt edilemez kilardi.
      responses:
        "200":
          description: Yonetici listesi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantYoneticiListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [tenant]
      summary: Admin — var olan tesise SONRADAN yonetici ekler
      description: |
        Yeni yonetici BIRINCIL DEGILDIR (birincil tenant basina tektir ve
        sahipligi sessizce devretmek panelde kimin sorumlu oldugunu
        degistirirdi). Parola ALINMAZ: uzaktan ekleme yapilirken admin'in
        baskasi adina parola secmesi, o parolayi bir kanaldan iletmesi
        demektir. Tek yol TEK SEFERLIK gecici koddur ve BIR KEZ doner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantYoneticiAdd" }
      responses:
        "201":
          description: Eklendi (tek seferlik kod ile)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantYoneticiAddedOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Bu telefon zaten kayitli
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /tenants/{tenant_id}/yoneticiler/{user_id}:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [tenant]
      summary: Admin — yoneticiyi tesisten cikarir (sert silme)
      description: |
        UC AYRI 409 uretir ve ucunun de anlami farklidir; tek bir
        "silinemedi" mesaji kullaniciya ne yapacagini soylemezdi:
          * son_yonetici_silinemez      -> once baska bir yonetici ekleyin
          * birincil_yonetici_silinemez -> once baskasini birincil yapin
          * yonetici_kayitlari_var      -> silinemez; hesabi pasiflestirin
        Yumusak silme (is_active=false) AYRI bir istir ve tekil
        `/yonetici` PATCH ucundan yapilir.
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Son yonetici / birincil yonetici / kayitlari var
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  # (P154 / Asama 6.3) GLOBAL ARAMA.
  /arama:
    get:
      tags: [arama]
      summary: Cok kaynakli arama — YALNIZ kullanicinin gorebilecegi kayitlar
      description: |
        ARAMA YENI BIR YETKI YUZEYI ACMAZ. Iki katman birlikte isler:

        * TENANT — `get_tenant_db` + RLS (burada ek bir sey yapilmaz;
          yapilsaydi ikinci bir dogruluk kaynagi olurdu),
        * ROL — her kaynagin rol kumesi ILGILI ROUTERIN kendi
          `require_role` kumesinden OKUNUR, kopyalanmaz. Bir routerin
          kumesi degisince arama kendiliginden ayni degisimi alir.
        * SATIR KAPSAMI — rol kumesi yetmez: `talep` kaynaginda saha ve
          sakin roller YALNIZ KENDI actiklarini gorur
          (`complaints._own_scope` ile ayni kural).

        Uc duzeyinde rol kapisi YOK ve bu bilincli: her tesis rolu en az
        bir kaynak gorebilir (duyuru herkese acik). Kapiyi uca koymak
        sakinin duyuru aramasini da kapatirdi. Suzgec KAYNAK duzeyinde.

        Kaynak basina en fazla 5 vurus; GOVDE DONMEZ (baslik + kisa
        ayrinti). Tam kayit icin ilgili ucca gidilir.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
          description: En az IKI karakter — tek harf butun tesisi tarar.
      responses:
        "200":
          description: Vuruslar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AramaSonucu" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # NOT VE EK (P154 / Asama 6.4) — her varliga takilabilen TEK sistem
  # ================================================================= #
  /ekler:
    get:
      tags: [ekler]
      summary: Bir varligin notlari + dosyalari — TEK zaman cizgisi
      description: |
        EK, ANA KAYDIN YETKISINI MIRAS ALIR. Bir ekin gizliligi ana
        kaydinkiyle AYNIDIR: daireye yazilmis not daireyi gorebilenlere
        aciktir, icra dosyasina yazilmis not yalnizca finans
        okuyabilenlere. Bu uc KENDI rol kumesini tutmaz — her varlik tipi
        icin ILGILI ROUTERIN `require_role` kumesini okur, boylece ana
        kaydin yetkisi degistiginde ekinki kendiliginden degisir.

        Not ve dosya AYNI listede doner (`tur` ayrimiyla): kullanici
        ikisini tek zaman cizgisinde gormek ister.
      parameters:
        - name: varlik_tipi
          in: query
          required: true
          schema: { $ref: "#/components/schemas/EkVarlikTipi" }
        - name: varlik_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Ekler, eskiden yeniye
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EkListesi" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Ana kaydi okuma yetkisi yok. Bu kapi VARLIK
            SORGUSUNDAN ONCE isler — aksi hâlde yetkisiz bir cagiran
            403/404 farkindan "boyle bir kayit var mi" sorusunu
            yanitlardi.
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [ekler]
      summary: Not ya da dosya ekler
      description: |
        DOSYA YUKLEME BURADA YAPILMAZ: istemci once `POST
        /uploads/presign` ile imzali URL alir, dosyayi DOGRUDAN depoya
        koyar, donen anahtari `dosya_key` olarak buraya yazar. Ikinci bir
        yukleme yolu, boyut/tur dogrulamasini iki yerde tutmak olurdu.

        UST KAYIT DOGRULANIR: polimorfik bag (FK yok) yuzunden bu kontrol
        UCTA yapilir. Yoksa rastgele bir UUID'ye ek takilir ve hicbir
        ekranda gorunmeyen kayitlar birikirdi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EkGirdi" }
      responses:
        "201":
          description: Eklendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ek" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /ekler/{ek_id}:
    delete:
      tags: [ekler]
      summary: Eki siler
      description: |
        KIM SILEBILIR: ekin SAHIBI ya da ana kayda YAZMA yetkisi olan.
        Yalniz sahibe birakmak isten ayrilan bir personelin notlarini
        kalici kilardi; yalniz yoneticiye birakmak ise kisinin kendi
        yazdigi notu duzeltmesini engellerdi.
      parameters:
        - name: ek_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ================================================================= #
  # AIDAT — unit (daire) + sakin + tahakkuk + odeme
  # ================================================================= #
  # ================================================================= #
  # BAGIMSIZ BOLUM TIPLERI + GRUPLARI (P26)
  # IKI AYRI KAVRAM: GRUP bolumun NE OLDUGU (Daire/Villa/Dukkan),
  # TIP buyukluk/duzen (1+0, 2+1, dubleks) + VARSAYILAN AIDAT TUTARI.
  # Tek tabloda birlestirmek her grup x tip kombinasyonunu ayri satira
  # zorlar ve varsayilan aidat tanimini anlamsizlastirirdi.
  # RBAC: yazma admin+yonetici; OKUMA saha rollerine de acik (daire
  # listeleri tip/grup adini gosterir); sakin ERISEMEZ.
  # ================================================================= #
  # ================================================================= #
  # MUHASEBE "TANIMLAR" KATMANI (P27)
  # Yedi kayit defteri + tenant ayarlari. RBAC: HEPSI admin+yonetici —
  # bunlar site YONETIM tanimlaridir; saha ve sakin ERISEMEZ. (P26'nin
  # daire tip/grup tanimlari saha rollerine okuma aciyordu cunku daire
  # listelerinde gorunuyorlar; muhasebe tanimlarinin boyle bir gorunumu
  # yok.)
  # PARA HER YERDE KURUS. Acilis bakiyeleri ISARETSIZ tutar + AYRI yon
  # (borc|alacak) tasir: "-500" bir firmada "biz mi borcluyuz, o mu"
  # sorusunu yanitlamaz.
  # SILME: bagli kayit varsa 409 VERILMEZ; baglar SET NULL ile bosalir
  # ve yanit KAC kaydin etkilendigini doner.
  # ================================================================= #
  # ================================================================= #
  # BORCLANDIRMA MOTORU (P28)
  # BIRLESTIRME KARARI: paralel bir sistem YOK — dort yol da mevcut
  # `dues_assessment` kaydina yazar; mobil "Aidatim", /units/{id}/dues ve
  # /reports/financial-summary degismeden calisir.
  # TEKIL yol icin ayri uc ACILMADI: `POST /dues/assessments` zaten odur ve
  # P28 alanlari ona OPSIYONEL eklendi (geriye uyum).
  # ================================================================= #
  # ================================================================= #
  # TAHSILAT, KASA VE FINANSAL HAREKETLER (P29)
  # TEK DEFTER: tahsilat/gider/gelir/virman/iade/acilis ayni
  # `finansal_hareket` kaydinda `tip` ile ayrilir — "kasa bakiyesi =
  # hareket toplami" tutarliligi ancak TEK kaynak varken KANITLANABILIR.
  # BAKIYE SAKLANMAZ, TURETILIR. TUTAR HER ZAMAN POZITIF; isaret `yon`da.
  # RBAC: yazma admin; okuma admin+yonetici.
  # ================================================================= #
  /finans/tahsilat:
    post:
      tags: [finans]
      summary: Tekil tahsilat (admin) — kasaya GIRIS
      description: >
        `dues_payment` tablosuyla YARISMAZ: o tablo cevrimici odeme
        saglayicisi (idempotency, provider referansi) icindir; buradaki
        hareket VEZNE kaydidir ve kasayi etkiler. Ikisini birlestirmek,
        saglayici alanlarini her nakit tahsilatta bos birakmak demekti.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOpsiyonel"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TahsilatCreate" }
      responses:
        "201":
          description: Kaydedildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinansalHareket" }
        "200":
          description: TEKRAR — ayni Idempotency-Key ile ikinci istek; YENI KAYIT ACILMADI
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinansalHareket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Ayni Idempotency-Key FARKLI bir para hareketiyle gonderildi
  /finans/tahsilat/toplu:
    post:
      tags: [finans]
      summary: Cok satirli tahsilat (admin) — HEPSI ya da HICBIRI
      description: >
        Kismi basari, kullaniciya "kac satir gecti" diye saydirmak ve
        kalanlari elle tekrar girdirmek demekti; tahsilatta bu, ayni parayi
        IKI KEZ kaydetme riskidir.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOpsiyonel"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopluTahsilatIstek" }
      responses:
        "201":
          description: Kaydedildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinansalHareketListe" }
        "200":
          description: TEKRAR — ayni Idempotency-Key ile ikinci istek; YENI KAYIT ACILMADI
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinansalHareketListe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Ayni Idempotency-Key FARKLI bir para hareketiyle gonderildi
  /finans/hareketler:
    get:
      tags: [finans]
      summary: Finansal hareket listesi (admin+yonetici)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: tip
          in: query
          schema: { type: string, enum: [tahsilat, gider, gelir, virman, iade, acilis] }
        - name: kasa_id
          in: query
          schema: { type: string, format: uuid }
        - name: user_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinansalHareketListe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [finans]
      summary: Cok satirli gider/gelir girisi (admin)
      description: >
        **YON ISTEMCIDEN ALINMAZ**: gider kasadan CIKAR, gelir kasaya GIRER.
        Alinsaydi "giris yonlu gider" gibi imkansiz bir satir yazilabilirdi.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOpsiyonel"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HareketToplu" }
      responses:
        "201":
          description: Kaydedildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinansalHareketListe" }
        "200":
          description: TEKRAR — ayni Idempotency-Key ile ikinci istek; YENI KAYIT ACILMADI
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinansalHareketListe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Ayni Idempotency-Key FARKLI bir para hareketiyle gonderildi
  /finans/virman:
    post:
      tags: [finans]
      summary: Hesaplar arasi virman (admin) — IKI SATIR uretir
      description: >
        Cikis + giris, ayni `virman_grup_id` ile eslesir. Tek satirla iki
        kasayi etkilemek, "bu kasadan ne cikti" sorgusunu kasa basina degil
        hareket basina cevaplamak zorunda birakirdi. Ayni kasaya virman 422.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOpsiyonel"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VirmanIstek" }
      responses:
        "201":
          description: Iki satir olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinansalHareketListe" }
        "200":
          description: TEKRAR — ayni Idempotency-Key ile ikinci istek; YENI KAYIT ACILMADI
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinansalHareketListe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Ayni Idempotency-Key FARKLI bir para hareketiyle gonderildi
  /finans/hareketler/{hareket_id}/onayla:
    post:
      tags: [finans]
      summary: Onay bekleyen hareketi ONAYLA (admin)
      description: |
        (P192 §2.3) `durum='onay_bekliyor'` P167'de eklendi ve panel
        sayiyordu ama ONAYLAYAN UC YOKTU: onaya dusen bir gider sonsuza
        kadar bekliyordu.

        Onay `odendi` yazar ve hareket O AN kasa bakiyesine girer —
        bakiye yalniz gerceklesmis satirlari sayar (§2.2).

        Hareket `onay_bekliyor` degilse 409.
      parameters:
        - name: hareket_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HareketOnayIstek" }
      responses:
        "200":
          description: Onaylanmis hareket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hareket" }
        "409": { $ref: "#/components/responses/Conflict" }
  /finans/hareketler/{hareket_id}/reddet:
    post:
      tags: [finans]
      summary: Onay bekleyen hareketi REDDET (admin)
      description: |
        (P192 §2.3) Red `iptal` yazar — TERS KAYIT DEGIL: ters kayit
        GERCEKLESMIS bir hareketi duzeltir, reddedilen gider ise hic
        gerceklesmedi ve kasadan hic cikmadi. Satir SILINMEZ: "bu harcama
        reddedildi" bilgisi denetimin konusudur.

        Hareket `onay_bekliyor` degilse 409.
      parameters:
        - name: hareket_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HareketOnayIstek" }
      responses:
        "200":
          description: Reddedilmis hareket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hareket" }
        "409": { $ref: "#/components/responses/Conflict" }
  /finans/hareketler/{hareket_id}/iptal:
    post:
      tags: [finans]
      summary: Hareketi TERS KAYITLA iptal et (admin)
      description: |
        (P154 / Asama 10) KAYIT SILINMEZ — silinemez de: `finansal_hareket`
        uzerinde `app_rw`nin DELETE yetkisi goc 0047'de GERI ALINDI. Bir
        muhasebe kaydi "hic olmamis" hâle getirilemez; gecmis raporlari
        geriye donuk degistirirdi.

        IPTAL ILE IADE AYRI SEYLER ve ayri tiplerdir:
          * IADE  — musteriye para donusu. GERCEK bir hareket, kismi olabilir.
          * IPTAL — kayit duzeltmesi. Tam tutar, ters yon, kismi OLMAZ.

        Iptal satiri `ters_kayit_id` ile IPTAL ETTIGINI gosterir —
        `iade_edilen_id` ile AYNI YON.
      parameters:
        - name: hareket_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IptalIstek" }
      responses:
        "201":
          description: Ters kayit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hareket" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Bu hareket zaten iptal edilmis
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /finans/iade:
    post:
      tags: [finans]
      summary: Odeme iadesi (admin) — TERS YONLU yeni hareket
      description: >
        Orijinal kayit SILINMEZ ya da degistirilmez: defter append-only
        okunur, silinen bir tahsilat gecmis raporlari geriye donuk
        degistirirdi. Kismi iade serbest ama TOPLAM iade orijinali ASAMAZ
        (422). Bir IADE tekrar iade EDILEMEZ (422).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOpsiyonel"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IadeIstek" }
      responses:
        "201":
          description: Iade kaydedildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinansalHareket" }
        "200":
          description: TEKRAR — ayni Idempotency-Key ile ikinci istek; YENI KAYIT ACILMADI
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinansalHareket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Ayni Idempotency-Key FARKLI bir para hareketiyle gonderildi
  /finans/acilis:
    post:
      tags: [finans]
      summary: Acilis fisi (admin) — kisi/kasa baslangic bakiyesi
      description: >
        `kasa.acilis_bakiye_kurus` KASANIN kendi acilisidir; bu fis KISI
        bazli acilistir (devreden borc/alacak) ve ikisi ayni toplama girer.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOpsiyonel"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcilisFisi" }
      responses:
        "201":
          description: Kaydedildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinansalHareket" }
        "200":
          description: TEKRAR — ayni Idempotency-Key ile ikinci istek; YENI KAYIT ACILMADI
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinansalHareket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Ayni Idempotency-Key FARKLI bir para hareketiyle gonderildi
  /finans/yaslandirma:
    get:
      tags: [finans]
      summary: "(P192 §5.1) Borç yaşlandırma — 0-30 / 31-60 / 61-90 / 90+"
      description: |
        DAIRE BASINA TEK KOVA: bir dairenin uc gecikmis borcu varsa uc
        kovaya birden dagitmak, "kac daire 90+ gundur borclu" sorusunu
        toplami daire sayisini asan bir sayiyla yanitlardi. Daire EN ESKI
        borcunun kovasina girer ve TUM kalan borcu orada sayilir.

        Kova tutarlari KALAN borctur (tahakkuk - odenen): kismi odenmis
        bir borcu tam tutariyla yaslandirmak, tahsil edilmis parayi
        "90 gundur odenmiyor" diye gostermek olurdu.

        Vadesi GELMEMIS ve VADESIZ borclar yaslandirmaya GIRMEZ.
      parameters:
        - name: ozet
          in: query
          schema: { type: boolean, default: false }
          description: "true = daire listeleri BOS doner (kart gorunumu)"
        - name: kova
          in: query
          schema: { type: string, enum: ["0-30", "31-60", "61-90", "90+"] }
      responses:
        "200":
          description: Yaşlandırma
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Yaslandirma" }
  /finans/tahsilat-gostergesi:
    get:
      tags: [finans]
      summary: "(P192 §5.2) Tahsilat oranı + geçen aya göre değişim"
      description: |
        TEK KAYNAK (P192 §1): tahakkuk ve tahsilat toplamlari `defter`
        modulunden gelir. Rapor, seffaflik ve mobil ana ekran da ayni
        fonksiyonlari cagirir; ayni metrik iki ekranda iki farkli rakam
        veremez.
      parameters:
        - name: donem
          in: query
          schema: { type: string, example: "2026-09" }
      responses:
        "200":
          description: Gösterge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TahsilatGostergesi" }
  /finans/hatirlatma-gecmisi:
    get:
      tags: [finans]
      summary: "(P192 §4.2) Kaç hatırlatma gitti, kim açtı"
      description: |
        Sayilar `otomasyon_gunlugu`nda da var ama orasi "gorev ne yapti"
        sorusunu yanitlar; burasi "kime ulasti"yi.

        OKUNDU BILGISI ALICIYA AITTIR: her alici icin ayri `notification`
        satiri yazilir, yoksa bir kullanicinin okumasi otekininkini de
        "okundu" yapardi.

        ELLE ve OTOMATIK hatirlatmalar AYNI listede — sakin acisindan
        ikisi de ayni bildirimdir.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Hatırlatma geçmişi
          content:
            application/json:
              schema:
                type: object
                required: [meta, gonderilen, okunan, items]
                properties:
                  meta: { $ref: "#/components/schemas/PageMeta" }
                  gonderilen: { type: integer }
                  okunan: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, gonderim_zamani, okundu]
                      properties:
                        id: { type: string, format: uuid }
                        user_id: { type: string, format: uuid, nullable: true }
                        ad: { type: string, nullable: true }
                        gonderim_zamani: { type: string, format: date-time }
                        okundu: { type: boolean }
                        tutar: { type: string, nullable: true }
  /finans/borclulara/hatirlat:
    post:
      tags: [finans]
      summary: "(P192 §5.3) Seçilen borçlulara toplu hatırlatma"
      description: |
        Otomatik hatirlatmadan (§4.2) AYRIDIR ve onun gunluk damgasina
        DOKUNMAZ. Borcu KAPANMIS daireler atlanir ve sayisi doner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BorcluTopluIstek" }
      responses:
        "200":
          description: Sonuç
          content:
            application/json:
              schema:
                type: object
                required: [gonderilen, atlanan]
                properties:
                  gonderilen: { type: integer }
                  atlanan: { type: integer }
  /finans/borclulara/faiz-affi:
    post:
      tags: [finans]
      summary: "(P192 §5.3) Seçilen dairelerin faizini TERS KAYITLA affet"
      description: |
        SILME YOK: af bir KARARDIR ve izi kalmali. ODENMIS FAIZ
        AFFEDILEMEZ — alinmis parayi karsiliksiz birakmak daireyi
        ALACAKLI gosterirdi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BorcluTopluIstek" }
      responses:
        "200":
          description: Sonuç
          content:
            application/json:
              schema:
                type: object
                required: [affedilen_kalem, toplam_kurus]
                properties:
                  affedilen_kalem: { type: integer }
                  toplam_kurus: { type: integer, format: int64 }
  /finans/borclulara/odeme-plani:
    post:
      tags: [finans]
      summary: "(P192 §5.3) Vade yapılandırması — açık borçları aya yay"
      description: |
        YENI BORC URETMEZ. "Odeme plani" denince borcu N taksite BOLMEK
        akla gelir; uründe bu, eski borclari ters kayitlayip N yeni kalem
        yazmak demekti — ve KISMI ODENMIS bir borcu ters kayitlamak
        alinmis parayi karsiliksiz birakirdi.

        Plan borcun KENDISINE degil VADESINE dokunur. Yan etki
        (bilincli): vade ileri atildigi icin gecikme faizi de azalir —
        bir odeme planinin zaten beklenen davranisi budur.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BorcluTopluIstek"
                - type: object
                  required: [taksit_sayisi, ilk_vade]
                  properties:
                    taksit_sayisi: { type: integer, minimum: 2, maximum: 36 }
                    ilk_vade: { type: string, format: date }
      responses:
        "200":
          description: Sonuç
          content:
            application/json:
              schema:
                type: object
                required: [daire, guncellenen_borc]
                properties:
                  daire: { type: integer }
                  guncellenen_borc: { type: integer }
  /budget/hedefler:
    get:
      tags: [budget]
      summary: "(P192 §5.4) Bütçe hedefleri (planlanan)"
      parameters:
        - name: yil
          in: query
          schema: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        "200":
          description: Hedefler
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ButceHedefi" }
    post:
      tags: [budget]
      summary: "(P192 §5.4) Hedef yaz (aynı hedef ikinci kez = GÜNCELLEME)"
      description: |
        Butce revize edilen bir seydir; kullaniciyi "once sil, sonra
        ekle" akisina sokmak, arada hedefsiz kalan bir an birakirdi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ButceHedefiCreate" }
      responses:
        "201":
          description: Yazıldı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ButceHedefi" }
  /budget/hedefler/{hedef_id}:
    delete:
      tags: [budget]
      summary: "(P192 §5.4) Hedefi sil"
      description: |
        GERCEK DELETE: bir hedef para degil, bir NIYETTIR; silinmesi
        hicbir muhasebe kaydini degistirmez.
      parameters:
        - name: hedef_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Silindi }
  /budget/karsilastirma:
    get:
      tags: [budget]
      summary: "(P192 §5.4) Bütçe ile gerçekleşen yan yana + sapma"
      description: |
        AYLIK SORULDUYSA AYLIK HEDEF, yoksa YILLIK HEDEFIN AYA DUSEN
        PAYI (yillik/12). Aylik hedefi olmayan bir kategoriyi "hedefsiz"
        saymak, yillik butcesi onaylanmis bir kalemi sifir hedefle
        gostermek olurdu.

        Hedefi olup HIC HAREKETI OLMAYAN kategori de tablodadir:
        "butcelendim ama hic harcamadim" bir SAPMADIR.
      parameters:
        - name: yil
          in: query
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: donem
          in: query
          schema: { type: string, example: "2026-03" }
      responses:
        "200":
          description: Karşılaştırma
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ButceKarsilastirma" }
  /finans/kasa-bakiyeleri:
    get:
      tags: [finans]
      summary: Kasa bakiyeleri (admin+yonetici) — DEFTERDEN TURETILIR
      description: >
        Bakiye SAKLANMAZ: saklanan bir bakiye her yazma yolunda elle
        guncellenmek zorunda kalir ve bir yol unutuldugunda defterle bakiye
        SESSIZCE ayrilir.
      responses:
        "200":
          description: Bakiyeler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KasaBakiyeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /finans/banka-eslestir:
    post:
      tags: [finans]
      summary: Banka ekstresi satirlarina ESLESTIRME ONERISI (admin)
      description: >
        **ONERI'dir, otomatik tahsilat DEGILDIR**: banka aciklamasi serbest
        metindir ve yanlis eslesen bir satir, BASKASININ borcunu kapatip
        gercek borclunun borcunu ACIK birakirdi. Belirsizlikte (iki aday ayni
        puan) ONERI URETILMEZ — secmek kullanicinin isidir.

        Oneri KISIYI hedefler, belirli bir borcu degil: bir odeme birden
        fazla borca yayilabilir ve hangisinin kapatilacagi tahsilat
        ekraninin isidir.

        DOSYA AYRISTIRMA ISTEMCIDE (P28 ice aktarimla ayni gerekce).
        **BANKA API ENTEGRASYONU KOD DEGIL BELGE NOTUDUR** (kapsam boyle
        diyor): her bankanin ayri sozlesmesi ve kimlik akisi var, once bir
        banka secilmeli.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankaEslestirIstek" }
      responses:
        "200":
          description: Oneriler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankaEslestirSonuc" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /finans/icra-dosyalari:
    get:
      tags: [finans]
      summary: Icra dosyalari (admin+yonetici)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: durum
          in: query
          schema: { type: string, enum: [baginiz, beklemede, avukatta, mahkemede, kapandi] }
        - name: user_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/IcraDosyasi" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [finans]
      summary: Icra dosyasi ac (admin+yonetici)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IcraDosyasiCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcraDosyasi" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Ayni dosya no zaten var
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /finans/icra-dosyalari/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [finans]
      summary: Icra dosyasi guncelle (admin+yonetici)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IcraDosyasiUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcraDosyasi" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ayni dosya no zaten var
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [finans]
      summary: Icra dosyasini sil (admin+yonetici)
      description: |
        **(P168 §2)** "Finansal kayit SILINMEZ" ilkesi DEFTER icindir: bir
        tahsilat ya da gider satirini silmek gecmis raporlari geriye donuk
        degistirir.

        Icra dosyasi defter satiri DEGIL, bir SUREC KAYDIDIR. Borcun
        kendisi `dues_assessment`ta durur ve buraya KOPYALANMAZ (P29);
        acik borc her satirda ANLIK okunur. Dosyayi silmek hicbir
        finansal tutari yok etmez — yalnizca "bu borc icin icra sureci
        baslatilmisti" bilgisi gider.

        Yanlis acilmis bir dosyayi silememek, listeyi kalici copla
        yasamaya mahkum ederdi. Denetime dosya no ve kisi yazilir; silinen
        kaydin ne oldugu sonradan yalnizca oradan okunabilir.
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /finans/ozet:
    get:
      tags: [finans]
      summary: Panel ozet kartlari (admin+yonetici) — hepsi DEFTERDEN
      responses:
        "200":
          description: Ozet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinansOzet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  # ================================================================= #
  # (P167 Asama 2) OZET SAYFASI — takvim, kisisel hatirlatma, pano duzeni
  # ================================================================= #
  /hatirlatmalar:
    get:
      tags: [takvim]
      summary: Kendi takvim hatirlatmalarim (admin + yonetici)
      description: |
        Kayit YALNIZ sahibinindir: ayni tesisteki baska bir yonetici bile
        gormez. `Etkinlik` (site etkinligi) ile KARISTIRILMAMALI — o
        sakinlere duyurulur ve RSVP alir; bu kimseye gorunmeyen kisisel
        bir nottur (goc 0056).
      responses:
        "200":
          description: Liste (yakin tarih ustte)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HatirlatmaOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [takvim]
      summary: Hatirlatma ekle (admin + yonetici)
      description: >
        `user_id` ISTEKTEN ALINMAZ, token'dan gelir — alinsaydi bir yonetici
        baskasinin takvimine not birakabilirdi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HatirlatmaCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HatirlatmaOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /hatirlatmalar/{hatirlatma_id}:
    parameters:
      - name: hatirlatma_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [takvim]
      summary: Hatirlatma guncelle (KISMI, yalniz kendi kaydi)
      description: >
        Baskasinin kaydi **404** — "senin degil" demek o kaydin VAR
        OLDUGUNU dogrulamak olurdu. Ters aralik 422; kontrol BIRLESMIS
        deger uzerinde yapilir (yalniz `bitis` gonderildiginde sema onu
        tek basina gorur ve mevcut `baslangic` ile karsilastiramaz).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HatirlatmaUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HatirlatmaOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [takvim]
      summary: Hatirlatma sil (yalniz kendi kaydi)
      description: >
        GERCEKTEN silinir — ters kayit yok. Finansal satirlardan farki:
        hatirlatma bir DEFTER KAYDI degil kisisel bir nottur; izini tutmak
        kullanicinin kendi ekranini temizleyememesi demekti. Islem yine de
        `audit_log`a yazilir (yalniz KIMLIK, notun metni degil).
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /takvim:
    get:
      tags: [takvim]
      summary: Pencereye dusen TUM takvim ogeleri — tek yanitta (admin + yonetici)
      description: |
        ALTI KAYNAK BIRLESIK: etkinlik · devriye penceresi · aidat son odeme ·
        gorev teslim · rezervasyon · kisisel hatirlatma.

        NEDEN TEK UC: istemcinin alti listeyi ayri cekmesi, kullanici her ay
        okunu tikladiginda ALTI gidis-donus demekti ve ucu gelip ucu
        gelmediginde takvim yarim cizilirdi. Ayrica alti tablo alti farkli
        kolon adi tasiyor (`tarih`, `pencere_baslangic`, `son_odeme_tarihi`,
        `sonraki_planlanan`...); bu ceviriyi istemciye birakmak, cizim
        kodunun alti veri seklini bilmesi demekti.

        AIDAT SATIRLARI TARIHE GORE GRUPLANIR (daire basina degil): 200
        daireli bir sitede ayni gun 200 kayit takvimi okunamaz kilardi.
        `id` o gruplar icin tarihten turetilmis KARARLI bir uuid5'tir.

        TEKRAR EDEN HATIRLATMA pencerede GENISLETILIR; kayit cogaltilmaz.
        Ayni `id` birden fazla satirda gorunebilir.

        IPTAL EDILEN REZERVASYON DISARIDA: iptal slotu bosaltir, takvimde
        gostermek bos bir saati dolu gibi okuturdu.

        PENCERE ZORUNLU ve en fazla **120 gun** — sinirsiz aralik, alti
        tablonun tamamini tek istekte suzdurmek olurdu.
      parameters:
        - name: baslangic
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: bitis
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Takvim ogeleri (zamana gore sirali)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TakvimResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/pano-tercihi:
    get:
      tags: [takvim]
      summary: Kendi Ozet sayfasi duzenim (TUM roller)
      description: |
        BOS NESNE = "varsayilani kullan". Sunucu bir varsayilan URETMEZ:
        varsayilan kume role gore degisir (menude gorunen ilk alti sayfa) ve
        onu burada hesaplamak, ayni karari menuden sonra IKINCI bir yerde
        daha vermek olurdu.
      responses:
        "200":
          description: Duzen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanoTercihi" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [takvim]
      summary: Ozet sayfasi duzenini kaydet (TUM roller, yalniz kendi)
      description: |
        PUT cunku kayit bir BUTUNDUR. PATCH olsaydi "widget listesini
        degistir ama bolum sirasina dokunma" gibi kismi bir sozlesme
        gerekirdi; oysa istemci duzeni her zaman tam biliyor ve kismi
        yazma, iki sekme acikken birinin otekinin duzenini yarim ezmesine
        kapi acardi.

        Tanimadigi anahtar ATILIR — JSONB serbestligi bir sozlesme
        bosllugu degildir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PanoTercihi" }
      responses:
        "200":
          description: Kaydedildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanoTercihi" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /yetki-matrisi:
    get:
      tags: [yetki]
      summary: Yetki matrisi — KODUN KENDISINDEN uretilir (admin + yonetici)
      description: |
        (P41) Her (METOT, yol) icin hangi rollerin kapidan gectigi.
        Matris ELLE TUTULAN bir listeden DEGIL, `require_role`un uretilen
        bagimliliga isledigi `izinli_roller` ozniteliginden turer: elle
        liste, ayni gercegi ikinci bir yerden uretmek ve bir uc
        degistiginde panelin YANLIS yetki tablosu gostermesi demekti.

        `roller: null` **"herkese acik" DEMEK DEGILDIR**: ucta ROL kapisi
        yoktur ama kimlik dogrulamasi yine gerekebilir. Ikisini
        karistirmak, kimliksiz erisilebilir bir uc varmis gibi gostermek
        olurdu.

        `moda_bagli: true` (P35): yazma sahibi TENANT MODUNA baglidir ve
        `roller` iki modun BIRLESIMIDIR — sabit tek bir kume gostermek
        `dis_sirket` modundaki gercek davranisi yanlis anlatirdi.

        OLCMEDIGI SEY: `IZIN` "ayni veriyi goruyor" demek degildir; bazi
        uclar tum rollere aciktir ama ICERIK role gore daralir. Matris
        ERISILEBILIRLIGI gosterir.

        RBAC: admin + yonetici. Saha/sakin rollerine kapali — tum sistemin
        yetki haritasini gostermek gereksiz bir kesif yuzeyi acardi.
      responses:
        "200":
          description: matris
          content:
            application/json:
              schema:
                type: object
                required: [roller, items]
                properties:
                  roller:
                    type: array
                    items: { type: string }
                    description: Sutun sirasi — test kilidiyle AYNI
                  items:
                    type: array
                    items:
                      type: object
                      required: [metot, yol]
                      properties:
                        metot: { type: string }
                        yol: { type: string }
                        roller:
                          type: array
                          nullable: true
                          items: { type: string }
                        moda_bagli: { type: boolean, default: false }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/{user_id}:
    delete:
      tags: [users]
      summary: Kullaniciyi sil (admin + yonetici + guvenlik_amiri)
      description: >
        (P189) AKILLI SILME — gecmisi YOKSA sert siler (deleted=true), VARSA
        (sikayet/talep/devriye okutma/finans — FK RESTRICT) kimlik alanlarini
        temizler, aktif daire baglarini kapatir, cihaz/push kayitlarini siler,
        is_active=false yapar; defter/denetim satirlari KALIR (deleted=false;
        KVKK). Bekleyen davet gecersiz kilinir. Ayni yetki kapisindan gecer:
        cagiran, kendi yonetebildigi rollerdeki bir kaydi silebilir. KENDI
        hesabini silemez (409) — kendi hesabi icin onayli ayri yol var
        (`POST /me/hesap-sil`).
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Silindi (deleted=true) ya da anonimlestirildi (deleted=false)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResidentDeleteOut" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Kendi hesabini silemez
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /units/toplu:
    patch:
      tags: [units]
      summary: Secili dairelerin niteligini TOPLU degistir (admin + yonetici)
      description: >
        (P154 / Asama 5) KIMLIK LISTESI ALINIR, "3,5,7-12" gibi bir aralik
        DEGIL: aralik ifadesi kullanicinin EKRANDA GORDUGU listeye gore
        anlam kazanir (blok suzgeci acikken "7-12" baska daireleri
        gosterir). Ayristirma arayuzdedir; sunucuya KESINLESMIS kimlikler
        gelir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitTopluGuncelle" }
      responses:
        "200":
          description: Etkilenen + atlanan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopluIslemSonuc" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /units/siralama:
    patch:
      tags: [units]
      summary: Surukle-birak yerlesimi TEK ISTEKTE kaydet (admin + yonetici)
      description: >
        Her daire icin ayri PATCH atmak, yirmi dairelik bir katta yirmi
        istek ve ARADA KESILME riski demekti: yarim uygulanmis bir
        siralama, kullanicinin gordugu duzenle veritabanindakini ayirirdi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitSiralama" }
      responses:
        "200":
          description: Etkilenen + atlanan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopluIslemSonuc" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /units/kat-onizleme:
    get:
      tags: [units]
      summary: Kat silme ETKI OZETI — silmeden once ne kaybedilecek (admin + yonetici)
      description: |
        (P165) Bir kat silinirse hangi bagli kayitlarin gidecegini SAYAR;
        hicbir sey silmez.

        NEDEN AYRI UC: `POST /units/kat-sil` zaten `cascade=false` iken 409
        doner, ama o yanit ancak kullanici SILMEYE BASTIKTAN sonra gorunur.
        Ozet ise karar aninda — onay ekraninda — gerekiyor. Hata yolunu
        bilgi yolu olarak kullanmak, kullaniciyi once denemeye zorlamakti.

        `mali_kayit` AYRI ISARETLENIR: sakin ya da talep yeniden
        olusturulabilir, bir tahsilat kaydi olusturulamaz. Arayuz bunu ayri
        bir uyari olarak gosterir.

        BOS KAT 404 DEGIL, SIFIRLARLA doner: kullanici ekranda henuz daire
        eklenmemis bir kat goruyor olabilir.
      parameters:
        - in: query
          name: blok
          required: true
          schema: { type: string, minLength: 1, maxLength: 8 }
        - in: query
          name: kat
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Etki ozeti
          content:
            application/json:
              schema:
                type: object
                required: [blok, kat, daire, sakin, tahakkuk, odeme, talep, rezervasyon, mali_kayit]
                properties:
                  blok: { type: string }
                  kat: { type: integer }
                  daire: { type: integer }
                  sakin: { type: integer }
                  tahakkuk: { type: integer }
                  odeme: { type: integer }
                  talep: { type: integer }
                  rezervasyon: { type: integer }
                  mali_kayit:
                    type: boolean
                    description: Tahakkuk ya da odeme var mi (muhasebe izi)
        "403": { $ref: "#/components/responses/Forbidden" }
  /units/kat-sil:
    post:
      tags: [units]
      summary: Bir katin TUM dairelerini sil (admin + yonetici)
      description: >
        KAZA KORUMASI blok silmedekiyle AYNI: daireler varsa
        `cascade=false` **409** doner ve UI once onay ister.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KatSilIstek" }
      responses:
        "200":
          description: Silinen sayisi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopluSilSonuc" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Onay gerekli
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  /blocks/toplu-sil:
    post:
      tags: [building]
      summary: Birden fazla blogu sil (admin + yonetici)
      description: >
        HEP YA DA HIC DEGIL, SATIR SATIR: on blogun ikisi doluysa
        otekilerin silinmesini engellemek, kullaniciyi listeyi elle
        ayiklamaya zorlardi. Silinemeyenler SEBEBIYLE doner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopluSilIstek" }
      responses:
        "200":
          description: Silinen + atlanan (sebepli)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopluSilSonuc" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ================================================================= #
  # ICE AKTARIM CATISI (P154 / Asama 8)
  #
  # DORT TUR, TEK AKIS: daire · kisi · acilis_bakiye · arac. Dort ayri uc
  # yazmak ONIZLEME + HATA RAPORU + GERI ALMA + ISLEM SINIRI mantigini
  # dort kez kopyalamak olurdu.
  #
  # KOLON ESLEME ARAYUZDE: sunucu ALANLARI bildirir (`/ice-aktarim/turler`),
  # istemci kullanicinin Excel basliklarini onlara esler ve satirlari BIZIM
  # alan kodlarimizla gonderir. XLSX AYRISTIRMA SUNUCUDA YAPILMAZ (bir
  # saldiri yuzeyidir) — dosyayi zaten istemci aciyor.
  #
  # KISMI BASARI: gecerli satirlar YAZILIR, hatali satirlar raporlanir.
  # 300 satirlik bir dosyada 4 hatali satir yuzunden 296 dogru satiri
  # reddetmek, kullaniciyi dosyayi elle ayiklamaya zorlardi. Bedeli iki
  # seyle odendi: ONIZLEME hicbir sey yazmaz, GERI ALMA kosumun tamamini
  # kaldirir.
  #
  # (Eski `/site-aktar` KALDIRILDI — bu cati onun yerini aldi.)
  # ================================================================= #
  /ice-aktarim/turler:
    get:
      tags: [ice-aktarim]
      summary: Turler + ALANLARI (admin + yonetici)
      responses:
        "200":
          description: Kolon eslemesinin kurulacagi alan tanimlari
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IceAktarimTur" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /ice-aktarim/{tur}:
    post:
      tags: [ice-aktarim]
      summary: Dogrulama ya da aktarim (admin + yonetici)
      parameters:
        - name: tur
          in: path
          required: true
          schema:
            type: string
            enum: [daire, kisi, acilis_bakiye, arac]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IceAktarimIstek" }
      responses:
        "201":
          description: Sonuc raporu. `yalniz_dogrula=true` ise HICBIR SEY yazilmaz.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IceAktarimSonuc" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /ice-aktarim:
    get:
      tags: [ice-aktarim]
      summary: Gecmis kosumlar (admin + yonetici)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Kosum listesi — geri alma bu listeden yapilir
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/IceAktarimKosum" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /ice-aktarim/{aktarim_id}/geri-al:
    post:
      tags: [ice-aktarim]
      summary: Kosumun yarattigi HER SATIRI kaldirir — HEP YA DA HIC
      description: >
        Ters sirada silinir (once cocuk, sonra ebeveyn). Bir satir
        silinemiyorsa TUM geri alma duser (409). KISMI GERI ALMA YAPILMAZ:
        yarim geri alinmis bir aktarim, kullanicinin "sildim" sandigi ama
        bir kismi duran bir veri birakirdi. Kosum kaydi SILINMEZ, durumu
        `geri_alindi` olur.
      parameters:
        - name: aktarim_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Guncel kosum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IceAktarimKosum" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Zaten geri alinmis ya da kayitlar kullanimda
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }

  # ================================================================= #
  # KURULUM SIHIRBAZI (P154 / Asama 7.3)
  #
  # TEK UC, SEKIZ SAYIM. Istemci bunu sekiz ayri liste ucuna giderek de
  # cikarabilirdi ama sekiz gidis-donus olur, uclarin yanit SEKILLERI ayni
  # degildir ve en onemlisi "bu adim bitti mi" KARARI sekiz yere dagilirdi.
  #
  # TAMAMLANMA SAYILIR, SAKLANMAZ: her adimin ciktisi zaten veritabaninda.
  # Bayrak tutmak ayni gercegin ikinci kaynagini uretir ve ayrisir —
  # yonetici tek blogunu silince bayrak "tamamlandi" demeye devam ederdi.
  #
  # ATLAMA saklanir (`tenant.kurulum_atlanan`, goc 0044) cunku veriden
  # TURETILEMEZ: "bu sitede NFC yok" ile "henuz eklemedim" verisel olarak
  # aynidir, kullanici icin degil.
  # ================================================================= #
  /kurulum:
    get:
      tags: [kurulum]
      summary: Kurulum adimlarinin durumu (admin + yonetici)
      responses:
        "200":
          description: Sekiz adim + ilerleme
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KurulumDurumu" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [kurulum]
      summary: Bir adimi atla / atlamayi geri al (admin + yonetici)
      description: >
        GERI ALINABILIR olmasi sart: "NFC yok" diyen bir tesis sonradan NFC
        kurabilir ve o zaman adimi geri getirebilmeli.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KurulumAtla" }
      responses:
        "200":
          description: Guncel durum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KurulumDurumu" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # ANKET (P38) — sakinlerin karar araci
  #
  # (P154 / Asama 7.2) SITE WEB PORTALI KALDIRILDI: `/public/{slug}`,
  # `/portal` ve `/portal/...` uclari silindi (ozel domain hizmeti
  # sunulmuyor). Anket AYNI ROUTERDA yasiyordu ve birlikte silinseydi
  # CALISAN bir ozellik giderdi — mobil anket ekrani bilerek salt-okuma,
  # yonetim yuzeyi panelde. Once ayrildi (`routers/anketler.py` + panelde
  # `/anketler` sayfasi), sonra portal kaldirildi.
  #
  # UCLARIN YOLU VE DAVRANISI DEGISMEDI — bu bir tasima, sozlesme
  # degisikligi degil.
  #
  # SONUC KAPANANA KADAR GIZLI: acik bir ankette guncel dagilimi gostermek
  # sonraki oy verenleri etkiler. Yonetim sonucu HER ZAMAN gorur.
  # ================================================================= #
  /anketler:
    get:
      tags: [anket]
      summary: Anketler (bilinen TUM roller okur)
      description: |
        SONUC KAPANANA KADAR GIZLI: acik bir ankette guncel dagilimi
        gostermek sonraki oy verenleri etkiler (surusel etki) ve oylamanin
        kendisini bozardi — `toplam_oy` ve secenek `oy` alanlari **null**
        doner. Yonetim (admin+yonetici) sonucu HER ZAMAN gorur: kararin
        sahibi odur.

        `oy_verdim` istegi yapan kisiye aittir; kendi oyunu bilmek
        baskasinin oyunu gormek DEGILDIR.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": { description: anketler }
    post:
      tags: [anket]
      summary: Anket olustur (admin + yonetici)
      description: >
        EN AZ IKI secenek: tek secenekli bir anket oy toplamaz, ONAY toplar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnketCreate" }
      responses:
        "201": { description: olusturuldu }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /anketler/{anket_id}:
    patch:
      tags: [anket]
      summary: Anketi guncelle (admin + yonetici)
      description: >
        SECENEKLER DEGISTIRILEMEZ (govdede kabul EDILMEZ): oy verilmis bir
        anketin seceneklerini degistirmek, verilmis oylari BASKA BIR SORUYA
        tasimak olurdu.
      parameters:
        - { name: anket_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: guncellendi }
        "404": { $ref: "#/components/responses/NotFound" }
  /anketler/{anket_id}/oy:
    post:
      tags: [anket]
      summary: Oy ver (YALNIZ resident)
      description: |
        TEK OY, DEGISTIRILEMEZ. "Oyumu degistireyim" akisi BILINCLI OLARAK
        YOKTUR: degistirilebilir oy, kapanis anina kadar sonucun anlamsiz
        olmasi ve kimin ne zaman dondugunun kayda gecmesi demekti. Ikinci
        oy **409 `anket_zaten_oy_verdiniz`**; kapali anket **409
        `anket_kapali`**; baska anketin secenegi **422**.

        Oy YALNIZ sakinde: anket sakinlerin karar aracidir, personelin oyu
        site kararina girmez.

        Oy verildikten SONRA bile acik anketin sonucu GIZLIDIR.
      parameters:
        - { name: anket_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secenek_id]
              properties:
                secenek_id: { type: string, format: uuid }
      responses:
        "201": { description: oy alindi }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # GURULTU CAYDIRICI (P37) — esik -> eylem -> sifirlama
  # AYRI BIR WEBHOOK KONFIGURASYONU ACILMADI: C1b'nin `integration` tablosu
  # zaten SSRF-korumali gonderim, KEK ile sifreli sir ve tenant izolasyonu
  # sunuyor. Tenant yalnizca HANGI entegrasyonun caydirici oldugunu secer
  # (`gurultu_integration_id`); NULL olmasi MANUEL MOD demektir — bir hata
  # durumu degil, cogu sitenin normali.
  # SIFIRLAMA KAYIT SILMEZ: esige varinca o dairenin ACIK gurultu
  # sikayetleri `kapali`ya cekilir; kayitlar gecmiste durur, P24 renk
  # skalasi dogal olarak yesile doner.
  # ================================================================= #
  /unit-uyarilari:
    get:
      tags: [gurultu]
      summary: Verilen caydirici uyarilar (admin + yonetici)
      description: >
        Uyari kaydi KOMSU DAVRANISI hakkinda veri tasir (P24 ile ayni
        gerekce): yalniz yonetim gorur. `esik`, `sayac` ve `metin` o anki
        degerleriyle KOPYALANMISTIR — ayar/sablon sonradan degisse de gecmis
        uyari ne oldugunu soylemeye devam eder.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: unit_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200": { description: uyarilar }
        "403": { $ref: "#/components/responses/Forbidden" }
  /unit-uyarilari/{uyari_id}/yapildi:
    post:
      tags: [gurultu]
      summary: Manuel modda anonsun YAPILDIGINI isaretle
      description: >
        SUNUCU BUNU KENDILIGINDEN VARSAYAMAZ: anonsun gercekten yapilip
        yapilmadigini yalniz insan bilir. Isaretlenmeyen kayit
        `manuel_bekliyor` olarak DURUR — sessizce "yapildi" saymak,
        denetimde yapilmamis bir isi yapilmis gostermek olurdu. Zaten
        isaretlenmis kayit **409**.
      parameters:
        - { name: uyari_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: isaretlendi }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /unit-uyarilari/kuyruk-isle:
    post:
      tags: [gurultu]
      summary: Basarisiz webhook uyarilarini ELLE yeniden dene (admin)
      description: >
        Normalde bunu zamanlanmis gorev yapar (`scheduler.gurultu_kuyrugu`,
        dakikada bir); bu uc beat'i beklemeden dogrulamak icindir.
        Geri cekilme KATLANIR (1, 5, 25 dk) ve en fazla 3 deneme yapilir;
        tukenirse kayit MANUEL MODA duser — sistem sessizce pes etmez.
      responses:
        "200": { description: "{islenen: n}" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ================================================================= #
  # KVKK AYDINLATMA + ONAY + PAZARLAMA IZINLERI (P36)
  # METIN TENANT ICERIGIDIR, urun sabiti DEGIL: her tesisin veri sorumlusu
  # kendisidir. Platforma gomulu tek bir metin, 200 tesise BASKASININ
  # metnini imzalatmak olurdu. Metin ORIJINAL DILINDE gosterilir (hukuki
  # metnin makine cevirisi yanlis bir taahhut uretirdi).
  #
  # SUNUCU NAVIGASYONU KILITLEMEZ, kapiyi ISTEMCI kurar (`onay_gerekli`).
  # Gerekce: onay vermemis bir kullanici METNI OKUYABILMELI ve cikis
  # yapabilmelidir; her ucu 403'lemek metni gostermeyi de imkansiz kilar.
  # RIZANIN GERCEK ZORLAMASI GONDERIM UCUNDADIR (P32): pazarlama mesajlari
  # yalniz O KANALA izin vermis kisilere gider.
  # ================================================================= #
  /kvkk/metin:
    get:
      tags: [kvkk]
      summary: Tenant'in GUNCEL aydinlatma metni (bilinen tum roller)
      description: >
        Rol suzgeci YOK: metin kullanicinin KENDI verisi hakkindadir,
        okuyamamak aydinlatmanin kendisini imkansiz kilardi. Tenant metin
        yayinlamadiysa **404**.
      responses:
        "200": { description: guncel surum }
        "404": { $ref: "#/components/responses/NotFound" }
  /kvkk/durum:
    get:
      tags: [kvkk]
      summary: Kendi onay durumum — onay kapisinin TEK girdisi
      responses:
        "200":
          description: durum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KvkkDurum" }
  /kvkk/onaylarim:
    get:
      tags: [kvkk]
      summary: KENDI onay gecmisim (bilinen tum roller)
      description: >
        (P170 §2) Yonetim panele tasindi, OKUMA yuzeyi yerinde kaldi.
        "Hangi metni hangi surumde ne zaman onayladim" sorusu kullanicinin
        KENDI verisidir; yanitlanamamasi onayin kendisini denetlenemez
        kilardi. Sorgu `user_id` ile sinirli — yonetici bile buradan
        baskasinin onayini goremez.
      responses:
        "200": { description: onay gecmisi }
  /kvkk/onay:
    post:
      tags: [kvkk]
      summary: Ekranda GORULEN surumu onayla
      description: |
        Surum govdede tasinir ve guncel surumle KARSILASTIRILIR: kullanici
        metni okurken yeni surum yayinlandiysa onayi ESKI METNE aitti —
        sessizce yeni surume yazmak, okumadigi bir metni onaylatmak olurdu
        (**409 `kvkk_surumu_degisti`**).

        IDEMPOTENT: ayni surum icin ikinci cagri yeni satir uretmez.

        Onay satiri SILINMEZ ve GUNCELLENMEZ. Onayi "geri almak" onay
        kaydini silmek DEGILDIR: aydinlatma bir BILDIRIMDIR — geri alinabilen
        sey PAZARLAMA RIZASIDIR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [surum]
              properties:
                surum: { type: integer, minimum: 1 }
      responses:
        "201":
          description: onaylandi (guncel durum doner)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KvkkDurum" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/pazarlama-tercihleri:
    get:
      tags: [kvkk]
      summary: Kendi pazarlama izinlerim
      responses:
        "200":
          description: tercihler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PazarlamaTercihleri" }
    patch:
      tags: [kvkk]
      summary: Pazarlama izinlerini guncelle (KISMI)
      description: |
        UC BAGIMSIZ KANAL. Tek bir "pazarlama" bayragi, kisiyi istemedigi
        kanaldan mesaj almak ile hic almamak arasinda secmeye zorlardi.
        Gonderilmeyen kanal DEGISMEZ. Ucu de VARSAYILAN KAPALIDIR (KVKK:
        riza ACIK olmali, varsayilan olamaz) ve HER AN geri alinabilir.

        Tercih HER ZAMAN KENDISI icindir — baskasinin rizasini kimse
        veremez, bu yuzden `/users/{id}` altinda bir ikizi YOKTUR.
        Degisim `audit_log`a yazilir (KVKK: ispat yukumlulugu veri
        sorumlusundadir).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PazarlamaTercihUpdate" }
      responses:
        "200":
          description: guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PazarlamaTercihleri" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # YONETISIM (P33) — KARAR DEFTERI + DOKUMAN ARSIVI + SITE AKTARIM
  # IS TAKIBI icin AYRI UC ACILMADI: denetim omurganin ZATEN VAR OLDUGUNU
  # gosterdi (`complaint` = Talep/Ariza, `task` = Is Emri, Ticketing v1'de
  # bagli). Yapilan sey birlestirme degil GENISLETMEDIR: `complaint` uc alan
  # kazandi (`unit_id`, `oncelik`, `atanan_personel_id`) ve mevcut
  # `/complaints` uclari bunlari tasiyor. `unit_complaint` ile birlestirmek
  # P22(e)'nin BILINCLI ayrimini bozardi.
  # RBAC: hepsi admin + yonetici.
  # ================================================================= #
  /karar-defteri:
    get:
      tags: [yonetisim]
      summary: Karar defteri kayitlari (admin+yonetici)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": { description: kararlar (uyeleriyle birlikte) }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [yonetisim]
      summary: Karar olustur
      description: |
        `karar_no` tenant icinde TEKTIR (cakisma 409). Uyeler AYRI tabloda
        (`karar_uyesi`) tutulur: tek metin sutununa virgulle yazmak, "bu
        karara kim katildi" sorgusunu metin aramasina cevirirdi. Uye bir
        ADDIR, kullanici referansi DEGILDIR — yonetim kurulu uyesi
        uygulamada hesabi olmayan biri olabilir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KararDefteriCreate" }
      responses:
        "201": { description: olusturuldu }
        "409": { $ref: "#/components/responses/Conflict" }
  /karar-defteri/{karar_id}:
    patch:
      tags: [yonetisim]
      summary: Karari guncelle
      description: |
        `uyeler` GONDERILIRSE liste TAMAMEN DEGISTIRILIR (kismi
        ekleme/cikarma yok — hangi uyenin kaldirildigi belirsizligini
        istemciye birakirdi). Gonderilmezse uyelere DOKUNULMAZ.
      parameters:
        - { name: karar_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: guncellendi }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [yonetisim]
      summary: Karari sil (uyeleriyle birlikte)
      parameters:
        - { name: karar_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: silindi }
        "404": { $ref: "#/components/responses/NotFound" }
  /karar-defteri/{karar_id}/pdf:
    get:
      tags: [yonetisim]
      summary: Karari PDF olarak indir
      description: |
        METIN sablonu kullanilir (P31 `metin_pdf`), tablo sablonu DEGIL:
        karar bir YAZIDIR ve tabloya sikistirmak metni hucrelere bolerdi.
        Baskan ve uyeler imza satiri olarak alta yazilir.
      parameters:
        - { name: karar_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
  /dokumanlar:
    get:
      tags: [yonetisim]
      summary: Site dokuman arsivi (admin+yonetici)
      description: |
        Sunucu DOSYAYI TASIMAZ, yalniz USTVERIYI tutar. Yukleme/indirme
        mevcut presign akisiyla dogrudan MinIO'ya yapilir; dosyayi API
        uzerinden gecirmek 25 MB'lik bir yuku is parcaciginda tutmak olurdu.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": { description: dokumanlar }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [yonetisim]
      summary: Yuklenen dosyanin kaydini olustur
      description: |
        `boyut_bayt` EN FAZLA 25 MB (26214400) — daha buyugu presign
        akisinda zaman asimina ve mobilde bellek baskisina yol acar. Sinir
        ayrica veritabani CHECK'i ile de korunur (migration 0022).
        Ayni `obje_anahtari` iki kez kaydedilemez (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DokumanCreate" }
      responses:
        "201": { description: kaydedildi }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /dokumanlar/{dokuman_id}:
    delete:
      tags: [yonetisim]
      summary: Dokuman kaydini sil (YUMUSAK)
      description: |
        **(P167 §6.3)** Silme artik YUMUSAK: `silindi_at` doldurulur.
        Kayit listeden kalkar (kullanici icin silinmistir), MinIO objesi
        ve satir bir SURE daha durur, gecelik retention suresi dolanlarin
        ONCE objesini sonra satirini siler.

        ONCEKI TASARIM VE KUSURU: satir siliniyor, obje kaliyordu. Gerekce
        "yanlislikla silinen bir yonetim plani geri alinabilsin"di — ama
        kayit gittigi icin dosyaya yalnizca DEPOYA ELLE baglanan biri
        ulasabiliyordu. Yani pratikte geri alinamiyor, buna karsilik obje
        depoda SONSUZA KADAR kaliyor ve kimse fark etmiyordu.

        Zaten silinmis bir kayda tekrar silme demek **404**'tur.
      parameters:
        - { name: dokuman_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: silindi }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [yonetisim]
      summary: Dokumani sakine AC / KAPAT (admin+yonetici)
      description: |
        **(P167 ek)** Tek degistirilebilir alan GORUNURLUKTUR.

        DENETIME YAZILIR: bir dokumani sakine acmak bir YAYIN kararidir;
        "bunu kim, ne zaman yayina cikardi" sorusunun bir cevabi olmali.
      parameters:
        - { name: dokuman_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DokumanUpdate" }
      responses:
        "200": { description: guncellendi }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/dokumanlar:
    get:
      tags: [yonetisim]
      summary: Sakine acilmis dokumanlar (YALNIZ resident)
      description: |
        **(P167 ek)** AYRI UC, "yonetim ucuna rol ekleme" DEGIL.

        `/dokumanlar` TUM arsivi doner. Ona `resident` rolu eklemek,
        gorunurluk suzgecini o ucun ICINDE bir rol dalina bagimli
        kilardi — ve o dalin bir gun yanlis yazilmasi BUTUN ARSIVI
        sakine acardi. Ayri uc, kuralin tek bir yerde ve tek bir
        cumleyle yasamasini saglar: "sakine acik ve silinmemis".

        `yukleyen_ad` **null doner**: sakinin ihtiyaci "hangi belge",
        "kim yukledi" degil. Personel adini her sakine dagitmak amac
        sinirliligiyla bagdasmazdi.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": { description: dokumanlar }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/dokumanlar/{dokuman_id}/indir:
    get:
      tags: [yonetisim]
      summary: Sakine acik dokumanin indirme baglantisi (YALNIZ resident)
      description: |
        **(P167 ek)** Sakine KAPALI ya da SILINMIS dokuman **404** doner,
        403 degil: 403 "bu belge var ama sana kapali" demek olurdu ve
        arsivde neyin BULUNDUGUNU dogrulardi. Sakin icin o kayit YOKTUR.
      parameters:
        - { name: dokuman_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Indirme baglantisi
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
                  dosya_adi: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /dokumanlar/{dokuman_id}/indir:
    get:
      tags: [yonetisim]
      summary: Dokumanin kisa omurlu indirme baglantisi (admin+yonetici)
      description: |
        **(P167 §6.3)** BU UC EKSIKTI: dosya yuklenebiliyor ve
        listelenebiliyordu ama INDIRILEMIYORDU — arsivin tek amaci olan
        sey yapilamiyordu.

        OBJE ANAHTARI DEGIL URL DONER: anahtar istemciye verilseydi hem
        depo yapisi disari sizar hem de iznin SURESI kaybolurdu (avatar,
        duyuru gorseli ve rapor kuyruguyla ayni kural).

        Silinmis dokuman **404**.
      parameters:
        - { name: dokuman_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Indirme baglantisi
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
                  dosya_adi: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /mesaj-sablonlari:
    get:
      tags: [mesajlar]
      summary: Mesaj sablonlari (admin+yonetici)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: kanal
          in: query
          schema: { type: string, enum: [sms, eposta] }
        - name: aktif
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/MesajSablonu" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [mesajlar]
      summary: Sablon olustur (admin+yonetici)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MesajSablonuCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MesajSablonu" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Ayni KANALDA ayni ad zaten var (farkli kanalda serbest)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /mesaj-sablonlari/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [mesajlar]
      summary: Sablon guncelle (admin+yonetici)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MesajSablonuUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MesajSablonu" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ayni kanalda ayni ad
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [mesajlar]
      summary: Sablon sil (admin+yonetici) — GECMIS DURUR
      description: >
        Gonderim gecmisi metni KOPYALADIGI icin sablon silinse de "ne
        gonderdik" sorusu cevaplanabilir kalir.
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /mesajlar/onizleme:
    post:
      tags: [mesajlar]
      summary: Etiketleri COZULMUS onizleme + SMS sayaci (admin+yonetici)
      description: >
        Sayac ONIZLEMEDE verilir, kaydetmede degil: kullanici yazarken parca
        sayisinin arttigini GORMELI.

        **TURKCE TUZAGI**: GSM-7 kumesinde `Ç` (BUYUK), `ö`, `ü` VARDIR ama
        `ç` (KUCUK), `ı`, `ğ`, `ş`, `İ`, `Ğ`, `Ş` YOKTUR. Bunlardan biri
        mesaji UCS-2'ye dusurur ve sinir **160'tan 70'e** iner — "biraz
        uzun" bir mesaj birden UC SMS olur. Yanit ZORLAYAN karakterleri
        dondurur ki kullanici bilincli secsin.
      parameters:
        - name: kanal
          in: query
          schema: { type: string, enum: [sms, eposta], default: sms }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MesajOnizlemeIstek" }
      responses:
        "200":
          description: Onizleme
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MesajOnizleme" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /mesajlar/gonder:
    post:
      tags: [mesajlar]
      summary: Bireysel + toplu gonderim TEK UCTAN (admin+yonetici)
      description: >
        `user_ids` verilirse o kisilere; verilmezse `blok`/`borc_durumu`
        suzgeci uygulanir. Iki ayri uc, ayni riza/gecmis mantigini iki kez
        yazmak olurdu. Tek istekte en fazla **500** alici.

        **SESSIZ DUSURME YOK**: rizasi olmayan (`riza_yok`) ve adresi
        olmayan (`adres_yok`) aliciler AYRI SAYILIR ve yanitta doner —
        "gonderdim" deyip 40 kisiyi atlamak, yonetimin haberi olmadan
        bildirimsiz kalmasi demekti.

        **SAGLAYICI**: SMS varsayilani LOG'dur (gercek hesap [DIŞ]);
        e-posta SMTP yapilandirilmissa gercekten gonderir, degilse loglar.
        Mimari saglayiciyi bir YAPILANDIRMA degisikligiyle degistirir.
        Durum `gonderildi` yazilir, `iletildi` YAZILMAZ: iletim bilgisini
        yalnizca gercek saglayici verebilir ve uydurmak panelde YANLIS bir
        teslim kaniti gosterirdi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MesajGonderIstek" }
      responses:
        "201":
          description: Gonderim sonucu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MesajGonderSonuc" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429":
          description: |
            (P154) Tesisin GUNLUK gonderim kotasi doldu. Kontrol gonderim
            BASLAMADAN yapilir: 300 kisilik listede 50. alicida kotaya
            takilmak, kime gidip kime gitmedigini aciklamasi zor bir durum
            birakirdi — yarim gonderim YERINE hic.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
  /mesaj-ayarlari:
    get:
      tags: [mesajlar]
      summary: Tesisin SMS/e-posta saglayici ayarlari (admin+yonetici)
      description: |
        **(P168 §4.4)** SIRLAR HIC DONMEZ — "maskeli" bile degil.

        Brief "sirlar arayuzde maskeli gosterilsin" diyor. Bunu `****`
        gibi bir metin dondurerek yapmak kolay ama YANLIS olurdu: maskeli
        deger de bir DEGERDIR, forma girer ve kullanici "kaydet"e
        bastiginda gercek parolanin uzerine `****` yazilirdi.

        Bunun yerine `sms_parola_var` / `smtp_parola_var` bayraklari
        doner. Arayuz bos bir alan cizer ve "kayitli bir parola var,
        degistirmek icin yenisini yazin" der.

        `sms_hazir` / `eposta_hazir`: kanal GERCEKTEN gonderebilir mi.
        Bayrak, gonderim aninda kullanilan saglayici secim
        fonksiyonundan turer — "ayarlar dolu mu" diye ayrica bakmak, o
        kontrolun bir gun gercek secimden ayrismasi demekti.
      responses:
        "200": { description: Ayarlar }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [mesajlar]
      summary: Ayarlari kaydet (admin+yonetici)
      description: |
        **(P168 §4.4)** BOS BIRAKILAN PAROLA MEVCUDU KORUR: alan hic
        gonderilmezse (`null`) degistirilmez; acikca BOS DIZGE
        gonderilirse TEMIZLENIR. Ikisini ayirmasaydik, kayitli bir
        parolayi silmenin hicbir yolu olmazdi.

        Denetime yalnizca HANGI alanlarin degistigi yazilir; sirlar
        denetim kaydina da girmez.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MesajYapilandirmaUpdate" }
      responses:
        "200": { description: Kaydedildi }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /mesaj-ayarlari/test:
    post:
      tags: [mesajlar]
      summary: Test gonderimi (admin+yonetici)
      description: |
        **(P168 §4.4)** GERCEKTEN GONDERIR: "ayarlar dolu mu" diye bakmak
        yanlis parolayi ya da yanlis basligi YAKALAMAZ — saglayici
        reddedene kadar her sey dogru gorunur. Tek durust olcum gercek
        bir istektir.

        GECMISE YAZILMAZ: test bir bildirim degildir; gonderim gecmisine
        dusmesi "kime ne gonderdik" defterini kirletirdi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MesajTestGonderim" }
      responses:
        "200":
          description: Sonuc (durum + saglayici + varsa hata)
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /mesajlar/gecmis:
    get:
      tags: [mesajlar]
      summary: Gonderim gecmisi (admin+yonetici)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: kanal
          in: query
          schema: { type: string, enum: [sms, eposta] }
        - name: user_id
          in: query
          schema: { type: string, format: uuid }
        - name: durum
          in: query
          schema: { type: string, enum: [kuyrukta, gonderildi, iletildi, okundu, basarisiz] }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/MesajGonderim" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /raporlar/katalog:
    get:
      tags: [raporlar]
      summary: Rapor katalogu (admin+yonetici)
      description: >
        Listede gorunup CALISMAYAN bir rapor OLAMAZ: katalog ve yonlendirme
        AYNI sozlukten okur (test her kodu tablo bicimiyle cagirip dogrular).
      responses:
        "200":
          description: Katalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RaporKatalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /raporlar/{kod}:
    post:
      tags: [raporlar]
      summary: Raporu uret — tablo | excel | pdf (admin+yonetici)
      description: >
        `bicim=tablo` JSON tablo doner; `excel` bir XLSX, `pdf` kurumsal
        sablonlu bir PDF **indirir** (`Content-Disposition: attachment`).

        PDF sablonu: site adi (+ logo varsa) · rapor adi · donem · zaman
        damgasi · her sayfada "Sayfa n / m". Sayfa sayisi onceden bilinmedigi
        icin **iki gecisli** uretilir — resmi bir ciktida "n / ?" kabul
        edilemez. Logo OPSIYONELDIR; yoksa baslik kayar (logoyu zorunlu
        kilmak, logo yuklememis siteye rapor urettirmemek olurdu).

        Excel'de para hucreleri **SAYIDIR** (TL cinsinden), metin degil:
        kurusu metin yazmak kullanicinin Excel'de toplam almasini
        engellerdi.
      parameters:
        - name: kod
          in: path
          required: true
          schema: { type: string }
          description: Katalog kodu (orn. borc_alacak)
        - name: bicim
          in: query
          schema: { type: string, enum: [tablo, excel, pdf], default: tablo }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RaporParametre" }
      responses:
        "200":
          description: Rapor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RaporTablo" }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /raporlar/{kod}/kuyruk:
    post:
      tags: [raporlar]
      summary: Agir raporu KUYRUGA al — 202 + is kimligi (admin+yonetici+denetci)
      description: >
        **(P167 §5)** Brief: "buyuk raporlar kuyruga girsin ve hazir olunca
        indirilebilsin (senkron uretim tarayiciyi kilitler)".

        Olculebilir sorun: `borc_alacak` ve `detayli_borc` TUM defteri tarar.
        500 daireli bir sitede bu, her dairenin butun tahakkuk/tahsilat
        gecmisini okuyup gecikme tazminatini tek tek hesaplamak demek. Istek
        yolunda yapildiginda tarayici yanit gelene kadar bekler, ters vekil
        zaman asimi sinirina takilabilir ve zaman asiminda IS YARIM KALIR —
        kullanici neyin oldugunu bilmez, yeniden dener, sunucu ayni isi bir
        kez daha yapar.

        AYRI UC, "bazen kuyruga alan tek uc" DEGIL: senkron uc bir DOSYA,
        bu uc bir IS KIMLIGI doner. Ayni ucun bazen dosya bazen JSON
        dondurmesi, ayrimi unutan bir istemcinin JSON'u dosya diye
        indirmesine yol acardi.

        `bicim=tablo` KABUL EDILMEZ (422): tablo ciktisi ekranda gosterilir
        ve zaten hizlidir; kuyruga almak kullaniciyi gormek istedigi seyi
        beklemeye zorlamak olurdu.
      parameters:
        - name: kod
          in: path
          required: true
          schema: { type: string }
        - name: bicim
          in: query
          required: true
          schema: { type: string, enum: [excel, pdf] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RaporParametre" }
      responses:
        "202":
          description: Is kuyruga alindi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RaporIs" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /raporlar/isler:
    get:
      tags: [raporlar]
      summary: Rapor islerim — YALNIZ kendi isleri (admin+yonetici+denetci)
      description: >
        **(P167 §5)** Gorunurluk kapisi `user_id`dir: rapor ciktisi kisi
        adlari ve site finansi tasir; ayni tesisteki baska bir yoneticinin
        BASKASININ istedigi dosyayi gormesi icin bir sebep yok — ve bu
        sizinti sessizdir.
      responses:
        "200":
          description: Isler (yeniden eskiye)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RaporIs" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /raporlar/isler/{is_id}/indir:
    get:
      tags: [raporlar]
      summary: Hazir raporu indir — kisa omurlu presigned URL
      description: >
        **(P167 §5)** Baskasinin isi icin **404** doner, 403 degil: 403
        "senin degil" demek olurdu ve o isin VAR OLDUGUNU dogrulardi.

        Hazir olmayan is icin **409**: arayuzun "indir" dugmesini o durumda
        cizmemesi gerekir, ama uc de reddeder — dugme yarisla goruntulenirse
        kullanici bos bir dosya indirmemelidir.
      parameters:
        - name: is_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Indirme baglantisi
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
                  dosya_adi: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/makbuzlar:
    get:
      tags: [aidat]
      summary: "(P192 §4.4) Sakinin MAKBUZ ARSIVI"
      description: |
        Makbuz uretiliyordu ama sakin ONA ULASAMIYORDU: makbuz ucu yalniz
        yonetime acikti ve arsiv ekrani yoktu.

        KAPSAM KENDI MAKBUZLARI: `user_id` suzgeci ZORUNLU — daire
        uzerinden suzmek, ayni dairede oturmus ESKI sakinin makbuzlarini
        yeni sakine gostermek olurdu.

        `pdf_url` KISA OMURLUDUR (presign) ve saklanmaz.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Makbuz listesi
          content:
            application/json:
              schema:
                type: object
                required: [meta, items]
                properties:
                  meta: { $ref: "#/components/schemas/PageMeta" }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Makbuz" }
  /me/odeme-bilgileri:
    get:
      tags: [aidat]
      summary: Sakinin odeme bilgileri (YALNIZ resident) — IBAN + KOD + borc
      description: >
        **(P30)** "Öde" ekraninin ihtiyaci olan HER SEY tek yanitta: iki cagri
        yapmak ekrani iki yukleme durumuna bolerdi.

        `iban` sitenin **anlasmali BANKA kasasindan** gelir (P27) — ayri bir
        "anlasmali IBAN" tenant alani ACILMADI, cunku iki yerde tutulan IBAN
        biri guncellenip digeri unutuldugunda parayi **YANLIS HESABA**
        yollardi. Banka kasasi yoksa `null` doner ve istemci havale
        secenegini **gizler**.

        `odeme_kodu` sakine ozel, **BIR KEZ uretilir ve SABIT KALIR** —
        turetilseydi (orn. daire no + id) daire numarasi degisince kod da
        degisir ve sakinin bankadaki duzenli talimati SESSIZCE eslesmez
        olurdu. Bicim `TS-XXXXXX`; alfabede `0/O/1/I` YOKTUR (kod elle
        yazilir).
      responses:
        "200":
          description: Odeme bilgileri
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OdemeBilgileri" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/odeme/kart:
    post:
      tags: [aidat]
      summary: Kart odemesi baslat (YALNIZ resident)
      description: >
        Mevcut `PaymentProvider` soyutlamasi uzerinden. AYRI BIR KART
        ENTEGRASYONU YAZILMADI: iki odeme yolu iki tahsilat kaydi bicimi
        uretirdi. Manuel/sahte saglayici ANINDA `basarili` doner ve tahsilat
        P29 defterine yazilir; gercek saglayici bir `odeme_url` dondurur ve
        tahsilat webhook ile yazilir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tutar_kurus]
              properties:
                tutar_kurus: { type: integer, format: int64, minimum: 1 }
      responses:
        "201":
          description: Baslatildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KartOdemeSonuc" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /borclandirma/toplu/onizleme:
    post:
      tags: [aidat]
      summary: Toplu borclandirma ONIZLEMESI (admin) — HICBIR SEY YAZMAZ
      description: >
        Ne olacagini gosterir. "500 daireden 3'u tipsiz" bilgisi islemeden
        ONCE gorulmelidir; sonra fark edilirse eksik tahakkuk sessizce
        yayilir. Isleme ucu AYNI govdeyi alir ve AYNI plani uretir —
        gorulen ile yazilan arasinda fark kalmasin diye.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopluBorcIstek" }
      responses:
        "200":
          description: Onizleme
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopluBorcOnizleme" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /borclandirma/toplu:
    post:
      tags: [aidat]
      summary: Toplu borclandirmayi ISLE (admin)
      description: >
        Onizlemedeki plani isler. Mukerrer tahakkuklar ATLANIR (uc yeniden
        calistirilabilir). Yanitta `created` **BOS** doner: 500 satirlik bir
        yanit istemciyi bogar ve ayrintiyi onizleme zaten verdi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopluBorcIstek" }
      responses:
        "201":
          description: Islendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuesAssessmentResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /borclandirma/sayac:
    post:
      tags: [aidat]
      summary: Sayac ile borclandirma — sihirbazin 4. adimi (admin)
      description: >
        Sihirbaz: dagitim sekli -> ana sayac -> tuketim degerleri ->
        borclandirma. Ilk uc adim istemcide toplanir ve sunucuya TEK istek
        gelir; ara adimlarda sunucu durumu tutmak, yarim kalmis sihirbazlari
        temizlemek zorunda birakirdi.

        ORTAK ALAN: ana sayac ile daire sayaclarinin toplami arasindaki fark
        ortak tuketimdir; `sayac_ana.ortak_alan_yuzde` verilmisse o yuzdesi
        dairelere ESIT dagitilir. NEGATIF fark (olcum hatasi) sifirlanir —
        dairelere negatif borc yazmak ALACAK uretirdi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SayacBorcIstek" }
      responses:
        "201":
          description: Islendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuesAssessmentResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /borclandirma/ice-aktarim:
    post:
      tags: [aidat]
      summary: Satir listesinden borclandirma — SATIR BAZLI hata raporu (admin)
      description: >
        **BOZUK SATIR TUM ICE AKTARIMI DUSURMEZ**: 400 satirlik bir dosyada
        3 hatali satir yuzunden 397 dogru satiri reddetmek, kullaniciyi
        dosyayi elle ayiklamaya zorlardi. Hatalar satir numarasiyla doner.

        **DOSYA AYRISTIRMA ISTEMCIDE**: sunucu XLSX ayristirmaz. Gerekce —
        xlsx ayristirma bir SALDIRI YUZEYIDIR (zip bombasi, XXE, formul
        enjeksiyonu) ve panel dosyayi zaten okuyup onizleme gostermek
        zorunda. Sunucu YAPILANDIRILMIS satir listesi alir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BorcIceAktarimIstek" }
      responses:
        "201":
          description: Islendi (hatali satirlar raporlanir)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BorcIceAktarimSonuc" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /aidat-planlari:
    get:
      tags: [otomasyon]
      summary: "(P192 §4.1) Otomatik aylik tahakkuk planlari"
      responses:
        "200":
          description: Plan listesi
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AidatPlani" }
    post:
      tags: [otomasyon]
      summary: "(P192 §4.1) Aidat plani olustur"
      description: |
        Yonetici BIR KEZ tanimlar: tutar/dagitim, ayin kacinda tahakkuk,
        vade kac gun sonra, onizleme kac gun once. Sistem her ay otomatik
        tahakkuk eder.

        Onceden `beat_schedule`da aidat gorevi YOKTU; yonetici her ay elle
        calistiriyordu ve unutursa o ay borc olusmuyordu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AidatPlaniCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AidatPlani" }
        "409": { $ref: "#/components/responses/Conflict" }
  /aidat-planlari/{plan_id}:
    parameters:
      - name: plan_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [otomasyon]
      summary: "(P192 §4.1) Plani guncelle (tutar, gun, aktiflik)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AidatPlaniUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AidatPlani" }
    delete:
      tags: [otomasyon]
      summary: "(P192 §4.1) Plani sil — YAZILMIS tahakkuklar etkilenmez"
      description: |
        Plan bir KURALDIR, para degil: silinmesi gecmis borclari geri
        almaz (onun yolu ters kayit, §6.3).
      responses:
        "204": { description: Silindi }
  /aidat-planlari/{plan_id}/ertele:
    post:
      tags: [otomasyon]
      summary: "(P192 §4.1) Bir donemi ATLA (plani kapatmadan)"
      description: |
        Plani pasife almak GELECEK aylari da kapatirdi; yonetici genelde
        "bu ay olmasin" demek ister. Zaten islenmis bir donem ertelenemez
        (409): borc yazildi, geri almak ters kayitla olur.
      parameters:
        - name: plan_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [donem]
              properties:
                donem: { type: string, example: "2026-09" }
      responses:
        "200":
          description: Ertelendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AidatPlani" }
        "409": { $ref: "#/components/responses/Conflict" }
  /hatirlatma-ayari:
    get:
      tags: [otomasyon]
      summary: "(P192 §4.2) Borc hatirlatma ayari"
      description: |
        Ayar tesise aittir ve TEKTIR; yoksa VARSAYILANLA acilir. "Yok"
        dondurmek, istemciyi once POST sonra PATCH yapmaya zorlardi.
      responses:
        "200":
          description: Ayar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HatirlatmaAyari" }
    patch:
      tags: [otomasyon]
      summary: "(P192 §4.2) Hatirlatma ayarini guncelle"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HatirlatmaAyariUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HatirlatmaAyari" }
  /duzenli-giderler:
    get:
      tags: [otomasyon]
      summary: "(P192 §4.5) Tekrar eden giderler"
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DuzenliGider" }
    post:
      tags: [otomasyon]
      summary: "(P192 §4.5) Tekrar eden gider tanimla"
      description: |
        Tekrar SAKLANIR, GENISLETILMEZ: "her ay" bir KURALDIR ve her
        ornegini satir olarak yazmak, kurali degistirmeyi yuzlerce satir
        guncellemeye cevirirdi.

        `otomatik_onay=false` (VARSAYILAN) ise vadesi gelen gider ONAY
        BEKLEYEN yazilir: otomatik "odendi" yazmak, sistemin kimseye
        sormadan kasadan para cikarmasi olurdu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DuzenliGiderCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuzenliGider" }
        "409": { $ref: "#/components/responses/Conflict" }
  /duzenli-giderler/{gider_id}:
    parameters:
      - name: gider_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [otomasyon]
      summary: "(P192 §4.5) Duzenli gideri guncelle"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DuzenliGiderUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuzenliGider" }
    delete:
      tags: [otomasyon]
      summary: "(P192 §4.5) Tekrar KURALINI sil — yazilmis giderler kalir"
      responses:
        "204": { description: Silindi }
  /otomasyon-gunlugu:
    get:
      tags: [otomasyon]
      summary: "(P192 §4) Otomasyon NE ZAMAN NE YAPTI"
      description: |
        Bu liste olmadan "gorev calisti ama hicbir sey uretmedi" durumu —
        ki asil merak edilen odur — gorunmez kalirdi. APPEND-ONLY: bir
        otomasyonun ne yaptigi sonradan duzeltilemez.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: tur
          in: query
          schema:
            type: string
            enum: [aidat_tahakkuk, aidat_onizleme, borc_hatirlatma,
                   duzenli_gider, gecikme_faizi, aylik_ozet]
      responses:
        "200":
          description: Gunluk
          content:
            application/json:
              schema:
                type: object
                required: [meta, items]
                properties:
                  meta: { $ref: "#/components/schemas/PageMeta" }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OtomasyonGunluk" }
  /borclandirma/gecikme-faizi/onizleme:
    get:
      tags: [aidat]
      summary: "(P192 §3.1) Islenecek gecikme faizi ONIZLEMESI"
      description: |
        Bu kosumda NE YAZILACAGINI gosterir, hicbir sey yazmaz. Onizleme
        ile isleme AYNI hesabi cagirir; ayri iki hesap, yoneticiye
        gosterilen ile yazilani ayirabilirdi.

        Faiz artik EKRANDA HESAPLANAN bir sayi degil, YAZILAN bir borc
        kalemidir: onceden hesaplaniyor ama hicbir yere yazilmiyordu ve
        sakin ana borcunu odeyince buharlasiyordu.
      responses:
        "200":
          description: Onizleme
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GecikmeFaizOnizleme" }
  /borclandirma/gecikme-faizi/isle:
    post:
      tags: [aidat]
      summary: "(P192 §3.1) Birikmis faizi BORC KALEMI olarak yaz"
      description: |
        IDEMPOTENT: her kosum FARKI yazar (birikmis toplam eksi daha once
        yazilmis faiz). Ikinci kez calistirildiginda fark 0 olur ve hicbir
        satir acilmaz; ayrica `uq_assessment_unit_donem_kalem` ayni borca
        ayni donemde ikinci kalemi veritabani duzeyinde engeller.

        Yazilan kalem `gecikme_uygula=false` tasir: FAIZE FAIZ ISLEMEZ.
      responses:
        "201":
          description: Yazilan faiz kalemleri
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GecikmeFaizSonuc" }
  /borclandirma/gecikme-ayari:
    get:
      tags: [aidat]
      summary: Aylik gecikme tazminati orani (admin+yonetici)
      responses:
        "200":
          description: Oran
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GecikmeAyar" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [aidat]
      summary: Gecikme oranini guncelle (admin)
      description: >
        Tazminat **TUTARI SAKLANMAZ**; raporlama/tahsilat aninda hesaplanir.
        Oran degistiginde GECMIS kayitlar da yeni orana gore okunur —
        saklansaydi ayni borc iki farkli yerde iki farkli tutar gosterirdi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gecikme_aylik_yuzde]
              properties:
                gecikme_aylik_yuzde: { type: number, format: double, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GecikmeAyar" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /kasalar:
    get:
      tags: [muhasebe-tanimlari]
      summary: Kasa/banka hesabi listesi (admin+yonetici)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: aktif
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Kasa" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [muhasebe-tanimlari]
      summary: Kasa/banka hesabi olustur (admin+yonetici)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KasaCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Kasa" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Benzersizlik ihlali (ayni ad/kod/plaka)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /kasalar/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [muhasebe-tanimlari]
      summary: Kasa guncelle (admin+yonetici)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KasaUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Kasa" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Benzersizlik ihlali
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [muhasebe-tanimlari]
      summary: Kasa sil (admin+yonetici)
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /gelir-gider-gruplari:
    get:
      tags: [muhasebe-tanimlari]
      summary: Gelir/gider grubu listesi (admin+yonetici)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: aktif
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
