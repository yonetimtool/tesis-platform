            (uydurma etiket YOK).
        unit_grup_ad: { type: string, nullable: true, description: "(P26) Grup adi" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UnitCreate:
      type: object
      required: [no]
      properties:
        no: { type: string }
        blok: { type: string, nullable: true, maxLength: 8, pattern: "^[A-Za-z0-9]+$" }
        kat: { type: integer, nullable: true, minimum: -5, maximum: 200 }
        sira: { type: integer, nullable: true, minimum: 0, maximum: 999 }
        metrekare: { type: number, format: double, nullable: true }
        aktif: { type: boolean, default: true }
        unit_tip_id:
          type: string
          format: uuid
          nullable: true
          description: "(P26) Bagimsiz bolum TIPI (1+1, 2+1, dubleks…) — varsayilan aidati tasir"
        unit_grup_id:
          type: string
          format: uuid
          nullable: true
          description: "(P26) Bagimsiz bolum GRUBU (Daire / Villa / Dukkan)"
    UnitBulkCreate:
      type: object
      description: >
        Toplu daire olusturma: kat_sayisi × kat_basi_daire adet, baslangic_no'dan
        ardisik (kat kat). En fazla 500 daire/istek.
      required: [kat_sayisi, kat_basi_daire, baslangic_no]
      properties:
        blok: { type: string, nullable: true, maxLength: 8, pattern: "^[A-Za-z0-9]+$" }
        kat_sayisi: { type: integer, minimum: 1, maximum: 200 }
        kat_basi_daire: { type: integer, minimum: 1, maximum: 999 }
        baslangic_no: { type: integer, minimum: 0, maximum: 999999 }
        baslangic_kat:
          type: integer
          default: 1
          minimum: -200
          maximum: 200
          description: >
            (P154 / Asama 5) BASLANGIC KATI. Negatif serbest: bodrum ve
            zemin gercek katlardir ve eskiden katlar HER ZAMAN 1'den
            basliyordu — bodrumlu bir binada kat numaralari bir kaydirmayla
            yaziliyordu. "Zemin" AYRI BIR DEGER DEGIL 0'dir; metin bir kat
            numarasi siralanamaz. VARSAYILAN 1 KALDI: brief "secilebilsin"
            diyor, "varsayilan degissin" demiyor.
        unit_tip_id:
          type: string
          format: uuid
          nullable: true
          description: "(P26) PARTININ TAMAMINA uygulanir — bir blok genelde tek tiptir"
        unit_grup_id:
          type: string
          format: uuid
          nullable: true
          description: "(P26) Bagimsiz bolum GRUBU (Daire / Villa / Dukkan)"
    UnitBulkResult:
      type: object
      required: [olusturulan, atlanan, bitis_no]
      properties:
        olusturulan:
          type: array
          items: { $ref: "#/components/schemas/Unit" }
        atlanan:
          type: array
          items: { type: string }
          description: Zaten var oldugu icin atlanan daire no'lari
        bitis_no: { type: integer, description: "Son daire numarasi (baslangic + toplam - 1)" }
    UnitUpdate:
      type: object
      minProperties: 1
      properties:
        no: { type: string }
        blok: { type: string, nullable: true, maxLength: 8, pattern: "^[A-Za-z0-9]+$" }
        kat: { type: integer, nullable: true, minimum: -5, maximum: 200 }
        sira: { type: integer, nullable: true, minimum: 0, maximum: 999 }
        metrekare: { type: number, format: double, nullable: true }
        aktif: { type: boolean }
        unit_tip_id:
          type: string
          format: uuid
          nullable: true
          description: "(P26) `null` GONDERILEBILIR: siniflandirmayi KALDIRIR. Gonderilmezse dokunulmaz."
        unit_grup_id:
          type: string
          format: uuid
          nullable: true
          description: "(P26) Bagimsiz bolum GRUBU (Daire / Villa / Dukkan)"
    UnitLayoutUpdate:
      type: object
      minProperties: 1
      description: |
        Daire fiziksel yerlesimi (blok/kat/sira) — bina semasi girisi. YALNIZ
        admin+yonetici (PATCH /units/{id}/layout). Alan null gonderilirse
        yerlesimden cikarilir; en az bir alan gerekir.
      properties:
        blok: { type: string, nullable: true, maxLength: 8, pattern: "^[A-Za-z0-9]+$" }
        kat: { type: integer, nullable: true, minimum: -5, maximum: 200 }
        sira: { type: integer, nullable: true, minimum: 0, maximum: 999 }

    UnitResident:
      type: object
      required: [id, unit_id, user_id]
      properties:
        id: { type: string, format: uuid }
        unit_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        user_ad: { type: string, nullable: true, description: "(P181 6.1) sakin ad-soyad; UI UUID yerine bunu gosterir" }
        rol_tipi: { $ref: "#/components/schemas/ResidentRol" }
        baslangic: { type: string, format: date-time, nullable: true }
        bitis: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    UnitResidentBrief:
      type: object
      description: Dairenin aktif sakini (hedef sakin secicisi — user_id + ad)
      required: [user_id, ad]
      properties:
        user_id: { type: string, format: uuid }
        ad: { type: string, description: Sakinin gorunen adi }
    ResidentAssign:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
          description: "role=resident bir app_user (ayni tenant)"
        rol_tipi: { $ref: "#/components/schemas/ResidentRol" }
        baslangic: { type: string, format: date-time, nullable: true }

    DuesAssessment:
      type: object
      required: [id, unit_id, donem, tutar_kurus, created_at]
      properties:
        kalem_tipi:
          type: string
          enum: [aidat, demirbas, olaganustu, faiz, sayac, diger]
          description: "(P192 §3.2) Borc NEYIN borcu"
        ters_kayit_id:
          type: string
          format: uuid
          nullable: true
          description: "(P192 §6.3) Doluysa bu satir bir DUZELTMEDIR"
        kaynak_assessment_id:
          type: string
          format: uuid
          nullable: true
          description: "(P192 §3.1) Faiz kaleminin dogdugu borc"
        id: { type: string, format: uuid }
        unit_id: { type: string, format: uuid }
        donem: { type: string, example: "2026-06" }
        tutar_kurus:
          type: integer
          minimum: 1
          description: "KURUS (minor units); para asla float degil"
        son_odeme_tarihi: { type: string, format: date, nullable: true }
        aciklama: { type: string, nullable: true }
        # --- P28 (ADDITIVE — eski alanlar aynen durur) ------------------- #
        gelir_gider_tanim_id: { type: string, format: uuid, nullable: true }
        gelir_gider_tanim_ad: { type: string, nullable: true }
        hedef_user_id:
          type: string
          format: uuid
          nullable: true
          description: >
            (P28) Borcun YAZILDIGI kisi — `gelir_gider_tanim.hedef_kurali` ve
            P23 bag verisinden cozulur. `null` = borc DAIREYE yazildi (tursuz
            tahakkukun eski davranisi).
        hedef_ad: { type: string, nullable: true }
        tarih:
          type: string
          format: date
          nullable: true
          description: >
            Islem gunu. `donem` (YYYY-MM) MUHASEBE DONEMIDIR ve ikisi ayni
            sey DEGILDIR: Ocak doneminin borcu Subat'ta acilabilir.
        gecikme_uygula: { type: boolean, default: true }
        kaynak: { type: string, enum: [tekil, toplu, sayac, ice_aktarim] }
        gecikme_kurus:
          type: integer
          format: int64
          description: |
            **ANLIK HESAPLANIR, SAKLANMAZ.** Oran degistiginde gecmis
            kayitlar da yeni orana gore okunur; saklansaydi ayni borc listede
            ve tahsilatta iki farkli tutar gosterirdi. BASIT faiz, TAM AY
            uzerinden (kismi ay orantilanmaz).
        created_at: { type: string, format: date-time }
    DuesAssessmentCreate:
      type: object
      required: [donem, tutar_kurus]
      properties:
        unit_id:
          type: string
          format: uuid
          nullable: true
          description: "Verilirse TEK daire; yoksa toplu"
        unit_ids:
          type: array
          nullable: true
          description: "Toplu modda hedef daireler; yoksa tum aktif daireler"
          items: { type: string, format: uuid }
        donem: { type: string, example: "2026-06" }
        tutar_kurus: { type: integer, minimum: 1 }
        son_odeme_tarihi: { type: string, format: date, nullable: true }
        aciklama: { type: string, nullable: true }
        # --- P28: hepsi OPSIYONEL, mevcut cagiranlar aynen calisir -------- #
        gelir_gider_tanim_id:
          type: string
          format: uuid
          nullable: true
          description: >
            (P28) Borclandirma TURU. Verilirse hedef kisi de tanimin
            `hedef_kurali`ndan cozulur. GELIR kalemi verilirse 422 —
            bir gelir borclandirilmaz, tahsil edilir.
        tarih: { type: string, format: date, nullable: true }
        gecikme_uygula: { type: boolean, default: true }
    DuesAssessmentResult:
      type: object
      required: [created, atlanan]
      properties:
        created:
          type: array
          items: { $ref: "#/components/schemas/DuesAssessment" }
        atlanan:
          type: integer
          description: |
            Atlanan tahakkuk sayisi. **(P28)** Benzersizlik artik
            `(daire, donem, TUR)` uzerindedir: ayni ay hem aidat hem elektrik
            borclandirilabilir. TUR VERILMEYEN kayitlarda eski koruma AYNEN
            durur (donem basina tek kayit) — Postgres'te NULL'lar
            benzersizlikte farkli sayildigi icin bu, `COALESCE`li bir
            benzersiz indeksle saglanir.

            **(P192 §3.2)** Benzersizlige `kalem_tipi` ve
            `kaynak_assessment_id` de EKLENDI: tanimsiz akista "Mart
            aidati + Mart cati onarimi" mumkun oldu ve bir dairenin ayni
            ayda birden cok gecikmis borcu icin ayri faiz kalemleri
            acilabiliyor. Duzeltilmis (ters kayitli) cift indeksin
            disindadir.
        atlananlar:
          type: array
          description: >-
            (P192 §3.2) Atlananlarin DOKUMU — hangi daire, NIYE atlandi.
            Sadece bir SAYI dondurmek, eksik tahakkukun fark edilmemesine
            yol aciyordu.
          items: { $ref: "#/components/schemas/TahakkukAtlanan" }

    DuesPayment:
      # (P192 §1) Kaynak tablo `dues_payment` DEGIL `finansal_hareket`.
      # Bicim korundu; unit_id / kaydeden_user_id / idempotency_key
      # OPSIYONELLESTI cunku defterde de opsiyoneller (vezneden girilen
      # tahsilat daireye bagli olmayabilir).
      type: object
      required: [id, tutar_kurus, odeme_zamani, yontem, durum, created_at]
      properties:
        id: { type: string, format: uuid }
        unit_id: { type: string, format: uuid, nullable: true }
        assessment_id: { type: string, format: uuid, nullable: true }
        tutar_kurus: { type: integer, minimum: 1 }
        odeme_zamani: { type: string, format: date-time }
        donem:
          type: string
          nullable: true
          example: "2026-06"
          description: "Odemenin atfedildigi donem; serbest odemede NULL olabilir"
        yontem: { $ref: "#/components/schemas/DuesYontem" }
        durum: { $ref: "#/components/schemas/DuesDurum" }
        makbuz_no: { type: string, nullable: true }
        provider: { type: string, nullable: true, description: "manual|iyzico|paytr" }
        provider_ref: { type: string, nullable: true, description: "Saglayici referansi (webhook bunu kullanir)" }
        odeme_url:
          type: string
          nullable: true
          description: "Yalniz kart akisi init yanitinda: saglayici odeme sayfasi URL'i (kalici degil)"
        kaydeden_user_id: { type: string, format: uuid, nullable: true }
        idempotency_key: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    DuesPaymentCreate:
      type: object
      required: [unit_id, tutar_kurus, yontem]
      properties:
        unit_id: { type: string, format: uuid }
        assessment_id: { type: string, format: uuid, nullable: true }
        tutar_kurus: { type: integer, minimum: 1 }
        yontem: { $ref: "#/components/schemas/DuesYontem" }
        makbuz_no: { type: string, nullable: true }
        odeme_zamani:
          type: string
          format: date-time
          nullable: true
          description: "Verilmezse sunucu now()"
        donem:
          type: string
          nullable: true
          example: "2026-06"
          description: "Verilmezse assessment'tan turer; o da yoksa NULL kalir"
        kasa_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            (P192 §1) Paranin girdigi kasa/banka hesabi. Verilmezse
            yontemden turetilir (havale/kart -> banka hesabi, elden ->
            merkez kasa) ve hicbiri yoksa acilir; NULL BIRAKILMAZ.

    UnitDuesStatus:
      type: object
      required: [unit_id, no, toplam_tahakkuk_kurus, toplam_odenen_kurus, bakiye_kurus]
      properties:
        unit_id: { type: string, format: uuid }
        no: { type: string }
        toplam_tahakkuk_kurus: { type: integer }
        toplam_odenen_kurus:
          type: integer
          description: "Yalniz durum='basarili' odemeler"
        bakiye_kurus:
          type: integer
          description: "toplam_tahakkuk - toplam_odenen (pozitif = borc)"
        assessments:
          type: array
          items: { $ref: "#/components/schemas/DuesAssessment" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/DuesPayment" }

    # ---------------------------- butce ----------------------------- #
    BudgetTip:
      type: string
      enum: [gelir, gider]
    BudgetKaynak:
      type: string
      enum: [manuel, aidat_odeme]
      description: |
        manuel = elle girilen kayit; aidat_odeme = basarili aidat odemesinden
        OTOMATIK uretilen gelir kaydi (ilgili_payment_id dolu; duzenlenemez/
        silinemez — idempotent: ayni odemeden ikinci kayit uretilmez).
    BudgetCategory:
      type: object
      required: [id, ad, tip, aktif, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, example: "Elektrik" }
        tip: { $ref: "#/components/schemas/BudgetTip" }
        aktif:
          type: boolean
          description: false = soft-delete (yeni kayit yazilamaz; eskiler korunur)
        created_at: { type: string, format: date-time }
    BudgetCategoryCreate:
      type: object
      required: [ad, tip]
      properties:
        ad: { type: string, minLength: 1, maxLength: 100 }
        tip: { $ref: "#/components/schemas/BudgetTip" }
    BudgetCategoryUpdate:
      type: object
      minProperties: 1
      properties:
        ad: { type: string, minLength: 1, maxLength: 100 }
        aktif: { type: boolean }
    BudgetEntry:
      type: object
      required: [id, kategori_id, tip, tutar_kurus, tarih, kaynak, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        kategori_id: { type: string, format: uuid }
        kategori_ad: { type: string, nullable: true }
        tip: { $ref: "#/components/schemas/BudgetTip" }
        tutar_kurus:
          type: integer
          minimum: 1
          description: KURUS (integer; float ASLA)
          example: 120000
        tarih: { type: string, format: date }
        aciklama: { type: string, nullable: true }
        kaynak: { $ref: "#/components/schemas/BudgetKaynak" }
        ilgili_payment_id:
          type: string
          format: uuid
          nullable: true
          description: kaynak=aidat_odeme ise kaynak odeme (dues_payment.id)
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    BudgetEntryCreate:
      type: object
      required: [kategori_id, tutar_kurus, tarih]
      description: "`tip` gonderilmez — kategoriden turetilir."
      properties:
        kategori_id: { type: string, format: uuid }
        tutar_kurus: { type: integer, minimum: 1, description: KURUS }
        tarih: { type: string, format: date }
        aciklama: { type: string, nullable: true, maxLength: 1000 }
    BudgetEntryUpdate:
      type: object
      minProperties: 1
      description: Yalniz kaynak=manuel kayitlar (aidat_odeme → 422)
      properties:
        kategori_id: { type: string, format: uuid }
        tutar_kurus: { type: integer, minimum: 1 }
        tarih: { type: string, format: date }
        aciklama: { type: string, nullable: true, maxLength: 1000 }
    BudgetCategorySummaryItem:
      type: object
      required: [kategori_id, ad, tip, toplam_kurus]
      properties:
        kategori_id: { type: string, format: uuid }
        ad: { type: string }
        tip: { $ref: "#/components/schemas/BudgetTip" }
        toplam_kurus: { type: integer }
    BudgetSummary:
      type: object
      required: [toplam_gelir_kurus, toplam_gider_kurus, bakiye_kurus, kategoriler]
      properties:
        toplam_gelir_kurus: { type: integer }
        toplam_gider_kurus: { type: integer }
        bakiye_kurus:
          type: integer
          description: gelir - gider (kasa; NEGATIF olabilir)
        kategoriler:
          type: array
          items: { $ref: "#/components/schemas/BudgetCategorySummaryItem" }

    # --------------------- finansal ozet (Wave 2B) ------------------ #
    GiderKalemi:
      type: object
      required: [ad, toplam_kurus]
      properties:
        ad: { type: string, example: "Elektrik" }
        toplam_kurus: { type: integer }
    TahsilatOzet:
      type: object
      required: [tahakkuk_kurus, tahsilat_kurus, geciken_daire_sayisi]
      description: YALNIZ yonetim yanitinda dolar (sakin/saha icin null)
      properties:
        tahakkuk_kurus: { type: integer }
        tahsilat_kurus:
          type: integer
          description: Yalniz durum='basarili' odemeler
        tahsilat_orani_yuzde:
          type: integer
          nullable: true
          description: round(100*tahsilat/tahakkuk); tahakkuk 0 ise null
        geciken_daire_sayisi:
          type: integer
          description: Donem tahakkuku tam odenmemis daire sayisi
    FinancialSummary:
      type: object
      required:
        [toplam_gelir_kurus, toplam_gider_kurus, bakiye_kurus, en_yuksek_giderler]
      properties:
        donem: { type: string, nullable: true, example: "2026-07" }
        toplam_gelir_kurus: { type: integer }
        toplam_gider_kurus: { type: integer }
        bakiye_kurus: { type: integer, description: NEGATIF olabilir }
        en_yuksek_giderler:
          type: array
          description: En yuksek gider kategorileri (ilk 5, buyukten kucuge)
          items: { $ref: "#/components/schemas/GiderKalemi" }
        tahsilat:
          allOf: [{ $ref: "#/components/schemas/TahsilatOzet" }]
          nullable: true

    # -------------------- arac gecisi + otopark (G1 + G4) -------------------- #
    VehiclePass:
      type: object
      description: >
        Bir arac gecisi. TEK satir gecisin TAMAMINI tutar: `giris_zamani` her
        zaman doludur, `cikis_zamani` NULL iken arac ICERIDEDIR. Otopark
        dolulugu (GET /parking/occupancy) ACIK satirlarin sayimidir — ayri
        sayac/tetikleyici yoktur, sayim ile kayit ASLA ayrisamaz.
      required: [id, plaka, giris_zamani, ziyaretci_mi, kaydeden_user_id, created_at]
      properties:
        id: { type: string, format: uuid }
        plaka:
          type: string
          example: "34ABC123"
          description: >
            NORMALIZE plaka — alfanumerik disi karakterler atilmis, harfler
            buyutulmus hali saklanir VE donuur ("34 abc 123" -> "34ABC123").
        arac_tanim:
          type: string
          nullable: true
          example: "BMW Siyah"
          description: Serbest arac tanimi (opsiyonel)
        giris_zamani: { type: string, format: date-time }
        cikis_zamani:
          type: string
          format: date-time
          nullable: true
          description: "**null => arac HALA ICERIDE** (acik gecis)"
        unit_id:
          type: string
          format: uuid
          nullable: true
          description: null = daireye bagli olmayan arac (ziyaretci/kurye/bilinmeyen)
        unit_no: { type: string, nullable: true, description: Daire numarasi (join ile) }
        ziyaretci_mi: { type: boolean, default: false }
        kaydeden_user_id: { type: string, format: uuid }
        kaydeden_ad: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    VehiclePassCreate:
      type: object
      description: >
        Arac GIRISI. `plaka` sunucuda normalize edilir. Daire referansi
        OPSIYONEL: `unit_id` VEYA `unit_no` (ikisi birlikte 422); hicbiri
        verilmezse arac daireye bagli degildir.
      required: [plaka]
      properties:
        plaka:
          type: string
          minLength: 1
          maxLength: 32
          example: "34 ABC 123"
          description: >
            Serbest formatta girilebilir; sunucu normalize eder. Normalize
            sonucu 2-20 alfanumerik karakter degilse 422.
        arac_tanim: { type: string, nullable: true, minLength: 1, maxLength: 120 }
        unit_id: { type: string, format: uuid, nullable: true }
        unit_no: { type: string, nullable: true, minLength: 1, maxLength: 50 }
        ziyaretci_mi: { type: boolean, default: false }
        giris_zamani:
          type: string
          format: date-time
          nullable: true
          description: >
            Verilmezse sunucu saati damgalanir. Geriye donuk kayit icin acik
            deger verilebilir; GELECEGE damga 422 (5 dk tolerans).
    ParkingOccupancy:
      type: object
      required: [dolu]
      properties:
        kapasite:
          type: integer
          nullable: true
          example: 120
          description: "Tenant ayari (`otopark_kapasite`); TANIMSIZ ise null"
        dolu:
          type: integer
          example: 78
          description: ACIK arac gecisi sayisi — kapasite bilinmese de HER ZAMAN gercek sayi
        oran:
          type: integer
          nullable: true
          example: 65
          description: >
            Yuzde (0-100, tam sayiya yuvarli) = round(100*dolu/kapasite).
            **kapasite null veya 0 ise null** — istemci "—" gosterir.

    # ----------------------------- ihlal (G2) ------------------------------- #
    Violation:
      type: object
      description: >
        Ihlal kaydi. `site_kurali` YALNIZ kural METNINI tutar; somut ihlal
        olayi (kim/nerede/nasil tespit etti + is akisi) burada izlenir.
      required: [id, baslik, kaynak, durum, olusturan_user_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        baslik: { type: string, maxLength: 200, example: "Otopark girişinde hatalı park" }
        aciklama: { type: string, nullable: true, maxLength: 2000 }
        kaynak:
          type: string
          enum: [kamera, manuel, devriye]
          default: manuel
          description: Tespit kaynagi
        konum:
          type: string
          nullable: true
          maxLength: 200
          example: "Otopark Girişi - Kamera 3"
          description: Serbest konum metni (checkpoint FK DEGIL)
        durum:
          type: string
          enum: [yeni, inceleniyor, kapatildi]
          default: yeni
          description: "`kapatildi` TERMINAL — yeniden acilmaz (409)"
        olusturan_user_id: { type: string, format: uuid }
        olusturan_ad: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ViolationCreate:
      type: object
      required: [baslik]
      properties:
        baslik: { type: string, minLength: 1, maxLength: 200 }
        aciklama: { type: string, nullable: true, minLength: 1, maxLength: 2000 }
        kaynak: { type: string, enum: [kamera, manuel, devriye], default: manuel }
        konum: { type: string, nullable: true, minLength: 1, maxLength: 200 }
    ViolationUpdate:
      type: object
      description: >
        Durum gecisi. KAPATMA (`kapatildi`) YALNIZ admin (403); `kapatildi`
        TERMINAL (409); ayni duruma gecis idempotent (200).
      required: [durum]
      properties:
        durum: { type: string, enum: [yeni, inceleniyor, kapatildi] }

    # ----------------------------- ANPR (P16) ------------------------------- #
    AnprEventIn:
      type: object
      description: |
        Kaynaktan bagimsiz ANPR olay govdesi. `kaynak` hangi ADAPTORUN
        calisacagini secer; `frigate|hikvision|dahua` icin govdenin geri kalani
        O MARKANIN kendi bicimi olabilir (ek alanlara IZIN VERILIR ve `ham`
        olarak saklanir), `manuel|standart` icin asagidaki alanlar dogrudan
        okunur.

        Adaptorlerin okudugu alanlar:
        * **frigate** — `after.id` (ya da `event.id`) kimlik, `after.sub_label`
          PLAKA (LPR sonucu; `label` "car"dir), `after.start_time` UNIX float
          SANIYE, `after.plate_score` guven.
        * **hikvision** — `EventNotificationAlert.ANPR.licensePlate`,
          `.dateTime` (ISO8601), `.confidenceLevel` (0-100). Olay kimligi
          yoksa `(plaka + zaman)`dan TUREVSEL uretilir — tekrar ayni kimligi
          verir, idempotency korunur.
        * **dahua** — `Events[0].Data.PlateNumber`, `.UTC` (UNIX) ya da
          `.Time`, `.Confidence`.
      required: [kaynak]
      properties:
        kaynak:
          type: string
          enum: [frigate, hikvision, dahua, manuel, standart]
        kaynak_olay_id:
          type: string
          maxLength: 200
          description: >
            Kaynagin KENDI olay kimligi — IDEMPOTENCY anahtari. Marka
            govdelerinde adaptor bunu kendi alanindan okur.
        plaka:
          type: string
          maxLength: 64
          description: "Serbest bicim; sunucu normalize eder (\"34 abc 123\" -> \"34ABC123\")"
        zaman: { type: string, format: date-time }
        kamera: { type: string, maxLength: 120, nullable: true }
        yon:
          type: string
          enum: [giris, cikis, bilinmiyor]
          default: bilinmiyor
          description: >
            Frigate yon URETMEZ; verilmezse `bilinmiyor` kabul edilir ve karar
            acik gecise gore verilir (bkz. uc aciklamasi).
        guven:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: "0..1 ya da 0..100 — 1'i asan deger YUZDE sayilir"
        foto_key: { type: string, maxLength: 500, nullable: true }
        ham:
          type: object
          description: Kaynagin ham govdesi (denetim + adaptor hata ayiklama)
    AnprEventOut:
      type: object
      required: [id, kaynak, kaynak_olay_id, plaka, zaman, yon, durum, created_at]
      properties:
        id: { type: string, format: uuid }
        kaynak: { type: string }
        kaynak_olay_id: { type: string }
        plaka: { type: string, description: NORMALIZE plaka, example: "34ABC123" }
        zaman: { type: string, format: date-time }
        kamera: { type: string, nullable: true }
        yon: { type: string, enum: [giris, cikis, bilinmiyor] }
        guven: { type: number, nullable: true }
        durum:
          type: string
          enum: [islendi, onay_bekliyor, yok_sayildi, hata]
        durum_nedeni:
          type: string
          nullable: true
          description: >
            Kisa KOD (PII tasimaz): `dusuk_guven`, `zaten_iceride`,
            `acik_gecis_yok`, `otomatik_cikis_kapali`, `elle_reddedildi`,
            `anpr_plaka_bicimi`, `anpr_zaman_bicimi`.
        vehicle_pass_id:
          type: string
          format: uuid
          nullable: true
          description: Acilan/kapanan gecis; onay bekleyen ve yok sayilan olayda null
        created_at: { type: string, format: date-time }
    AnprEventListResponse:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AnprEventOut" }
    AnprOnayIn:
      type: object
      required: [onay]
      properties:
        onay: { type: boolean }
        plaka:
          type: string
          minLength: 1
          maxLength: 64
          nullable: true
          description: Verilirse OCR duzeltilir; verilmezse okunan plaka kabul edilir
    AnprApiKeyCreate:
      type: object
      required: [ad]
      properties:
        ad: { type: string, minLength: 1, maxLength: 120, example: "Ana kapi kutusu" }
    AnprApiKeyOut:
      type: object
      required: [id, ad, kimlik, aktif, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string }
        kimlik:
          type: string
          description: Anahtarin ACIK yarisi (`<kimlik>.<sir>` icindeki kimlik)
        aktif: { type: boolean }
        son_kullanim: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    AnprApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/AnprApiKeyOut"
        - type: object
          required: [anahtar]
          properties:
            anahtar:
              type: string
              description: >
                TAM anahtar (`<kimlik>.<sir>`) — YALNIZ BU YANITTA, BIR KEZ
                doner. Sunucuda saklanmaz.

    # ------------------------ birlesik akis (G5) ---------------------------- #
    ActivityItem:
      type: object
      required: [id, tur, baslik_kimlik, veri, baslik, zaman, kaynak_id]
      description: >
        METIN DEGIL KIMLIK (tur 15): satirin gorunen cumlesini ISTEMCI kurar.
        Sunucu `baslik_kimlik` (yerellestirilebilir kimlik) ve `veri` (satirin
        degisken alanlari) gonderir. `baslik`/`alt_metin` DEPRECATED'dir ve
        yalniz guncellenmemis istemciler icin, TURKCE uretilir.
      properties:
        id:
          type: string
          example: "kargo_teslim:9f1c8a2e-2b7e-4b1a-9c31-3f5f0b6d1a44"
          description: >
            Kaynaklar arasi BENZERSIZ olay kimligi — `"<tur>:<kaynak_id>"`.
            Siralamanin ikincil anahtaridir (esit zamanli olaylarda kararlilik).
        tur:
          type: string
          enum:
            [devriye_okutma, gorev_tamamlama, aidat_odeme, talep, daire_sikayeti,
             alarm, ziyaretci_giris, ziyaretci_cikis, kargo, kargo_teslim,
             arac_giris, arac_cikis, ihlal]
        baslik_kimlik:
          type: string
          example: talep_cozuldu
          enum:
            [devriye_okutma, gorev_tamamlama, aidat_odeme,
             talep_acik, talep_is_emri, talep_cozuldu, talep_reddedildi,
             daire_sikayeti,
             alarm_kacirilan_tur, alarm_eksik_checkpoint, alarm_gecikmis_okutma,
             ziyaretci_giris, ziyaretci_cikis, kargo, kargo_teslim,
             arac_giris, arac_cikis, ihlal]
          description: >
            Basligin YERELLESTIRILEBILIR kimligi. `tur`den AYRIDIR: bir tur
            birden cok baslik verebilir (`talep` -> acildi / is emrine donustu /
            cozuldu / reddedildi; `alarm` -> tipine gore uc kimlik). Istemci
            metni kendi dilinde uretir. Taninmayan kimlik satiri DUSURMEZ.
        veri:
          type: object
          additionalProperties: true
          example: { firma: "Aras Kargo", daire: "A-12" }
          description: >
            Satirin DEGISKEN kismi. Alanlar `tur`e gore degisir:
            `ad` (devriye/gorev), `daire`+`tutar_kurus` (aidat),
            `baslik` (talep/ihlal, ihlalde ayrica `konum`),
            `daire`+`kategori` (daire sikayeti; `kategori` SOZLESME KIMLIGI),
            `plan`+`baslangic`+`bitis` (alarm), `ad`+`daire` (ziyaretci),
            `firma`+`daire` (kargo), `plaka`(+`daire`,`tanim`) (arac).
            OPSIYONEL alanlar null olarak degil HIC gonderilmez — bicimi
            alanin varligi belirler. Para `tutar_kurus` TAM SAYIDIR: bicimleme
            dile duyarlidir ve istemcinin isidir.
        baslik:
          type: string
          deprecated: true
          example: "Kargo Teslim Edildi"
          description: >
            DEPRECATED (tur 15) — `baslik_kimlik` kullanin. Yalniz Turkce
            uretilir; tum istemciler gecince kalkacak.
        alt_metin:
          type: string
          nullable: true
          deprecated: true
          example: "Aras Kargo — Daire A-12"
          description: >
            DEPRECATED (tur 15) — `veri` kullanin. `veri`den TURETILIR
            (sunucuda artik SQL'de cumle kurulmaz).
        zaman:
          type: string
          format: date-time
          description: Olayin GERCEKLESME zamani (kaydin created_at'i olmayabilir — orn. cikis damgasi)
        renk_ipucu:
          type: string
          nullable: true
          enum: [olumlu, uyari, alarm, notr]
          description: UI nokta/rozet rengi ipucu
        kaynak_id:
          type: string
          format: uuid
          description: Kaynak kaydin kendi id'si (derin baglanti icin)
    ActivityPage:
      type: object
      required: [meta, items]
      properties:
        meta:
          type: object
          required: [limit]
          properties:
            limit: { type: integer }
            next_cursor:
              type: string
              nullable: true
              description: >
                Bir sonraki sayfanin imleci; **null ise akisin sonundasiniz**.
                OPAK — istemci ayristirmamalidir. `total` alani YOKTUR.
        items:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }

    # ---------------- hava durumu + kameralar (G7 backfill) ----------------- #
    Weather:
      type: object
      required: [sicaklik_c, durum, konum_ad]
      properties:
        sicaklik_c: { type: number, format: double, example: 24.3 }
        durum:
          type: string
          enum: [acik, parcali, kapali, sis, yagmur, kar, firtina]
          description: Open-Meteo weather_code'undan turetilmis normalize durum
        konum_ad:
          type: string
          example: "İstanbul"
          description: "Tenant ayarindaki konum adi (tenant.konum_ad)"
    Camera:
      type: object
      description: >
        Site kamerasi. `sakin_gorebilir` sakin/tesis gorevlisi gorunurlugunun
        TEK anahtaridir (varsayilan false); suzgec sunucuda uygulanir.
      required: [id, ad, stream_url, tur, aktif, sakin_gorebilir,
                 oynatilabilir, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, maxLength: 100, example: "Ana Kapı" }
        konum:
          type: string
          nullable: true
          maxLength: 200
          example: "Ana Kapı - Giriş"
          description: Serbest konum metni (checkpoint FK DEGIL)
        stream_url:
          type: string
          maxLength: 2048
          example: "https://cam.example.com/hls/1/index.m3u8"
          description: >
            Istemcinin oynattigi yayin (hls/mp4). Sema `tur` ile tutarlidir:
            hls/mp4 -> http(s)://, rtsp -> rtsp://. **(P25) EN FAZLA 2048
            karakter** — asilirsa 422 `invalid_stream_url`
            (`kamera_url_cok_uzun`). (P190 §6) `tur=rtsp` kayitlarda bu alan
            YONETIM DISI rollere maskelenir ("rtsp://***"): RTSP adresi
            kimlik bilgisi tasiyabilir ve istemci onu zaten oynatamaz;
            sunucu-tarafi cekim yalniz rtsp:// kaynaklara yapilir.
        restream_url:
          type: string
          nullable: true
          maxLength: 2048
          example: "http://frigate.site.local:5000/api/kapi/stream.m3u8"
          description: >
            (0012 / P17) RTSP kamerayi OYNATILABILIR yapan HLS gecidi
            (Frigate/go2rtc yeniden yayini). Dolu ise istemci `stream_url`
            yerine **BUNU** oynatir ve `oynatilabilir` true olur.
            YALNIZ http(s) — buraya `rtsp://` yazmak "oynatilabilir isaretli
            ama oynamayan" bir kamera uretirdi (422 `invalid_stream_url`).
            `stream_url` KORUNUR: o kameranin KENDI adresidir (envanter, saha
            teshisi, Frigate yapilandirmasi) ve gecit yeniden kurulunca
            degisen adres bu alandir.
        snapshot_url:
          type: string
          nullable: true
          maxLength: 2048
          example: "http://frigate.site.local:5000/api/kapi/latest.jpg"
          description: >
            (0031 / P121) TEK KARE dondüren adres (image/jpeg). Izgara karosu
            oynatici ACMADAN 5-10 sn'de bir bunu ceker; `null` ise karo yer
            tutucu gosterir (davranis degismez). Frigate'in
            `/api/<kamera>/latest.jpg` ucu tam olarak budur.
            YALNIZ http(s) — `rtsp://` bir kare adresi olamaz ve 422
            `invalid_stream_url` (`kamera_snapshot_semasi`) verir.
            Backend bu adresi de HIC cekmez; kareyi ISTEMCI ceker.
        tur:
          type: string
          enum: [hls, mp4, rtsp]
          default: hls
          description: Yayin turu; oynatilabilirligi belirler
        aktif:
          type: boolean
          default: true
          description: >
            false = devre disi (orn. bakimda). Pasif kamera SAKINE hic
            gosterilmez; yonetim/operasyon gorur.
        sakin_gorebilir:
          type: boolean
          default: false
          description: >
            **KVKK anahtari.** true = resident + tesis_gorevlisi bu kamerayi
            gorur (aktif=true ise). Varsayilan false.
        oynatilabilir:
          type: boolean
          description: >
            TURETILMIS (saklanmaz): istemci bu kamerayi oynatabilir mi.
            hls/mp4 -> true; rtsp -> false **AMA `restream_url` doluysa
            rtsp de true olur** (0012 / P17) ve (P190 §6) `canli_yol`
            doluysa da true olur. Istemci false ise oynat dugmesini pasifler.
        canli_yol:
          type: string
          nullable: true
          example: "/cameras/9f.../canli/index.m3u8"
          description: >
            (P190 §6) TURETILMIS: RTSP kamera icin YONETILEN canli izleme
            yolu (backend HLS vekili, kimlik-kapili). MediaMTX
            yapilandirilmamissa null. Doluysa istemci restream yerine BUNU
            oynatir; RTSP adresi/kimlik bilgisi istemciye gitmez.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CameraCreate:
      type: object
      required: [ad, stream_url]
      properties:
        ad: { type: string, minLength: 1, maxLength: 100 }
        konum: { type: string, nullable: true, minLength: 1, maxLength: 200 }
        stream_url:
          type: string
          maxLength: 2048
          description: >
            Sema `tur` ile tutarli olmali (aksi 422 invalid_stream_url):
            hls/mp4 -> http:// | https://, rtsp -> rtsp://.
            **(P25) EN FAZLA 2048 karakter** — asilirsa 422
            `invalid_stream_url` (`kamera_url_cok_uzun`).
        tur: { type: string, enum: [hls, mp4, rtsp], default: hls }
        aktif: { type: boolean, default: true }
        sakin_gorebilir:
          type: boolean
          default: false
          description: Verilmezse KAPALI — sakin/tesis gorevlisi gormez
        restream_url:
          type: string
          nullable: true
          maxLength: 2048
          description: >
            (0012 / P17) Opsiyonel HLS gecidi (Frigate/go2rtc). YALNIZ
            http(s) — `rtsp://` 422 verir. Dolu ise `oynatilabilir` true
            olur; `null` gonderilirse gecit kaldirilir ve rtsp kamera yeniden
            oynatilamaz hale gelir.
        snapshot_url:
          type: string
          nullable: true
          maxLength: 2048
          description: >
            (0031 / P121) Opsiyonel anlik kare adresi (image/jpeg). Izgara
            karosu bunu periyodik ceker. YALNIZ http(s) — `rtsp://` 422
            verir. `null` gonderilirse kare kaldirilir ve karo yer tutucuya
            doner.
    CameraUpdate:
      type: object
      description: >
        En az bir alan gerekli. URL/tur tutarliligi mevcut kayitla
        birlestirilerek dogrulanir (yalniz `tur` gonderilse bile).
      minProperties: 1
      properties:
        ad: { type: string, minLength: 1, maxLength: 100 }
        konum: { type: string, nullable: true, maxLength: 200 }
        stream_url: { type: string, maxLength: 2048 }
        tur: { type: string, enum: [hls, mp4, rtsp] }
        aktif: { type: boolean }
        sakin_gorebilir: { type: boolean }
        restream_url:
          type: string
          nullable: true
          maxLength: 2048
          description: >
            (0012 / P17) Opsiyonel HLS gecidi (Frigate/go2rtc). YALNIZ
            http(s) — `rtsp://` 422 verir. Dolu ise `oynatilabilir` true
            olur; `null` gonderilirse gecit kaldirilir ve rtsp kamera yeniden
            oynatilamaz hale gelir.
        snapshot_url:
          type: string
          nullable: true
          maxLength: 2048
          description: >
            (0031 / P121) Opsiyonel anlik kare adresi (image/jpeg). Izgara
            karosu bunu periyodik ceker. YALNIZ http(s) — `rtsp://` 422
            verir. `null` gonderilirse kare kaldirilir ve karo yer tutucuya
            doner.

    OauthBaglantiListesi:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [saglayici, created_at]
            properties:
              saglayici: { type: string, enum: [google, microsoft, apple] }
              eposta:
                type: string
                nullable: true
                description: |
                  YALNIZ GORUNTULEME. Apple private relay adresi olabilir;
                  eslesmede kullanilmaz ve `app_user.email`i ezmez.
              son_giris_at: { type: string, format: date-time, nullable: true }
              created_at: { type: string, format: date-time }
