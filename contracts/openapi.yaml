openapi: 3.0.3
info:
  title: Tesis Guvenlik & Operasyon API
  version: "0.1.0"
  description: |
    Multi-tenant tesis guvenlik & operasyon SaaS — v0 sozlesmesi.
    Backend (FastAPI) ile Mobil (Flutter) ve Panel (Next.js) gelistiricilerinin
    paralel calismasi icin tek dogruluk kaynagidir.

    Konvansiyonlar (detay: /contracts/README.md):
      * Tum zamanlar ISO8601 UTC (`...Z`). tenant.timezone ile yorumlanir.
      * Hata zarfi: `{ "error": { "code": "...", "message": "..." } }`.
      * Sayfalama: `limit` (varsayilan 50, max 200) + `offset`. Liste yanitlari
        `PageMeta` icerir.
      * Auth: JWT Bearer (bkz. /contracts/auth.md). Tenant her zaman token'dan
        cikarilir — istemci tenant_id gondermez/secemez.
      * `POST /scans` icin `Idempotency-Key` header zorunlu.

servers:
  # NOT: base path /v0 KALDIRILDI — gercek backend endpoint'leri /v0 ONEKI OLMADAN
  # sunuyor (orn. /auth/login, /scans). Base = host:port.
  - url: https://api.example.com
    description: production
  - url: http://localhost:8000
    description: yerel gelistirme

tags:
  - name: auth
  - name: shifts
  - name: checkpoints
  - name: patrol-plans
  - name: scans
  - name: dashboard
  - name: me

security:
  - bearerAuth: []

paths:
  # ================================================================= #
  # AUTH
  # ================================================================= #
  /auth/login:
    post:
      tags: [auth]
      summary: Email + parola ile giris
      security: []   # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Basarili
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Hatali kimlik bilgisi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/login-phone:
    post:
      tags: [auth]
      summary: Mobil giris — cep telefonu (global benzersiz) + (gecici kod VEYA parola)
      description: |
        MOBIL roller (yonetici/security/tesis_gorevlisi/resident) girisi: e-posta/
        daire no/tenant_slug YERINE `phone + password` alinir. Telefon GLOBAL
        benzersiz oldugundan tenant NUMARADAN otomatik cozulur
        (`tenant_id_by_phone`, SECURITY DEFINER). Numara E.164 normalize edilir.
        (Admin paneli e-posta ile `POST /auth/login` kullanir.)

        * Kalici parola eslesirse: `password_setup_required=false` + tam
          token cifti (TokenPair ile ayni alanlar).
        * GECICI KOD eslesirse (ilk giris): `password_setup_required=true` +
          `setup_token` doner; oturum token'i VERILMEZ. Istemci
          `POST /auth/set-password` ile kalici parolayi belirlemek ZORUNDADIR.
      security: []   # public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneLoginRequest"
      responses:
        "200":
          description: Basarili (normal oturum VEYA parola kurulumu gerekli)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneLoginResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Hatali telefon / kod / parola
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/set-password:
    post:
      tags: [auth]
      summary: Ilk giris sonrasi ZORUNLU kalici parola belirleme (sakin)
      description: |
        `login-resident`'in gecici kodla dondurdugu kisa omurlu `setup_token`
        (~10 dk) ile cagirilir. Basarida parola kaydedilir (bcrypt), gecici
        kod SILINIR (tek kullanimlik) ve tam oturum (TokenPair) doner —
        sakin tekrar giris yapmak zorunda kalmaz.
      security: []   # setup_token govdede tasinir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "200":
          description: Parola belirlendi; oturum acildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Gecersiz/suresi dolmus/kullanilmis setup_token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /residents:
    post:
      tags: [auth]
      summary: Sakin hesabi olustur (yonetici) — daire + gecici kod
      description: |
        Yonetici (veya admin) daire + sakin hesabini tek adimda acar. Ayni
        `unit_no` varsa YENI daire acilmaz, mevcuta baglanir (ayni dairede
        coklu sakin). Yanittaki `temp_code` YALNIZ BU YANITTA bir kez duz
        metin doner — yonetici sakine iletir; sunucuda bcrypt hash'i saklanir
        ve sakin kalici parolasini belirleyince gecersizlesir.
        RBAC: admin + yonetici (unit CRUD'un admin-only olmasindan ayri,
        sakin acma akisidir).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResidentCreate"
      responses:
        "201":
          description: Sakin olusturuldu (gecici kod bir kez gosterilir)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentCreated"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: telefon (global) veya email (tenant) zaten kayitli
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [auth]
      summary: Site sakin listesi (yonetici/admin) — ad + daire no + durum
      description: |
        Tenant'taki sakinler (role=resident): ad + aktif daire no (bitis IS NULL)
        + is_active. Telefon KVKK geregi DONMEZ. Saha/sakin roller 403.
      responses:
        "200":
          description: Sakin listesi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResidentListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /residents/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [auth]
      summary: Sakini duzenle (yonetici/admin) — ad ve/veya telefon
      description: |
        telefon global benzersiz (cakisma 409); normalize edilir. Numarayi bos
        birakmak = degismez (en az bir alan). role=resident degilse 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResidentUpdate" }
      responses:
        "204": { description: Guncellendi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Bu telefon zaten kayitli
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [auth]
      summary: Sakini SIL (akilli, yonetici/admin) — telefon her durumda serbest
      description: |
        Gecmissiz sakin TAMAMEN silinir (deleted=true; unit_resident/rsvp/device
        CASCADE). Gecmisi olan sakin (FK RESTRICT) silinemez -> pasiflestirilir +
        telefon=NULL (deleted=false). Boylece ayni numarayla yeniden kayit her
        zaman mumkun. role=resident degilse 404. Saha/sakin roller 403.
      responses:
        "200":
          description: Silme sonucu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResidentDeleteOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /residents/{id}/reset-password:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [auth]
      summary: Sakin parolasini sifirla (yonetici/admin) — yeni gecici kod
      description: |
        Yeni TEK SEFERLIK gecici kod uretir (password_set=false); sakin telefon +
        bu kodla girip yeni parola belirler. Kod YALNIZ bu yanitta doner.
        role=resident degilse 404.
      responses:
        "200":
          description: Yeni gecici kod
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResidentResetPasswordOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh token ile yeni access (+rotated refresh) al
      security: []   # refresh token govdede tasinir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Yeni token cifti
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Gecersiz / suresi dolmus / iptal edilmis refresh token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ================================================================= #
  # SELF-SERVIS PROFIL (/me/*) — tum roller, yalniz kendi kaydi
  # ================================================================= #
  /me/profile:
    get:
      tags: [me]
      summary: Kendi profilim (kimlik + iletisim)
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeProfileOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/password:
    patch:
      tags: [me]
      summary: Kendi parolami degistir (mevcut parola zorunlu)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeRequest" }
      responses:
        "204": { description: Parola guncellendi }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /me/contact:
    patch:
      tags: [me]
      summary: Kendi telefon + arama rizami guncelle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserContactUpdate" }
      responses:
        "200":
          description: Guncellenmis profil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeProfileOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # SHIFTS
  # ================================================================= #
  /shifts:
    get:
      tags: [shifts]
      summary: Vardiya listesi
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: gun_tipi
          in: query
          schema: { $ref: "#/components/schemas/GunTipi" }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Shift" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [shifts]
      summary: Vardiya olustur
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShiftCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shift" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /shifts/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [shifts]
      summary: Vardiya detay
      responses:
        "200":
          description: Detay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shift" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [shifts]
      summary: Vardiya guncelle (kismi)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShiftUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shift" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [shifts]
      summary: Vardiya sil
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ================================================================= #
  # CHECKPOINTS
  # ================================================================= #
  /checkpoints:
    get:
      tags: [checkpoints]
      summary: Checkpoint listesi
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: aktif
          in: query
          schema: { type: boolean }
        - name: nfc_tag_uid
          in: query
          description: NFC etiket UID ile esleme/arama
          schema: { type: string }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Checkpoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [checkpoints]
      summary: Checkpoint olustur (nfc_tag_uid eslemesi dahil)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckpointCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkpoint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: nfc_tag_uid bu tenant'ta zaten kayitli
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /checkpoints/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [checkpoints]
      summary: Checkpoint detay
      responses:
        "200":
          description: Detay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkpoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [checkpoints]
      summary: Checkpoint guncelle (kismi)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckpointUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkpoint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [checkpoints]
      summary: Checkpoint sil
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /checkpoints/{id}/sdm-key:
    parameters:
      - $ref: "#/components/parameters/PathId"
    put:
      tags: [checkpoints]
      summary: NTAG424 SDM anahtarini kaydet/kapat (yalniz admin)
      description: |
        Checkpoint'e yapisik NTAG424 DNA etiketinin SDM (SDMFileRead) AES-128
        anahtarini kaydeder: `{ "key": "<32 hex>" }`. Anahtar sunucuda `SDM_KEK`
        (env) ile AES-GCM SIFRELI saklanir ve HICBIR response'ta geri donmez;
        yalniz `Checkpoint.sdm_aktif` gorunur. Kayit sirasinda replay sayaci
        (`sdm_son_sayac`) 0'lanir — yeni anahtar = yeni/yeniden provision edilmis
        etiket varsayimi. `{ "key": null }` SDM'i kapatir.

        `SDM_KEK` yapilandirilmamissa (bos/32 karakterden kisa) **500
        `config_error`** — anahtar yazma reddedilir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  nullable: true
                  description: "AES-128 anahtar, 32 hex karakter; null = SDM kapat"
                  example: "00112233445566778899AABBCCDDEEFF"
      responses:
        "200":
          description: Kaydedildi/kapatildi (anahtar donmez; sdm_aktif gorunur)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkpoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500":
          description: SDM_KEK yapilandirilmamis (config_error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ================================================================= #
  # PATROL PLANS
  # ================================================================= #
  /patrol-plans:
    get:
      tags: [patrol-plans]
      summary: Devriye plani listesi
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: aktif
          in: query
          schema: { type: boolean }
        - name: shift_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/PatrolPlan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [patrol-plans]
      summary: Devriye plani olustur
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatrolPlanCreate" }
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatrolPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /patrol-plans/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [patrol-plans]
      summary: Devriye plani detay (checkpoint listesi dahil)
      responses:
        "200":
          description: Detay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatrolPlanDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [patrol-plans]
      summary: Devriye plani guncelle (kismi)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatrolPlanUpdate" }
      responses:
        "200":
          description: Guncellendi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatrolPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [patrol-plans]
      summary: Devriye plani sil
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /patrol-plans/{id}/checkpoints:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [patrol-plans]
      summary: Plana atanmis checkpoint listesi (sirali)
      responses:
        "200":
          description: Atanmis noktalar
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PatrolPlanCheckpoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [patrol-plans]
      summary: Plana checkpoint listesi ata (tam degisim / replace)
      description: |
        Gonderilen liste plani tamamen yeniden tanimlar (idempotent set-replace).
        Listedeki sira, gonderim sirasidir; `sira` alani opsiyoneldir, verilmezse
        dizideki index kullanilir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatrolPlanCheckpointAssign" }
      responses:
        "200":
          description: Atama guncellendi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PatrolPlanCheckpoint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ================================================================= #
  # SCANS  (mobil tur kaniti)
  # ================================================================= #
  /scans:
    get:
      tags: [scans]
      summary: Gun-gun tarama raporu (admin + yonetici)
      description: |
        Secilen gunun (tenant timezone) TUM taramalari — KIM (guard_ad), HANGI
        NOKTA (checkpoint_ad), NE ZAMAN (okutma_zamani). okutma_zamani'na gore
        sirali. RBAC: admin + yonetici (saha/resident 403).
      parameters:
        - name: tarih
          in: query
          required: false
          schema: { type: string, format: date }
          description: "YYYY-MM-DD (tenant tz); verilmezse bugun"
        - name: konumsuz
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            (P34) Yalniz konumu OLMAYAN okutmalar. `konumsuz_sayisi` alani
            bu suzgecten BAGIMSIZ hesaplanir — aksi halde suzgeci acan amir
            "kac tanesi" sorusunu ancak satirlari sayarak yanitlardi.
      responses:
        "200":
          description: Gunun taramalari
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanReportResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [scans]
      summary: Tur kaniti gonder (NFC okutma)
      description: |
        Mobil istemcinin checkpoint okutma kanitini gonderdigi endpoint.
        Offline kuyruktan cift gonderimi engellemek icin `Idempotency-Key`
        header'i ZORUNLUDUR.

        (P34) KONUM BIR KANITTIR, ON KOSUL DEGIL: izin reddedilse veya sinyal
        gelmese de okutma KAYDEDILIR — ama SESSIZ KALMAZ. `konum_durumu`
        NEDENI tasir (`var` | `izin_yok` | `servis_kapali` | `zaman_asimi` |
        `bilinmiyor`); gonderilmezse sunucu turetir (koordinat varsa `var`,
        yoksa `bilinmiyor` — alan yoklugunu "izin reddi" saymak OLMAYAN bir
        reddi raporlamak olurdu). `konum_durumu: var` iken koordinat zorunlu
        (422; DB CHECK'i de ayni sozu tutar).

        (P34) BASLANGIC FOTOGRAFI (tenant ayari
        `tur_baslangic_foto_zorunlu`): acikken, bir tur penceresinin ILK
        okutmasi `foto_key` olmadan **422 `foto_gerekli`** doner. Neden
        fotograf: NTAG424 SDM zaten etiketin FIZIKSEL varligini
        kriptografik olarak kanitliyor — "1 metre gidip gel" turu bir hareket
        kanitina gerek YOK. Fotografin ekledigi sey BASKA bir boyut: ortam ve
        gunun saati (gunduz/gece); GPS de konumu ekler. Yalniz ILK okutma
        istenir — her noktada fotograf turu iki katina cikarirdi. Istemci
        AYNI Idempotency-Key ile fotografli govdeyi yeniden gonderir (ilk
        deneme reddedildigi icin sunucuda kayit yoktur, cakisma olmaz). Ayni key ile ikinci istek 200 + ilk kaydi doner
        (yeni kayit olusturmaz).

        nfc_tag_uid -> checkpoint eslesmesi NORMALIZE edilir (strip + upper;
        buyuk/kucuk harf ve bas/son bosluk farki eslesmeyi dusurmez) — task
        completion ve asset checkout/checkin ile ayni davranis (mobil §11 #3).

        NTAG424 SDM/SUN dogrulamasi: `imza_dogrulandi` YALNIZ SUNUCUDA hesaplanir
        (govdedeki alan deprecated + yok sayilir). Etiket SDM ciktisi
        `sdm_picc_data` (32 hex) + `sdm_cmac` (16 hex) ile gonderilir. Karar:

        | checkpoint anahtari | SDM alanlari | sonuc |
        |---|---|---|
        | yok | yok/var | kayit `imza_dogrulandi=false` (gecis donemi) |
        | var | yok | kayit `false` (zorlama yok) |
        | var | gecersiz (CMAC/UID/format) | **422 `invalid_signature`** — kayit OLUSMAZ |
        | var | sayac ilerlememis | **422 `replay_detected`** — kayit OLUSMAZ |
        | var | gecerli | kayit `true`; replay sayaci gunceller |

        Idempotent tekrar (ayni Idempotency-Key + ayni govde) SDM dogrulamasini
        ATLAR ve 200 doner — tekrar gonderim replay SANILMAZ.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanCreate" }
      responses:
        "201":
          description: Kayit olusturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanEvent" }
        "200":
          description: Idempotent tekrar — mevcut kayit donduruldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanEvent" }
        "400":
          description: Idempotency-Key eksik veya gecersiz govde
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: nfc_tag_uid hicbir checkpoint ile eslesmedi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Ayni Idempotency-Key farkli govde ile gonderildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >-
            Dogrulama hatasi; SDM'e ozgu kodlar: `invalid_signature` (CMAC/UID/
            format gecersiz) ve `replay_detected` (okuma sayaci ilerlememis) —
            iki durumda da scan kaydi OLUSMAZ.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

