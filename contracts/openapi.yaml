        durum: { type: string, enum: [teslim_alindi] }

    UnitAccessRequest:
      type: object
      description: >
        Yonetici tek-seferlik daire erisim izni (talep+izin tek satirda).
        onaylandi & used=false => gecerli izin; yonetici o dairenin ziyaretci/
        kargo kaydini ILK okudugunda used=true olur (one-shot, suresiz).
      required: [id, unit_id, granted_to_yonetici_user_id, durum, used, requested_at]
      properties:
        id: { type: string, format: uuid }
        unit_id: { type: string, format: uuid }
        unit_no: { type: string, nullable: true, description: Daire no (join ile) }
        granted_to_yonetici_user_id:
          type: string
          format: uuid
          description: >
            Talebi acan yonetici VEYA admin (izin ona verilir; isim tarihsel —
            admin de erisim talebi acabilir).
        yonetici_ad: { type: string, nullable: true }
        granted_by_resident_user_id:
          type: string
          format: uuid
          nullable: true
          description: Karari veren sakin (karara kadar null)
        resident_ad: { type: string, nullable: true }
        durum: { type: string, enum: [bekliyor, onaylandi, reddedildi] }
        used:
          type: boolean
          description: true = izin tuketildi (yonetici bir kez gordu); tekrar 403
        requested_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
        used_at: { type: string, format: date-time, nullable: true }
    UnitAccessRequestCreate:
      type: object
      description: unit_id VEYA unit_no alanlarindan TAM BiRi verilmeli (aksi 422)
      properties:
        unit_id: { type: string, format: uuid, nullable: true }
        unit_no:
          type: string
          nullable: true
          minLength: 1
          maxLength: 50
          description: Daire numarasi (orn. A-12) — sunucuda tenant icinde cozulur
    UnitAccessRequestDecision:
      type: object
      description: Sakin karari — onay/red ('bekliyor'a geri donus yok)
      required: [durum]
      properties:
        durum: { type: string, enum: [onaylandi, reddedildi] }
    BulkAccessRequestResult:
      type: object
      description: >
        Toplu izin talebi sonucu. created = yeni acilan bekleyen talep sayisi;
        skipped = zaten acik/onayli oldugu icin atlanan daire sayisi; items =
        yeni acilan talepler. Per-daire sakin RIZASI korunur (baypas yok).
      required: [created, skipped, items]
      properties:
        created: { type: integer }
        skipped: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/UnitAccessRequest" }
    GrantedUnit:
      type: object
      description: Talebi acanin SU AN goruntuleyebilecegi daire (onayli+kullanilmamis)
      required: [request_id, unit_id]
      properties:
        request_id: { type: string, format: uuid, description: Izin (talep) kaydinin id'si }
        unit_id: { type: string, format: uuid }
        unit_no: { type: string, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
    GrantedUnitsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GrantedUnit" }

    OrtakAlan:
      type: object
      required: [id, ad, aktif, acilis, kapanis, slot_dakika, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, maxLength: 200, example: Havuz }
        aciklama: { type: string, nullable: true, maxLength: 1000 }
        aktif:
          type: boolean
          description: false = kaldirilmis (soft-delete; rezerve edilemez)
        acilis:
          type: string
          example: "08:00"
          description: >-
            Musaitlik acilis saati ("HH:MM"). Alan her gun [acilis, kapanis)
            araliginda rezerve edilebilir.
        kapanis: { type: string, example: "22:00", description: 'Kapanis ("HH:MM"), > acilis' }
        slot_dakika:
          type: integer
          example: 60
          description: Slot izgara uzunlugu (dk) — GET /common-areas/{id}/slots buradan uretir
        created_at: { type: string, format: date-time }
    OrtakAlanCreate:
      type: object
      required: [ad]
      properties:
        ad: { type: string, minLength: 1, maxLength: 200 }
        aciklama: { type: string, nullable: true, minLength: 1, maxLength: 1000 }
        acilis: { type: string, default: "00:00", description: 'Verilmezse tum-gun ("HH:MM")' }
        kapanis: { type: string, default: "23:59:59", description: '> acilis olmali' }
        slot_dakika: { type: integer, default: 60, minimum: 1, maximum: 1440 }
    OrtakAlanUpdate:
      type: object
      description: En az bir alan gerekli
      properties:
        ad: { type: string, minLength: 1, maxLength: 200 }
        aciklama: { type: string, nullable: true, minLength: 1, maxLength: 1000 }
        aktif: { type: boolean }
        acilis: { type: string, description: '"HH:MM"; kapanis ile birlikte > acilis olmali' }
        kapanis: { type: string, description: '"HH:MM"' }
        slot_dakika: { type: integer, minimum: 1, maximum: 1440 }
    Slot:
      type: object
      required: [baslangic, bitis, dolu]
      description: >-
        Bir gunun tek slotu — ROL-FARKINDA. resident/saha: yalniz dolu/bos
        (kimlik + kisi sayisi YOK). admin/yonetici: dolu slotta ayrica rezerve
        eden daire (unit_no) + kisi_sayisi (denetim).
      properties:
        baslangic: { type: string, example: "10:00" }
        bitis: { type: string, example: "11:00" }
        dolu:
          type: boolean
          description: true = bu slotla kesisen ONAYLI rezervasyon var
        rezerve_edilebilir:
          type: boolean
          default: false
          description: >-
            Istekteki SAKIN bu slotu SIMDI rezerve edebilir mi (24s penceresi +
            gunluk kota + son-dakika istisnasi). Yonetimde her zaman false.
        sebep:
          type: string
          nullable: true
          enum: [dolu, gecti, cok_erken, gunluk]
          description: Rezerve edilemme sebebi (rezerve_edilebilir=false iken)
        unit_no:
          type: string
          nullable: true
          description: >-
            YALNIZ admin/yonetici + dolu slot: rezerve eden daire no
            (resident/saha icin DAIMA null — gizlilik).
        kisi_sayisi:
          type: integer
          nullable: true
          description: "YALNIZ admin/yonetici + dolu slot: rezerve edilen kisi sayisi"
        benim:
          type: boolean
          default: false
          description: >-
            YALNIZ resident: bu dolu slot istekteki sakinin KENDI rezervasyonu
            mu. Istemci baslangic/bitis + simdi ile aktif(yesil)/gecmis(kirmizi)
            rengini secer. Baskasinin dolu slotu benim=false + kimlik/kisi null.
    AlanSlotResponse:
      type: object
      required: [alan_id, tarih, slot_dakika, items]
      properties:
        alan_id: { type: string, format: uuid }
        tarih: { type: string, format: date }
        slot_dakika: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/Slot" } }

    Rezervasyon:
      type: object
      required: [id, alan_id, unit_id, tarih, baslangic, bitis, kisi_sayisi,
                 durum, talep_eden_user_id, created_at]
      properties:
        id: { type: string, format: uuid }
        alan_id: { type: string, format: uuid }
        alan_ad: { type: string, nullable: true, description: Alan adi (join ile) }
        unit_id: { type: string, format: uuid }
        unit_no: { type: string, nullable: true, description: Daire numarasi (join ile) }
        tarih: { type: string, format: date }
        baslangic: { type: string, example: "10:00", description: '"HH:MM"' }
        bitis: { type: string, example: "12:00", description: '"HH:MM" — baslangictan sonra' }
        kisi_sayisi: { type: integer, minimum: 1 }
        notlar:
          type: string
          nullable: true
          description: Opsiyonel not ("not" SQL anahtar sozcugu; alan adi notlar)
        durum: { type: string, enum: [onaylandi, iptal] }
        talep_eden_user_id: { type: string, format: uuid }
        talep_eden_ad: { type: string, nullable: true }
        iptal_eden_user_id:
          type: string
          format: uuid
          nullable: true
          description: Iptal eden (sakin/yonetim); yalniz durum='iptal'de dolu
        iptal_eden_ad: { type: string, nullable: true }
        iptal_zamani: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        gecmis:
          type: boolean
          default: false
          description: >
            (P165) BITIS SAATI GECTI MI — SUNUCU hesaplar, tesisin saat
            diliminde (`tarih` bir GUN, `bitis` gun-ici bir SAAT; ikisi
            ancak bir saat diliminde bir ANA donusur). Istemci bunu KENDI
            saatiyle hesaplamamalidir: saati yanlis kurulu bir cihaz
            gecmis bir kaydin yaninda "Iptal et" gosterirdi. `true` iken
            iptal MUMKUN DEGILDIR. Olcu BITIS, baslangic degil — su an
            SUREN bir rezervasyon aktiftir ve iptal edilebilir.
    RezervasyonCreate:
      type: object
      required: [alan_id, tarih, baslangic, bitis, kisi_sayisi]
      properties:
        alan_id: { type: string, format: uuid }
        tarih: { type: string, format: date }
        baslangic: { type: string, example: "10:00" }
        bitis: { type: string, example: "12:00", description: baslangictan sonra olmali }
        kisi_sayisi: { type: integer, minimum: 1, maximum: 1000 }
        unit_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Opsiyonel — sakinin birden fazla aktif dairesi varsa secim;
            kendi dairesi olmali (aksi 422). Verilmezse ilk aktif daire.
        notlar: { type: string, nullable: true, minLength: 1, maxLength: 1000 }

    Etkinlik:
      type: object
      description: |
        Etkinlik + SEFFAF katilim sayilari. Sayilar herkese acik;
        kim-katiliyor listesi URUN GEREGI donmez (kimlik degil yalniz sayi).
        benim_durumum istekteki kullanicinin KENDI beyanidir.

        Cevrilen metin alanlari `baslik` + `aciklama`; `konum` CEVRILMEZ
        (yer adi). Ceviri ustverisi: CeviriAlanlari.
      allOf:
        - $ref: "#/components/schemas/CeviriAlanlari"
      required: [id, baslik, aciklama, tarih, olusturan_user_id,
                 katiliyorum_sayisi, katilmiyorum_sayisi, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        baslik: { type: string, maxLength: 200, example: Mac izleme aksami }
        aciklama: { type: string, maxLength: 5000 }
        tarih:
          type: string
          format: date-time
          description: Etkinlik BASLANGICI
        bitis_zamani:
          type: string
          format: date-time
          nullable: true
          description: >
            Etkinlik bitisi; null = ANLIK etkinlik (bitis = baslangic).
            `?aktif=true` suzgeci COALESCE(bitis_zamani, tarih) kullanir.
        konum: { type: string, nullable: true, maxLength: 500 }
        foto_key:
          type: string
          nullable: true
          description: MinIO obje anahtari (/uploads/presign ile yuklenir)
        foto_url:
          type: string
          nullable: true
          description: >
            Goruntuleme icin kisa omurlu presigned GET URL (foto_key varsa).
            Depo yapilandirilmamissa null doner — okuma akisi kirilmaz.
        olusturan_user_id: { type: string, format: uuid }
        olusturan_ad: { type: string, nullable: true }
        katiliyorum_sayisi: { type: integer, minimum: 0 }
        katilmiyorum_sayisi: { type: integer, minimum: 0 }
        benim_durumum:
          type: string
          enum: [katiliyorum, katilmiyorum]
          nullable: true
          description: Istekteki kullanicinin kendi RSVP'si (beyan yoksa null)
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EtkinlikCreate:
      type: object
      required: [baslik, aciklama, tarih]
      properties:
        baslik: { type: string, minLength: 1, maxLength: 200 }
        aciklama: { type: string, minLength: 1, maxLength: 5000 }
        tarih: { type: string, format: date-time, description: Baslangic }
        bitis_zamani:
          type: string
          format: date-time
          nullable: true
          description: "Verilirse baslangictan SONRA olmali (aksi 422)"
        konum: { type: string, nullable: true, minLength: 1, maxLength: 500 }
        foto_key:
          type: string
          nullable: true
          description: "/uploads/presign ile yuklenen obje anahtari (tenant onekli)"
    EtkinlikUpdate:
      type: object
      description: >
        En az bir alan gerekli. `bitis_zamani: null` bitisi, `foto_key: null`
        gorseli kaldirir.
      properties:
        baslik: { type: string, minLength: 1, maxLength: 200 }
        aciklama: { type: string, minLength: 1, maxLength: 5000 }
        tarih: { type: string, format: date-time }
        bitis_zamani: { type: string, format: date-time, nullable: true }
        konum: { type: string, nullable: true, maxLength: 500 }
        foto_key: { type: string, nullable: true }
    EtkinlikRsvp:
      type: object
      description: Kullanici basina TEK kayit; tekrar PUT beyani degistirir
      required: [durum]
      properties:
        durum: { type: string, enum: [katiliyorum, katilmiyorum] }

    SiteKurali:
      type: object
      description: >-
        Cevrilen metin alanlari `baslik` + `icerik`; Accept-Language ile secilen
        dilde doner. Ceviri ustverisi: CeviriAlanlari.
      allOf:
        - $ref: "#/components/schemas/CeviriAlanlari"
      required: [id, baslik, icerik, sira, olusturan_user_id,
                 created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        baslik: { type: string, maxLength: 200, example: Havuz Saatleri }
        icerik: { type: string, maxLength: 10000 }
        foto_key:
          type: string
          nullable: true
          description: Opsiyonel gorsel — /uploads/presign ile alinan obje anahtari
        foto_url:
          type: string
          nullable: true
          description: Goruntuleme icin kisa omurlu presigned GET URL (foto_key varsa)
        sira: { type: integer, minimum: 0, description: Liste sirasi (kucuk once) }
        olusturan_user_id: { type: string, format: uuid }
        olusturan_ad: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DisHizmetCreate:
      type: object
      description: "Guvenilir esnaf/hizmet kisisi. tur: Cilingir/Elektrik/Tesisat..."
      required: [tur, ad, soyad, telefon]
      properties:
        tur: { type: string, minLength: 1, maxLength: 80, example: "Çilingir" }
        ad: { type: string, minLength: 1, maxLength: 120 }
        soyad: { type: string, minLength: 1, maxLength: 120 }
        telefon: { type: string, minLength: 1, maxLength: 40 }
        aciklama: { type: string, nullable: true, maxLength: 1000 }
    DisHizmetUpdate:
      type: object
      description: Kismi guncelleme (en az bir alan).
      minProperties: 1
      properties:
        tur: { type: string, minLength: 1, maxLength: 80 }
        ad: { type: string, minLength: 1, maxLength: 120 }
        soyad: { type: string, minLength: 1, maxLength: 120 }
        telefon: { type: string, minLength: 1, maxLength: 40 }
        aciklama: { type: string, nullable: true, maxLength: 1000 }
    DisHizmetOut:
      type: object
      required: [id, tur, ad, soyad, telefon, created_at]
      properties:
        id: { type: string, format: uuid }
        tur: { type: string }
        ad: { type: string }
        soyad: { type: string }
        telefon: { type: string }
        aciklama: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    DisHizmetListResponse:
      type: object
      required: [items]
      properties:
        note: { type: string, nullable: true, description: "Bolum notu (yonetici)" }
        items:
          type: array
          items: { $ref: "#/components/schemas/DisHizmetOut" }
    DisHizmetNoteUpdate:
      type: object
      properties:
        note: { type: string, nullable: true, maxLength: 2000 }
    SiteKuraliCreate:
      type: object
      required: [baslik, icerik]
      properties:
        baslik: { type: string, minLength: 1, maxLength: 200 }
        icerik: { type: string, minLength: 1, maxLength: 10000 }
        foto_key:
          type: string
          nullable: true
          description: "Opsiyonel gorsel: once /uploads/presign ile alinan obje anahtari"
        sira: { type: integer, minimum: 0, default: 0 }
    SiteKuraliUpdate:
      type: object
      description: En az bir alan gerekli
      properties:
        baslik: { type: string, minLength: 1, maxLength: 200 }
        icerik: { type: string, minLength: 1, maxLength: 10000 }
        foto_key:
          type: string
          nullable: true
          description: Acikca null gonderilirse gorsel kaldirilir; alan yoksa dokunulmaz
        sira: { type: integer, minimum: 0 }

    Notification:
      type: object
      required: [id, tip, mesaj, okundu, created_at]
      description: >
        `mesaj` ISTEGIN DILINDE uretilir (tur 16): kayit cumle degil
        `mesaj_kimlik` + `mesaj_veri` tasir. Boylece ayni kayit her
        kullaniciya kendi dilinde gorunur — cumle kayda DONDURULMAZ.
        Tur 16 oncesi satirlarda kimlik `null`dur ve `mesaj` kayittaki
        (Turkce) metindir.
      properties:
        id: { type: string, format: uuid }
        tip:
          type: string
          enum: [kacirilan_tur, eksik_checkpoint, gecikmis_okutma]
          example: kacirilan_tur
        patrol_window_id: { type: string, format: uuid, nullable: true }
        patrol_plan_id: { type: string, format: uuid, nullable: true }
        checkpoint_id: { type: string, format: uuid, nullable: true }
        task_id: { type: string, format: uuid, nullable: true }
        mesaj:
          type: string
          description: Istegin dilinde uretilmis gosterilecek metin
        mesaj_kimlik:
          type: string
          nullable: true
          example: kacirilan_tur
          description: >
            Metnin yerellestirilebilir kimligi (= `tip` / push `data.tip`).
            Istemci kendi metnini kurmak ya da yonlendirme yapmak icin
            kullanabilir.
        mesaj_veri:
          type: object
          nullable: true
          additionalProperties: true
          example: { plan: "Gece devriyesi", eksik: 2 }
          description: Metnin DEGISKEN alanlari (cevrilmez — veridir)
        okundu: { type: boolean }
        created_at: { type: string, format: date-time }
    NotificationUpdate:
      type: object
      required: [okundu]
      properties:
        okundu: { type: boolean }
    NotificationTopluOkundu:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
          maxItems: 500
        okundu: { type: boolean, default: true }
    NotificationTopluSil:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
          maxItems: 500
    NotificationTopluSonuc:
      type: object
      required: [etkilenen]
      properties:
        etkilenen: { type: integer }

    # ----------------------------- tasks --------------------------- #
    # Gorev tipi = yonetici-tanimli kategori (task_category); kategori_id null =
    # "Diğer". Sabit task_tip enum'u KALDIRILDI.
    Task:
      type: object
      required: [id, ad, foto_zorunlu, aktif, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, example: "Cop toplama" }
        aciklama: { type: string, nullable: true }
        atanan_user_id: { type: string, format: uuid, nullable: true }
        checkpoint_id: { type: string, format: uuid, nullable: true }
        kategori_id:
          type: string
          format: uuid
          nullable: true
          description: "Gorev tipi = yonetici-tanimli kategori; null = Diğer"
        periyot_dakika:
          type: integer
          minimum: 1
          nullable: true
          description: "Tekrar araligi (dakika); tek seferlikse null"
        sonraki_planlanan:
          type: string
          format: date-time
          nullable: true
          description: "Bir sonraki planlanan an (UTC); peyzaj takvimi. Tamamlaninca ilerler."
        foto_zorunlu:
          type: boolean
          description: "true ise completion foto_key olmadan kabul edilmez (422) — mobil §11 #2"
        aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TaskCreate:
      type: object
      required: [ad]
      properties:
        ad: { type: string }
        aciklama: { type: string, nullable: true }
        atanan_user_id: { type: string, format: uuid, nullable: true }
        checkpoint_id: { type: string, format: uuid, nullable: true }
        kategori_id: { type: string, format: uuid, nullable: true, description: "null = Diğer" }
        periyot_dakika: { type: integer, minimum: 1, nullable: true }
        sonraki_planlanan: { type: string, format: date-time, nullable: true }
        foto_zorunlu: { type: boolean, default: false }
        aktif: { type: boolean, default: true }
    TaskUpdate:
      type: object
      minProperties: 1
      properties:
        ad: { type: string }
        aciklama: { type: string, nullable: true }
        atanan_user_id: { type: string, format: uuid, nullable: true }
        checkpoint_id: { type: string, format: uuid, nullable: true }
        kategori_id: { type: string, format: uuid, nullable: true }
        periyot_dakika: { type: integer, minimum: 1, nullable: true }
        sonraki_planlanan: { type: string, format: date-time, nullable: true }
        foto_zorunlu: { type: boolean }
        aktif: { type: boolean }

    TaskCategory:
      type: object
      required: [id, ad, aktif, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, example: "Havuz bakimi" }
        aktif: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }
    TaskCategoryCreate:
      type: object
      required: [ad]
      properties:
        ad: { type: string, minLength: 1, maxLength: 100 }
    TaskCategoryUpdate:
      type: object
      minProperties: 1
      properties:
        ad: { type: string, minLength: 1, maxLength: 100 }
        aktif: { type: boolean }

    TaskCompletion:
      type: object
      required: [id, task_id, tamamlayan_user_id, tamamlanma_zamani, idempotency_key, created_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        tamamlayan_user_id:
          type: string
          format: uuid
          description: "Token'dan turetilir"
        tamamlanma_zamani: { type: string, format: date-time }
        nfc_tag_uid: { type: string, nullable: true }
        gps_lat: { type: number, format: double, nullable: true }
        gps_lng: { type: number, format: double, nullable: true }
        foto_key: { type: string, nullable: true }
        foto_url:
          type: string
          nullable: true
          description: >
            (P131) Kisa omurlu presigned GET — `foto_key` doluysa DOLDURULUR.
            2026-08-04'e kadar bu alan semada VARDI ama sunucu HICBIR YERDE
            doldurmuyordu: fotograf kaniti yukleniyor, saklaniyor ve ne
            mobilde ne web'de gorunuyordu. Regresyon kilidi:
            `backend/tests/test_foto_url_kapsam.py`.
        notlar: { type: string, nullable: true }
        idempotency_key: { type: string }
        created_at: { type: string, format: date-time }
    # Capraz-gorev tamamlama gecmisi ogesi (GET /task-completions). foto_url/gps
    # YOK; kanit varligi foto_var/nfc_dogrulandi bool olarak yeter.
    TaskCompletionHistory:
      type: object
      required:
        [id, task_id, kategori_ad, tamamlayan_user_id, tamamlanma_zamani, foto_var, nfc_dogrulandi]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        task_adi: { type: string, nullable: true }
        kategori_ad: { type: string, description: "Gorevin kategorisi; null kategori -> Diğer" }
        tamamlayan_user_id: { type: string, format: uuid }
        tamamlanma_zamani: { type: string, format: date-time }
        foto_var: { type: boolean, description: "foto_key dolu mu" }
        nfc_dogrulandi: { type: boolean, description: "nfc_tag_uid okutuldu mu" }
        notlar: { type: string, nullable: true }
    TaskCompletionKategoriSayi:
      type: object
      required: [kategori_ad, sayi]
      properties:
        kategori_ad: { type: string }
        sayi: { type: integer }
    TaskCompletionOzet:
      type: object
      required: [toplam, kalemler]
      description: |
        Filtrelenmis TUM kume uzerinden KATEGORI bazli sayim (sabit tip kirilimi
        kaldirildi). NULL kategori "Diğer" altinda; sayi'ya gore azalan.
      properties:
        toplam: { type: integer }
        kalemler:
          type: array
          items: { $ref: "#/components/schemas/TaskCompletionKategoriSayi" }
    TaskCompletionCreate:
      type: object
      required: [tamamlanma_zamani]
      properties:
        tamamlanma_zamani: { type: string, format: date-time }
        nfc_tag_uid:
          type: string
          nullable: true
          description: "Verilirse task.checkpoint_id'nin nfc'si ile eslesmeli"
        gps_lat: { type: number, format: double, nullable: true }
        gps_lng: { type: number, format: double, nullable: true }
        foto_key:
          type: string
          nullable: true
          description: "Once /uploads/presign ile alinan obje anahtari"
        notlar: { type: string, nullable: true }

    # ---------------------------- uploads -------------------------- #
    PresignRequest:
      type: object
      required: [content_type]
      properties:
        content_type:
          type: string
          example: "image/jpeg"
          description: >
            Yuklenecek dosyanin MIME tipi — YALNIZ gorsel: image/jpeg,
            image/png, image/webp, image/heic (aksi 422); imzali PUT URL bu
            content-type'a baglanir (airtight — baska tip ile yuklenemez).
        dosya_adi:
          type: string
          nullable: true
          description: "Opsiyonel; uzanti foto_key icin kullanilabilir"
        boyut:
          type: integer
          nullable: true
          minimum: 1
          description: "Istemci-beyanli dosya boyutu (byte); max ~8MB (asarsa 422). Best-effort — sunucu dosyayi bizzat olcmez."
    PresignResponse:
      type: object
      required: [foto_key, upload_url, method, expires_in]
      properties:
        foto_key:
          type: string
          description: "Completion'da gonderilecek obje anahtari (tenant ile namespace'li)"
        upload_url:
          type: string
          description: "Presigned PUT URL — istemci dosyayi buraya PUT eder"
        method: { type: string, enum: [PUT], example: PUT }
        expires_in:
          type: integer
          description: "URL gecerlilik suresi (saniye)"
          example: 900

    # ---------------------------- assets --------------------------- #
    AssetKategori:
      type: string
      enum: [ekipman, arac, alet, diger]
    AssetDurum:
      type: string
      enum: [musait, zimmetli, bakimda]
    Asset:
      type: object
      required: [id, ad, durum, aktif, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, example: "Cim bicme makinesi" }
        kategori: { $ref: "#/components/schemas/AssetKategori" }
        nfc_tag_uid: { type: string, nullable: true }
        durum: { $ref: "#/components/schemas/AssetDurum" }
        aciklama: { type: string, nullable: true }
        aktif: { type: boolean }
        acik_zimmet:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/AcikZimmet" }]
          description: "Acik zimmet ozeti; zimmetli degilse null (mobil §13 #2/#5)"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AcikZimmet:
      type: object
      required: [alan_user_id, alan_user_ad, alinma_zamani]
      properties:
        alan_user_id: { type: string, format: uuid }
        alan_user_ad: { type: string, example: "Guard A" }
        alinma_zamani: { type: string, format: date-time }
    AssetCreate:
      type: object
      required: [ad]
      properties:
        ad: { type: string }
        kategori: { $ref: "#/components/schemas/AssetKategori" }
        nfc_tag_uid: { type: string, nullable: true }
        aciklama: { type: string, nullable: true }
        aktif: { type: boolean, default: true }
    AssetUpdate:
      type: object
      minProperties: 1
      properties:
        ad: { type: string }
        kategori: { $ref: "#/components/schemas/AssetKategori" }
        nfc_tag_uid: { type: string, nullable: true }
        durum: { $ref: "#/components/schemas/AssetDurum" }
        aciklama: { type: string, nullable: true }
        aktif: { type: boolean }

    AssetCheckout:
      type: object
      required: [id, asset_id, alan_user_id, alma_zamani, idempotency_key, created_at]
      properties:
        id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        alan_user_id:
          type: string
          format: uuid
          description: "Token'dan turetilir (alan kullanici)"
        alan_user_ad:
          type: string
          nullable: true
          description: "Alan kullanicinin adi (id + ad birlikte; mobil §13 #5)"
        birakan_user_id:
          type: string
          format: uuid
          nullable: true
          description: "Zimmeti kapatan (sahibi veya admin); acik zimmette NULL"
        birakan_user_ad:
          type: string
          nullable: true
          description: "Birakan kullanicinin adi (id + ad birlikte)"
        alma_zamani: { type: string, format: date-time }
        birakma_zamani:
          type: string
          format: date-time
          nullable: true
          description: "NULL => hala uzerinde (acik zimmet)"
        alma_nfc_tag_uid: { type: string, nullable: true }
        birakma_nfc_tag_uid: { type: string, nullable: true }
        alma_gps_lat: { type: number, format: double, nullable: true }
        alma_gps_lng: { type: number, format: double, nullable: true }
        birakma_gps_lat: { type: number, format: double, nullable: true }
        birakma_gps_lng: { type: number, format: double, nullable: true }
        notlar: { type: string, nullable: true }
        idempotency_key: { type: string }
        created_at: { type: string, format: date-time }
    CheckoutRequest:
      type: object
      properties:
        nfc_tag_uid:
          type: string
          nullable: true
          description: "Okutulan etiket; verilirse asset.nfc_tag_uid ile eslesmeli"
        gps_lat: { type: number, format: double, nullable: true }
        gps_lng: { type: number, format: double, nullable: true }
        notlar: { type: string, nullable: true }
    CheckinRequest:
      type: object
      properties:
        nfc_tag_uid:
          type: string
          nullable: true
          description: "Okutulan etiket; verilirse asset.nfc_tag_uid ile eslesmeli"
        gps_lat: { type: number, format: double, nullable: true }
        gps_lng: { type: number, format: double, nullable: true }
        notlar: { type: string, nullable: true }

    # ------------------------ tenant settings ---------------------- #
    TenantSettings:
      type: object
      required: [tenant_id, ad, slug, timezone]
      properties:
        tenant_id: { type: string, format: uuid }
        ad: { type: string }
        slug: { type: string }
        timezone: { type: string }
        kurulum_tamamlandi:
          type: boolean
          default: true
          description: "false ise BIRINCIL yonetici ILK GIRISTE tesisi adlandirmali (mobil setup ekrani)"
        yonetim_email:
          type: string
          nullable: true
          description: "Tesisin yonetim maili (tenant seviyesi) — yonetici iletisim kartinda gosterilir"
        konum_ad:
          type: string
          default: "İstanbul"
          description: "Hava durumu basliginda gorunen konum adi (GET /weather)"
        konum_lat:
          type: number
          format: double
          default: 41.0082
          description: "Hava durumu koordinati (enlem) — GET /weather bunu kullanir"
        konum_lon:
          type: number
          format: double
          default: 28.9784
          description: "Hava durumu koordinati (boylam)"
        otopark_kapasite:
          type: integer
          nullable: true
          minimum: 0
          example: 120
          description: >
            (G4, ADDITIVE) Otopark kapasitesi. **null = TANIMSIZ** —
            `GET /parking/occupancy` `kapasite` ve `oran` alanlarini null
            doner (istemci "—" gosterir).
        anpr_guven_esigi:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 0.85
          description: >
            (P16) Plaka okuma GUVEN esigi. Bu degerin ALTINDAKI okuma gecis
            ACMAZ, `onay_bekliyor` durumuna duser. `1.0` = hicbir okumaya
            guvenme (hepsi onaya), `0.0` = hepsini isle — ikisi de gecerli
            ayarlardir.
        tur_gecikme_toleransi_dk:
          type: integer
          minimum: 1
          maximum: 240
          default: 10
          description: >
            (P34) Tur penceresi acildiktan sonra bu kadar dakika icinde
            okutma gelmezse gecikme alarmi baslar. TENANT AYARIDIR: 10 dk
            bir sitede makul, kampus buyuklugunde erken alarm demektir.
        tur_alarm_tekrar_sayisi:
          type: integer
          minimum: 0
          maximum: 10
          default: 3
          description: >
            (P34) Alarm kac kez tekrarlanir. Araliklar KATLANIR (tolerans,
            2x, 4x...). **0 = alarm KAPALI** ve gecerli bir tercihtir; ust
            sinir bildirim yorgunlugunu onler.
        tur_baslangic_foto_zorunlu:
          type: boolean
          default: false
          description: >
            (P34) Tur penceresinin ilk okutmasinda kamera fotografi
            zorunlu mu? Urun kurali DEGIL tenant tercihi: gece vardiyasinda
            kamera kullanimi her sitede kabul gormez.
        gurultu_esigi:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
          description: >
            (P37) Daire basina ACIK **gurultu** sikayeti bu sayiya ULASINCA
            (sinir DAHIL) uyari tetiklenir ve o dairenin sayaci SIFIRLANIR.
            `>` degil `>=`: aksi halde esik ayari kullaniciya soyledigi
            sayidan bir fazlasinda calisirdi.
        gurultu_uyari_metni:
          type: string
          nullable: true
          maxLength: 1000
          description: >
            (P37) NULL veya bos = varsayilan metin. Bos metni "bilerek
            bosalttim" saymak, iceriksiz bir anons gondermek olurdu.
        gurultu_integration_id:
          type: string
          format: uuid
          nullable: true
          description: >
            (P37) Caydirici webhook'u olarak kullanilacak `/integrations`
            kaydi. **NULL = MANUEL MOD** (hata degil): esik asilinca
            yoneticiye bildirim gider ve anonsu o yapar.
        rezervasyon_gecmis_ay:
          type: integer
          minimum: 0
          maximum: 120
          default: 12
          description: >
            (P165) `GET /reservations?gecmis=true` listesinin kac AY geriye
            gidecegi. **0 = SINIRSIZ.** Bu bir GORUNUM penceresidir —
            rezervasyon SILINMEZ, yalnizca gecmis listesinde gizlenir
            (kayit ortak alan anlasmazliginda kanittir). Yonetici
            yazabilir.
        guvenlik_modu:
          type: string
          enum: [yonetim_ici, dis_sirket]
          default: yonetim_ici
          description: >
            (P35) Guvenligi KIM yonetir. `yonetim_ici` bugunku davranistir
            (yonetici planlar); `dis_sirket`te vardiya/tur/kontrol noktasi
            YAZMA yetkisi `guvenlik_amiri`ne GECER ve yonetici SALT-OKUR.
            OKUMA HER IKI MODDA ACIK KALIR — dis sirkete devretmek DENETIMI
            devretmek degildir. `admin` her iki modda yazar (mod yanlis
            ayarlandiginda tesis kilitli kalmasin). **Yalniz admin
            degistirebilir** ve degisim `audit_log`a yazilir: sahipligi
            devreden bir ayarin izsiz degismesi, "turleri kim planliyordu"
            sorusunu sonradan yanitlanamaz kilardi.
        anpr_otomatik_cikis:
          type: boolean
          default: true
          description: >
            (P16) Cikis olayinda acik gecis otomatik kapansin mi? Tek yonlu
            kapida (yalniz giris kamerasi) kapatan olmaz — site kapatabilir.
    TenantSettingsUpdate:
      type: object
      description: >
        En az bir alan gerekli. admin TUM alanlari gonderebilir; `yonetici`
        YALNIZ `ad`, `konum_ad`, `konum_lat`, `konum_lon`, `otopark_kapasite`,
        `anpr_guven_esigi` ve `anpr_otomatik_cikis` gonderebilir (baska alan
        gonderirse 403). ANPR ayarlari yoneticidedir cunku bunlar SAHA
        kararidir — kameranin nerede durdugunu ve yanlis okumanin ne siklikta
        oldugunu site bilir. `slug` ve tenant `id` bu uctan ASLA degismez.
      minProperties: 1
      properties:
        timezone: { type: string }
        ad: { type: string }
        yonetim_email: { type: string, nullable: true }
        konum_ad: { type: string, minLength: 1 }
        konum_lat: { type: number, format: double, minimum: -90, maximum: 90 }
        konum_lon: { type: number, format: double, minimum: -180, maximum: 180 }
        otopark_kapasite:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100000
          description: >
            (G4, ADDITIVE) Acikca `null` gonderilirse kapasite TANIMSIZ'a
            doner ve `oran` yeniden null olur.
        anpr_guven_esigi:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: "(P16) Plaka okuma guven esigi (0..1)"
        anpr_otomatik_cikis:
          type: boolean
          description: "(P16) Cikis olayinda acik gecis otomatik kapatilsin mi"
        tur_gecikme_toleransi_dk:
          type: integer
          minimum: 1
          maximum: 240
          description: (P34) Tur gecikme alarmi toleransi (dakika)
        tur_alarm_tekrar_sayisi:
          type: integer
          minimum: 0
          maximum: 10
          description: "(P34) Alarm tekrar sayisi; 0 = KAPALI"
        tur_baslangic_foto_zorunlu:
          type: boolean
          description: (P34) Tur baslangicinda kamera fotografi zorunlu mu
        guvenlik_modu:
          type: string
          enum: [yonetim_ici, dis_sirket]
          description: "(P35) YALNIZ admin gonderebilir (yonetici 403); denetlenir"
        gurultu_esigi: { type: integer, minimum: 1, maximum: 50 }
        gurultu_uyari_metni:
          type: string
          nullable: true
          maxLength: 1000
          description: "(P37) null gonderimi metni VARSAYILANA dondurur"
        gurultu_integration_id:
          type: string
          format: uuid
          nullable: true
          description: "(P37) null = manuel mod"
        rezervasyon_gecmis_ay:
          type: integer
          minimum: 0
          maximum: 120
          description: "(P165) gecmis listesi penceresi (ay); 0 = sinirsiz"

    # ---------------------- yonetici iletisim ---------------------- #
    YoneticiKart:
      type: object
      description: >
        Yonetici iletisim karti. GIZLILIK ISTISNASI (contracts/auth.md §C1a):
        `telefon` burada tenant'in TUM uyelerine acilir — C1a'nin yon/riza
        kapilari BU UC icin gecerli DEGILDIR (yonetici = HIZMET rolu; numarayi
        admin bilerek girer). Istisna YALNIZ role='yonetici' icindir.
      required: [user_id, ad_soyad]
      properties:
        user_id: { type: string, format: uuid }
        ad_soyad: { type: string, example: "Ayse Yilmaz" }
        telefon:
          type: string
          nullable: true
          example: "+905321112203"
          description: "Mobil kartta METIN olarak gorunur ve tel: ile aranir"
    YoneticiIletisimOut:
      type: object
      required: [yoneticiler]
      properties:
        yoneticiler:
          type: array
          description: "BIRINCIL ilk, sonra created_at ASC. Pasif yoneticiler listelenmez."
          items: { $ref: "#/components/schemas/YoneticiKart" }
        yonetim_email: { type: string, nullable: true }

    # ----------------------------- aidat --------------------------- #
    ResidentRol:
      type: string
      enum: [malik, kiraci]
    DuesYontem:
      type: string
      enum: [elden, havale, kart, diger]
    DuesDurum:
      type: string
      enum: [basarili, bekliyor, iptal]

    # ------------------ P27 "Tanimlar" katmani semalari ---------------- #
    # PARA HER YERDE KURUS (int64). Acilis bakiyeleri ISARETSIZ tutar + AYRI
    # yon tasir (bkz. yol yorumlari).
    MesajSablonu:
      type: object
      required: [id, kanal, ad, govde, amac, aktif, created_at]
      properties:
        id: { type: string, format: uuid }
        kanal: { type: string, enum: [sms, eposta] }
        ad: { type: string, minLength: 1, maxLength: 100 }
        konu:
          type: string
          nullable: true
          maxLength: 200
          description: >
            YALNIZ e-postada. SMS'te dolu konu, gonderilen metne GIRMEYEN
            bir alan olurdu (kullanici yazar ve kaybeder) — 422.
        govde: { type: string, minLength: 1, maxLength: 4000 }
        amac:
          type: string
          enum: [pazarlama, operasyonel]
          default: operasyonel
          description: >
            **SABLONDA durur, gonderim aninda secilmez**: ayni sablonun bir
            gun pazarlama bir gun operasyonel gonderilmesi, riza denetimini
            anlamsiz kilardi.
        aktif: { type: boolean }
        etiketler:
          type: array
          items: { type: string }
          description: Sablonda gecen etiketler (sirali, tekrarsiz)
        bilinmeyen_etiketler:
          type: array
          items: { type: string }
          description: >
            Desteklenmeyen etiketler — **UYARIDIR, hata degil**: sablon
            kaydedilir ama kullanici yazim hatasini gorur. Bilinmeyen etiket
            gonderilen metinde de OLDUGU GIBI KALIR (bos birakmak hatayi
            gizlerdi).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MesajSablonuCreate:
      type: object
      required: [kanal, ad, govde]
      properties:
        kanal: { type: string, enum: [sms, eposta] }
        ad: { type: string, minLength: 1, maxLength: 100 }
        konu: { type: string, nullable: true, maxLength: 200 }
        govde:
          type: string
          minLength: 1
          maxLength: 4000
          description: >
            **(P171) SUNUCU YAZMA ANINDA TEMIZLER** — `KvkkMetinCreate.govde`
            ile AYNI beyaz liste. E-posta kanalinda govde zengin metindir
            ve saklanan deger BASKASINA GONDERILIR; SMS'te bicimlendirme
            zaten anlamsizdir ve duz metin beyaz listeden DEGISMEDEN gecer.
        amac: { type: string, enum: [pazarlama, operasyonel], default: operasyonel }
        aktif: { type: boolean, default: true }
    MesajSablonuUpdate:
      type: object
      minProperties: 1
      properties:
        ad: { type: string, minLength: 1, maxLength: 100 }
        konu: { type: string, nullable: true, maxLength: 200 }
        govde: { type: string, minLength: 1, maxLength: 4000 }
        amac: { type: string, enum: [pazarlama, operasyonel] }
        aktif: { type: boolean }
    SmsOlcum:
      type: object
      required: [karakter, unicode_mi, parca, kalan, zorlayan]
      properties:
        karakter: { type: integer }
        unicode_mi:
          type: boolean
          description: True ise sinir 160 degil 70
        parca: { type: integer }
        kalan: { type: integer }
        zorlayan:
          type: array
          items: { type: string }
          description: UCS-2'ye zorlayan karakterler (orn. ı, ğ, ş, kucuk ç)
    MesajOnizlemeIstek:
      type: object
      required: [govde]
      properties:
        govde: { type: string, minLength: 1, maxLength: 4000 }
        konu: { type: string, nullable: true, maxLength: 200 }
        user_id:
          type: string
          format: uuid
          nullable: true
          description: Verilmezse ORNEK degerlerle onizlenir
    MesajOnizleme:
      type: object
      required: [govde, etiketler, bilinmeyen_etiketler]
      properties:
        konu: { type: string, nullable: true }
        govde: { type: string }
        etiketler: { type: array, items: { type: string } }
        bilinmeyen_etiketler: { type: array, items: { type: string } }
        sms:
          allOf: [{ $ref: "#/components/schemas/SmsOlcum" }]
          nullable: true
          description: YALNIZ kanal=sms iken dolu
    MesajYapilandirmaUpdate:
      type: object
      minProperties: 1
      description: >
        **(P168 §4.4)** Kismi guncelleme. Parola alani GONDERILMEZSE
        mevcut deger korunur; BOS DIZGE gonderilirse temizlenir.
      properties:
        sms_saglayici: { type: string, nullable: true, maxLength: 40 }
        sms_kullanici: { type: string, nullable: true, maxLength: 150 }
        sms_parola: { type: string, nullable: true, maxLength: 200 }
        sms_baslik: { type: string, nullable: true, maxLength: 40 }
        smtp_host: { type: string, nullable: true, maxLength: 200 }
        smtp_port: { type: integer, nullable: true, minimum: 1, maximum: 65535 }
        smtp_kullanici: { type: string, nullable: true, maxLength: 200 }
        smtp_parola: { type: string, nullable: true, maxLength: 200 }
        smtp_gonderen: { type: string, nullable: true, maxLength: 200 }
        gunluk_kota:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100000
          description: >
            NULL = sinir yok. `0` KABUL EDILMEZ: "sinirsiz" mi "kapali"
            mi belirsiz olurdu.
    MesajTestGonderim:
      type: object
      required: [kanal, hedef]
      properties:
        kanal: { type: string, enum: [sms, eposta] }
        hedef:
          type: string
          minLength: 3
          maxLength: 200
          description: Telefon ya da e-posta; hangisi oldugunu `kanal` soyler.
    MesajGonderIstek:
      type: object
      required: [sablon_id]
      properties:
        sablon_id: { type: string, format: uuid }
        user_ids:
          type: array
          nullable: true
          items: { type: string, format: uuid }
          description: Verilirse suzgec YERINE bu kisiler
        blok: { type: string, nullable: true }
        borc_durumu: { type: string, nullable: true, enum: [borclu, tumu] }
        rol:
          type: string
          maxLength: 32
          nullable: true
          description: |
            (P154) ROL BAZLI segment. Diger suzgeclerden AYRI calisir ve
            erken doner: blok/borc suzgecleri SAKIN listesinden turuyor
            (`unit_resident`), oysa `security`/`tesis_gorevlisi` daireye
            bagli DEGILDIR ve o listede hic gorunmez. Tek sorguya
            sikistirmak "guvenlige duyuru gonder"i SESSIZCE bos liste
            yapardi.

    MesajGonderSonuc:
      type: object
      required: [gonderildi, basarisiz, riza_yok, adres_yok]
      properties:
        gonderildi: { type: integer }
        basarisiz: { type: integer }
        riza_yok:
          type: integer
          description: Pazarlama rizasi olmadigi icin ATLANANLAR (sessizce dusurulmez)
        adres_yok: { type: integer, description: Telefonu/e-postasi olmayanlar }
    MesajGonderim:
      type: object
      required: [id, kanal, amac, hedef, govde, durum, created_at]
      properties:
        id: { type: string, format: uuid }
        kanal: { type: string, enum: [sms, eposta] }
        amac: { type: string, enum: [pazarlama, operasyonel] }
        user_id: { type: string, format: uuid, nullable: true }
        user_ad: { type: string, nullable: true }
        hedef:
          type: string
          description: >
            Gonderildigi ADRES/NUMARA — kullanici sonradan degistirse bile
            "nereye gonderdik" cevaplanabilmeli.
        konu: { type: string, nullable: true }
        govde:
          type: string
          description: >
            **COZULMUS metin** (etiketler yerine konmus hali). Sablona
            referans YETMEZ: sablon sonradan degistirilirse gecmis kayit
            "ne gonderdik" sorusuna YANLIS cevap verirdi — bu bir KVKK ve
            hukuk sorusudur (bildirim kaniti).
        durum: { type: string, enum: [kuyrukta, gonderildi, iletildi, okundu, basarisiz] }
        hata: { type: string, nullable: true }
        saglayici: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    RaporParametre:
      type: object
      description: >
        Parametre modali — **TEK MODEL**, her rapor alt kumesini kullanir.
        Rapor basina ayri model, modal bileseninin her rapor icin yeniden
        yazilmasi olurdu.
      properties:
        baslangic: { type: string, format: date, nullable: true }
        bitis: { type: string, format: date, nullable: true }
        tazminat_tarihi:
          type: string
          format: date
          nullable: true
          description: >
            Gecikme tazminatinin HANGI TARIHE gore hesaplanacagi. Ayri alan
            olmasi sart: donem raporunu BUGUNUN tazminatiyla almak isteyen
            yonetim var. Verilmezse `bitis`, o da yoksa bugun.
        blok: { type: string, nullable: true }
        gelir_gider_tanim_id: { type: string, format: uuid, nullable: true }
        listeleme_tipi:
          type: string
          nullable: true
          maxLength: 30
          description: "Raporun anlamlandirdigi anahtar (orn. borclu | alacakli)"
        min_tutar_kurus:
          type: integer
          format: int64
          nullable: true
          description: SINIRLAR DAHIL (100 TL borclu "en az 100 TL" listesinde OLMALI)
        max_tutar_kurus: { type: integer, format: int64, nullable: true }
        siralama: { type: string, nullable: true, maxLength: 30 }
        ismi_goster:
          type: boolean
          default: true
          description: >
            **KVKK**: `false` iken ad SUTUNU da kalkar (degeri bosaltmak
            yetmez — bos sutun "adi neden yok" sorusunu dogururdu). Kapiya
            asilacak listede ad OLMAMALI.
        icradakileri_goster: { type: boolean, default: true }
        kasa_id: { type: string, format: uuid, nullable: true }
        firma_id: { type: string, format: uuid, nullable: true }
        user_id: { type: string, format: uuid, nullable: true }
        unit_id: { type: string, format: uuid, nullable: true }
        olusturan_user_id: { type: string, format: uuid, nullable: true }
        bolum: { type: string, nullable: true, maxLength: 40 }
        ekstre_turu: { type: string, nullable: true, maxLength: 20 }
        evrak_tipi: { type: string, nullable: true, maxLength: 20 }
        calisma_sekli: { type: string, nullable: true, maxLength: 20 }
        gelir_gider_tanim_idler:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
          description: >
            Brief "bes ayri alan" diyor — o bir MODAL YERLESIMIDIR; veri bir
            LISTEDIR. Bes ayri alan adi acmak, altincisi istendiginde
            sozlesmeyi degistirmek zorunda birakirdi.
        baslangic_ay: { type: integer, minimum: 1, maximum: 12, nullable: true }
        baslangic_yil: { type: integer, minimum: 2000, maximum: 2200, nullable: true }
        bitis_ay: { type: integer, minimum: 1, maximum: 12, nullable: true }
        bitis_yil: { type: integer, minimum: 2000, maximum: 2200, nullable: true }
        imza: { type: boolean, default: false }
        aciklamalari_goster: { type: boolean, default: true }
        evrak_bilgisi_goster: { type: boolean, default: true }
        grup_goster: { type: boolean, default: false }
    RaporSutun:
      type: object
      required: [anahtar, baslik]
      properties:
        anahtar: { type: string }
        baslik: { type: string }
        tip: { type: string, enum: [metin, kurus, tarih, sayi], default: metin }
    RaporTablo:
      type: object
      required: [kod, baslik, sutunlar, satirlar]
      properties:
        kod: { type: string }
        baslik: { type: string }
        sutunlar:
          type: array
          items: { $ref: "#/components/schemas/RaporSutun" }
        satirlar:
          type: array
          items: { type: object, additionalProperties: true }
        toplamlar:
          type: object
          additionalProperties: true
          description: Sutun basina alt toplam (Excel/PDF'te kalin satir)
        metin:
          type: string
          nullable: true
          description: >
            Serbest metin bolumu — yaslandirma ozeti, ihtar govdesi, denetim
            notu. Tablo sablonuna sikistirilmadi: ihtar bir YAZIDIR ve
            hucrelere bolunurdu.
    RaporKatalogOgesi:
      type: object
      required: [kod, baslik, aciklama, kategori, alanlar, agir]
      properties:
        kod: { type: string }
        baslik: { type: string }
        aciklama: { type: string }
        kategori:
          type: string
          enum: [listeler, ekstreler, dokumler]
          description: Kart izgarasinin bolumu (P167 §5).
        alanlar:
          type: array
          items: { type: string }
          description: >
            Bu raporun ANLAMLANDIRDIGI `RaporParametre` alanlari. Modal
            yalniz bunlari cizer, sunucu yalniz bunlari okur. Istemcide
            ikinci bir liste tutulsaydi, bir rapora yeni suzgec
            eklendiginde iki yer ayrisir ve kusur SESSIZ olurdu: alan
            cizilir, sunucu yok sayar, kullanici ancak ciktiya bakip anlar.
        agir:
          type: boolean
          description: >
            Tum defteri tarayan rapor mu? Istemci bunlari senkron uc yerine
            `/raporlar/{kod}/kuyruk`a yollar. OLCUYU SUNUCU BILIR: istemcide
            olsaydi, yeni bir agir rapor eklendiginde arayuz onu senkron
            cagirmaya devam ederdi.
        grafik:
          nullable: true
          description: "(P181 8) Grafik yapilandirmasi (web/PDF/Excel tek kaynak); yoksa yalniz tablo."
          allOf: [{ $ref: "#/components/schemas/RaporGrafikTanimi" }]
    RaporGrafikTanimi:
      type: object
      required: [tip, x, seriler]
      properties:
        tip: { type: string, enum: [cizgi, sutun, pasta] }
        x: { type: string, description: "x ekseni sutun kimligi" }
        seriler:
          type: array
          items: { type: string }
          description: "y serileri (sutun kimlikleri)"
    RaporKatalog:
      type: object
      required: [items, kategoriler]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RaporKatalogOgesi" }
        kategoriler:
          type: array
          items: { type: string }
          description: >
            Kategori SIRASI — brief §5'in sirasi. Alfabetik siralamak
            "Listeler"i "Dokumler"in altina duserirdi.
    RaporIs:
      type: object
      required: [id, kod, bicim, durum, created_at]
      description: >
        Arka planda uretilen rapor isi. `dosya_key` DONMEZ: obje anahtari
        istemciye verilmez (avatar ve duyuru gorseliyle ayni kural);
        indirme ayri bir uctan alinan kisa omurlu presigned URL ile yapilir.
      properties:
        id: { type: string, format: uuid }
        kod: { type: string }
        bicim: { type: string, enum: [excel, pdf] }
        durum: { type: string, enum: [bekliyor, uretiliyor, hazir, hata] }
        dosya_adi: { type: string, nullable: true }
        hata:
          type: string
          nullable: true
          description: KULLANICIYA gosterilecek kisa hata kimligi — yigin izi DEGIL.
        created_at: { type: string, format: date-time }
        biten_at: { type: string, format: date-time, nullable: true }
    OdemeBilgileri:
      type: object
      required: [odeme_kodu, borc_kurus, kart_aktif]
      properties:
        iban:
          type: string
          nullable: true
          description: Anlasmali banka kasasinin IBAN'i; yoksa null (havale gizlenir)
        banka_adi: { type: string, nullable: true }
        odeme_kodu:
          type: string
          pattern: "^TS-[A-Z2-9]{6}$"
          description: Havale aciklamasina yazilacak BENZERSIZ kod (sabit)
        borc_kurus: { type: integer, format: int64 }
        kart_aktif:
          type: boolean
          description: >
            Saglayici yapilandirilmis mi. Manuel saglayici "kart" DEGILDIR —
            secenegi acmak sakini calismayan bir akisa sokardi.
    KartOdemeSonuc:
      type: object
      required: [durum]
      properties:
        durum: { type: string, example: basarili }
        odeme_url:
          type: string
          nullable: true
          description: Doluysa istemci 3D akisina yonlendirir
        hareket_id:
          type: string
          format: uuid
          nullable: true
          description: Aninda basarili ise yazilan tahsilat hareketi
    FinansalHareket:
      type: object
      description: >
        TEK DEFTER kaydi. **TUTAR HER ZAMAN POZITIF**; isaret `yon`dadir —
        negatif tutar saklamak "iade" ile "eksi gider"i ayirt edilemez
        kilardi.
      required: [id, tip, yon, tutar_kurus, tarih, created_at]
      properties:
        id: { type: string, format: uuid }
        tip: { type: string, enum: [tahsilat, gider, gelir, virman, iade, acilis] }
        yon: { type: string, enum: [giris, cikis] }
        tutar_kurus: { type: integer, format: int64, minimum: 1 }
        tarih: { type: string, format: date }
        kasa_id: { type: string, format: uuid, nullable: true }
        kasa_ad: { type: string, nullable: true }
        user_id: { type: string, format: uuid, nullable: true }
        user_ad: { type: string, nullable: true }
        unit_id: { type: string, format: uuid, nullable: true }
        firma_id: { type: string, format: uuid, nullable: true }
        gelir_gider_tanim_id: { type: string, format: uuid, nullable: true }
        assessment_id: { type: string, format: uuid, nullable: true }
        belge_no:
          type: string
          nullable: true
          maxLength: 50
          description: >
            (P167 Asama 4) BOS BIRAKILIRSA MERKEZI SERIDEN uretilir
            (`GID-2026-000045` gibi; bkz. app/belge_no.py + goc 0058).
            Kullanicinin yazdigi numara EZILMEZ — elinde gercek bir fatura
            numarasi olabilir. Tenant icinde benzersizdir
            (`uq_hareket_belge_no`); var olan bir numara elle yazilirsa
            istek 409 doner.
        aciklama: { type: string, nullable: true }
        virman_grup_id:
          type: string
          format: uuid
          nullable: true
          description: Virmanin IKI satirini eslestirir
        iade_edilen_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Iade edilen hareket — "hangi tahsilat iade edildi" sorusu
            aciklama metnine birakilamaz.
        durum:
          type: string
          enum: [odendi, bekliyor, onay_bekliyor]
          default: odendi
          description: >
            (P167 Asama 2, goc 0056) GERCEKLESME DURUMU. Varsayilan `odendi`
            OLMAK ZORUNDA: tabloda duran her satir zaten gerceklesmis bir
            para hareketidir (kasa bakiyesi onlardan hesaplaniyor) ve baska
            bir varsayilan, gecmis butun defteri bir gecede "odenmemis"
            gostermek olurdu.
        created_at: { type: string, format: date-time }
    FinansalHareketListe:
      type: object
      required: [meta, items]
      properties:
        meta: { $ref: "#/components/schemas/PageMeta" }
        items:
          type: array
          items: { $ref: "#/components/schemas/FinansalHareket" }
    YaslandirmaDaire:
      type: object
      required: [unit_id, unit_no, en_eski_gun, kova, kalan_kurus]
      properties:
        unit_id: { type: string, format: uuid }
        unit_no: { type: string }
        en_eski_gun: { type: integer }
        kova: { type: string }
        kalan_kurus: { type: integer, format: int64 }
        borclu_ad: { type: string, nullable: true }
        borclu_user_id: { type: string, format: uuid, nullable: true }
    Yaslandirma:
      type: object
      required: [kovalar, toplam_kalan_kurus, toplam_daire]
      properties:
        kovalar:
          type: array
          items:
            type: object
            required: [kova, daire, kalan_kurus]
            properties:
              kova: { type: string }
              daire: { type: integer }
              kalan_kurus: { type: integer, format: int64 }
              daireler:
                type: array
                items: { $ref: "#/components/schemas/YaslandirmaDaire" }
        toplam_kalan_kurus: { type: integer, format: int64 }
        toplam_daire: { type: integer }
    TahsilatGostergesi:
      type: object
      required: [donem, tahakkuk_kurus, tahsilat_kurus, onceki_donem]
      properties:
        donem: { type: string }
        tahakkuk_kurus: { type: integer, format: int64 }
        tahsilat_kurus: { type: integer, format: int64 }
        oran_yuzde: { type: integer, nullable: true }
        onceki_donem: { type: string }
        onceki_oran_yuzde: { type: integer, nullable: true }
        degisim_puan:
          type: integer
          nullable: true
          description: "Yuzde PUANI farki; null = onceki ayda tahakkuk yok"
    BorcluTopluIstek:
      type: object
      required: [unit_ids]
      properties:
        unit_ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, format: uuid }
          description: >-
            BOS BIRAKILAMAZ: "hepsi" anlamina gelen bos bir liste,
            yanlislikla butun siteye islem yapmayi bir tikla mumkun
            kilardi.
    ButceHedefiCreate:
      type: object
      required: [yil, kategori_id, tutar_kurus]
      properties:
        yil: { type: integer, minimum: 2000, maximum: 2100 }
        donem:
          type: string
          nullable: true
          description: "NULL = YILLIK hedef; dolu ('YYYY-MM') = o ayin hedefi"
        kategori_id: { type: string, format: uuid }
        tutar_kurus: { type: integer, format: int64, minimum: 0 }
        aciklama: { type: string, nullable: true, maxLength: 500 }
    ButceHedefi:
      type: object
      required: [id, yil, kategori_id, tutar_kurus, created_at]
      properties:
        id: { type: string, format: uuid }
        yil: { type: integer }
        donem: { type: string, nullable: true }
        kategori_id: { type: string, format: uuid }
        tutar_kurus: { type: integer, format: int64 }
        aciklama: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    ButceKarsilastirma:
      type: object
      required: [yil, items, hedef_gelir_kurus, hedef_gider_kurus,
                 gerceklesen_gelir_kurus, gerceklesen_gider_kurus]
      properties:
        yil: { type: integer }
        donem: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            required: [ad, tip, hedef_kurus, gerceklesen_kurus, sapma_kurus]
            properties:
              kategori_id: { type: string, format: uuid, nullable: true }
              ad: { type: string }
              tip: { type: string, enum: [gelir, gider] }
              hedef_kurus: { type: integer, format: int64 }
              gerceklesen_kurus: { type: integer, format: int64 }
              sapma_kurus:
                type: integer
                format: int64
                description: >-
                  gerceklesen - hedef. GIDERDE POZITIF = butce asildi;
                  GELIRDE POZITIF = hedefin uzerinde gelir.
              sapma_yuzde: { type: integer, nullable: true }
        hedef_gelir_kurus: { type: integer, format: int64 }
        hedef_gider_kurus: { type: integer, format: int64 }
        gerceklesen_gelir_kurus: { type: integer, format: int64 }
        gerceklesen_gider_kurus: { type: integer, format: int64 }
    Makbuz:
      type: object
      required: [id, belge_no, tutar_kurus, created_at]
      properties:
        id: { type: string, format: uuid }
        belge_no: { type: string }
        tutar_kurus: { type: integer, format: int64 }
        unit_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        pdf_url:
          type: string
          nullable: true
          description: "Kisa omurlu indirme adresi (presign); SAKLANMAZ"
    AidatPlaniCreate:
      type: object
      required: [ad, gelir_gider_tanim_id]
      properties:
        ad: { type: string, maxLength: 100 }
        gelir_gider_tanim_id:
          type: string
          format: uuid
          description: >-
            ZORUNLU: dagitim hedefi ve borcun KIME yazilacagi
            (kiraci/malik) tanimdan gelir.
        kalem_tipi:
          type: string
          enum: [aidat, demirbas, olaganustu, sayac, diger]
        dagitim:
          type: string
          enum: [daire_basina, esit, arsa_payi, metrekare]
        tutar_kurus: { type: integer, format: int64, nullable: true, minimum: 1 }
        toplam_tutar_kurus: { type: integer, format: int64, nullable: true, minimum: 1 }
        tahakkuk_gunu:
          type: integer
          minimum: 1
          maximum: 28
          description: >-
            1..28 — 29/30/31 her ayda YOKTUR ve "ayin 31'i" kurali
            Subat'ta sessizce hic calismazdi.
        vade_gun: { type: integer, minimum: 0, maximum: 90 }
        onizleme_gun: { type: integer, minimum: 0, maximum: 28 }
        aktif: { type: boolean }
        aciklama: { type: string, nullable: true, maxLength: 500 }
    AidatPlaniUpdate:
      type: object
      properties:
        ad: { type: string, maxLength: 100 }
        kalem_tipi: { type: string, enum: [aidat, demirbas, olaganustu, sayac, diger] }
        dagitim: { type: string, enum: [daire_basina, esit, arsa_payi, metrekare] }
        tutar_kurus: { type: integer, format: int64, nullable: true, minimum: 1 }
        toplam_tutar_kurus: { type: integer, format: int64, nullable: true, minimum: 1 }
        tahakkuk_gunu: { type: integer, minimum: 1, maximum: 28 }
        vade_gun: { type: integer, minimum: 0, maximum: 90 }
        onizleme_gun: { type: integer, minimum: 0, maximum: 28 }
        aktif: { type: boolean }
        aciklama: { type: string, nullable: true, maxLength: 500 }
    AidatPlani:
      # `allOf` KULLANILMADI ve bu bilincli: sozlesme kapisi (panel testi)
      # bilesik semalarin ZORUNLU alanlarini goremiyor ve arayuzun
      # okudugu `id`/`son_donem` gibi alanlari "vaat edilmemis" sayiyor.
      # Duz sema, sozlesmeyi okuyan ARACLAR icin de daha durustur.
      type: object
      required: [id, ad, gelir_gider_tanim_id, tahakkuk_gunu, aktif, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, maxLength: 100 }
        gelir_gider_tanim_id: { type: string, format: uuid }
        kalem_tipi:
          type: string
          enum: [aidat, demirbas, olaganustu, sayac, diger]
        dagitim:
          type: string
          enum: [daire_basina, esit, arsa_payi, metrekare]
        tutar_kurus: { type: integer, format: int64, nullable: true }
        toplam_tutar_kurus: { type: integer, format: int64, nullable: true }
        tahakkuk_gunu: { type: integer, minimum: 1, maximum: 28 }
        vade_gun: { type: integer, minimum: 0, maximum: 90 }
        onizleme_gun: { type: integer, minimum: 0, maximum: 28 }
        aktif: { type: boolean }
        aciklama: { type: string, nullable: true }
        son_donem:
          type: string
          nullable: true
          description: >-
            Islenen SON donem — IDEMPOTENCY DAMGASI. Gorev gunde on kez
            kossa da ayni donemi ikinci kez islemez.
        onizleme_donem: { type: string, nullable: true }
        ertelenen_donem: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    HatirlatmaAyari:
      type: object
      required: [aktif, vade_oncesi_gun, kademeler]
      properties:
        aktif: { type: boolean }
        vade_oncesi_gun:
          type: integer
          minimum: 0
          maximum: 30
          description: "0 = vade oncesi hatirlatma yok"
        kademeler:
          type: array
          description: "Vade GECTIKTEN sonra kac gun sonra hatirlatilacagi"
          items: { type: integer }
        metin:
          type: string
          nullable: true
          description: >-
            NULL = urun varsayilani (cok dilli). Metin girilirse O KULLANILIR
            ve CEVRILMEZ: yoneticinin yazdigi cumleyi makineyle degistirmek,
            onun soylemedigi bir seyi ona soyletmek olurdu. `{tutar}` ve
            `{vade}` alanlari doldurulur; bilinmeyen bir alan yazilmissa
            metin OLDUGU GIBI gonderilir (bicimlendirme hatasi yuzunden
            hic gondermemek en kotu sonuc olurdu).
        son_calisma: { type: string, format: date, nullable: true }
    HatirlatmaAyariUpdate:
      type: object
      properties:
        aktif: { type: boolean }
        vade_oncesi_gun: { type: integer, minimum: 0, maximum: 30 }
        kademeler:
          type: array
          maxItems: 6
          items: { type: integer, minimum: 0, maximum: 365 }
        metin: { type: string, nullable: true, maxLength: 1000 }
    DuzenliGiderCreate:
      type: object
      required: [ad, tutar_kurus, sonraki_tarih]
      properties:
        ad: { type: string, maxLength: 100 }
        tutar_kurus: { type: integer, format: int64, minimum: 1 }
        periyot: { type: string, enum: [aylik, uc_aylik, alti_aylik, yillik] }
        sonraki_tarih: { type: string, format: date }
        kasa_id: { type: string, format: uuid, nullable: true }
        firma_id: { type: string, format: uuid, nullable: true }
        gelir_gider_tanim_id: { type: string, format: uuid, nullable: true }
        otomatik_onay:
          type: boolean
          description: >-
            VARSAYILAN false: vadesi gelen gider ONAY BEKLEYEN yazilir.
            Otomatik "odendi" yazmak, sistemin kimseye sormadan kasadan
            para cikarmasi olurdu.
        aktif: { type: boolean }
        aciklama: { type: string, nullable: true, maxLength: 500 }
    DuzenliGiderUpdate:
      type: object
      properties:
        ad: { type: string, maxLength: 100 }
        tutar_kurus: { type: integer, format: int64, minimum: 1 }
        periyot: { type: string, enum: [aylik, uc_aylik, alti_aylik, yillik] }
        sonraki_tarih: { type: string, format: date }
        kasa_id: { type: string, format: uuid, nullable: true }
        firma_id: { type: string, format: uuid, nullable: true }
        gelir_gider_tanim_id: { type: string, format: uuid, nullable: true }
        otomatik_onay: { type: boolean }
        aktif: { type: boolean }
        aciklama: { type: string, nullable: true, maxLength: 500 }
    DuzenliGider:
      # `allOf` KULLANILMADI — gerekce `AidatPlani`de.
      type: object
      required: [id, ad, tutar_kurus, periyot, sonraki_tarih, aktif, created_at]
      properties:
        id: { type: string, format: uuid }
        ad: { type: string, maxLength: 100 }
        tutar_kurus: { type: integer, format: int64 }
        periyot: { type: string, enum: [aylik, uc_aylik, alti_aylik, yillik] }
        sonraki_tarih: { type: string, format: date }
        kasa_id: { type: string, format: uuid, nullable: true }
        firma_id: { type: string, format: uuid, nullable: true }
        gelir_gider_tanim_id: { type: string, format: uuid, nullable: true }
        otomatik_onay: { type: boolean }
        aktif: { type: boolean }
        aciklama: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    OtomasyonGunluk:
      type: object
      required: [id, tur, calisma_zamani, adet, tutar_kurus]
      properties:
        id: { type: string, format: uuid }
        tur:
          type: string
          enum: [aidat_tahakkuk, aidat_onizleme, borc_hatirlatma,
                 duzenli_gider, gecikme_faizi, aylik_ozet]
        calisma_zamani: { type: string, format: date-time }
        donem: { type: string, nullable: true }
        adet: { type: integer }
        tutar_kurus: { type: integer, format: int64 }
        sonuc:
          type: object
          additionalProperties: true
          description: >-
            Her otomasyonun ozeti farklidir; ture ozel sutunlar acmak,
            besinci otomasyonda tabloyu yeniden sekillendirmek demekti.
    GecikmeFaizSatiri:
      type: object
      required: [assessment_id, unit_id, unit_no, donem, kalan_kurus,
                 toplam_faiz_kurus, yazilmis_kurus, fark_kurus]
      properties:
        assessment_id: { type: string, format: uuid }
        unit_id: { type: string, format: uuid }
        unit_no: { type: string }
        donem: { type: string, example: "2026-03" }
        son_odeme_tarihi: { type: string, format: date, nullable: true }
        kalan_kurus: { type: integer, format: int64 }
        toplam_faiz_kurus:
          type: integer
          format: int64
          description: "O ana kadar BIRIKMIS toplam faiz"
        yazilmis_kurus:
          type: integer
          format: int64
          description: "Daha once faiz kalemi olarak yazilmis tutar"
        fark_kurus:
          type: integer
          format: int64
          description: "Bu kosumda YAZILACAK tutar (toplam - yazilmis)"
    GecikmeFaizOnizleme:
      type: object
      required: [donem, uygulaniyor, aylik_yuzde, toplam_fark_kurus, items]
      properties:
        donem: { type: string }
        uygulaniyor:
          type: boolean
          description: "Tesis gecikme faizi uyguluyor mu (tenant ayari)"
        aylik_yuzde: { type: number }
        toplam_fark_kurus: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/GecikmeFaizSatiri" }
    GecikmeFaizSonuc:
      type: object
      required: [donem, yazilan, toplam_kurus, items]
      properties:
        donem: { type: string }
        yazilan: { type: integer }
        toplam_kurus: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/GecikmeFaizSatiri" }
    TahakkukTersKayitIstek:
      type: object
      properties:
        aciklama: { type: string, nullable: true, maxLength: 500 }
    TahakkukAtlanan:
      # (P192 §3.2) Onceden yalnizca bir SAYI donuyordu ve atlanan satir
      # sessizce kayboluyordu; yonetici eksik tahakkuk yaptigini fark
      # etmiyordu.
      type: object
      required: [unit_id, neden]
      properties:
        unit_id: { type: string, format: uuid }
        unit_no: { type: string, nullable: true }
        neden:
          type: string
          example: "arsa_payi_girilmemis"
    HareketOnayIstek:
      # (P192 §2.3) Onay/red govdesi. `aciklama` redde anlamlidir ("neden
      # reddedildi") ama onayda da serbesttir; ayri iki sema yazmak ayni
      # akisi iki yerde tanimlamak olurdu.
      type: object
      properties:
        aciklama: { type: string, nullable: true, maxLength: 500 }
    TahsilatCreate:
      type: object
      required: [kasa_id, tutar_kurus]
      properties:
        user_id: { type: string, format: uuid, nullable: true }
        unit_id: { type: string, format: uuid, nullable: true }
        assessment_id: { type: string, format: uuid, nullable: true }
        kasa_id: { type: string, format: uuid }
        tutar_kurus: { type: integer, format: int64, minimum: 1 }
        tarih: { type: string, format: date, nullable: true }
        belge_no: { type: string, nullable: true, maxLength: 50 }
        aciklama: { type: string, nullable: true, maxLength: 500 }
        donem:
          type: string
          nullable: true
          maxLength: 7
          example: "2026-06"
          description: "(P192) Muhasebe donemi; verilmezse assessment'tan turer"
        yontem:
          allOf: [{ $ref: "#/components/schemas/DuesYontem" }]
          nullable: true
          description: "(P192) Paranin nasil alindigi; varsayilan 'elden'"
    TopluTahsilatSatir:
      type: object
      required: [tutar_kurus]
      properties:
        user_id: { type: string, format: uuid, nullable: true }
        unit_id: { type: string, format: uuid, nullable: true }
        assessment_id: { type: string, format: uuid, nullable: true }
        tutar_kurus: { type: integer, format: int64, minimum: 1 }
        aciklama: { type: string, nullable: true }
        donem: { type: string, nullable: true, maxLength: 7 }
    TopluTahsilatIstek:
      type: object
      required: [kasa_id, satirlar]
      properties:
        kasa_id: { type: string, format: uuid }
        tarih: { type: string, format: date, nullable: true }
        satirlar:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/TopluTahsilatSatir" }
    HareketSatir:
      type: object
      required: [tip, tutar_kurus, kasa_id]
      properties:
        tip: { type: string, enum: [gider, gelir] }
        tutar_kurus: { type: integer, format: int64, minimum: 1 }
        kasa_id: { type: string, format: uuid }
        firma_id: { type: string, format: uuid, nullable: true }
        gelir_gider_tanim_id: { type: string, format: uuid, nullable: true }
        tarih: { type: string, format: date, nullable: true }
        belge_no: { type: string, nullable: true, maxLength: 50 }
        aciklama: { type: string, nullable: true, maxLength: 500 }
        durum:
          type: string
          enum: [odendi, bekliyor, onay_bekliyor]
          default: odendi
          description: >
            (P167 Asama 2) SATIR BAZINDA durum: ayni fiste bir kalem
            odenmis, oteki onay bekliyor olabilir. Fis basina tek durum,
            kullaniciyi fisi bolmeye zorlardi. Varsayilan `odendi` cunku
            mevcut istemcilerin ANLAMI degismemeli.
    HareketToplu:
      type: object
      required: [satirlar]
      properties:
        satirlar:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/HareketSatir" }
    VirmanIstek:
      type: object
      required: [kaynak_kasa_id, hedef_kasa_id, tutar_kurus]
      properties:
        kaynak_kasa_id: { type: string, format: uuid }
        hedef_kasa_id: { type: string, format: uuid }
        tutar_kurus: { type: integer, format: int64, minimum: 1 }
        tarih: { type: string, format: date, nullable: true }
        aciklama: { type: string, nullable: true, maxLength: 500 }
    IptalIstek:
      type: object
      description: >
        TUTAR ALINMAZ: kismi iptal diye bir sey yoktur. Kismen geri odenen
        para IADEDIR (`/finans/iade`). Iptal "bu kayit yanlis girildi"
        demektir ve yarim yanlis olmaz.
      properties:
        aciklama: { type: string, nullable: true, maxLength: 500 }
        tarih: { type: string, format: date, nullable: true }
    IadeIstek:
      type: object
      required: [hareket_id]
      properties:
        hareket_id: { type: string, format: uuid }
        tutar_kurus:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Verilmezse KALAN iade edilebilir tutarin tamami
        tarih: { type: string, format: date, nullable: true }
        aciklama: { type: string, nullable: true, maxLength: 500 }
    AcilisFisi:
      type: object
      required: [kasa_id, yon, tutar_kurus]
      properties:
        kasa_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, nullable: true }
        yon: { type: string, enum: [giris, cikis] }
        tutar_kurus: { type: integer, format: int64, minimum: 1 }
        tarih: { type: string, format: date, nullable: true }
        aciklama: { type: string, nullable: true, maxLength: 500 }
    KasaBakiye:
      type: object
      required: [kasa_id, kod, ad, acilis_bakiye_kurus, hareket_kurus, bakiye_kurus]
      properties:
        kasa_id: { type: string, format: uuid }
        kod: { type: string }
        ad: { type: string }
        acilis_bakiye_kurus: { type: integer, format: int64 }
        hareket_kurus: { type: integer, format: int64 }
        bakiye_kurus: { type: integer, format: int64 }
        banka_mi:
          type: boolean
          description: "(P192 §2.1) Kasa mi banka hesabi mi — ayrim gorunur olmali"
        iban: { type: string, nullable: true }
        bekleyen_cikis_kurus:
          type: integer
          format: int64
          description: >-
            (P192 §2.2) Onay bekleyen/gerceklesmemis CIKIS. Bakiyeye DAHIL
            DEGIL: onceden bakiyeyi simdiden dusuruyordu.
        bekleyen_giris_kurus: { type: integer, format: int64 }
    KasaBakiyeResponse:
      type: object
      required: [items, genel_toplam_kurus]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/KasaBakiye" }
        genel_toplam_kurus: { type: integer, format: int64 }
    BankaSatirIn:
      type: object
      required: [satir_no, aciklama, tutar_kurus]
      properties:
        satir_no: { type: integer }
        aciklama: { type: string, maxLength: 500 }
        tutar_kurus: { type: integer, format: int64, minimum: 1 }
    BankaEslestirIstek:
      type: object
      required: [satirlar]
      properties:
        satirlar:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/BankaSatirIn" }
    BankaEslestirOneri:
      type: object
      required: [satir_no, guven, neden]
      properties:
        satir_no: { type: integer }
        user_id: { type: string, format: uuid, nullable: true }
        user_ad: { type: string, nullable: true }
        assessment_id: { type: string, format: uuid, nullable: true }
        guven:
          type: integer
          minimum: 0
          maximum: 100
          description: 0 = oneri yok
        neden:
          type: string
          description: |
            `odeme_kodu` (P30 — KESIN, guven 100) / ad / soyad /
            tutar_tam / tutar_kismi / belirsiz / eslesme_yok.
            **Kod HER SEYI EZER**: ad/tutar tahminine sonra bakmak,
            kodu dogru yazmis bir sakini "belirsiz" saymak olurdu.
    BankaEslestirSonuc:
      type: object
      required: [oneriler]
      properties:
        oneriler:
          type: array
          items: { $ref: "#/components/schemas/BankaEslestirOneri" }
    IcraDosyasi:
      type: object
      description: >
        Hukuki surec kaydi — PARA HAREKETI DEGIL. Borclar `dues_assessment`ta
        durur ve buraya KOPYALANMAZ: iki yerde tutulan borc, biri guncellenip
        digeri unutuldugunda hangi rakamin dogru oldugunu belirsiz birakirdi.
      required: [id, dosya_no, user_id, durum, created_at]
      properties:
        id: { type: string, format: uuid }
        dosya_no: { type: string, maxLength: 50 }
        user_id: { type: string, format: uuid }
        user_ad: { type: string, nullable: true }
        veris_tarihi: { type: string, format: date, nullable: true }
        avukat: { type: string, nullable: true }
        durum: { type: string, enum: [baginiz, beklemede, avukatta, mahkemede, kapandi] }
        aciklama: { type: string, nullable: true }
        acik_borc_kurus:
          type: integer
          format: int64
          description: ANLIK okunur (kopyalanmaz)
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IcraDosyasiCreate:
      type: object
      required: [dosya_no, user_id]
      properties:
        dosya_no: { type: string, minLength: 1, maxLength: 50 }
        user_id: { type: string, format: uuid }
        veris_tarihi: { type: string, format: date, nullable: true }
        avukat: { type: string, nullable: true, maxLength: 150 }
        durum: { type: string, enum: [baginiz, beklemede, avukatta, mahkemede, kapandi], default: beklemede }
        aciklama: { type: string, nullable: true, maxLength: 1000 }
    IcraDosyasiUpdate:
      type: object
      minProperties: 1
      properties:
        dosya_no: { type: string, minLength: 1, maxLength: 50 }
        veris_tarihi: { type: string, format: date, nullable: true }
        avukat: { type: string, nullable: true, maxLength: 150 }
        durum: { type: string, enum: [baginiz, beklemede, avukatta, mahkemede, kapandi] }
        aciklama: { type: string, nullable: true, maxLength: 1000 }
    FinansOzet:
      type: object
      required: [borclandirilan_ay_kurus, tahsil_edilen_ay_kurus, acik_borc_kurus, kasa_toplam_kurus, icra_acik_dosya]
      properties:
        borclandirilan_ay_kurus: { type: integer, format: int64 }
        tahsil_edilen_ay_kurus: { type: integer, format: int64 }
        acik_borc_kurus:
          type: integer
          format: int64
          description: Sakinlerin siteye borcu (ALACAKLARIMIZ).
        kasa_toplam_kurus: { type: integer, format: int64 }
        borc_kurus:
          type: integer
          format: int64
          default: 0
          description: >
            (P167 §2.2) "BORCLARIM" — sitenin firmalara ODENMEMIS gideri.
            `acik_borc_kurus`un aynasi DEGIL TERSI: o sakinin bize borcu,
            bu bizim disariya borcumuz. Ikisini tek kartta toplamak kimin
            kime borclu oldugunu okunamaz kilardi. Ters kayitla iptal
            edilmis satirlar DISARIDA (iptal bir duzeltmedir, borc degil).
        onay_bekleyen_adet:
          type: integer
          default: 0
          description: >
            Onay bekleyen hareket ADEDI — tutar degil. Yonetici burada "ne
            kadar" degil "kac is bekliyor" sorusunu soruyor.
        odenmis_fatura_ay_kurus:
          type: integer
          format: int64
          default: 0
          description: >
            Bu ay odenmis gider toplami. HAREKET TARIHINE gore, kayit
            zamanina gore DEGIL: gecen ayin faturasi bu ay girilmis
            olabilir ve onu bu ayin gideri saymak defterle celisirdi.
        icra_acik_dosya: { type: integer }
    TopluBorcSuzgec:
      type: object
      description: >
        Hedef suzgeci. `unit_ids` verilirse **suzgeci EZER** (elle secim):
        kullanici tek tek sectiyse blok/tip kisitlarini ayrica uygulamak
        "sectigim daire neden yok" uretirdi.
      properties:
        blok: { type: string, nullable: true }
        unit_tip_id: { type: string, format: uuid, nullable: true }
        unit_grup_id: { type: string, format: uuid, nullable: true }
        unit_ids:
          type: array
          nullable: true
          items: { type: string, format: uuid }
    TopluBorcIstek:
      type: object
      required: [donem, gelir_gider_tanim_id]
      properties:
        donem: { type: string, maxLength: 7, example: "2026-07" }
        gelir_gider_tanim_id: { type: string, format: uuid }
        suzgec: { $ref: "#/components/schemas/TopluBorcSuzgec" }
        tutar_kurus:
          type: integer
          nullable: true
          minimum: 1
          description: >
            Verilirse HER daireye bu tutar; verilmezse P26'nin TIP
            VARSAYILANI kullanilir.
        yedek_tutar_kurus:
          type: integer
          nullable: true
          minimum: 1
          description: Tipi/tutari olmayan daireler icin yedek
        son_odeme_tarihi: { type: string, format: date, nullable: true }
        tarih: { type: string, format: date, nullable: true }
        aciklama: { type: string, nullable: true, maxLength: 500 }
        gecikme_uygula: { type: boolean, default: true }
    TopluBorcSatir:
      type: object
      required: [unit_id, unit_no]
      properties:
        unit_id: { type: string, format: uuid }
        unit_no: { type: string }
        tutar_kurus: { type: integer, nullable: true }
        hedef_user_id: { type: string, format: uuid, nullable: true }
        hedef_ad: { type: string, nullable: true }
        atlama_nedeni:
          type: string
          nullable: true
          description: Dolu ise bu satir ISLENMEZ (orn. tutar_cozulemedi)
    TopluBorcOnizleme:
      type: object
      required: [satirlar, islenecek, atlanacak, toplam_kurus]
      properties:
        satirlar:
          type: array
          items: { $ref: "#/components/schemas/TopluBorcSatir" }
        islenecek: { type: integer }
        atlanacak: { type: integer }
        toplam_kurus: { type: integer, format: int64 }
    SayacBorcIstek:
      type: object
      required: [donem, gelir_gider_tanim_id, ana_sayac_id, ana_tuketim, birim_fiyat_kurus, bolum_tuketimleri]
      properties:
        donem: { type: string, maxLength: 7 }
        gelir_gider_tanim_id: { type: string, format: uuid }
        ana_sayac_id: { type: string, format: uuid }
        ana_tuketim: { type: number, format: double, minimum: 0 }
        birim_fiyat_kurus: { type: integer, minimum: 1, description: "Birim fiyat, KURUS" }
        bolum_tuketimleri:
          type: object
          description: "daire sayac id -> donem tuketimi"
          additionalProperties: { type: number, format: double }
        son_odeme_tarihi: { type: string, format: date, nullable: true }
        tarih: { type: string, format: date, nullable: true }
        aciklama: { type: string, nullable: true, maxLength: 500 }
    BorcIceAktarimSatir:
      type: object
      required: [satir_no, unit_no]
      properties:
        satir_no: { type: integer, description: Kaynak dosyadaki satir numarasi }
        unit_no: { type: string }
        tutar_kurus: { type: integer, nullable: true }
        aciklama: { type: string, nullable: true }
    BorcIceAktarimIstek:
      type: object
      required: [donem, gelir_gider_tanim_id, satirlar]
      properties:
        donem: { type: string, maxLength: 7 }
        gelir_gider_tanim_id: { type: string, format: uuid }
        satirlar:
          type: array
          items: { $ref: "#/components/schemas/BorcIceAktarimSatir" }
