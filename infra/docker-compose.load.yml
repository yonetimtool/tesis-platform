# P39 — yuk testi katmani. Ana compose'a EK olarak kullanilir; normal
# `up` ile HIC baslamaz (profil + run --rm).
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.load.yml \
#     run --rm k6 run /load/senaryo.js
services:
  k6:
    image: grafana/k6:latest
    profiles: ["load"]
    # api ile AYNI AGDA: olcum internete cikmaz, ag gecikmesi girmez.
    depends_on:
      api:
        condition: service_started
    environment:
      API_BASE: http://api:8000
      TENANT_SLUG: ${LOAD_TENANT_SLUG:-acme-plaza}
      VUS: ${LOAD_VUS:-10}
      SURE: ${LOAD_SURE:-40s}
    volumes:
      - ./load:/load:ro
