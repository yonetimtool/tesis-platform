# SENTETIK RTSP kaynagi. `runOnInit` mediamtx acilirken ffmpeg'i baslatir:
# hareketli bir test deseni (yatay kayan cubuklar) -> Frigate'in HAREKET
# dedektoru bunu gorur. NESNE/PLAKA tespiti icin GERCEK goruntu gerekir
# (bkz. docs/frigate-poc.md "olculemeyen").
logLevel: info
rtspTransports: [tcp]
paths:
  kapi:
    runOnInit: >
      ffmpeg -re -f lavfi -i "testsrc=size=1280x720:rate=10"
      -f lavfi -i "anullsrc=channel_layout=mono:sample_rate=8000"
      -c:v libx264 -preset ultrafast -tune zerolatency -g 20 -pix_fmt yuv420p
      -c:a aac -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/kapi
    runOnInitRestart: yes
