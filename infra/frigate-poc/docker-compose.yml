# FRIGATE PoC (MASTER-PLAN P15) — AYRI YIGIN, prod compose'a DOKUNMAZ.
#
# Kaldirmak icin:  docker compose -f infra/frigate-poc/docker-compose.yml up -d
# Indirmek icin:   docker compose -f infra/frigate-poc/docker-compose.yml down
#   (down -v BU YIGINDA da kullanilmaz — kural: kalici hacim silinmez.)
#
# Uc servis:
#   kaynak  — mediamtx + ffmpeg: SENTETIK bir RTSP yayini uretir. Gercek
#             kamera GEREKMEZ; PoC'un ag/akis yolunu kanit gerektirmeden
#             kosabilmesi icin.
#   mqtt    — mosquitto: Frigate olaylarini YAYINLAR; PoC bunlari dinler.
#   frigate — go2rtc (restream) + detektor + API.
name: frigate-poc

services:
  kaynak:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: fpoc-kaynak
    environment:
      MTX_PROTOCOLS: tcp
      MTX_RTSPADDRESS: ":8554"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "18554:8554"

  mqtt:
    image: eclipse-mosquitto:2
    container_name: fpoc-mqtt
    volumes:
      - ./mediamtx/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "11883:1883"

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: fpoc-frigate
    depends_on: [kaynak, mqtt]
    shm_size: "128mb"
    environment:
      FRIGATE_MQTT_HOST: mqtt
    volumes:
      - ./config:/config
      - ./storage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 200000000
    ports:
      - "15000:5000"   # web arayuzu + HTTP API
      - "18555:8554"   # go2rtc RESTREAM (RTSP) — mobil oynaticinin hedefi
      - "18984:1984"   # go2rtc arayuzu (WebRTC/HLS uretimi)
