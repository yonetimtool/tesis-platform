# Yonetio — URETIM (PRODUCTION) compose.
#
# Tek Debian 13 sunucu; pfSense NAT arkasinda YALNIZ TCP 80/443 iletilir.
# Sadece `caddy` host portu yayinlar (80/443). Diger tum servisler ic agda
# (tesisnet) izole — postgres/redis/minio/api/admin-web host'a ACILMAZ.
#
# Kullanim (bkz. infra/RUNBOOK-PROD.md):
#   cd infra && cp .env.prod.example .env.prod && $EDITOR .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# SERVIS ADI VERMEYIN: argumansiz komut kod tasiyan DORT servisi de kurar.
# Bir alt kume kurmak imajla depoyu AYRISTIRIR (`contracts/` canli mount,
# `backend/app` imajda) ve yeni bir goc olmayan bir modulu arar — 2026-08'de
# ortami dusurdu (P171). Ad vermek zorundaysaniz dordunu birden yazin:
#   docker compose build migrate api admin-web worker
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm worker \
#       python -m scripts.create_admin --email you@firma.com
#   (worker, api DEGIL: OWNER_DSN yalniz worker/beat'te tanimli — api'ye
#    superuser DSN'i bilincli olarak verilmez.)
#
# NOT: seed servisi YOKTUR (prod'da demo veri uretilmez). Ilk admin
# scripts/create_admin.py ile kurulur.

name: yonetio-prod

x-tz: &tz
  TZ: ${TZ:-Europe/Istanbul}

services:
  # --------------------------------------------------------------------- #
  # Caddy — TEK genel giris. Otomatik Let's Encrypt TLS, HTTP->HTTPS,
  # api./panel./storage. alt-alanlarini ic servislere ters-proxy'ler.
  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
      - admin-web
      # (P177) Tanitim sitesi. `depends_on` yalniz BASLATMA SIRASIDIR,
      # saglik beklemez — Caddy tanitim-web'den once kalkarsa ilk istek
      # 502 alir ve saniyeler icinde duzelir. admin-web'de `depends_on`
      # bilincli olarak KALDIRILMISTI (P171) cunku orada API'nin sema
      # hatasi TUM alan adini dusuruyordu; burada oyle bir zincir yok:
      # tanitim-web hicbir servise bagimli degil.
      - tanitim-web
      - minio
    environment:
      <<: *tz
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL gerekli (Let's Encrypt bildirimleri)}
      API_DOMAIN: ${API_DOMAIN:-api.yonetio.site}
      PANEL_DOMAIN: ${PANEL_DOMAIN:-panel.yonetiyor.com}
      PANEL_DOMAIN_ESKI: ${PANEL_DOMAIN_ESKI:-panel.yonetio.site}
      PANEL_DOMAIN_IDN: ${PANEL_DOMAIN_IDN:-panel.xn--ynetiyor-n4a.com}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:-storage.yonetio.site}
      # (P120) YENI BIRINCIL ALAN — yönetiyor.com, PUNYCODE bicimiyle.
      # Unicode yazmak eslesmeyen bir site blogu birakirdi: tarayici ve
      # TLS SNI daima punycode gonderir.
      # (P149) ASIL alan adi ASCII: IDN bicimi 301 ile buraya gelir.
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-yonetiyor.com}
      PORTAL_DOMAIN_IDN: ${PORTAL_DOMAIN_IDN:-xn--ynetiyor-n4a.com}
      # ESKI kok alan — kapatilmadi. Mobil yapimin icindeki hukuki belge
      # adresleri (`https://yonetio.site/gizlilik`) buraya bakiyor.
      PORTAL_DOMAIN_ESKI: ${PORTAL_DOMAIN_ESKI:-yonetio.site}
      # (P154) TESIS CALISMA ALANI KONAGI. Varsayilan `app.<portal>` —
      # yani PROD DAVRANISI AYNEN KORUNUR. Tek seviyeli ad kullanan
      # kurulumlar (orn. Cloudflare Tunnel + ucretsiz sertifika:
      # `app-test.yonetio.site`) bunu .env'de ezer. Caddyfile'da `app.`
      # oneki SABIT yazildigi surece o adlar icin site blogu — ve
      # dolayisiyla SERTIFIKA — hic uretilmiyordu.
      APP_DOMAIN: ${APP_DOMAIN:-app.${PORTAL_DOMAIN:-yonetiyor.com}}
      APP_DOMAIN_IDN: ${APP_DOMAIN_IDN:-app.${PORTAL_DOMAIN_IDN:-xn--ynetiyor-n4a.com}}
      # (P154) TLS saglayicisi. BOS = otomatik HTTPS (prod davranisi).
      # Cloudflare Tunnel arkasinda `tls internal` verilir: ACME origin'e
      # ulasamadigi icin Let's Encrypt orada CALISMAZ (bkz. Caddyfile notu).
      # (P177) TANITIM SITESI KONAGI — VARSAYILANI BILEREK YEREL.
      #
      # `tanitim.localhost` gercek bir alan adi DEGIL ve olmasi da
      # gerekmiyor: Caddy `.localhost` adlarina ACME'ye HIC GITMEDEN
      # dahili sertifika verir. Varsayilani `test.yonetio.site` yapmak,
      # PROD Caddy'sinin test alan adi icin Let's Encrypt'e basvurmasi
      # demekti — prod DONDURULMUS ve oraya hicbir yeni istek gitmemeli.
      #
      # Test sunucusu bunu `.env.prod`da ezer: TANITIM_DOMAIN=test.yonetio.site
      TANITIM_DOMAIN: ${TANITIM_DOMAIN:-tanitim.localhost}
      # Eski yollarin (davet/gizlilik/kosullar/hesap-silme) 301 ile
      # gonderilecegi calisma alani. Bkz. Caddyfile tanitim blogu.
      TANITIM_ESKI_HEDEF: ${TANITIM_ESKI_HEDEF:-https://app-test.yonetio.site}
      CADDY_TLS: ${CADDY_TLS:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # (P120) Kok ve `app.` icin GECICI statik sayfalar. Salt-okunur.
      - ./portal:/srv/portal:ro
      - caddy_data:/data       # ACME sertifikalari/anahtarlari (KALICI olmali)
      - caddy_config:/config
    networks: [tesisnet]
    restart: unless-stopped

  # --------------------------------------------------------------------- #
  # Postgres — RLS'li ana veritabani. Host'a ACILMAZ.
  db:
    image: postgres:16
    environment:
      <<: *tz
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tesisnet]
    restart: unless-stopped

  redis:
    image: redis:7
    # AOF => broker/sonuc dayanikliligi (celery). Host'a ACILMAZ.
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      <<: *tz
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [tesisnet]
    restart: unless-stopped

  # --------------------------------------------------------------------- #
  # MinIO — foto kanit deposu. Host'a ACILMAZ; genel erisim YALNIZ Caddy
  # uzerinden storage. alt-alanindan (presigned URL host'u). Konsol kapali.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      <<: *tz
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD gerekli}
      MINIO_BROWSER: "off"   # web konsolu prod'da kapali
    volumes:
      - miniodata:/data
    # NOT: minio/minio imaji shell/curl icermez => klasik healthcheck yok;
    # minio-init asagida `until mc ...` ile hazir olana dek bekler.
    networks: [tesisnet]
    restart: unless-stopped

  # One-shot: bucket'i olusturur (private kalir; erisim presigned URL ile).
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      <<: *tz
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD gerekli}
      MINIO_BUCKET: ${MINIO_BUCKET:-tesis-foto}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "minio bekleniyor..."; sleep 1;
        done
        mc mb -p "local/$$MINIO_BUCKET" || true
        echo "bucket hazir: $$MINIO_BUCKET"
    networks: [tesisnet]
    restart: "no"

  # --------------------------------------------------------------------- #
  # Ceviri motoru — KENDI BARINDIRDIGIMIZ LibreTranslate (yayin icerigi 7 dil).
  #
  # Icerik DIS bir servise gonderilmez: tesise ait veridir. Servis yalniz ic
  # agda (tesisnet) durur — `ports:` YOKTUR, Caddy'ye de baglanmaz.
  #
  # OPERASYON NOTU: ilk kalkista argos modelleri INDIRILIR (~1-2 GB, dakikalar
  # surer) ve `ltmodels` volume'unde kalir. Disk/bellek butcesini buna gore
  # ayirin; modeller inene kadar ceviri isleri `durum='hata'` yazar ve
  # ORIJINAL metin servis edilmeye devam eder (icerik ETKILENMEZ).
  libretranslate:
    image: libretranslate/libretranslate:v1.6.1
    depends_on:
      libretranslate-init:
        condition: service_completed_successfully
    environment:
      <<: *tz
      # Yalniz mobil UI'nin 7 dili (tum dil seti GB'lar demek olurdu).
      LT_LOAD_ONLY: ${TRANSLATE_LANGS:-tr,en,ar,ru,de,fr,es}
      LT_DISABLE_WEB_UI: "true"
      LT_UPDATE_MODELS: "false"
    volumes:
      - ltmodels:/home/libretranslate/.local/share/argos-translate
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/languages').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    networks: [tesisnet]
    restart: unless-stopped

  # One-shot: model dizininin sahipligini KONTEYNER kullanicisina verir (taze
  # named volume root'a ait olur; LibreTranslate uid 1032 ile kosar ve aksi
  # halde "Permission denied" ile duser). minio-init ile ayni desen.
  libretranslate-init:
    image: alpine:3.20
    volumes:
      - ltmodels:/models
    command:
      - sh
      - -c
      - |
        chown -R 1032:65534 /models
        echo "ceviri model dizini hazir"
    networks: [tesisnet]
    restart: "no"

  # --------------------------------------------------------------------- #
  # One-shot: CANONICAL migration'lari OWNER ile uygular + app_rw rolunu kurar.
  # NOT: "kanonik" = gocler icin TEK KAYNAK /contracts/db'dir. Revizyon
  # dosyalarini YERINDE duzenleme kurali DEVRE DISI — bkz.
  # docs/MIGRATION-POLITIKASI.md (prod bir kez goc ettikten sonra yerinde
  # duzenleme ona ULASMIYOR; 0008b_uyum_yakalama tam bu yuzden gerekti).
  # (contracts + infra/scripts salt-okunur mount; kod imaja zaten bake edilmis.)
  migrate:
    build:
      context: ../backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *tz
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}@db:5432/${POSTGRES_DB}
      OWNER_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}@db:5432/${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD gerekli}
    volumes:
      - ../contracts:/contracts:ro
      - ./scripts:/scripts:ro
    command:
      - sh
      - -c
      - |
        set -e
        # (P171 duzeltme) DUSERSE EYLEME DONUK BIR MESAJ BIRAK.
        #
        # Goc dustugunde `api`, `admin-web` ve `worker` HIC BASLAMAZ
        # (ucu de buna `service_completed_successfully` ile bagli) ve
        # operator `docker ps`te HICBIR SEY goremez. Ciplak bir alembic
        # geri izlemesi bunun NEDEN oldugunu soylemez.
        hata() {
          echo "" >&2
          echo "!! GOC ZINCIRI DUSTU — api/admin-web/worker BASLAMAYACAK." >&2
          echo "   Ucu de bu servise 'service_completed_successfully' ile" >&2
          echo "   baglidir; bu yuzden ortam tamamen erisilemez gorunur." >&2
          echo "" >&2
          echo "   EN SIK NEDEN: imaj depodan ESKI. \`contracts/\` canli" >&2
          echo "   mount'tur, \`backend/\` ise imaja gomuludur — yeni goc" >&2
          echo "   dosyasi eski kodla/bagimliliklarla karsilasir." >&2
          echo "   COZUM — KANONIK KOMUT (dordunu de kurun, KISMI BUILD" >&2
          echo "   tam olarak bu hataya yol acar):" >&2
          echo "     docker compose build migrate api admin-web worker" >&2
          echo "" >&2
          echo "   Gunlukler: docker compose logs migrate" >&2
          exit 1
        }
        # `trap ... ERR` YOK: bu kabuk `sh` (busybox/dash) ve ERR tuzagi
        # bash'e ozeldir — olculdu, "trap: ERR: bad trap" verdi. Acik
        # `|| hata` hem tasinabilir hem okunur.
        echo ">> Migration'lar uygulaniyor (owner)..."
        alembic -c /contracts/db/alembic.ini upgrade head || hata
        echo ">> app_rw rolu hazirlaniyor..."
        python /scripts/setup_app_role.py
    networks: [tesisnet]
    restart: "no"

  # --------------------------------------------------------------------- #
  # API (FastAPI). Host'a ACILMAZ; Caddy api. alt-alanindan proxy'ler.
  api:
    build:
      context: ../backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # (P150) SMS GECIDI. Verilmezse saglayici LOG'dur ve kodlar
      # KULLANICIYA GITMEZ — sakin giris yapamaz. Kapali teste
      # gercek kullanici sokmadan once doldurulmali.
      # --- (P172 §2) MESAJ SAGLAYICILARI — GENEL (ENV) AYAR ---
      #
      # HEPSI OPSIYONEL (`:-` bos varsayilan): eksik degisken compose'u
      # KIRMAZ. OAuth'ta bunu `:?` ile yapip yigin acilmamisti; ayni hata
      # tekrarlanmasin. Verilmezse saglayici LOG'a duser ve gonderim
      # "yapilandirilmadi" doner — sessizce "gonderildi" DEMEZ.
      #
      # BUNLAR GENEL AYARDIR. Bir tesis arayuzden kendi saglayicisini
      # girerse O TESIS icin bunlarin yerine gecer — ve karar KANAL
      # BASINADIR: tesis yalniz SMS'ini girdiyse e-posta yine buradan
      # gider (bkz. `app/mesajlasma.py::_ayardan_veya_env`).
      #
      # E-POSTA (Resend): SMTP_HOST=smtp.resend.com, SMTP_PORT=587
      # (STARTTLS), SMTP_USER=resend, SMTP_PASSWORD=<API anahtari>,
      # SMTP_FROM=noreply@yonetio.site. Port 25 ISP'de kapali; 587
      # uzerinden Resend'e verilir, disari iletmeyi Resend yapar.
      # (P177) YENI KAYIT AKISI + GONDERIM KAPILARI.
      #
      # UCU DE VARSAYILAN KAPALI ve compose'a YAZILDI ki `docker compose
      # config` ciktisinda gorunsunler: pydantic-settings varsayilanina
      # birakilan bir bayrak, ortamda "yok" gibi gorunur ve operator onu
      # aramaya kalkinca hicbir yerde bulamaz.
      YENI_KAYIT_AKISI: ${YENI_KAYIT_AKISI:-false}
      SMS_AKTIF: ${SMS_AKTIF:-false}
      TICARI_ILETI_AKTIF: ${TICARI_ILETI_AKTIF:-false}
      SMS_SAGLAYICI: ${SMS_SAGLAYICI:-}
      SMS_KULLANICI: ${SMS_KULLANICI:-}
      SMS_PAROLA: ${SMS_PAROLA:-}
      SMS_BASLIK: ${SMS_BASLIK:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      <<: *tz
      # Uygulama app_rw (async asyncpg) ile baglanir — RLS'e TABI.
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD:?APP_DB_PASSWORD gerekli}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli (bos birakilirsa token BOS anahtarla imzalanir)}
      SDM_KEK: ${SDM_KEK}
      # CORS: panel origin'i (tarayici -> API dogrudan cagri; prod'da acilir).
      CORS_ORIGINS: ${CORS_ORIGINS}
      # (P120) Sakine giden mesajlardaki `{odeme_linki}` etiketinin tabani.
      # Eskiden BIZE AIT OLMAYAN bir alan adi sabit koduydu; bkz.
      # backend/app/config.py -> portal_base_url.
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://yönetiyor.com}
      # MinIO: presigned URL host'u PUBLIC storage adresi olmali (istemci erisir).
      # api sunucu-tarafi MinIO cagrisi YAPMAZ (presign yerel imzalanir).
      MINIO_ENDPOINT: ${MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD gerekli}
      MINIO_BUCKET: ${MINIO_BUCKET:-tesis-foto}
      # Odeme (opsiyonel; varsayilan manual — gercek anahtar yoksa dokunma).
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual}
      IYZICO_API_KEY: ${IYZICO_API_KEY:-}
      IYZICO_SECRET: ${IYZICO_SECRET:-}
      PAYTR_MERCHANT_ID: ${PAYTR_MERCHANT_ID:-}
      PAYTR_MERCHANT_KEY: ${PAYTR_MERCHANT_KEY:-}
      PAYTR_MERCHANT_SALT: ${PAYTR_MERCHANT_SALT:-}
      # Push (FCM). Kimlik dosyasi ./secrets/ altinda; yoksa no-op (cokme yok).
      PUSH_PROVIDER: ${PUSH_PROVIDER:-noop}
      # Icerik cevirisi: prod'da GERCEK motor (ic ag). Kapatmak icin
      # TRANSLATE_PROVIDER=noop — icerik yine yazilir, ceviri uretilmez.
      TRANSLATE_PROVIDER: ${TRANSLATE_PROVIDER:-libretranslate}
      TRANSLATE_URL: ${TRANSLATE_URL:-http://libretranslate:5000}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:-/secrets/fcm-service-account.json}
      # --- (P154 / Asama 4) SOSYAL GIRIS — Google / Microsoft / Apple ---
      #
      # HEPSI OPSIYONEL (`:-` ile bos varsayilan) ve bu bilincli:
      # yapilandirilmamis saglayici `/auth/oauth/saglayicilar` listesinde
      # GORUNMEZ, dolayisiyla arayuzde dugmesi de cizilmez. Eksik bir
      # degisken compose'u KIRMAMALI — sosyal giris bir EK yoldur ve
      # telefon/parola girisi ondan bagimsiz calisir. `:?` (zorunlu)
      # kullanmak, sosyal girisi yapilandirmamis her kurulumun
      # ACILMAMASI demekti.
      #
      # NEDEN BU BLOK GEC EKLENDI (P155r2): `environment` bloklari ACIK
      # BEYAZ LISTEDIR — compose'da `env_file` yok, yani burada adi
      # gecmeyen hicbir degisken konteynere ULASMAZ. `.env`e yazmak tek
      # basina YETMIYORDU ve hata SESSIZDI: `saglayicilar` bos liste
      # doner, arayuz dugme cizmez, hicbir yerde hata gorunmez. Test
      # takimi da yakalayamazdi: `tests/test_oauth.py` `settings`i
      # DOGRUDAN monkeypatch'liyor, konteyner ortamina hic bakmiyor.
      # Gerileme kilidi: `tests/test_compose_oauth.py`.
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      # `*_AUD`: `id_token.aud` icin KABUL EDILEN degerler (virgulle
      # ayrilir). BOS BIRAKILIRSA `CLIENT_ID` kullanilir — tek istemcili
      # (yalniz web) kurulumda yeterlidir. MOBIL EKLENINCE ZORUNLU olur:
      # Google/Apple mobil icin AYRI istemci kimligi uretir ve jetonun
      # `aud`u O kimligi tasir; liste guncellenmezse mobil giris sessizce
      # reddedilir. Sartname listesinde YOKTU, bilerek eklendi.
      OAUTH_GOOGLE_AUD: ${OAUTH_GOOGLE_AUD:-}
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_AUD: ${OAUTH_MICROSOFT_AUD:-}
      OAUTH_MICROSOFT_TENANT: ${OAUTH_MICROSOFT_TENANT:-common}
      OAUTH_APPLE_CLIENT_ID: ${OAUTH_APPLE_CLIENT_ID:-}
      OAUTH_APPLE_AUD: ${OAUTH_APPLE_AUD:-}
      OAUTH_APPLE_TEAM_ID: ${OAUTH_APPLE_TEAM_ID:-}
      OAUTH_APPLE_KEY_ID: ${OAUTH_APPLE_KEY_ID:-}
      # `.p8` ICERIGI tek satirda; satir sonlari `\n` kacisi olarak yazilir
      # ve uygulama onlari cozer (`oauth._apple_istemci_sirri`).
      OAUTH_APPLE_PRIVATE_KEY: ${OAUTH_APPLE_PRIVATE_KEY:-}
      # Saglayiciya bildirilen `redirect_uri`nin tabani. TERS VEKIL
      # ARKASINDA ZORUNLU: istekten turetilen adres (ic konak, http,
      # farkli port) kayitli adresle tutmaz ve giris "redirect_uri
      # mismatch" ile patlar.
      OAUTH_CALLBACK_TABAN: ${OAUTH_CALLBACK_TABAN:-}
      # BOS = O YUZEY KAPALI: `baslat` 503 doner ve hata kullanici siteden
      # AYRILMADAN gorunur (saglayicidan donunce 404 bulmasindan iyidir).
      OAUTH_WEB_DONUS: ${OAUTH_WEB_DONUS:-}
      OAUTH_MOBIL_DONUS: ${OAUTH_MOBIL_DONUS:-com.app.yonetiyor://oauth}
    volumes:
      # Klasor mount (dosya yoksa da baslar); FCM json yoksa push unconfigured.
      - ./secrets:/secrets:ro
      # GOC BASI OKUNABILSIN diye (P124 emniyet agi). `/health` semanin
      # BEKLENEN basini goc dosyalarindan hesaplar; imaj yalniz `backend/`i
      # kopyaladigi icin prod'da o dosyalar YOKTU ve alan bos donuyordu:
      # "uyumlu": null — yani `migrate` kosulmadan `api` dagitildiginda
      # emniyet agi SESSIZCE karar vermiyordu. Tam da korumasi gereken
      # ortamda islevsizdi; canli dogrulama (infra/canli-yuzey-dogrula.sh)
      # bunu olctu. SALT OKUNUR: goc dosyalari sir degildir, yazilmaz.
      - ../contracts:/contracts:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [tesisnet]
    restart: unless-stopped

  # Celery worker — dis bildirim (push) dispatch dahil.
  worker:
    build:
      context: ../backend
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *tz
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD:?APP_DB_PASSWORD gerekli}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli (bos birakilirsa token BOS anahtarla imzalanir)}
      OWNER_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}@db:5432/${POSTGRES_DB}
      APP_DSN: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD:?APP_DB_PASSWORD gerekli}@db:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: ${MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD gerekli}
      MINIO_BUCKET: ${MINIO_BUCKET:-tesis-foto}
      # --- (P172 §2) MESAJ SAGLAYICILARI — ISCI DE GONDERIR ---
      #
      # OLCULDU: `worker` bu degiskenlerin HICBIRINI almiyordu, oysa
      # `mesaj_kuyrugu` gorevi basarisiz gonderimleri YENIDEN DENER ve
      # `kanal_saglayicisi(...)` cagirir. Yani toplu gonderimin yeniden
      # deneme yolu saglayicisiz kaliyor, sessizce LOG'a dusuyordu:
      # panelde "yeniden denendi" gorunur, kimseye bir sey gitmezdi.
      #
      # `api` ile AYNI kume olmali; biri eksik kalirsa ayni mesaj istek
      # yolunda gidip kuyruk yolunda gitmezdi.
      # (P177) YENI KAYIT AKISI + GONDERIM KAPILARI.
      #
      # UCU DE VARSAYILAN KAPALI ve compose'a YAZILDI ki `docker compose
      # config` ciktisinda gorunsunler: pydantic-settings varsayilanina
      # birakilan bir bayrak, ortamda "yok" gibi gorunur ve operator onu
      # aramaya kalkinca hicbir yerde bulamaz.
      YENI_KAYIT_AKISI: ${YENI_KAYIT_AKISI:-false}
      SMS_AKTIF: ${SMS_AKTIF:-false}
      TICARI_ILETI_AKTIF: ${TICARI_ILETI_AKTIF:-false}
      SMS_SAGLAYICI: ${SMS_SAGLAYICI:-}
      SMS_KULLANICI: ${SMS_KULLANICI:-}
      SMS_PAROLA: ${SMS_PAROLA:-}
      SMS_BASLIK: ${SMS_BASLIK:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-noop}
      # Icerik cevirisi: prod'da GERCEK motor (ic ag). Kapatmak icin
      # TRANSLATE_PROVIDER=noop — icerik yine yazilir, ceviri uretilmez.
      TRANSLATE_PROVIDER: ${TRANSLATE_PROVIDER:-libretranslate}
      TRANSLATE_URL: ${TRANSLATE_URL:-http://libretranslate:5000}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:-/secrets/fcm-service-account.json}
    volumes:
      - ./secrets:/secrets:ro
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info"]
    networks: [tesisnet]
    restart: unless-stopped

  # Celery beat — periyodik scheduler (pencere uretimi/tespiti).
  beat:
    build:
      context: ../backend
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *tz
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD:?APP_DB_PASSWORD gerekli}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli (bos birakilirsa token BOS anahtarla imzalanir)}
      OWNER_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}@db:5432/${POSTGRES_DB}
      APP_DSN: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD:?APP_DB_PASSWORD gerekli}@db:5432/${POSTGRES_DB}
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info"]
    networks: [tesisnet]
    restart: unless-stopped

  # --------------------------------------------------------------------- #
  # admin-web (Next.js standalone). Host'a ACILMAZ; Caddy panel. proxy'ler.
  # BFF (sunucu tarafi) API'ye IC AGDAN (http://api:8000) baglanir.
  admin-web:
    build:
      context: ../admin-web
    # (P171 duzeltme) `depends_on: api` KALDIRILDI — Kerem'in karari.
    #
    # NEDEN: iki servisin BASARISIZLIK MODU AYRI OLMALI. API'nin sema
    # uyumsuzlugunda kapali kalmasi DOGRU (yanlis semaya yazmak veriyi
    # bozar). Ama admin-web veriye YAZMAZ, API'yi CAGIRIR — API yoksa
    # kullanici bir sayfa gorup anlamli bir hata almali, alan adi komple
    # 502 vermemeli.
    #
    # OLCULEN OLAY: goc 0066 dustu -> api baslamadi -> admin-web de
    # baslamadi -> `docker ps` bos, alan adi 502, teshis icin log bile
    # yok. Ortam sessizce yok oldu.
    #
    # KARSILIGI ISTEMCIDE KURULDU: `components/SunucuDurumu.tsx` API'ye
    # ulasilamadiginda MERKEZI bir durum ekrani cizer (tekrar dene
    # dugmesiyle) ve `GET /api/saglik` API erisilebilirligini RAPOR eder.
    #
    # BASLAMA SIRASI KAYBI YOK: admin-web API'yi yalniz ISTEK ANINDA
    # cagirir, acilista degil. Once kalkmasi bir sorun yaratmaz.
    environment:
      <<: *tz
      NODE_ENV: production
      API_BASE_URL: http://api:8000
    healthcheck:
      # 127.0.0.1 (localhost DEGIL): busybox wget localhost'u ::1'e cozer ve
      # IPv4'e DUSMEZ; app ise HOSTNAME=0.0.0.0 ile yalniz IPv4 dinler →
      # "Connection refused" false-negative. (api'nin python urllib probe'u
      # etkilenmez: getaddrinfo sonuclarini sirayla dener, IPv4'e duser.)
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [tesisnet]
    restart: unless-stopped

  # --------------------------------------------------------------------- #
  # (P177) tanitim-web — YONETIYOR TANITIM SITESI (Next.js standalone).
  #
  # AYRI BIR UYGULAMA ve bu bilincli: panelin (admin-web) tasarim dili
  # metalik/neumorphic bir CALISMA ALANI dilidir; tanitim sitesi acik
  # zeminli, kurumsal mavi bir KARSILAMA yuzeyidir. Ayni pakete koymak,
  # iki dilin ayni `tailwind.config.ts` icinde carpismasi demekti.
  #
  # `depends_on: api` YOK — admin-web'deki P171 karariyla ayni gerekce ve
  # burada daha da net: bu site API'yi yalniz IKI ucta cagirir (kayit
  # basvurusu ve iletisim formu). API dustugunde sitenin geri kalani
  # (tanitim, fiyat hesaplayici, hukuki metinler) CALISMAYA DEVAM
  # ETMELIDIR.
  #
  # NEXT_PUBLIC_* DERLEME ANINDA GOMULUR: bayrak degistirmek imaji
  # yeniden derlemeyi gerektirir (`--build`). `API_BASE_URL` bunun
  # DISINDADIR — sunucu tarafi onu calisma aninda okur.
  tanitim-web:
    build:
      context: ../apps/tanitim-web
      args:
        NEXT_PUBLIC_APP_ADRESI: ${TANITIM_APP_ADRESI:-https://app-test.yonetio.site}
        NEXT_PUBLIC_SITE_ADRESI: ${TANITIM_SITE_ADRESI:-https://test.yonetio.site}
        NEXT_PUBLIC_PLAY_ADRESI: ${PLAY_STORE_URL:-https://play.google.com/store/apps/details?id=com.app.yonetiyor}
        NEXT_PUBLIC_APP_STORE_ADRESI: ${APP_STORE_URL:-}
        NEXT_PUBLIC_ILETISIM_EPOSTA: ${TANITIM_ILETISIM_EPOSTA:-destek@yonetio.site}
        NEXT_PUBLIC_TANITIM_UCRETSIZ: ${TANITIM_UCRETSIZ:-1}
        NEXT_PUBLIC_SSO_GOOGLE: ${TANITIM_SSO_GOOGLE:-1}
        NEXT_PUBLIC_SSO_MICROSOFT: ${TANITIM_SSO_MICROSOFT:-0}
        NEXT_PUBLIC_SSO_APPLE: ${TANITIM_SSO_APPLE:-0}
    environment:
      <<: *tz
      NODE_ENV: production
      API_BASE_URL: http://api:8000
    healthcheck:
      # 127.0.0.1 (localhost DEGIL): busybox wget localhost'u ::1'e cozer
      # ve IPv4'e DUSMEZ; app ise HOSTNAME=0.0.0.0 ile yalniz IPv4 dinler
      # -> sahte "Connection refused". admin-web'de olculen ayni tuzak.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [tesisnet]
    restart: unless-stopped

networks:
  tesisnet:
    driver: bridge

volumes:
  # Argos ceviri modelleri (ilk kalkista indirilir, sonra yeniden kullanilir).
  ltmodels:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
