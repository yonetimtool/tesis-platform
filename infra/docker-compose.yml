# Tesis Guvenlik & Operasyon — yerel gelistirme ortami (DEV-A).
#
# Servisler: db (Postgres+pgcrypto), redis, migrate (one-shot), api (FastAPI),
# worker (Celery). Migration'lar /contracts/db'deki CANONICAL migration ile
# uygulanir; burada IKINCI bir migration uretilmez.
#
# Kullanim:
#   cd infra && cp .env.example .env && docker compose up --build
#   curl localhost:8000/health
#   docker compose exec api pytest -v          # RLS izolasyon testi dahil

name: tesis

services:
  db:
    # postgres:16 — gen_random_uuid() icin pgcrypto eklentisi mevcut
    # (migration `CREATE EXTENSION IF NOT EXISTS pgcrypto` calistirir).
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # MinIO (S3-uyumlu) — foto kanit deposu.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      # Inline varsayilan (:-) => .env eksik olsa bile "not set" WARN olusmaz.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin12345}
    ports:
      - "9000:9000"   # S3 API (ic ag: http://minio:9000)
      - "9001:9001"   # Web console
    volumes:
      - miniodata:/data
    restart: unless-stopped

  # One-shot: bucket'i olusturur (mc, minio hazir olana dek bekler).
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin12345}
      MINIO_BUCKET: ${MINIO_BUCKET:-tesis-foto}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "minio bekleniyor..."; sleep 1;
        done
        mc mb -p "local/$$MINIO_BUCKET" || true
        echo "bucket hazir: $$MINIO_BUCKET"
    restart: "no"

  # Ceviri motoru — KENDI BARINDIRDIGIMIZ LibreTranslate.
  #
  # NEDEN kendi barindirma: yayin icerigi (duyuru/kural/etkinlik) tesise ait
  # veridir; dis bir ceviri servisine gonderilmez. Servis IC AGDA durur —
  # `ports:` YOKTUR, yalniz api/worker erisir (host'a/internete kapali).
  #
  # Modeller ilk kalkista indirilir ve `ltmodels` volume'unde KALIR (sonraki
  # kalkislar hizli). LT_LOAD_ONLY ile YALNIZ mobil UI'nin 7 dili yuklenir —
  # tum dil setini indirmek GB'lar ve dakikalar demek olurdu.
  libretranslate:
    image: libretranslate/libretranslate:v1.6.1
    depends_on:
      libretranslate-init:
        condition: service_completed_successfully
    environment:
      LT_LOAD_ONLY: ${TRANSLATE_LANGS:-tr,en,ar,ru,de,fr,es}
      LT_DISABLE_WEB_UI: "true"
      # Model guncellemesi kalkista ag beklemesi yapmasin (pinned imaj).
      LT_UPDATE_MODELS: "false"
    volumes:
      - ltmodels:/home/libretranslate/.local/share/argos-translate
    healthcheck:
      # /languages yuklenmis modelleri listeler — modeller hazir olmadan 200 vermez.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/languages').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # One-shot: model dizininin sahipligini KONTEYNER kullanicisina verir.
  # Taze named volume root'a ait olur; LibreTranslate uid 1032 ile kosar ve
  # aksi halde "Permission denied: .../argos-translate/packages" ile DUSER.
  # (minio-init ile ayni desen.)
  libretranslate-init:
    image: alpine:3.20
    volumes:
      - ltmodels:/models
    command:
      - sh
      - -c
      - |
        chown -R 1032:65534 /models
        echo "ceviri model dizini hazir"
    restart: "no"

  # One-shot: CANONICAL migration'lari OWNER ile uygular + app_rw rolunu kurar.
  # NOT: "kanonik" = gocler icin TEK KAYNAK /contracts/db'dir. Revizyon
  # dosyalarini YERINDE duzenleme kurali DEVRE DISI — bkz.
  # docs/MIGRATION-POLITIKASI.md (prod bir kez goc ettikten sonra yerinde
  # duzenleme ona ULASMIYOR; 0008b_uyum_yakalama tam bu yuzden gerekti).
  migrate:
    build:
      context: ../backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # alembic env.py bu URL'i kullanir (owner, sync psycopg surucusu).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # setup_app_role.py icin owner libpq DSN'i.
      OWNER_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - ../contracts:/contracts:ro
      - ./scripts:/scripts:ro
    command:
      - sh
      - -c
      - |
        set -e
        # (P171 duzeltme) DUSERSE EYLEME DONUK BIR MESAJ BIRAK.
        #
        # Goc dustugunde `api`, `admin-web` ve `worker` HIC BASLAMAZ
        # (ucu de buna `service_completed_successfully` ile bagli) ve
        # operator `docker ps`te HICBIR SEY goremez. Ciplak bir alembic
        # geri izlemesi bunun NEDEN oldugunu soylemez.
        hata() {
          echo "" >&2
          echo "!! GOC ZINCIRI DUSTU — api/admin-web/worker BASLAMAYACAK." >&2
          echo "   Ucu de bu servise 'service_completed_successfully' ile" >&2
          echo "   baglidir; bu yuzden ortam tamamen erisilemez gorunur." >&2
          echo "" >&2
          echo "   EN SIK NEDEN: imaj depodan ESKI. \`contracts/\` canli" >&2
          echo "   mount'tur, \`backend/\` ise imaja gomuludur — yeni goc" >&2
          echo "   dosyasi eski kodla/bagimliliklarla karsilasir." >&2
          echo "   COZUM — KANONIK KOMUT (dordunu de kurun, KISMI BUILD" >&2
          echo "   tam olarak bu hataya yol acar):" >&2
          echo "     docker compose build migrate api admin-web worker" >&2
          echo "" >&2
          echo "   Gunlukler: docker compose logs migrate" >&2
          exit 1
        }
        # `trap ... ERR` YOK: bu kabuk `sh` (busybox/dash) ve ERR tuzagi
        # bash'e ozeldir — olculdu, "trap: ERR: bad trap" verdi. Acik
        # `|| hata` hem tasinabilir hem okunur.
        echo ">> Migration'lar uygulaniyor (owner)..."
        alembic -c /contracts/db/alembic.ini upgrade head || hata
        echo ">> app_rw rolu hazirlaniyor..."
        python /scripts/setup_app_role.py
    restart: "no"

  api:
    build:
      context: ../backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Uygulama app_rw (async asyncpg) ile baglanir — RLS'e TABI.
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # --- (P172 §2) MESAJ SAGLAYICILARI ---
      #
      # HEPSI OPSIYONEL (`:-` bos varsayilan): eksik degisken compose'u
      # KIRMAZ. Verilmezse saglayici LOG'a duser ve gonderim
      # "yapilandirilmadi" doner — sessizce "gonderildi" DEMEZ.
      #
      # Dev'de normalde BOSTUR (gercek SMS/e-posta gitmesin). Gercek bir
      # saglayiciyi denemek icin `infra/.env`e yazmak yeter.
      # (P177) YENI KAYIT AKISI + GONDERIM KAPILARI.
      #
      # UCU DE VARSAYILAN KAPALI ve compose'a YAZILDI ki `docker compose
      # config` ciktisinda gorunsunler: pydantic-settings varsayilanina
      # birakilan bir bayrak, ortamda "yok" gibi gorunur ve operator onu
      # aramaya kalkinca hicbir yerde bulamaz.
      YENI_KAYIT_AKISI: ${YENI_KAYIT_AKISI:-false}
      SMS_AKTIF: ${SMS_AKTIF:-false}
      TICARI_ILETI_AKTIF: ${TICARI_ILETI_AKTIF:-false}
      SMS_SAGLAYICI: ${SMS_SAGLAYICI:-}
      SMS_KULLANICI: ${SMS_KULLANICI:-}
      SMS_PAROLA: ${SMS_PAROLA:-}
      SMS_BASLIK: ${SMS_BASLIK:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      JWT_SECRET: ${JWT_SECRET}
      # NTAG424 SDM anahtar sifreleme KEK'i (32+ karakter). Prod'da .env'den ver;
      # asagidaki varsayilan YALNIZ gelistirme icindir.
      SDM_KEK: ${SDM_KEK:-dev-sdm-kek-yalnizca-gelistirme-icin-degistir}
      # Testlerin (docker compose exec api pytest) kullandigi DSN'ler:
      OWNER_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DSN: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      API_URL: http://localhost:8000
      # MinIO: presigned URL host'u PUBLIC adres olmali (tarayici/cihaz erisir).
      # api->minio sunucu-tarafi cagri YAPMAZ (presign yerel imzalanir; bucket'i
      # minio-init kurar) — bu yuzden ic ag (http://minio:9000) burada gerekmez.
      MINIO_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin12345}
      MINIO_BUCKET: ${MINIO_BUCKET:-tesis-foto}
      # Odeme saglayici — GERCEK ANAHTAR YOK (placeholder/sandbox); varsayilan manual.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual}
      IYZICO_API_KEY: ${IYZICO_API_KEY:-sandbox-iyzico-key}
      IYZICO_SECRET: ${IYZICO_SECRET:-sandbox-iyzico-secret}
      PAYTR_MERCHANT_ID: ${PAYTR_MERCHANT_ID:-sandbox-mid}
      PAYTR_MERCHANT_KEY: ${PAYTR_MERCHANT_KEY:-sandbox-paytr-key}
      PAYTR_MERCHANT_SALT: ${PAYTR_MERCHANT_SALT:-sandbox-paytr-salt}
      # Push: varsayilan noop; gercek FCM icin .env'de PUSH_PROVIDER=fcm +
      # kimlik mount'u docker-compose.push.yml override'iyla baglanir.
      PUSH_PROVIDER: ${PUSH_PROVIDER:-noop}
      # (P39) Olcumle secilir; bkz. docs/scaling-runbook.md.
      # TOPLAM BAGLANTI = API_WORKERS x (DB_POOL_SIZE + DB_MAX_OVERFLOW)
      # ve bu, Postgres `max_connections` (100) - diger servisler'den
      # KUCUK olmali.
      API_WORKERS: ${API_WORKERS:-1}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      # Icerik cevirisi. DEV VARSAYILANI `echo` (deterministik sahte ceviri):
      # test kosumu model indirmesine/CPU'ya bagli olmasin ve 600+ testin her
      # duyuru olusturmasi gercek ceviri kuyrugu tetiklemesin. GERCEK ceviri
      # icin: TRANSLATE_PROVIDER=libretranslate (servis zaten ayakta).
      TRANSLATE_PROVIDER: ${TRANSLATE_PROVIDER:-echo}
      TRANSLATE_URL: ${TRANSLATE_URL:-http://libretranslate:5000}
      # --- (P154 / Asama 4) SOSYAL GIRIS — Google / Microsoft / Apple ---
      #
      # HEPSI OPSIYONEL (`:-` ile bos varsayilan): yapilandirilmamis
      # saglayici `/auth/oauth/saglayicilar` listesinde GORUNMEZ ve
      # arayuzde dugmesi cizilmez. Dev'de normal durum BOSTUR — sosyal
      # giris kapali, telefon/parola girisi calisir.
      #
      # PROD DOSYASIYLA AYNI KUME OLMALI: `environment` bloklari ACIK
      # BEYAZ LISTEDIR (compose'da `env_file` yok), yani burada adi
      # gecmeyen degisken konteynere ULASMAZ. Iki dosyanin ayrismasi,
      # dev'de calisan bir yapilandirmanin prod'da SESSIZCE calismamasi
      # demek olurdu — P155r2'de tam olarak bu yasandi (ikisinde de
      # yoktu). Kilit: `tests/test_compose_oauth.py`.
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      # `*_AUD` bos ise `CLIENT_ID` kullanilir; mobil eklenince (ayri
      # istemci kimligi) ZORUNLU olur.
      OAUTH_GOOGLE_AUD: ${OAUTH_GOOGLE_AUD:-}
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_AUD: ${OAUTH_MICROSOFT_AUD:-}
      OAUTH_MICROSOFT_TENANT: ${OAUTH_MICROSOFT_TENANT:-common}
      OAUTH_APPLE_CLIENT_ID: ${OAUTH_APPLE_CLIENT_ID:-}
      OAUTH_APPLE_AUD: ${OAUTH_APPLE_AUD:-}
      OAUTH_APPLE_TEAM_ID: ${OAUTH_APPLE_TEAM_ID:-}
      OAUTH_APPLE_KEY_ID: ${OAUTH_APPLE_KEY_ID:-}
      OAUTH_APPLE_PRIVATE_KEY: ${OAUTH_APPLE_PRIVATE_KEY:-}
      OAUTH_CALLBACK_TABAN: ${OAUTH_CALLBACK_TABAN:-}
      OAUTH_WEB_DONUS: ${OAUTH_WEB_DONUS:-}
      # (P180) niyet=kayit donusu — yonetici kayit tamamlama sayfasi.
      OAUTH_KAYIT_DONUS: ${OAUTH_KAYIT_DONUS:-}
      OAUTH_MOBIL_DONUS: ${OAUTH_MOBIL_DONUS:-com.app.yonetiyor://oauth}
    ports:
      - "8000:8000"
    volumes:
      # TUR 68 — SOZLESME TESTI icin: `contracts/openapi.yaml` sozlesmedir ve
      # `tests/test_sozlesme_sapmasi.py` onu uygulamayla karsilastirir. Imaj
      # yalniz `backend/`i kopyaliyor, bu yuzden sozlesme SALT OKUNUR baglanir.
      # (Yalniz gelistirme compose'unda; prod imaji test kosmuyor.)
      - ../contracts:/contracts:ro
      # (P155r2) `tests/test_compose_oauth.py` icin: compose dosyalari,
      # `settings`teki her `oauth_*` ayarini GERCEKTEN gecirdiklerini
      # kanitliyor. `contracts` ile AYNI gerekce — imaj yalniz `backend/`i
      # kopyaliyor, dolayisiyla test okuyacagi dosyayi bulamazdi ve
      # SESSIZCE atlanirdi (hep atlayan bir test hicbir sey korumaz).
      #
      # `../infra` KLASORU BAGLANMADI, YALNIZ IKI DOSYA: klasorde `.env`
      # ve `secrets/` duruyor; onlari api konteynerine sokmak, testi
      # kosmak icin sir yuzeyini buyutmek olurdu. Dosyalar SALT OKUNUR ve
      # sir icermiyor (yalniz degisken REFERANSLARI).
      - ./docker-compose.yml:/infra/docker-compose.yml:ro
      - ./docker-compose.prod.yml:/infra/docker-compose.prod.yml:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Opsiyonel — varsayilan `up`ta CALISMAZ (profil ile tetiklenir):
  #   docker compose --profile seed run --rm seed
  # (api ayaktaysa daha kisa yol: docker compose exec api python -m scripts.seed)
  seed:
    profiles: ["seed"]
    build:
      context: ../backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Seed ornek icerigi GERCEK ceviri hattindan gecirir -> motor hazir olmali.
      libretranslate:
        condition: service_healthy
    environment:
      OWNER_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # entity_cevir RLS altinda app_rw ile yazar (worker ile ayni yol).
      APP_DSN: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      # Seed BILINCLI olarak GERCEK saglayiciyi kullanir (api/worker dev
      # varsayilani `echo`dur; ornek veri gercek ceviri tasisin).
      TRANSLATE_PROVIDER: ${SEED_TRANSLATE_PROVIDER:-libretranslate}
      TRANSLATE_URL: ${TRANSLATE_URL:-http://libretranslate:5000}
    command: ["python", "-m", "scripts.seed"]
    restart: "no"

  worker:
    build:
      context: ../backend
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # --- (P172 §2) MESAJ SAGLAYICILARI ---
      #
      # HEPSI OPSIYONEL (`:-` bos varsayilan): eksik degisken compose'u
      # KIRMAZ. Verilmezse saglayici LOG'a duser ve gonderim
      # "yapilandirilmadi" doner — sessizce "gonderildi" DEMEZ.
      #
      # Dev'de normalde BOSTUR (gercek SMS/e-posta gitmesin). Gercek bir
      # saglayiciyi denemek icin `infra/.env`e yazmak yeter.
      # (P177) YENI KAYIT AKISI + GONDERIM KAPILARI.
      #
      # UCU DE VARSAYILAN KAPALI ve compose'a YAZILDI ki `docker compose
      # config` ciktisinda gorunsunler: pydantic-settings varsayilanina
      # birakilan bir bayrak, ortamda "yok" gibi gorunur ve operator onu
      # aramaya kalkinca hicbir yerde bulamaz.
      YENI_KAYIT_AKISI: ${YENI_KAYIT_AKISI:-false}
      SMS_AKTIF: ${SMS_AKTIF:-false}
      TICARI_ILETI_AKTIF: ${TICARI_ILETI_AKTIF:-false}
      SMS_SAGLAYICI: ${SMS_SAGLAYICI:-}
      SMS_KULLANICI: ${SMS_KULLANICI:-}
      SMS_PAROLA: ${SMS_PAROLA:-}
      SMS_BASLIK: ${SMS_BASLIK:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      JWT_SECRET: ${JWT_SECRET}
      # Scheduler: tenant enumerasyonu (owner) + tenant-scoped is (app_rw, sync).
      OWNER_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DSN: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      # MinIO (ileride worker'da foto isleme/temizlik gerekebilir).
      MINIO_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin12345}
      MINIO_BUCKET: ${MINIO_BUCKET:-tesis-foto}
      # Push kancalari worker'da kosar (dispatch_external) — api ile ayni secim.
      PUSH_PROVIDER: ${PUSH_PROVIDER:-noop}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      # ASIL CEVIRI ISI BURADA kosar (istek yolu yalniz kuyruklar). api ile
      # AYNI secim; gercek ceviri icin TRANSLATE_PROVIDER=libretranslate.
      TRANSLATE_PROVIDER: ${TRANSLATE_PROVIDER:-echo}
      TRANSLATE_URL: ${TRANSLATE_URL:-http://libretranslate:5000}
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info"]
    restart: unless-stopped

  # Celery beat — periyodik scheduler task'larini tetikler.
  beat:
    build:
      context: ../backend
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      OWNER_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DSN: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info"]
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  # Argos ceviri modelleri (ilk kalkista indirilir, sonra yeniden kullanilir).
  ltmodels:
