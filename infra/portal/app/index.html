<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yönetio uygulaması — yakında</title>
<meta name="robots" content="noindex">
<!--
  (P120) `app.` KONAĞI İÇİN GEÇİCİ YER TUTUCU.

  NEDEN VAR: `app.` için DNS'te A kaydı açılmıştı ama Caddy'de site bloğu
  yoktu. Tanımsız bir konak temiz bir 404 vermez — SNI eşleşmediği için
  TLS el sıkışması düşer ve ziyaretçi ERR_SSL_PROTOCOL_ERROR görür. Bir
  adres yayınlanmışsa, "henüz hazır değil" demek bile bağlantının kopmuş
  görünmesinden iyidir.

  `noindex`: bu sayfa arama sonuçlarına girmemeli; gerçek uygulama yüzeyi
  (P40–P42) geldiğinde onun yerine geçecek.

  MAĞAZA BAĞLANTISI HENÜZ YOK: uygulama App Store incelemesinde, Play'de
  yayında değil. Var olmayan bir mağaza bağlantısı koymak, ziyaretçiyi
  "bulunamadı" sayfasına göndermek olurdu; yayınlandığında buraya eklenir.
-->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 2rem 1.25rem;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f6f7f9; color: #16202c;
  }
  main { width: 100%; max-width: 32rem; text-align: center; }
  h1 { font-size: clamp(1.6rem, 5.5vw, 2.1rem); margin: 0 0 .5rem;
       letter-spacing: -0.02em; }
  h1 span { color: #0e7c86; }
  .rozet {
    display: inline-block; margin-bottom: 1.25rem; padding: .3rem .7rem;
    border-radius: 999px; font-size: .8rem; font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase;
    background: #0e7c86; color: #fff;
  }
  p { margin: 0 0 1rem; opacity: .8; }
  .baglar { margin-top: 1.75rem; display: flex; flex-wrap: wrap; gap: .625rem;
            justify-content: center; }
  a.dugme {
    display: inline-block; padding: .65rem 1.15rem; border-radius: 10px;
    text-decoration: none; font-weight: 600; border: 1px solid #cfd6de;
    color: #16202c; background: #fff;
  }
  a.dugme.birincil { background: #0e7c86; border-color: #0e7c86; color: #fff; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f1519; color: #e8edf2; }
    a.dugme { background: #161e24; border-color: #2e3b45; color: #e8edf2; }
  }
</style>
</head>
<body>
<main>
  <span class="rozet">Yakında</span>
  <h1>Yönet<span>io</span> uygulaması</h1>
  <p>Mobil uygulama yayına hazırlanıyor. Yayınlandığında mağaza
     bağlantıları burada olacak.</p>
  <p>Yöneticiyseniz panele tarayıcıdan girebilirsiniz.</p>
  <div class="baglar">
    <a class="dugme birincil" href="https://panel.yonetio.site">Yönetim paneli</a>
    <a class="dugme" href="https://yonetio.site/gizlilik">Gizlilik Politikası</a>
  </div>
</main>
</body>
</html>
