name: mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.1+8

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # i18n: 7 dil (tr varsayilan + en/ar/ru/de/fr/es) — ARB + gen-l10n akisi.
  flutter_localizations:
    sdk: flutter
  # Tarih/saat/sayi bicimlendirmesi (DateFormat/NumberFormat) — aktif dile gore.
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  flutter_secure_storage: ^10.3.1
  dio: ^5.9.2
  nfc_manager: ^4.2.1
  # nfc_manager NDEF tiplerini (NdefMessage/TypeNameFormat) dogrudan kullaniyoruz.
  ndef_record: ^1.4.2
  path_provider: ^2.1.6
  connectivity_plus: ^7.2.0
  image_picker: ^1.2.3
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  # (P202) Zorunlu guncelleme: calisan PAKETIN surumu okunur — koda gomulu
  # bir sabit degil. Sabit, pubspec ile ayrisabilirdi; paket sozlugu
  # ayrisamaz.
  package_info_plus: ^10.2.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  # WP-F canli kamera oynatici (HLS/MJPEG — istemci oynatir).
  video_player: ^2.9.2
  # 4'lu izgara/Hizli Ozet: grup paylasan metinler AYNI (sigan en buyuk) boyutta.
  auto_size_text: ^3.0.0
  flutter_web_auth_2: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Launcher ikonlari (Yönetiyor markasi) — kaynak PNG'ler depo kokundeki
  # `assets/marka/yonetiyor-logo.png`ten uretilir.
  # Ikon yeniden uretimi (SIRAYLA, depo kokunden):
  #   python3 scripts/ikon-uret.py
  #   cd mobile && dart run flutter_launcher_icons
  # (`test/tools/generate_branding_assets.dart` hâlâ CALISMA ZAMANI
  #  varliklarini — icon_master/icon_background/ic_stat — uretir; launcher
  #  girdileri artik ondan DEGIL, yukaridaki betikten gelir.)
  flutter_launcher_icons: ^0.14.3

# Adaptive icon: master'dan orneklenen mavi→teal gradyan zemin katmani +
# beyaz isaret foreground katmani (%66 guvenli bolgede — dairesel maskede
# kirpilmaz).
# applicationId/paket adi DEGISMEZ — yalniz ikon + (manifest'te) etiket.
flutter_launcher_icons:
  android: true
  # (P114) iOS ACILDI. Uygulama simgesi App Store denetiminde bakilan ilk
  # seydir ve Flutter'in varsayilan yer tutucusu ("F" harfi) tek basina
  # reddedilme sebebi olabilir. Ayni master'dan uretiliyor — iki ayri
  # kaynak, birinin guncellenip digerinin unutulmasi demekti.
  ios: true
  # iOS SIMGESI SAYDAMLIK KABUL ETMEZ (App Store yuklemede reddeder).
  # Master saydam kenar tasiyor; alfa duzlestirilir.
  remove_alpha_ios: true
  # (P177 §8) KAYNAK ARTIK DEPO KOKUNDEKI `assets/marka/ikon/` — tek
  # uretim yeri `scripts/ikon-uret.py`. Yollar `../` ile disari cikiyor
  # ve bu bilincli: launcher ikonu URUNUN ikonudur, mobil paketin degil;
  # ayni dosyalar Play/App Store yuklemesinde ve tanitim sitesinin
  # faviconunda da kullaniliyor. Ikinci bir kopya tutmak, biri
  # guncellenip oteki unutuldugunda magazada ESKI ikonla cikmak demekti
  # (P166'da tam olarak bu yasandi).
  #
  # `icon_master.png` DOKUNULMADAN duruyor: o CALISMA ZAMANI varligidir
  # (giris ekrani + splash, `yonetio_logo.dart`), launcher girdisi degil.
  # Onu bu turda degistirmek, istenmeyen bir arayuz degisikligi olurdu.
  image_path: "../assets/marka/ikon/ios-appstore-1024.png"
  adaptive_icon_background: "../assets/marka/ikon/android-adaptive-background.png"
  adaptive_icon_foreground: "../assets/marka/ikon/android-adaptive-foreground.png"
  # Android 13+ TEMALI IKON. Sistem bunu bir ALFA MASKESI olarak kullanip
  # kullanicinin duvar kagidindan turettigi renkle boyar.
  adaptive_icon_monochrome: "../assets/marka/ikon/android-monochrome.png"
  # 0 ZORUNLU: varsayilan %16 iceri cekme, foreground'daki payin USTUNE binip
  # isareti ikonun ~1/3'une dusuruyordu. Pay zaten uretimde veriliyor —
  # isaretin sinir kutusu KOSEGENI dairesel maskenin icine sigacak sekilde
  # olcekleniyor (generate_branding_assets.dart).
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # ARB dosyalarindan AppLocalizations uretimi (bkz. l10n.yaml).
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Yalniz calisma zamaninda gereken varlik paketlenir (giris ekrani + splash).
  # logo_master.png (kaynak) ve icon_background/icon_foreground (launcher-icon
  # uretim girdileri) BILEREK listelenmez — APK'ya girmelerinin anlami yok.
  assets:
    - assets/branding/icon_master.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
